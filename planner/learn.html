                else if(t<0.8){ y = baseY - 80; }                       // long plateau
                else { y = baseY - 80 + ((t-0.8)/0.2)*30; }            // soft decline
                pts.push(x.toFixed(1)+','+y.toFixed(1));
              }
              return '<polyline points="'+pts.join(' ')+'" stroke="#7ee787" stroke-width="2.5" fill="none"/>';
            })()
          // Baseline reference
          + '<line x1="' + leftPad + '" y1="' + (baseY-40) + '" x2="' + (w-rightPad) + '" y2="' + (baseY-40) + '" stroke="#30363d" stroke-width="1" stroke-dasharray="3 3"/>'
          + '<text x="' + (w-rightPad-4) + '" y="' + (baseY-44) + '" fill="#8b949e" font-size="9" text-anchor="end">baseline</text>'
          // Legend
          + '<rect x="' + (leftPad+10) + '" y="' + (topY-5) + '" width="14" height="3" fill="#f85149"/>'
          + '<text x="' + (leftPad+30) + '" y="' + (topY-1) + '" fill="#c9d1d9" font-size="11">refined carb / sugar lunch → 2pm crash</text>'
          + '<rect x="' + (leftPad+10) + '" y="' + (topY+12) + '" width="14" height="3" fill="#7ee787"/>'
          + '<text x="' + (leftPad+30) + '" y="' + (topY+16) + '" fill="#c9d1d9" font-size="11">protein + fat + fibre → steady 4-hr window</text>'
          + '</svg>';
      },
      sections: [
        { title: "Intuition", text: "Your brain is ~2% of body weight but burns ~20% of your calories — mostly as glucose, all day, even at rest. The catch: it cannot store glucose. So cognition is hostage to whatever your bloodstream is doing right now. A high-sugar breakfast or refined-carb lunch produces a 60-90 min insulin response that drives glucose BELOW baseline ('the 2pm slump'). A protein + fat + complex-carb meal produces a flat, sustained 4-hour fuel window. Same calories, completely different study output. Food is not a nice-to-have around learning — it's the substrate." },
        { title: "Mechanism", text: "Three independent levers: <b>(1) Glucose stability</b> — low-GI meals avoid the insulin spike → no reactive hypoglycemia → no slump. <b>(2) Long-chain omega-3s (DHA/EPA)</b> — DHA is ~10-15% of brain phospholipids; chronic intake supports membrane fluidity, synaptic plasticity, and is associated with faster processing speed (Witte et al. 2014). <b>(3) Hydration</b> — even 1-2% dehydration measurably degrades working memory and sustained attention (Adan 2012). Caffeine is a 4th lever — it blocks adenosine receptors, but is a stimulant, not a nootropic; it borrows alertness from later in the day and from your sleep." },
        { title: "Worked Example", text: "Two students, identical 9am-5pm study schedule, identical material. <b>Student A</b>: cereal+OJ breakfast, sandwich+soda lunch, coffee at 3pm. Real deep-work hours: ~3 (peaks 10-11am and 4-5pm; 1-3pm is a fog). <b>Student B</b>: eggs+oats+berries breakfast, salmon+greens+rice lunch, water + green tea throughout, last caffeine by noon. Real deep-work hours: ~6 (steady 10-12, 1-3, 3-5 windows). Same chair-time, 2× the encoding. Over a 4-month semester that's a letter-grade difference with zero extra effort." },
        { title: "Pitfall & Tie-In", text: "Pitfall 1: skipping breakfast 'to save time' — fasting cognition CAN be sharp short-term, but pairs badly with hard new material and tends to crater by 11am if you don't actually fast-adapt. Pitfall 2: caffeine after 2pm — half-life 5-6 hrs means a 3pm coffee still has 25% in your system at midnight, wrecking deep sleep and tomorrow's encoding. Pitfall 3: 'energy drinks' (sugar + caffeine) — worst possible combo, you get the crash AND the sleep debt. Pitfall 4: big heavy lunch ('food coma' is real — gastric stretch + insulin response). Tie-in: this is the metabolic floor under every other technique on this page; spaced repetition can't compensate for 2pm fog every day." }
      ],
      keypoints: [
        { title: "Plate rule for study days", text: "Every meal: 1 palm of protein + 1 fist of fibrous carbs (greens, oats, legumes) + 1 thumb of fat (olive oil, nuts, avocado). Skip 'pure carb' meals on study days." },
        { title: "Caffeine timing", text: "First cup 60-90 min after waking (let cortisol peak first). Last cup by noon — 2pm if you must, never after 3pm. Cap at 200-400 mg/day." },
        { title: "Brain-specific nutrients", text: "Omega-3 (fatty fish 2×/wk or 1-2 g algae/fish oil), choline (eggs), B12 (animal protein or supplement if vegetarian), magnesium glycinate (300 mg evening — sleep + calm)." },
        { title: "Hydration baseline", text: "~30 ml per kg body weight per day. A 1L bottle on the desk, refill 2-3× = solved. Thirst is a lagging indicator — by the time you feel it you've already lost ~10% attention." }
      ]
    }
  ],

  useCases: [
    {
      id: "srs-for-life",
      title: "📅 Make Spaced Repetition Stick — For Life",
      desc: "The technique is simple. Keeping it as a daily habit for years is the hard part. This is the playbook that survives boredom, busy weeks, and tool-hopping.",
      icon: "📅", color: "#f778ba",
      steps: [
        { title: "Pick ONE tool and stop shopping", component: "Tool Lock-in", detail: "Anki (free, FSRS algorithm, syncs everywhere) is the boring correct answer. RemNote or Mochi if you want notes + cards in one place. Paper Leitner box if you hate screens. ⚠️ Tool-hopping every 3 months is the #1 reason people quit — pick one this week.", proto: "Decision", code: "Anki  →  https://apps.ankiweb.net" },
        { title: "Anchor reviews to an existing habit", component: "Habit Stacking", detail: "The review must attach to something you already do daily — willpower fails, anchors don't. ☕ Morning coffee → 10 min Anki before email. 🚌 Commute → phone Anki in dead time. 🚽 Bathroom break → 5 cards. Small wins compound.", proto: "BJ Fogg / James Clear" , refs: [{ label: "Atomic Habits — habit stacking", url: "https://jamesclear.com/habit-stacking" }] },
        { title: "Cap input, never cap reviews", component: "Throughput Discipline", detail: "Add only 5–15 new cards/day. Steady-state load = new × interval. Add 50/day and in a month you'll have 500 reviews/day and quit. NEVER skip reviews — skipping for a week creates a backlog that kills the habit. Skip new cards first.", proto: "Sustainable Rate", code: "new cards/day:  10\nmax reviews/day: 200" },
        { title: "Write atomic, personal cards", component: "Card Quality", detail: "One fact per card. 'List the 7 OSI layers' = bad. 'What is layer 3?' = good. Use cloze deletions for lists/definitions. Add your own example, sketch, or hook — the weirder, the stickier. NEVER make cards from material you don't yet understand — SRS is for retention, not learning.", proto: "20 Rules of Knowledge", refs: [{ label: "Wozniak — 20 Rules", url: "https://super-memory.com/articles/20rules.htm" }] },
        { title: "Make it frictionless and portable", component: "Friction Removal", detail: "Sync to phone + laptop + tablet. Reviews must start in <5 seconds from phone unlock — put the icon on the home screen. Offline-capable (planes, subway, signal-less moments are gold). If it takes more than one tap to start, you'll skip.", proto: "Friction < 5s" },
        { title: "Audit monthly — kill leeches, let easies fly", component: "Maintenance", detail: "Leech cards (failed 8+ times) → suspend or rewrite. They poison your time. Easy cards always rated Easy → let them stretch to 6+ months; don't fight the algorithm. If you can't sustain 20 reviews/day, you're adding too many new cards.", proto: "Monthly Review" },
        { title: "Stack with techniques SRS can't replace", component: "Combine Levers", detail: "SRS is ONLY for retrieving discrete facts. It will NOT build intuition (pair with Feynman), skill (pair with deliberate practice), or connections (pair with a concept map or Zettelkasten). Use the right tool for the right job.", proto: "Technique Stack" },
        { title: "White-knuckle the first 30 days", component: "Habit Formation", detail: "The habit forms around day 21–30. Until then: review EVERY day even if 5 cards. Tell someone you're doing it (social commitment). Track the streak — don't break the chain. After ~30 days the cost drops to ~10 min and the retention payoff becomes obvious.", proto: "Don't Break the Chain" },
        { title: "🚀 5-minute starter (do this today)", component: "Activation", detail: "1. Install Anki. 2. Import any starter deck in your domain (vocab, anatomy, chess openings, framework APIs). 3. Set new cards = 10/day. 4. Put the Anki icon on your phone's home screen. 5. Review tomorrow morning with coffee. That's it — you're in.", proto: "GO" }
      ]
    },
    {
      id: "balance-volume",
      title: "⚖️ Balance Techniques & Manage the Volume of Information",
      desc: "Most learners drown not in difficulty but in volume — too many cards, too many notes, too many open tabs. This is the calculus for deciding what to keep, what to drop, and how to split your time across techniques.",
      icon: "⚖️", color: "#d2a8ff",
      steps: [
        { title: "Triage every piece of info into one of 4 buckets", component: "Information Triage", detail: "Before storing anything ask: (1) MUST recall on demand → SRS card. (2) Need to UNDERSTAND deeply → Feynman + concept map. (3) Useful REFERENCE I'll look up → searchable note, no card. (4) Interesting but non-actionable → highlight + close tab, do not store. ~70% of what you read falls in bucket 4. Be ruthless.", proto: "4-Bucket Filter", code: "Recall?   →  Anki\nUnderstand? → Feynman\nLookup?   →  Notes\nNoise?    →  Drop" },
        { title: "Apply the 80/20 to your domain", component: "Pareto Pruning", detail: "In every field ~20% of concepts power 80% of the work. For each new topic ask: 'If I could only remember 5 things from this chapter forever, which 5?' Make cards/notes ONLY for those. The rest stays as searchable reference. This single rule cuts deck size 5× without losing real value.", proto: "80/20 Rule" },
        { title: "Time-box your weekly study budget", component: "Time Allocation", detail: "Pick a sustainable weekly budget (e.g., 5 hrs). A balanced default split:  30% retrieval (Anki/brain-dump)  ·  30% deliberate practice / problems  ·  20% deep understanding (Feynman + reading)  ·  15% connection (concept map / linked notes)  ·  5% reflection. Adjust by goal — exam-prep tilts to retrieval+practice; research tilts to connection.", proto: "Budget Split", code: "5 hr/wk →\n  90m  Anki + recall\n  90m  problems / practice\n  60m  Feynman + reading\n  45m  notes / mapping\n  15m  weekly review" },
        { title: "Cap card & note INTAKE, not throughput", component: "Intake Caps", detail: "Hard caps that survive contact with reality:  10–15 new Anki cards/day  ·  3–5 atomic notes/day in your Zettelkasten  ·  1 Feynman explanation/week  ·  1 concept-map revision/week. If you blow through these you'll have great input for a week and zero output for a year. Caps protect future-you.", proto: "Daily / Weekly Caps" },
        { title: "Use the Just-In-Time test", component: "JIT Filter", detail: "Before adding ANY card or note, ask: 'Will I actually need to recall this in the next 6 months without looking it up?' If no → don't store it. If you're storing 'because it's interesting' you're building a graveyard. The library does not need to live in your head.", proto: "6-Month Test" },
        { title: "Practice scheduled deletion", component: "Pruning Ritual", detail: "Monthly: scan your Anki deck for leeches (failed 8+ times) → rewrite or suspend. Quarterly: archive notes you haven't linked to or revisited. Annually: delete entire decks that no longer serve your goals. A 5,000-card deck you can't sustain is worse than a 500-card deck you do daily.", proto: "Prune Cycle" },
        { title: "Match technique to material type", component: "Right Tool, Right Job", detail: "Discrete facts (vocab, dates, syntax, formulas) → SRS. Procedural skills (coding, instruments, sport) → deliberate practice + worked examples. Conceptual depth (theory, models, frameworks) → Feynman + concept map. Cross-domain insight (research, writing) → Zettelkasten. Using SRS for everything is the most common mistake — it bloats your deck and starves the other levers.", proto: "Technique-Material Fit" },
        { title: "Run a weekly load check", component: "Weekly Audit", detail: "Every Sunday, 10 minutes: (1) Anki review count trending up or sustainable? (2) Notes growing faster than you can link them? (3) Did Feynman + practice actually happen this week, or did you only do the easy retrieval? If unbalanced → cut new intake by 50% next week and re-balance. The system must serve you, not the reverse.", proto: "Sunday Reset" },
        { title: "🎯 The minimal balanced stack", component: "Default Recipe", detail: "When in doubt run this: 10 min/day Anki  ·  3 problems/day mixed practice  ·  1 Feynman explanation/week (Sunday)  ·  3 atomic linked notes/week  ·  1 monthly leech-and-link audit. ~45 min/day total. Sustainable for years; covers all 5 cognitive levers; survives a busy week by shrinking proportionally — never to zero.", proto: "Default Stack" }
      ]
    },
    {
      id: "video-dryrun",
      title: "🎬 Dry-Run: Learning a 16-min Technical Video (TPU Explainer)",
      desc: "A worked example. How long does a video ACTUALLY take to learn at each depth, and how to chunk-and-dive instead of binge-and-forget. Uses 'Tensor Processing Units Explained' (The Coding Gopher, 16 min) as the test case — the same logic applies to any tutorial or lecture.",
      icon: "🎬", color: "#79c0ff",
      steps: [
        { title: "The brutal time/depth ladder", component: "Time Estimation", detail: "A 16-min video is NOT a 16-min learning task. Realistic budgets: Passive watch = 16 min · First understanding (pause, look up unknowns) = 45–60 min · Solid grasp, can describe each idea in own words = 3–4 hrs over 2 sittings · Thorough mastery, can backtrack any topic and explain it well = 12–20 hrs over 2–3 weeks · Working competence (good-enough for daily use) = 6–10 hrs over 1–2 weeks. Rule of thumb: depth × 4 per level.", proto: "Time Budget", code: "Watch       : 1×  duration\nUnderstand  : 3×  duration\nSolid grasp : 12× duration\nMastery     : 50× duration\n(for technical content)" },
        { title: "First pass — orient at 1× speed, no notes", component: "Pre-Survey (SQ3R 'S')", detail: "Watch the WHOLE thing once at normal speed without pausing. Goal: map the territory, not capture it. After watching, write a 5-line summary from memory. For the TPU video that'd be: 'CPU/GPU/TPU comparison → systolic array → MXU dataflow → bfloat16 → TPU pods → use cases'. Wrong details are fine — you're building the skeleton.", proto: "Skeleton First", code: "Time: 16 min watch + 5 min brain-dump = 21 min" },
        { title: "Chunk the video into bite-size segments", component: "Chunking", detail: "Working memory holds ~4 chunks at once (Cowan 2001). Split a 16-min video into 4-min segments aligned to topic boundaries — not arbitrary time slices. For the TPU video: (1) 0–3 min CPU vs GPU vs TPU framing · (2) 3–9 min systolic array & MXU dataflow · (3) 9–13 min bfloat16 & precision · (4) 13–16 min scaling, pods, use cases. ONE chunk per study session, not all four.", proto: "Chunk Boundaries" },
        { title: "Per chunk — watch · pause · explain · question", component: "WPEQ Loop", detail: "For each chunk: (W) Watch the segment, pen ready. (P) Pause and re-watch any 30-sec span you can't yet repeat. (E) Close laptop. Explain what just happened on a blank page (Feynman mini). (Q) Write 2-3 questions you still can't answer. The Q list IS your follow-up research plan. Budget: 4 min video → 25 min full WPEQ loop.", proto: "WPEQ", code: "W → 4 min  watch\nP → 5 min  re-watch sticky bits\nE → 10 min explain on paper\nQ → 5 min  unanswered questions\n────────────────\n     ~25 min / 4-min chunk" },
        { title: "Dive on the dense bit (the systolic array, ~3 min)", component: "Deep-Dive Drill", detail: "Every technical video has ONE conceptual core. In this video it's the systolic array dataflow. Don't move on until you can: (1) sketch a 4×4 array from memory · (2) trace where each operand enters and exits · (3) compute the pipeline fill cost. Open a notebook, code a 4×4 systolic array in 30 lines of NumPy. The 3 min of video → ~2 hrs of work — and you finally GET it.", proto: "Code the Core" },
        { title: "Build a 1-page concept map of the whole video", component: "Synthesis", detail: "After all 4 chunks, open one A4 page. Draw the 4 chunks as boxes, label the edges between them ('enables', 'requires', 'contrasts with'). For TPU: Systolic Array →(needs)→ Reduced Precision (BF16) →(scales via)→ ICI & Pods →(deployed for)→ Use Cases. Cross-link: Systolic Array →(differs from)→ GPU SIMT. The labels are where understanding lives.", proto: "Concept Map" },
        { title: "Make 8–15 Anki cards — only the recall-worthy bits", component: "Selective Retention", detail: "Out of ~40 facts in a 16-min video, only ~10–15 are worth memorizing forever. Use the 4-bucket triage from the previous use case. For TPU video keepers: BF16 bit layout (1+8+7) · MXU dimensions per generation · systolic pipeline fill formula · 'why bfloat16 over fp16' (one mechanism card) · ICI link count per v4+ chip. Drop: every marketing TOPS number, every 'Google uses this for Search' fact.", proto: "10–15 Cards Max" },
        { title: "Schedule the re-watch (don't skip this)", component: "Spaced Re-encounter", detail: "Re-watch the FULL video at 1.25× after 3 days, then again after 2 weeks. Each pass you'll notice things you missed — that's the spacing effect working on video, not just cards. After the 2-week re-watch, do one final Feynman pass on a blank page. If it flows end-to-end, you're done — archive your notes.", proto: "Spaced Repetition (Video)" },
        { title: "🎯 Total time accounting (the honest number)", component: "Audit", detail: "Orient pass (21 min) + 4 WPEQ chunks (4 × 25 min = 100 min) + systolic deep-dive code (120 min) + concept map (30 min) + Anki authoring (20 min) + 2 re-watches (40 min) + final Feynman (20 min) = ~5.5 hrs total spread over ~2 weeks. That delivers solid working competence on a 16-min video. Trying to do it in one sitting yields ~30 min of recall a week later — same hours, ~10% of the result.", proto: "Total: ~5.5 hrs" },
        { title: "Generalize the formula", component: "Reusable Template", detail: "For ANY technical video/lecture: budget ≈ (duration × 20) for solid competence, (duration × 50) for mastery. A 1-hr lecture ≈ 20 hrs to genuinely learn. This is why 'I watched the playlist at 2×' produces near-zero retention — the math was never on your side. Chunk + WPEQ + dive + spaced re-watch is the entire trick.", proto: "Duration × 20 ≈ Competence" }
      ]
    },
    {
      id: "pareto-determination",
      title: "🎯 Determining the 20% — How to Actually Find What Matters",
      desc: "Everyone repeats '80/20' but few have a method for FINDING the critical 20% in a new topic. These are the seven heuristics that work — use them to triage any book, course, or domain before you sink time into it.",
      icon: "🎯", color: "#7ee787",
      steps: [
        { title: "Heuristic 1 — Map the syllabus, count the references", component: "Frequency Analysis", detail: "Open the table of contents and the index. Concepts that appear in MULTIPLE chapters or have the most index sub-entries are almost always in the 20%. In *CLRS*: sorting, hashing, graphs, DP appear everywhere → core. Red-black trees appear in one chapter → not core. Same for video playlists — topics referenced across multiple lectures are foundational.", proto: "Index-Count Method", code: "Scan ToC + index →\nrank concepts by mention count\nTop 20% by frequency = core" },
        { title: "Heuristic 2 — Find the 'prerequisite' nodes", component: "Dependency Topology", detail: "Draw a quick concept dependency graph (10 min on paper). The nodes with the most OUTGOING edges (things that depend on them) are the 20%. In ML: linear algebra → calculus → probability are prerequisites to EVERYTHING — learn them solid, the rest cascades. A concept with zero outgoing edges (a leaf) is rarely worth deep memorization.", proto: "Outgoing-Edge Count" },
        { title: "Heuristic 3 — Ask the practitioner question", component: "Real-Use Filter", detail: "For each candidate topic ask: 'In the last 12 months, how often have working practitioners ACTUALLY used this?' Read 5 blog posts / Stack Overflow answers / PRs in your domain. Topics that show up in ≥3 of 5 = high-yield 20%. Topics in 0 of 5 (despite being in the textbook) = academic trivia, skip or defer.", proto: "5-Source Sample", code: "Sample 5 real-world artifacts\n(blogs, PRs, talks, incidents)\nCount topic appearances\n≥3 hits → core 20%" },
        { title: "Heuristic 4 — The 'exam blueprint' shortcut", component: "Past-Paper Mining", detail: "For any standardized topic (certifications, school exams, interview prep): tally topics across the last 5 years of past papers. The distribution is rarely uniform — usually 30% of topics produce 70% of marks. That's your 20%, with receipts. Works for: AWS certs · GRE/SAT · LeetCode interview tags · medical board exams · driving tests.", proto: "Past-Paper Histogram" },
        { title: "Heuristic 5 — The Pareto pre-mortem", component: "Imagine the Outcome", detail: "Imagine you've finished learning the topic and someone asks: 'What 5 things would you regret not knowing cold?' Write them BEFORE studying. Those 5 are your initial 20%. Update after week 1 with what surprised you. Forces you to start with the END state in mind — the opposite of cover-the-book learning.", proto: "Pre-Mortem List", code: "Q: 'In 3 months, what 5 facts\nwill I REGRET not knowing?'\nAnswer NOW → that's your 20%" },
        { title: "Heuristic 6 — The 'what breaks?' test", component: "Failure-Mode Probe", detail: "Ask: 'If a junior gets THIS concept wrong, what fails in production?' Concepts whose ignorance causes outages, security holes, or wrong answers are the 20%. Concepts whose ignorance just makes you slower or less elegant are the long tail. In SQL: indexes, transactions, NULLs → 20%. Window functions → useful but tail.", proto: "Blast-Radius Filter" },
        { title: "Heuristic 7 — Steal an expert's mental model", component: "Expert Shortcut", detail: "Find 2–3 senior people in the domain and ask: 'If you were teaching this in 4 hours, what would you cover?' Their answer IS the 20% — distilled by years of pattern matching you don't have yet. Equivalent: read 'overview' or 'principles of X' books (e.g., Hennessy & Patterson's *Computer Architecture: A Quantitative Approach*). Skip the encyclopedias.", proto: "Expert Distillation" },
        { title: "Combine — the triangulation rule", component: "Convergence Check", detail: "Any single heuristic has noise. Run 3+ heuristics on the same domain. The intersection (topics flagged by ALL of frequency + practitioner-use + expert-distillation) is your *high-confidence* 20% — start there. The union (flagged by any one) is your *full* 20%. Drop anything flagged by zero heuristics.", proto: "Triangulation", code: "20% = ⋂ (H1 ∪ H2 ∪ H3 …)\nhigh-confidence core =\n  flagged by ≥3 heuristics" },
        { title: "Worked example — applying it to the TPU video & study site", component: "Live Demo", detail: "Apply to `study/tpu.html` (20 deep dives, 90 mindmap nodes). Frequency: 'systolic array' appears in ~14 nodes → CORE. Dependency: 'matrix multiply' is prereq to every generation → CORE. Practitioner: 'BF16 vs FP32' appears in every ML blog → CORE. Expert: a Google TPU engineer's 4-hr talk covers exactly: systolic arrays, MXU, HBM, ICI, BF16, XLA, sharding. Convergent 20% = those 7 topics. Skip (for now): individual v1–v5p marketing specs, OCS internals, individual paper case studies.", proto: "Worked Result", code: "TPU high-confidence 20%:\n  1. Systolic arrays\n  2. MXU dataflow\n  3. HBM hierarchy\n  4. ICI / topology\n  5. BF16 (vs FP16/FP32)\n  6. XLA compilation\n  7. Sharding (data/model/pipeline)\n\nLearn these cold → 80%\nof every TPU conversation\nbecomes accessible." },
        { title: "Re-audit at 25%, 50%, 75% completion", component: "Iterative Refinement", detail: "Your initial 20% will be wrong by ~30%. That's fine — the act of studying reveals what's actually load-bearing. Re-rank after each quarter of progress: which topics keep showing up in problems? Which keep biting you? Promote those, demote things that turned out to be encyclopedic detail. The 20% is a moving target you sharpen, not a fixed list you commit to on day one.", proto: "Living Document" },
        { title: "🚦 Stop conditions for the long tail", component: "Drop Permission", detail: "Explicit permission to NOT learn the remaining 80%: (1) For most working roles, 80% knowledge of the 20% beats 30% knowledge of 100%. (2) The long tail is what reference docs / search / LLMs are FOR — outsource it. (3) Re-visit the long tail only when a real problem forces you. (4) 'I might need it someday' is not a reason — measure by 'in the last 6 months I needed it' instead. Without explicit drop permission, every learner over-scopes and burns out.", proto: "Permission to Drop" }
      ]
    },
    {
      id: "exam-prep",
      title: "📝 Cramming for an Exam Next Week",
      desc: "Closed-book test in 7 days. Already familiar with material but shaky. Optimise for short-term retrieval + minimal panic.",
      icon: "📝", color: "#58a6ff",
      steps: [
        { title: "Day 1 — Brain Dump", component: "Active Recall", detail: "For each topic, close all books and write everything you remember on a blank page. The gaps you discover ARE your study plan.", proto: "Retrieval Practice" },
        { title: "Day 2-3 — Targeted Re-study + Re-test", component: "Feynman", detail: "Re-study only the gaps. After studying each, immediately try to explain it on paper without notes.", proto: "Self-Explanation" },
        { title: "Day 4 — Mixed Practice Problems", component: "Interleaving", detail: "Mix problem types from across all topics. This builds the 'which technique do I use?' muscle.", proto: "Practice Testing" },
        { title: "Day 5 — Past Papers Under Timed Conditions", component: "Deliberate Practice", detail: "Simulate the real exam — same time limit, no notes, same paper format. Review every mistake.", proto: "Mock Exam" },
        { title: "Day 6 — Spaced Recap", component: "Spaced Repetition", detail: "Quick recall pass through all topics + re-do the 3 problems you failed yesterday.", proto: "Final Pass" },
        { title: "Day 7 — Sleep & Light Recall Only", component: "Consolidation", detail: "DO NOT cram. Sleep consolidates everything. A 15-min recall walk is the max. Eat. Sleep 8 hrs.", proto: "Rest" }
      ]
    },
    {
      id: "deep-understanding",
      title: "🧭 Deep Understanding of a Conceptual Subject",
      desc: "You need *intuition*, not just facts — e.g., physics, ML theory, economics. Long timeline (months).",
      icon: "🧭", color: "#7ee787",
      steps: [
        { title: "Build a Concept Map First", component: "Concept Mapping", detail: "Before diving into chapter 1, sketch what you think the field's structure looks like. Update weekly.", proto: "Pre-mapping" },
        { title: "Read Actively with Elaboration", component: "Elaborative Interrogation", detail: "Every paragraph: write a 1-line 'why does this matter / why is it true?' in the margin.", proto: "Active Reading" },
        { title: "Find or Build Analogies", component: "Analogical Reasoning", detail: "For each new abstract concept, find a familiar concrete analog. Voltage ↔ water pressure; backprop ↔ blame assignment.", proto: "Analogy Mapping" },
        { title: "Feynman Weekly", component: "Feynman Technique", detail: "Every Friday: pick one concept from the week and explain it end-to-end on a blank page. Refine until it flows.", proto: "Gap Diagnosis" },
        { title: "Link to a Knowledge Base", component: "Zettelkasten", detail: "Each concept gets a permanent note linked to ≥2 existing notes. Your graph IS your understanding.", proto: "Linked Notes" },
        { title: "Teach Someone", component: "Protégé Effect", detail: "Write a blog post, give a talk, tutor a peer. Teaching forces you to surface every fuzzy bit.", proto: "Public Explanation" }
      ]
    },
    {
      id: "skill-acquisition",
      title: "🛠️ Acquiring a Practical Skill (coding, language, instrument)",
      desc: "You need to *do* something, not just know it. Output quality matters.",
      icon: "🛠️", color: "#ffa657",
      steps: [
        { title: "Study Worked Examples First", component: "Worked Examples", detail: "Don't start from a blank screen. Read 3-5 complete solutions for each new pattern.", proto: "Scaffolding" },
        { title: "Faded Practice", component: "Faded Worked Examples", detail: "Re-do the example with the last step blanked. Then the last two. Until you can do it solo.", proto: "Progressive Fade" },
        { title: "Interleaved Problem Sets", component: "Interleaving", detail: "Mix problem types — don't do 20 'binary search' problems in a row. Mix sorting, trees, graphs in one session.", proto: "Mixed Practice" },
        { title: "Deliberate Practice on Weak Spots", component: "Deliberate Practice", detail: "Identify your worst sub-skill (recursion? mutex bugs?). Drill it in isolation with immediate feedback.", proto: "Targeted Reps" },
        { title: "Spaced Review of Patterns", component: "Spaced Repetition", detail: "Maintain an Anki deck of patterns you've solved. 'When I see X, I try Y.' Review daily." , proto: "SRS for Patterns" },
        { title: "Build & Ship Something Real", component: "Project-Based Transfer", detail: "Apply the skill to a problem that matters to you. Transfer to real conditions is the final test.", proto: "Real Project" }
      ]
    },
    {
      id: "lifelong",
      title: "🌱 Lifelong Learning (no deadline)",
      desc: "Reading widely to grow over years has no exam, no syllabus, no boss. That sounds free — it's actually the hardest mode, because nothing forces consistency. This is the playbook for non-fiction books, papers, and self-chosen courses that compound across decades: how to pick the right book, read it actively, capture what matters, link it to what you already know, revisit it correctly, and share it so it sticks.",
      icon: "🌱", color: "#d2a8ff",
      steps: [
        { title: "Pick books that EARN your time — most don't", component: "Selection Filter", detail: "Without a deadline, your only scarce resource is attention. Filter ruthlessly: (1) Does the book solve a problem you actually have right now? (2) Has it survived 10+ years (vs the latest hype cycle)? (3) Did someone you respect re-read it? (4) Open to a random page — is the prose clear? You can read maybe 30-40 non-fiction books a year, ~1,500 in a lifetime. Every weak book displaces a great one forever. Naval's rule: 'Read what you love until you love to read.' Sturgeon's rule: '90% of everything is crap' — including books. Quit fast.",
          proto: "Pick → Quit → Pick",
          code: "Selection checklist (yes to 2+):\n  ☐ solves a real current problem?\n  ☐ 10+ years old & still cited?\n  ☐ re-read by someone you trust?\n  ☐ random page = clear prose?\n  ☐ teaches a mental model you lack?" },
        { title: "Pearl's 50-page rule — quit early and proudly", component: "Quit Discipline", detail: "Nancy Pearl: if you're under 50, read 50 pages before deciding to abandon. Over 50, subtract your age from 100 → that's how many pages a book gets. A book is not a friend you owe loyalty to. Each page you grind through a mediocre book is a page stolen from a great one. Sunk-cost thinking is the #1 reason people read fewer good books than they could. Keep a 'quit list' — it's a badge of taste, not failure. The books you quit often re-enter your life 5 years later when you're ready; that's fine.",
          proto: "Quit ≠ failure",
          code: "Quit triggers (any one):\n  · I keep re-reading the same paragraph\n  · I'd rather be doing chores\n  · Author hasn't earned trust by page 50\n  · Same idea repeated 3 ways\n  · No new mental hooks formed" },
        { title: "Read with a pen — marginalia beats highlighting", component: "Active Reading + Dual Coding", detail: "Passive highlighting feels productive and produces almost nothing 2 weeks later. Replace it with a tiny symbol vocabulary that forces a judgment on every mark: ? = unclear, ! = surprising, ★ = key idea, □ = follow-up to look up, △ = I disagree, → = connects to [X]. Add sketches in the margin (dual coding: words + pictures encode in two different memory systems and reinforce each other — Paivio 1971). Mortimer Adler's <em>How to Read a Book</em>: 'Marking a book is literally an expression of your differences or your agreements with the author. It is the highest respect you can pay him.'",
          proto: "Symbol vocabulary",
          code: "?   unclear, come back\n!   surprising claim\n★   key contribution\n□   look this up later\n△   I disagree / weak\n→   links to [other idea]\n[*] worth an Anki card",
          refs: [{ label: "Adler — How to Mark a Book", url: "https://stevenson.ucsc.edu/academics/stevenson-college-core-courses/documents/2019/Adler-How%20to%20Mark%20a%20Book.pdf" }] },
        { title: "The 3-pass rule for non-fiction (Adler-style)", component: "Pass Structure", detail: "Most non-fiction doesn't deserve linear reading. Pass 1 — <b>Inspectional</b> (~30 min): table of contents, preface, conclusion, first/last paragraph of each chapter. You now know if it deserves Pass 2. Pass 2 — <b>Analytical</b> (~6-10 hr): read for understanding, with your pen. Annotate symbols, capture key claims. Pass 3 — <b>Syntopical</b> (when you have a question that crosses multiple books): bounce between 3-5 books on the same theme, comparing how they answer your question. Reading 5 books syntopically on one theme teaches you more than reading 50 books linearly.",
          proto: "Inspectional → Analytical → Syntopical",
          refs: [{ label: "Adler — How to Read a Book", url: "https://en.wikipedia.org/wiki/How_to_Read_a_Book" }] },
        { title: "Sunday brain-dump — retrieval beats re-reading", component: "Weekly Retrieval", detail: "Every Sunday evening (15 min): close all books and notes. On a blank page write — from memory — 'What did I read this week? What's the one idea I want to remember? Who would I explain it to and how?' This is testing-effect (Roediger & Karpicke 2006): retrieval practice produces 2-3× better long-term retention than passive re-reading the same material for the same time. The act of trying to remember strengthens the trace, even when you fail. Bonus: noticing gaps reveals where your understanding is shallow — that's tomorrow's reading priority.",
          proto: "Sunday recall",
          code: "Weekly journal template (~15 min):\n  This week I read:        ___\n  ONE idea worth keeping:  ___\n  Where would I use it?    ___\n  What did I forget?       ___ (re-read that part)\n  Next week's pick:        ___" },
        { title: "Atomic linked notes — your second brain (Zettelkasten)", component: "Permanent Notes", detail: "Niklas Luhmann published 70 books and 400 papers using a paper-card Zettelkasten. The two rules that did the work: (1) <b>One idea per note</b> — atomic, in your own words, ~200 words, stand-alone (no 'see book X p47'). (2) <b>Every note links to 2+ existing notes</b> — even if the link feels weak. After 12 months you'll have ~300 notes and an organic web of connections nobody else has mapped because nobody else read those exact sources in that exact order. The notes ARE your thinking; books are raw material. Tools: Obsidian, Roam, Logseq — but a folder of .md files works.",
          proto: "Note ↔ Note ↔ Note",
          refs: [
            { label: "How to Take Smart Notes (Sönke Ahrens)", url: "https://takesmartnotes.com/" },
            { label: "Zettelkasten Method overview", url: "https://zettelkasten.de/posts/overview/" }
          ] },
        { title: "Anki, but only for the load-bearing facts", component: "Spaced Repetition", detail: "Spaced repetition (Anki, Mochi) keeps a fact alive forever for <30 sec/day per card. The trap: people add hundreds of cards per book and drown. Better rule — <b>5-15 cards per book, max</b>, and only for: named results/laws, the canonical formula, the precise definition, the killer numeric ('compound interest at 7% doubles in 10 years'), the one-line method summary. NOT card-worthy: author opinions, chapter summaries, vibes — those live in your Zettel. Tag every card with the book id so it can be deleted if your view changes.",
          proto: "5-15 cards / book",
          code: "Card-worthy        :  Anki\nMental models      :  Zettel notes\nBook overview      :  one-page summary\nQuotes & vibes     :  margin + journal\n\nOver-carding rule: if your daily reviews\nexceed 20 min, delete the weakest 30%." },
        { title: "Spaced re-encounter — re-read what mattered", component: "Re-read Cycle", detail: "The compounding move most readers skip. Schedule: re-skim your own one-page summaries <b>monthly</b> (5 min each). Re-skim your Zettel notes by random sampling <b>weekly</b> (10 min — surprise re-encounters are the best). Re-read your 5 favourite books <b>annually</b> — the book hasn't changed, but you have, and you'll find what you couldn't see before. Heraclitus updated: you cannot step into the same book twice. A book re-read 3× over a decade teaches more than 30 new books read once.",
          proto: "Re-read calendar",
          code: "Cadence:\n  weekly  :  10 min random Zettel walk\n  monthly :  skim all one-pagers\n  yearly  :  re-read 1-3 top books\n  5-yearly:  re-read your formative book\n              (almost a different book now)" },
        { title: "Build a personal canon — 10 books you re-read forever", component: "Personal Canon", detail: "After 5-10 years of wide reading, a small set will earn re-read status. These are YOUR canon — 5 to 20 books that consistently teach you new things on the 3rd, 5th, 10th read because they're rich enough to grow with you. Examples that often qualify: <em>How to Read a Book</em>, <em>Thinking Fast and Slow</em>, <em>Meditations</em>, <em>The Beginning of Infinity</em>, <em>Gödel Escher Bach</em>, the one programming book that shaped you. The canon is a stable substrate of mental models — every new book gets read against it, and slots into the web instead of floating away.",
          proto: "Curate, don't accumulate" },
        { title: "Annual reading themes — focus beats variety", component: "Yearly Theme", detail: "Pick ONE deep theme per year — 6 to 12 books, in conversation with each other (syntopical reading at the year scale). Year 1: 'how the mind works'. Year 2: 'how complex systems fail'. Year 3: 'the history of computing'. A year of themed reading produces 3× more durable understanding than the same number of unrelated books, because each book reinforces (or productively contradicts) the others. Keep a small side budget (~20%) for serendipity — books outside the theme that found you, not the other way around.",
          proto: "1 theme · 6-12 books · 1 year" },
        { title: "Discuss in public — defending an idea reveals if you own it", component: "Social Elaboration", detail: "An idea you can't explain to a smart friend you don't actually understand (Feynman). Pick one of: monthly book club (3-5 people, same book), a blog/newsletter where you write a 600-word take after each book, a podcast with a co-host, dinner conversations with a 'what I'm learning' opener, or a Discord/Slack channel for the theme. Two things happen: (1) you read sharper because you know you'll have to explain it, (2) someone in the audience corrects, extends, or surprises you in a way solo reading never would. Even 'discussing' to yourself by writing publicly produces 80% of the benefit.",
          proto: "Output forces clarity",
          code: "Cheapest 'public' formats:\n  · 1 tweet/Mastodon post per book (~30 min)\n  · 600-word blog summary (~2 hr)\n  · 30-min walk + voice memo + share\n  · 1 question to a Discord/forum\n  · explain to a friend over coffee" },
        { title: "Parallel reading — 3 books at once, by mode", component: "Stack Strategy", detail: "One book is fragile (you'll stall and stop). Three books, picked by cognitive mode, almost guarantees daily progress: <b>(1) Hard book</b> for peak hours (theory, dense non-fiction) · <b>(2) Medium book</b> for mid-energy time (history, biography, narrative non-fiction) · <b>(3) Light book</b> for fatigue/bedtime (essays, fiction, memoir). You'll always have something matching your current state. Don't go above ~4 in parallel — it dilutes the encoding. Finish or quit; don't accumulate half-read piles.",
          proto: "Match book to energy" },
        { title: "Anti-patterns to dodge", component: "Common Traps", detail: "1) <b>Bookshelf-as-trophy</b> — buying ≫ reading; collecting books gives the dopamine of learning without the work. 2) <b>Highlight without judging</b> — passive marks rot in 2 weeks. 3) <b>Finishing every book you start</b> — sunk-cost ruins your average. 4) <b>Reading the new instead of the proven</b> — recency bias picks heat over signal. 5) <b>Reading without a question</b> — without intent even a great book is forgettable. 6) <b>Skipping the journal/Zettel</b> — without capture, 80% evaporates in 6 weeks. 7) <b>Reading alone forever</b> — no friction, no growth. 8) <b>Goodreads vanity counts</b> — racing for 100 books/year produces shallow reads. Trade speed for depth.",
          proto: "What to STOP doing" },
        { title: "🚀 30-minute starter — start the practice today", component: "Activation", detail: "Today (30 min total): (1) Pick ONE book from your shelf that's been waiting (5 min). (2) Set up a single .md or notebook called 'reading log' (3 min). (3) Read 10-20 pages with a pen using the symbol vocabulary above (15 min). (4) Close the book and write 3 sentences from memory: what was the chapter about · one surprising idea · one question it raised (5 min). (5) Pick the same time tomorrow. The whole system above unfolds from this one daily ritual; don't try to set up Zettel/Anki/book-club on day one — that's premature optimisation. Start the loop, the rest accretes.",
          proto: "GO",
          code: "Day 1 commitment:\n  20 pages · 15 min · pen in hand\n  3-sentence recall · same time daily\n\nWeek 4 check: am I actually reading?\n  Yes → add Sunday journal\nWeek 8 check: am I retaining?\n  Yes → add Zettel notes\nWeek 12: pick yearly theme + 1 friend" }
      ]
    },
    {
      id: "read-a-paper",
      title: "📄 How to Read a Research Paper — Without Drowning",
      desc: "A research paper is dense by design — 8 pages can hide 2 years of work. Reading it linearly start-to-finish is the worst possible strategy. This is the Keshav 3-pass method + the augmentations that turn a paper into knowledge you can use, cite, and explain.",
      icon: "📄", color: "#79c0ff",
      steps: [
        { title: "Decide WHY you're reading this paper", component: "Exit Criteria", detail: "Three levels of intent change everything: (A) Triage — 'is this even worth my time?' → 5 min. (B) Comprehension — 'what did they do, what works, what doesn't?' → 1 hr. (C) Reproduction — 'I could implement this / build on this' → 4-5 hrs. Pick ONE before you open the PDF; promote later if it earns it. Reading a paper at level C when level A would do is the #1 way to lose weekends.", proto: "Set the depth", code: "Triage      :  5 min   (1 pass)\nComprehend  :  1 hr    (2 passes)\nReproduce   :  4-5 hr  (3 passes + code)" },
        { title: "Pass 1 — 5 to 10 minutes, no notes yet", component: "Keshav Pass 1", detail: "Read in this exact order: TITLE → ABSTRACT → INTRODUCTION → SECTION HEADINGS only → CONCLUSION → glance at REFERENCES (do you recognize names?). Skip everything else. After: in 60 seconds answer the 5 C's: Category (what kind of paper), Context (which other papers it relates to), Correctness (do the assumptions seem valid), Contributions (what's actually new), Clarity (is it well written?). If 3+ of the 5 are weak → STOP. You don't owe every paper a deep read.", proto: "5 C's filter", refs: [{ label: "Keshav — How to Read a Paper", url: "https://web.stanford.edu/class/ee384m/Handouts/HowtoReadPaper.pdf" }] },
        { title: "Pass 2 — 1 hour, structural read with annotation", component: "Keshav Pass 2", detail: "Read the whole paper but SKIP proofs / detailed math derivations. Mark up: (1) the EXACT problem being solved (write it as a sentence in your own words at the top), (2) every key figure (understand the axes, the legend, what 'good' looks like), (3) underlined claims that you'd quote if writing about this. End with a 5-line summary FROM MEMORY — close the PDF, open a blank page. If you can't summarize from memory, you didn't actually read it.", proto: "Structural read", code: "After pass 2 you should be able to answer:\n  • What problem?\n  • What's the key idea?\n  • What evidence supports it?\n  • What's the main limitation?\n  • Could I explain this on a whiteboard?" },
        { title: "Pass 3 — 4 to 5 hours, virtual re-implementation", component: "Keshav Pass 3", detail: "Only for papers you'll truly build on. Read every section assuming you are the author. Re-derive each equation. Sketch each algorithm in pseudocode. For every design choice, ask 'what would I have done?' and note where you diverge. Find what they DIDN'T say — implicit assumptions, missing baselines, weak evaluations. This is where you spot the future paper hiding in the gaps.", proto: "Reproduce-in-head", code: "Each equation:  derive on paper\nEach algorithm: pseudocode\nEach plot:      could you recreate it?\nEach baseline:  is it the right comparison?" },
        { title: "Read figures, tables, and references like first-class content", component: "Visual Triage", detail: "Most readers skim figures. STOP. Figures and tables carry 80% of the actual evidence. For each: (1) read the caption fully (often more precise than the prose), (2) name the axes and units out loud, (3) ask 'what would falsify the claim this figure makes?'. References are a free literature map — circle the 3 most-cited works there; they're the prerequisites you should read NEXT if anything was opaque.", proto: "Figures-first", code: "Per figure (3 min):\n  caption  →  axes  →  legend  →\n  what's the story?  →  what could disprove it?" },
        { title: "Active annotation — write IN the paper, not next to it", component: "Marginalia", detail: "Develop a tiny shorthand: ? = unclear · ! = surprising claim · ★ = key contribution · □ = follow-up to look up · △ = I disagree / weak argument. Highlight is passive and useless 2 weeks later — symbols force a judgment. Tools: Zotero + a tablet, or print + pen if the paper is dense. The marked-up PDF becomes your durable artifact, not your linear notes.", proto: "Symbol vocabulary" },
        { title: "Synthesis — produce ONE page, not 10", component: "One-Pager Output", detail: "After the read, force the paper through a fixed template on a single page: PROBLEM (1 sentence) · PRIOR WORK (1 line each, max 3) · KEY IDEA (1 paragraph in plain English) · EVIDENCE (1 sentence + the most convincing figure) · LIMITATIONS (3 bullets) · WHAT THIS LETS ME DO NEXT (1-3 lines). If you can't fit it on a page, you didn't understand it. The one-pager is what you'll re-read in 6 months — not the paper.", proto: "Paper one-pager", code: "Template (~1 page):\n  Problem       : ___\n  Prior work    : ___ ___ ___\n  Key idea      : ___\n  Evidence      : ___ (fig N)\n  Limitations   : ___ ___ ___\n  Next for me   : ___" },
        { title: "Convert to Anki cards — but ONLY what passes the 6-month test", component: "Card Distillation", detail: "Add 3-8 Anki cards per paper, no more. Card-worthy: the named result/theorem, the canonical formula, the killer numeric ('FlashAttention reduces memory from O(N²) to O(N)'), the precise problem definition, the 1-line method summary. NOT card-worthy: experimental setup details, ablation specifics, related-work attributions — those belong in the one-pager. Tag every card with the paper id so you can trace it back. (See the anki plugin in this repo for the conventions.)", proto: "Paper → 3-8 cards" },
        { title: "Stack-read: 10 papers in a domain in a week", component: "Domain Sweep", detail: "Going deep on one paper teaches the paper. Going wide on 10 teaches the FIELD. Pick a seed paper, build a reading list from its references + papers that cite it (Google Scholar 'cited by'). Pass-1 all 10 in one sitting (50 min total). Cluster: which 2-3 deserve a Pass 2? Which 1 deserves Pass 3? Now you have a literature map most newcomers spend months developing. Output: one paragraph per paper + a 1-page concept map showing how they relate.", proto: "Breadth-first sweep", code: "Day 1  : Pass-1 all 10        (~50 min)\nDay 2-3: Pass-2 top 3        (~3 hr)\nDay 4-5: Pass-3 top 1        (~5 hr)\nDay 6  : Concept map + write-up\nDay 7  : Share with someone (Feynman)" },
        { title: "Read for the gaps — every paper points at the next one", component: "Gap Mining", detail: "After Pass 2, write 3 follow-up questions the paper DOESN'T answer: 'How does this scale to N=10×?' · 'What happens under distribution shift?' · 'Why didn't they compare against X?'. These gaps are (a) future research directions, (b) the questions to bring to the author / reviewer / interviewer, (c) the seed of YOUR next paper. The gaps are more valuable than the contributions for an active researcher.", proto: "Gap questions" },
        { title: "Common traps to dodge", component: "Anti-Patterns", detail: "1) Reading linearly start-to-finish (you'll bog down in Section 2 and miss the point). 2) Highlighting without judging (passive). 3) Adding 30 Anki cards per paper (queue death). 4) Treating a hard paper as a personal failing — sometimes the paper IS badly written; move on. 5) Reading without a prior question — without intent, even a great paper is forgettable. 6) Never sharing what you read — a paper unspoken is a paper unlearned.", proto: "Don't do this" },
        { title: "🚀 30-minute starter — pick a paper today", component: "Activation", detail: "1) Choose a paper at the edge of your current work (not random). 2) Decide your level: A, B, or C (start with B). 3) Do Pass 1 (10 min). 4) If it earns it, do Pass 2 (open the timer, 60 min hard stop). 5) Write the one-page summary BEFORE bed. 6) Tomorrow morning, decide: do I need Pass 3 for this paper? 80% of the time the answer is no — and you've still extracted more value than 90% of readers.", proto: "GO" }
      ]
    },
    {
      id: "memory-fatigue",
      title: "🧠 Beating Memory Fatigue on Long Study Days",
      desc: "Encoding capacity decays sharply after ~90 min and crashes past 4-5 hrs without real recovery. The playbook for 8-10 high-quality study hours: spot fatigue early, take the right kind of break, defend sleep + glucose, and put the hardest material in your peak window.",
      icon: "🧠", color: "#ffa657",
      steps: [
        { title: "Memory fatigue is a REAL biological cost — not a willpower problem", component: "The Mechanism", detail: "Encoding new information runs on (1) prefrontal attention circuits that burn glucose locally, (2) hippocampal pattern-separation that needs spaced consolidation, and (3) noradrenaline/dopamine tone that decays with sustained effort. After ~90 min of focused encoding, the hippocampus is biochemically full — new items overwrite older ones before they consolidate. Pushing harder doesn't make this go away; it makes the forgetting worse. The fatigue you feel after hour 4 is not laziness — it's a signal you've maxed out the encoding budget for that block.", proto: "Brain ≠ CPU", code: "Encoding capacity over a single day:\n  hr 1 :  ████████████  100%\n  hr 2 :  ███████████    92%\n  hr 3 :  █████████      78%\n  hr 4 :  ██████         55%\n  hr 5 :  ████           35%   ← here be illusions\n  hr 6 :  ██             18%\n  (without intentional recovery)" },
        { title: "Spot fatigue 20 minutes before it crashes you", component: "Early-Warning Signs", detail: "Don't wait for exhaustion — by then you've already wasted 30-60 min. The leading indicators: (1) re-reading the same paragraph and still not retaining it, (2) reaching for your phone every 2-3 min, (3) micro-typos and miscounts you wouldn't normally make, (4) feeling 'productive' but unable to summarize the last 15 min from memory, (5) physical: yawning, eye dryness, neck/shoulder tension, slumping posture. Two or more of these = STOP the encoding block now. Continuing past these signals doesn't add productive time; it adds garbage time you'll need to redo.", proto: "Yellow-light list" },
        { title: "Work in 90-minute ultradian cycles, not 'as long as I can'", component: "Ultradian Rhythm", detail: "BRAC (Basic Rest-Activity Cycle, Kleitman 1969 → modern replication): the brain runs on ~90-min cycles of high → low alertness, even during the day. Align study blocks to it: 75-90 min of deep encoding, then 15-25 min of TRUE rest. Three of these in a morning = ~4.5 hrs of real work, far more than 6 hrs of grinding through fatigue. Four is the practical ceiling for most adults. Stop trying for five — the data is unambiguous: the 5th block produces less retention than skipping it.", proto: "90 / 20", code: "Sustainable day (max retention):\n  09:00–10:30  block 1 (hardest material)\n  10:30–10:50  REAL break\n  11:00–12:30  block 2 (next-hardest)\n  12:30–13:30  lunch + walk\n  13:30–15:00  block 3 (review / lighter)\n  15:00–15:30  break\n  15:30–17:00  block 4 (consolidation, planning)\n  ─────────────\n  ~5 hr deep work · 8 hr clock" },
        { title: "An 'active rest' break is NOT scrolling your phone", component: "Real vs Fake Breaks", detail: "A phone-scroll break feels restful but keeps the same attention circuits firing AND adds dopamine noise that makes returning to deep work harder. <b>Real recovery</b> = (a) eyes off screen for 10+ min, (b) different sensory modality (walk, dishes, stretching, music), (c) no new decisions or information intake. Berman et al. (2008) showed a 50-min walk in nature improved attention scores by ~20% vs an urban walk. A 10-min walk works too. Even staring out a window beats Instagram for cognitive recovery.", proto: "Default break menu", code: "GOOD breaks (true recovery):\n  · walk outside (no headphones for deep recovery)\n  · stretch / light yoga\n  · wash dishes / tidy a small area\n  · stare out a window\n  · 10-min NSDR / yoga nidra audio\n  · 20-min nap (set an alarm — beyond 30 min causes grogginess)\n\nBAD breaks (look restful, aren't):\n  · phone scrolling / social media\n  · news / podcasts on hard topics\n  · responding to messages\n  · 'just one more video'" },
        { title: "The 3 physiological levers: sleep, glucose, hydration", component: "Bio-Substrate", detail: "All cognitive tricks fail on a broken substrate. <b>Sleep:</b> &lt;7 hr cuts new-info retention by ~40% (Walker, 2017). One night below 6 hr ≈ 0.08% BAC for working memory. <b>Glucose:</b> the brain burns ~120 g/day — skip a meal during heavy encoding and you'll feel it in 90 min. Slow carbs + protein > sugar spike + crash. <b>Hydration:</b> 2% dehydration measurably degrades attention. Adults under-drink by default when focused — keep water in arm's reach. Optimize ONE per week if all three feel hard; the cognitive ROI is bigger than any study technique.", proto: "Substrate first" },
        { title: "Schedule the hardest material when YOU are sharpest, not when convenient", component: "Chronotype Match", detail: "About 25% of adults peak before 10 am, ~25% peak after 6 pm, the rest fall in the middle (Roenneberg chronotype studies). Track your own focus quality (1-10) every 90 min for 5 days. Stack the hardest encoding (new theory, dense papers) on your two peak blocks. Reserve trough hours for known-easy work: review, organizing notes, watching skim-able videos, light coding. Forcing hard work into a trough is a 2× cost — bad encoding AND your peak block goes wasted on easy stuff.", proto: "Peak match", code: "Morning chronotype (~25%):\n  peaks 09:00, ~14:00 ·  trough 16:00\nEvening chronotype (~25%):\n  peaks 11:00, 19:00 ·  trough 14:00\nDay 1-5: rate each block 1-10\nDay 6:   schedule the next month around your top 2 windows" },
        { title: "Context-switching ALSO drains the encoding budget", component: "Switch Tax", detail: "Each switch between topics carries a 5-25 min 'attention residue' cost (Leroy 2009) — your brain keeps processing the prior task. So 4 hours split across 6 unrelated topics ≈ 2 hours of actual deep work. <b>Batch by cognitive mode</b>: one 90-min block on Topic A · one on Topic B · DON'T toggle within a block. Same goes for tools: open the 3-4 tabs you need at the start of a block, close everything else (especially chat/email). 'Inbox-zero' culture is a slow-leak attack on retention.", proto: "Mode-batching" },
        { title: "Use the 'second-wind hour' wisely — it's an illusion", component: "Anti-Pattern", detail: "Around hour 6-7 of a long study day many people get a sudden energy spike (sympathetic rebound, often after dinner). It FEELS like you're back to peak. You're not — measurable encoding and reasoning is still well below morning levels. Use this window for: <b>reviewing</b> what you encoded earlier (retrieval doesn't need peak capacity), <b>planning</b> tomorrow, <b>organizing</b> notes, <b>light synthesis</b>. NOT for: cramming new theory, hard problems, or watching a dense lecture. People who confuse second-wind for true peak are the ones who study 10 hr/day and retain less than someone doing 5.", proto: "Trust the curve, not the feel" },
        { title: "Recovery protocols that actually work (in order of effect)", component: "Recovery Stack", detail: "Ranked by evidence + practicality: <b>(1) Sleep</b> — non-negotiable, single biggest lever. <b>(2) 20-min nap</b> before 3 pm (Mednick et al. — 20 min restores attention without sleep inertia; >30 min causes grogginess). <b>(3) NSDR / yoga nidra</b> — 10-20 min lying down with a guided audio; restores dopamine baseline without the full nap cost (Huberman lab). <b>(4) Outdoor walk 15-30 min</b>, ideally with greenery (Attention Restoration Theory). <b>(5) Cold-water face splash</b> — mammalian dive reflex, 30-60 sec of focused calm. <b>(6) 4-7-8 breathing</b> — 4 cycles down-regulates sympathetic load. Stack them based on time budget; don't try all in one day.", proto: "Pick by time budget", code: "Time you can spare → best recovery:\n  20 sec   :  cold splash + 4-7-8 breath\n  5 min    :  walk + window + water\n  15 min   :  walk outdoors, no phone\n  20 min   :  nap (alarm!) OR NSDR audio\n  90 min   :  nap + walk + meal\n  full eve :  zero screens 1 hr pre-bed" },
        { title: "Spaced recall ≫ extended re-study at every fatigue level", component: "Fatigue-Proof Technique", detail: "Retrieval practice (Anki, brain-dump, self-quizzing) survives fatigue far better than re-reading or watching new lectures. Why: retrieval uses already-encoded traces (cheaper) where new encoding builds new traces (expensive). So when fatigue hits and you still want to be productive, DON'T push more new material — switch to retrieval. Hour 6-8 is great for Anki reviews, problem sets on yesterday's topic, or Feynman-explaining today's morning material. Same wall-clock time, very different retention.", proto: "Late-day = retrieval", code: "Fatigue level → best technique:\n  fresh        : new theory, dense papers\n  mid-day      : worked examples, derivation\n  late         : retrieval (Anki, recall)\n  exhausted    : organizing notes, planning\n  past that    : sleep — anything else is theatre" },
        { title: "The honest weekly ceiling for sustained deep learning", component: "The Hard Numbers", detail: "Cal Newport's 'Deep Work' surveys + Ericsson's expert-performance studies converge: <b>4 hours/day, ~25 hours/week</b> of true deep work is the sustainable ceiling for most adults. Some people hit 5; almost nobody sustains 6+ for weeks without breakdown. 'I studied 12 hours today' is almost always 4 hours of real work + 8 hours of fatigue-grinding low-yield activity. <b>Reframe the goal</b>: not 'how many hours can I sit there' but 'how many high-quality deep-encoding hours did I bank this week'. The latter is what compounds into expertise.", proto: "Cap, don't max", code: "Reality vs perception:\n  Self-reported : 10-12 hr/day\n  Actual deep   : 3-5 hr/day  ← the real metric\n  Sustainable   : 25 hr/week\n  Weekly cap    : ~30 hr (else REM debt accumulates)" },
        { title: "Common traps that quietly destroy long-day productivity", component: "Anti-Patterns", detail: "1) <b>Skipping the morning block</b> for 'easy admin' — you spend your sharpest hour on email. 2) <b>'I'll take a break after this section'</b> — sections expand to fill the fatigue. Set hard time stops. 3) <b>Caffeine after 2 pm</b> — half-life 5-6 hr, wrecks the deep-sleep that consolidates today's encoding. 4) <b>Studying with social media open</b> — even unread notifications degrade attention (Stothart 2015). 5) <b>No protein at lunch</b> — pure-carb lunch → 2 pm crash. 6) <b>Doing the same kind of work all day</b> — switch modalities (read → write → discuss → code → sketch). 7) <b>Pulling an all-nighter before a deadline</b> — 24 hr no sleep ≈ 0.10% BAC; you cannot encode through it.", proto: "Avoid these" },
        { title: "🚀 Today's starter — design your next 8-hour study day", component: "Activation", detail: "1) Pick the ONE hardest topic for the day; commit it to your peak window. 2) Block 3 × 90-min sessions on a calendar, with 20-min recovery slots between. Treat the breaks as un-cancelable. 3) Pre-pick the 'real break' activity for each slot (walk, NSDR, dishes). 4) Set a phone in another room during deep blocks. 5) After lunch: switch to retrieval-mode work (Anki, brain-dump on morning material). 6) Stop the new-material encoding by 5 pm regardless of how you feel. 7) Tomorrow morning, rate each block 1-10 — within 5 days you'll find your real ceiling and your two peak windows.", proto: "Design tomorrow tonight" }
      ]
    },
    {
      id: "diffused-thinking",
      title: "🌫️ Diffused-Mode Thinking — Engineering Insight",
      desc: "Use the OTHER thinking mode on purpose. Focused mode grinds; diffused mode connects. Insight lives in the alternation. A practical protocol for stuck-problem solving + creative leaps.",
      icon: "🌫️",
      color: "#a371f7",
      steps: [
        { title: "The two modes — why most students only use one", component: "Foundation", detail: "Your brain has two complementary thinking modes (Barbara Oakley, popularizing work by Marcus Raichle on the Default Mode Network). <b>Focused mode</b>: narrow attention, prefrontal cortex, follows known rails, solves WITHIN a frame. <b>Diffused mode</b>: relaxed attention, DMN active, makes long-range low-probability connections, jumps BETWEEN frames. Most students live 100% in focused mode and wonder why insights don't come. The insights need the OTHER mode. They are not competitors — they are partners.", proto: "Both, not one" },
        { title: "How to recognize when you're stuck in focused mode", component: "Self-Diagnosis", detail: "Red flags that you've over-stayed in focused mode: <b>(1)</b> reading the same paragraph 3 times without traction; <b>(2)</b> trying variations of the same failed approach over and over; <b>(3)</b> mounting frustration that 'I should be able to do this'; <b>(4)</b> the answer feels just out of reach but won't come; <b>(5)</b> tunnel vision — you've forgotten the broader context of the problem. When 2+ of these appear, focused-mode grinding has stopped paying. Time to switch modes.", proto: "5 red flags" },
        { title: "The activation protocol — load → release → return", component: "Protocol", detail: "Three-step recipe to invoke diffused mode on purpose: <b>(1) LOAD</b> — work the problem in focused mode for 20-40 min until you've genuinely engaged. Empty diffused time is just zoning out; loaded diffused time is where insight comes from. <b>(2) RELEASE</b> — do a no-input physical activity for 15-30 min (walk, shower, dishes, NSDR). NO phone, NO podcast, NO talking — those re-engage focused mode. Let the problem float without trying to solve it. <b>(3) RETURN</b> — sit back down with the problem. ~70% of the time you'll have a partial or full insight ready.", proto: "20-40 / 15-30 / sit", code: "Diffused-mode triggers, ranked:\n  ★★★  walking outdoors (no phone)\n  ★★★  shower\n  ★★    washing dishes / chores\n  ★★    20-min nap before 3 pm\n  ★★    NSDR / yoga nidra audio\n  ★     long drive (highway, not city)\n  ✗     phone scrolling (suppresses DMN)\n  ✗     conversation (focused-mode)\n  ✗     reading anything (focused-mode)" },
        { title: "Sleep — diffused mode at maximum strength", component: "Sleep as DMN Amplifier", detail: "REM sleep is essentially diffused mode at full intensity, with novel content selection turned all the way up. Wagner et al. (2004, Nature): subjects who slept on a number-sequence problem solved it at ~2× the rate of subjects who didn't. Stickgold's later work showed the effect is strongest when you re-prime the problem in the last 5 min before bed. Practical implication: ALWAYS load a hard problem into your head right before sleep. Worst case, you wake up rested. Best case, the answer is waiting.", proto: "Load → sleep → re-attempt", refs: [{ label: "Wagner et al. 2004 — sleep & insight", url: "https://www.nature.com/articles/nature02223" }] },
        { title: "Pomodoro as forced mode-switching", component: "Daily Schedule", detail: "The Pomodoro technique (25 min focused + 5 min break) isn't magic time-management; it's enforced mode-alternation. The 5-min break — IF spent on a no-screen activity (walk to window, stretch, water) — gives the DMN a quick re-set. After every 4 pomodoros, a 20-30 min full diffused-mode break. <b>Anti-pattern</b>: using the 5-min break to check Twitter — that recruits focused attention and gives ZERO DMN benefit. The break has to be input-empty to work.", proto: "25/5 with EMPTY breaks" },
        { title: "When to STAY in focused mode (and not diffuse)", component: "Counter-Cases", detail: "Diffused mode is NOT always the right tool. Stay focused when: <b>(1)</b> doing rote drill (Anki reviews, multiplication facts, vocabulary) — these need cued retrieval, not free association; <b>(2)</b> executing a known procedure under time pressure (the exam itself, a live debug session); <b>(3)</b> writing/coding the FIRST draft of something — get the bones down first, refine via diffusion later; <b>(4)</b> shallow tasks (email, admin) — these are too small to benefit from DMN. Diffused mode is for ill-structured, novel, integrative problems where the path is not yet known.", proto: "Match mode to task" },
        { title: "Anti-patterns that LOOK like diffused mode but aren't", component: "Anti-Patterns", detail: "1) <b>Scrolling social media</b> — feels restful but RECRUITS focused attention (small rewards, novelty hits) and SUPPRESSES the DMN. You'll feel tired AND get no insight. 2) <b>Listening to a podcast on a walk</b> — the walk part is diffused-friendly, but the audio fills working memory and keeps focused mode online. 3) <b>Trying to FORCE the insight</b> — diffused mode requires release; the harder you try, the more focused you become. 4) <b>Doing the same problem for hours</b> without a release — diminishing returns set in fast after 45-90 min in either mode.", proto: "Phone-free, talk-free" },
        { title: "Note-capture for diffused-mode insights", component: "Capture System", detail: "Diffused-mode insights are FRAGILE — they often disappear within 60 seconds if not captured. Keep a friction-free capture tool with you at all times: phone notes app (1 dedicated 'insights' note), a small notebook + pen, or voice memo. The rule: when an insight surfaces, capture it IMMEDIATELY in 1-2 lines. Don't elaborate (that re-engages focused mode and you'll lose the rest of the pipeline). Review the insights note end-of-day; ~30% will be gold, ~70% won't survive scrutiny — that's fine, the cost of capture is tiny.", proto: "Capture < 60 sec" },
        { title: "The compounding effect over weeks", component: "Long Game", detail: "Mode-alternation isn't a single-session technique; it compounds. People who deliberately practice alternation for 4+ weeks report: <b>(a)</b> they recognize stuck-points 5-10 min earlier (faster mode-switch); <b>(b)</b> their insight rate during walks/showers roughly doubles (the DMN gets 'trained' to work on whatever you most-recently loaded); <b>(c)</b> they need fewer total hours of focused grinding for the same output — diffused mode subsidizes focused mode. This is the neuroscience underneath 'the best programmers say walking is the #1 debugging tool'.", proto: "4 weeks to compound" },
        { title: "🚀 Today's starter — diffuse one stuck problem TONIGHT", component: "Activation", detail: "1) Right now, name the ONE problem you've been stuck on this week (technical or otherwise). 2) Spend 20 min in focused mode loading it — re-read the constraints, list what you've tried, write down what feels blocked. 3) Then immediately go for a 20-min walk OUTDOORS, no phone, no podcast, no music. Let the problem drift through your mind without solving. 4) When you return, spend 10 min writing down whatever surfaced — even partial insights. 5) Tonight: re-load the problem in your head in the last 5 min before sleep. 6) Tomorrow morning: re-attempt for 15 min — measure how different the approach feels.", proto: "Stuck problem → walk → sleep" }
      ]
    }

  quiz: [
    { topic: "Encoding",
      q: "Why does re-reading produce poor long-term retention despite feeling productive?",
      options: [
        "It bores the brain into shutting down",
        "It creates a 'fluency illusion' — recognition is mistaken for recall",
        "It takes too little time to encode anything",
        "It only works for fiction, not technical material"
      ],
      answer: 1,
      explain: "Correct answer: B. Repeated exposure makes the text feel familiar, and the brain confuses that familiarity (recognition) with the ability to reproduce the content from memory (recall). On a closed-book test, the recognition cue is gone and so is the apparent knowledge. Dunlosky et al. (2013) rated re-reading and highlighting as LOW utility for exactly this reason. Option A is folk-psychology; option C is wrong (re-reading actually takes lots of time); option D is just untrue. The fix is to replace one re-read with a closed-book brain-dump — the discomfort you feel IS the encoding work happening." },
    { topic: "Encoding",
      q: "What is the single most evidence-supported technique for long-term retention of factual material?",
      options: [
        "Highlighting key passages in colour",
        "Watching lectures at 1.5× speed twice",
        "Active recall (retrieval practice) — pulling info from memory without cues",
        "Reading the chapter the night before the exam"
      ],
      answer: 2,
      explain: "Correct answer: C. Roediger & Karpicke's testing-effect studies (2006 and follow-ups) consistently show effect sizes of d ≈ 0.5–0.8, far ahead of any passive technique. The act of retrieval *itself* strengthens the memory trace, independent of whether the retrieval is then followed by re-study. Highlighting (A) and re-reading the night before (D) are both rated LOW in Dunlosky et al.'s meta-analysis. Speed-watching lectures (B) without retrieval is just faster passive consumption. The practical move is dead simple: after every chapter or video, close everything and write a 5-minute summary from memory." },
    { topic: "Scheduling",
      q: "Why does spaced repetition outperform massed practice (cramming)?",
      options: [
        "Spacing gives your eyes a rest between sessions",
        "Each review at the edge of forgetting strengthens the memory more than fresh repetition",
        "Massed practice violates copyright law in some countries",
        "Spacing only works for visual material"
      ],
      answer: 1,
      explain: "Correct answer: B. Ebbinghaus's forgetting curve shows memory decays exponentially after learning. When you review just before the point of forgetting, the retrieval is effortful (a 'desirable difficulty'), and each successful retrieval flattens the forgetting curve so the next interval can be longer. Cramming bunches all reviews together when memory is already strong, wasting most of the effort. Cepeda et al. (2008) found optimal gaps of ~10-20% of the desired retention interval. Modern SRS algorithms (SM-2, FSRS in Anki) automate this scheduling. Options A, C, and D are nonsense distractors." },
    { topic: "Scheduling",
      q: "You're learning calculus integration techniques. Which practice schedule produces the best long-term performance?",
      options: [
        "20 substitution problems, then 20 by-parts, then 20 partial fractions (blocked)",
        "Random shuffle of all 60 problems across the three techniques (interleaved)",
        "Do all 60 substitution problems and skip the others",
        "Watch 60 worked examples and don't solve any yourself"
      ],
      answer: 1,
      explain: "Correct answer: B (interleaved). Rohrer & Taylor (2007) showed that students who interleaved related problem types scored ~63% on a test one week later vs. ~20% for blocked practice — despite the blocked group performing BETTER during practice itself. Why: real tests require you to *recognise which technique applies*, and only interleaving builds that discrimination cue. Blocked practice (A) lets you autopilot — you already know it's a 'substitution problem'. Option C ignores 2/3 of the syllabus; option D produces zero retrieval, the very thing the test demands. Expect interleaving to feel harder in the moment; that discomfort is the learning happening." },
    { topic: "Connection",
      q: "Why is the Feynman Technique especially powerful for spotting knowledge gaps?",
      options: [
        "It uses a special font that triggers memory recall",
        "Explaining in simple language without jargon forces you to surface every spot where understanding is fuzzy",
        "It works only if you actually have a 12-year-old to talk to",
        "It replaces the need to ever re-study a topic"
      ],
      answer: 1,
      explain: "Correct answer: B. Jargon, textbook phrasing, and dense notation let you *hide* gaps from yourself — you can recite a definition without grasping what it means. Forcing a plain-language explanation removes those crutches and every hesitation, hand-wave, or 'um, basically…' marks a real gap to study. Option A is silly; option C misunderstands — the 12-year-old is a mental audience, not a literal requirement; option D is wrong — Feynman is a DIAGNOSTIC, the loop is 'explain → find gap → re-study → re-explain'. Tie-in: this is essentially unit-testing your own understanding. Your explanation is the test; gaps are the failures." },
    { topic: "Connection",
      q: "What distinguishes a CONCEPT map from a MIND map, and why does it matter for learning?",
      options: [
        "Concept maps use colour; mind maps don't",
        "Mind maps must be hand-drawn; concept maps can be digital",
        "Concept maps label the relationships (edges) between ideas, forcing you to articulate the connection",
        "There is no real difference; the terms are interchangeable"
      ],
      answer: 2,
      explain: "Correct answer: C. A mind map is a hierarchical tree of concepts — useful for brainstorming. A concept map adds *labelled edges* (verbs/phrases) between nodes: 'causes', 'enables', 'is a kind of', 'contrasts with'. Those labels force you to articulate exactly HOW concepts relate, which is where most understanding actually lives. If you can't label an edge, that's a real gap. Novak & Gowin (1984) developed the technique; Nesbit & Adesope's (2006) meta-analysis found effect sizes around d ≈ 0.7 on retention vs. text-only study. Options A, B, and D are distractors — colour and medium are irrelevant; the structural difference is what matters." },
    { topic: "Practice",
      q: "Which condition is REQUIRED for practice to count as 'deliberate practice' (Ericsson)?",
      options: [
        "Practising for at least 10,000 hours",
        "Practising at the edge of current ability with immediate, specific feedback on a targeted sub-skill",
        "Practising only in groups with a certified coach present",
        "Practising the entire skill end-to-end every session"
      ],
      answer: 1,
      explain: "Correct answer: B. Ericsson's framework requires three ingredients: (1) tasks slightly past current ability (the 'learning zone', ~70-85% success rate), (2) targeted at one specific sub-skill at a time, (3) with feedback tight enough to adjust on the next rep. The 10,000-hour figure (A) is a popular oversimplification by Gladwell — Ericsson explicitly disclaimed it; quality matters more than total hours. Group practice and coaches (C) help but aren't required. Practising the WHOLE skill end-to-end (D) is what casuals do — that's just experience, which plateaus. The reason a 10-year senior dev isn't automatically a distributed-systems expert is that most of their reps were comfort-zone CRUD, not deliberate stretch." },
    { topic: "Best Fit",
      q: "If your PRIMARY goal is BOTH high retention AND intuitive connection of ideas, which combination is the strongest evidence-based pairing?",

        "Pomodoro alone — it solves everything",
        "Active Recall + Spaced Repetition + Feynman + Concept Mapping",
