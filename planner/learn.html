<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d1117">
<!-- PWA (optional): uncomment the next two lines and ship manifest.json + icons/ + sw.js
     only if the user has explicitly asked for installable/offline support. See PLAYBOOK Step 14.
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
-->
<title>Study Tool Template</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #0d1117; color: #c9d1d9; overflow: hidden; }

  /* ── Toolbar ── */
  #toolbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    background: rgba(13,17,23,0.92); backdrop-filter: blur(8px);
    padding: 0 24px; display: flex; align-items: stretch; gap: 0;
    border-bottom: 1px solid #30363d; height: 50px;
  }
  #toolbar h1 { font-size: 18px; font-weight: 600; color: #58a6ff; white-space: nowrap; display: flex; align-items: center; margin-right: 24px; }
  .tab-group { display: flex; gap: 0; align-items: stretch; margin-right: 20px; }
  .tab {
    background: none; border: none; border-bottom: 2px solid transparent;
    color: #8b949e; padding: 0 16px; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all .2s; display: flex; align-items: center;
  }
  .tab:hover { color: #c9d1d9; }
  .tab.active { color: #58a6ff; border-bottom-color: #58a6ff; }
  .actions { display: flex; align-items: center; gap: 8px; }
  .btn { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .btn:hover { background: #30363d; border-color: #58a6ff; }
  .toolbar-sep { width: 1px; height: 24px; background: #30363d; align-self: center; margin: 0 6px; flex-shrink: 0; }
  .hint { font-size: 12px; color: #8b949e; margin-left: auto; display: flex; align-items: center; }
  #toolbar-menu { display: contents; }
  #hamburger {
    display: none; background: none; border: 1px solid #30363d; color: #c9d1d9;
    font-size: 20px; padding: 4px 10px; border-radius: 6px; cursor: pointer; line-height: 1;
  }
  #hamburger:hover { border-color: #58a6ff; color: #58a6ff; }

  /* ── Floating Controls ── */
  .canvas-controls {
    position: fixed; top: 62px; right: 16px; z-index: 8;
    display: flex; flex-direction: column; gap: 4px;
  }
  .canvas-controls .cbtn {
    background: rgba(22,27,34,0.85); backdrop-filter: blur(8px);
    border: 1px solid #30363d; color: #8b949e; padding: 6px 12px;
    border-radius: 8px; cursor: pointer; font-size: 11px; text-align: left;
    transition: all 0.2s; white-space: nowrap;
  }
  .canvas-controls .cbtn:hover { background: rgba(33,38,45,0.95); color: #c9d1d9; border-color: #58a6ff; }
  .mobile-only { display: none !important; }
  #legend, #legend-graph { position: relative; }

  /* ── Views ── */
  #canvas, #canvas-graph { width: 100vw; height: 100vh; }
  .view { display: none; }
  .view.active { display: block; }

  /* Mindmap */
  path.link { pointer-events: stroke; cursor: pointer; }
  path.link:hover { stroke-opacity: 0.7 !important; stroke-width: 3 !important; }

  /* ── Tooltip ── */
  #tooltip {
    position: fixed; pointer-events: none; opacity: 0;
    background: #161b22; border: 1px solid #30363d; border-radius: 8px;
    padding: 10px 14px; max-width: 380px; font-size: 13px; line-height: 1.5;
    box-shadow: 0 8px 24px rgba(0,0,0,.4); transition: opacity .15s; z-index: 20;
  }
  #tooltip.has-slides { pointer-events: auto; }
  #tooltip .tt-title { color: #58a6ff; font-weight: 600; margin-bottom: 4px; }
  #tooltip .tt-body  { color: #8b949e; }
  #tooltip .tt-slides { margin-top: 6px; padding-top: 5px; border-top: 1px solid #30363d; }
  #tooltip .tt-slides:empty { display: none; }
  #tooltip .tt-slides a {
    display: inline-block; margin: 2px 4px 2px 0; padding: 2px 8px; border-radius: 4px;
    background: rgba(88,166,255,0.1); color: #58a6ff; text-decoration: none;
    font-size: 11px; font-weight: 500; cursor: pointer; border: 1px solid rgba(88,166,255,0.2);
  }
  #tooltip .tt-slides a:hover { background: rgba(88,166,255,0.2); border-color: #58a6ff; }

  #source-link {
    position: fixed; bottom: 16px; right: 16px; z-index: 10;
    background: rgba(22,27,34,0.92); border: 1px solid #30363d; border-radius: 8px;
    padding: 8px 14px; font-size: 12px; font-weight: 600;
    color: #ff0000; text-decoration: none;
  }
  #source-link:hover { background: rgba(255,0,0,0.1); border-color: #ff0000; }

  /* ── Legend ── */
  #legend {
    position: fixed; bottom: 16px; left: 16px; z-index: 10;
    background: rgba(22,27,34,0.92); border: 1px solid #30363d; border-radius: 8px;
    padding: 12px 16px; font-size: 12px;
  }
  #legend div { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  #legend span.swatch { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  #legend .swatch-line { width: 20px; height: 3px; border-radius: 2px; display: inline-block; }
  .legend-item:hover { background: rgba(88,166,255,0.1); }
  .legend-item.active-filter { background: rgba(88,166,255,0.18); outline: 1px solid #58a6ff; }

  /* ── Graph ── */
  .graph-link { fill: none; stroke-opacity: 0.45; }
  .graph-link:hover { stroke-opacity: 0.9; }
  .graph-node-label { font-size: 11px; fill: #c9d1d9; pointer-events: none; paint-order: stroke; stroke: #0d1117; stroke-width: 3.5px; }
  .graph-link-label { font-size: 9.5px; fill: #8b949e; pointer-events: auto; cursor: pointer; paint-order: stroke; stroke: #0d1117; stroke-width: 3px; }
  .graph-link-label:hover { fill: #58a6ff; }
  .graph-link-hit { fill: none; stroke: transparent; stroke-width: 16; pointer-events: stroke; cursor: pointer; }

  /* ── Learning Path Panel ── */
  #path-panel {
    position: fixed; top: 56px; right: 0; bottom: 0; width: 340px; z-index: 10;
    background: rgba(13,17,23,0.95); border-left: 1px solid #30363d;
    overflow-y: auto; padding: 20px; display: none; backdrop-filter: blur(8px);
  }
  #path-panel.open { display: block; }
  #path-panel h2 { font-size: 15px; color: #58a6ff; margin-bottom: 4px; }
  #path-panel .subtitle { font-size: 12px; color: #8b949e; margin-bottom: 16px; }
  .path-step { display: flex; gap: 12px; padding: 10px; border-radius: 8px; cursor: pointer; transition: background .2s; margin-bottom: 2px; position: relative; }
  .path-step:hover { background: rgba(88,166,255,0.08); }
  .path-step.active { background: rgba(88,166,255,0.14); }
  .step-badge { flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%; border: 2px solid #30363d; background: #161b22; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #c9d1d9; }
  .path-step.active .step-badge { border-color: #58a6ff; background: #58a6ff; color: #0d1117; }
  .path-step.completed .step-badge { background: #238636; border-color: #238636; color: #fff; }
  .path-step.completed .step-connector { background: #238636; }
  .path-step.active .step-connector { background: #58a6ff; }
  .step-content { flex: 1; min-width: 0; }
  .step-title { font-size: 13px; font-weight: 600; color: #c9d1d9; }
  .step-desc  { font-size: 11px; color: #8b949e; margin-top: 2px; line-height: 1.4; }
  .step-connector { position: absolute; left: 33px; top: 38px; bottom: -4px; width: 2px; background: #30363d; }
  .path-step:last-child .step-connector { display: none; }
  .path-controls { display: flex; gap: 8px; margin-bottom: 14px; }
  .path-btn { flex: 1; padding: 7px 10px; border-radius: 6px; border: 1px solid #30363d; background: #21262d; color: #c9d1d9; font-size: 12px; cursor: pointer; text-align: center; }
  .path-btn:hover { background: #30363d; border-color: #58a6ff; }

  /* ── Command Panel (Comments/Tags) ── */
  #cmd-panel {
    position: fixed; top: 56px; right: 0; bottom: 0; width: 380px; z-index: 15;
    background: rgba(13,17,23,0.97); border-left: 1px solid #30363d;
    display: none; flex-direction: column; backdrop-filter: blur(10px);
  }
  #cmd-panel.open { display: flex; }
  #cmd-panel-header { padding: 16px 18px 12px; border-bottom: 1px solid #30363d; display: flex; align-items: flex-start; gap: 12px; }
  #cmd-panel-header .cp-title { flex: 1; }
  #cmd-panel-header .cp-name { font-size: 15px; font-weight: 600; color: #c9d1d9; }
  #cmd-panel-header .cp-tip  { font-size: 11px; color: #8b949e; margin-top: 3px; line-height: 1.4; }
  #cmd-panel-close { background: none; border: none; color: #8b949e; font-size: 20px; cursor: pointer; padding: 0 4px; line-height: 1; }
  #cmd-panel-close:hover { color: #c9d1d9; }
  #cmd-tags { padding: 8px 18px; display: flex; flex-wrap: wrap; gap: 6px; min-height: 20px; }
  .cmd-tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 500; }
  .cmd-tag.tag-done     { background: #23863633; color: #7ee787; border: 1px solid #23863666; }
  .cmd-tag.tag-todo     { background: #1f6feb33; color: #79c0ff; border: 1px solid #1f6feb66; }
  .cmd-tag.tag-confused  { background: #da363333; color: #ff7b72; border: 1px solid #da363366; }
  .cmd-tag.tag-important { background: #9e6a0333; color: #ffa657; border: 1px solid #9e6a0366; }
  .cmd-tag.tag-custom    { background: #30363d; color: #c9d1d9; border: 1px solid #484f58; }
  #cmd-comments { flex: 1; overflow-y: auto; padding: 10px 18px; }
  .cmd-comment { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; position: relative; }
  .cmd-comment .cc-text { font-size: 13px; color: #c9d1d9; line-height: 1.5; white-space: pre-wrap; }
  .cmd-comment .cc-time { font-size: 10px; color: #484f58; margin-top: 4px; }
  .cmd-comment .cc-del { position: absolute; top: 6px; right: 8px; background: none; border: none; color: #484f58; cursor: pointer; font-size: 14px; }
  .cmd-comment .cc-del:hover { color: #ff7b72; }
  .cmd-empty { color: #484f58; font-size: 12px; font-style: italic; text-align: center; padding: 20px; }
  #cmd-input-area { padding: 12px 18px; border-top: 1px solid #30363d; }
  #cmd-input { width: 100%; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #c9d1d9; padding: 10px 12px; font-size: 13px; font-family: inherit; resize: none; outline: none; min-height: 60px; }
  #cmd-input:focus { border-color: #58a6ff; }
  #cmd-input-hint { font-size: 10px; color: #484f58; margin-top: 6px; line-height: 1.5; }
  #cmd-input-hint code { background: #161b22; padding: 1px 4px; border-radius: 3px; color: #8b949e; }
  .comment-badge { font-size: 9px; fill: #0d1117; pointer-events: none; }
  .has-comment-ring { fill: none; stroke: #ffa657; stroke-width: 2; stroke-dasharray: 3 2; }

  /* ── Deep Dives ── */
  #view-deepdive { overflow-y: auto; margin-top: 50px; height: calc(100vh - 50px); }
  #view-usecase { overflow-y: auto; margin-top: 50px; height: calc(100vh - 50px); }
  .dd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; padding: 24px 32px; max-width: 1400px; margin: 0 auto; }
  .dd-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; cursor: pointer; overflow: hidden; transition: all .25s; }
  .dd-card:hover { border-color: #58a6ff; transform: translateY(-3px); box-shadow: 0 8px 30px rgba(0,0,0,.4); }
  .dd-card-img { width: 100%; height: 200px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .dd-card-img svg { width: 100%; height: 100%; display: block; }
  .dd-card-body { padding: 16px; }
  .dd-card-num { font-size: 11px; color: #58a6ff; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
  .dd-card-title { font-size: 17px; font-weight: 700; color: #c9d1d9; margin: 4px 0 6px; }
  .dd-card-desc { font-size: 12px; color: #8b949e; line-height: 1.5; }
  .dd-full { display: none; padding: 20px 0 40px; overflow-y: auto; }
  .dd-full.active { display: block; }
  .dd-infographic { max-width: 900px; margin: 0 auto; padding: 32px; background: #161b22; border: 1px solid #30363d; border-radius: 16px; }
  .dd-infographic h2 { font-size: 24px; color: #58a6ff; margin-bottom: 4px; }
  .dd-infographic .dd-subtitle { font-size: 13px; color: #8b949e; margin-bottom: 24px; }
  .dd-section { margin-top: 24px; }
  .dd-section h3 { font-size: 15px; color: #ffa657; margin-bottom: 8px; }
  .dd-section p { font-size: 13px; color: #c9d1d9; line-height: 1.7; }
  .dd-section .dd-formula { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 12px 16px; font-family: 'Courier New', monospace; font-size: 14px; color: #7ee787; margin: 10px 0; text-align: center; }
  .dd-keypoints { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .dd-kp { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 12px; font-size: 12px; }
  .dd-kp strong { color: #58a6ff; display: block; margin-bottom: 4px; }
  .dd-kp span { color: #8b949e; }
  .dd-nav { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
  .dd-nav button { padding: 8px 20px; }

  /* ── Use Cases ── */
  .uc-flow { max-width: 960px; margin: 0 auto; padding: 32px; }
  .uc-flow h2 { font-size: 22px; color: #58a6ff; margin-bottom: 4px; }
  .uc-flow .uc-subtitle { font-size: 13px; color: #8b949e; margin-bottom: 20px; }
  .uc-step {
    display: flex; gap: 14px; padding: 16px; border-radius: 10px; border: 1px solid #30363d;
    background: #161b22; cursor: pointer; transition: all .3s; opacity: 0.3;
  }
  .uc-step.active { opacity: 1; border-color: #58a6ff; box-shadow: 0 0 20px rgba(88,166,255,0.15); }
  .uc-step.done { opacity: 0.8; border-color: #3fb950; }
  .uc-step .uc-badge {
    width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; background: #30363d; color: #8b949e; flex-shrink: 0;
  }
  .uc-step.active .uc-badge { background: #58a6ff; color: #fff; }
  .uc-step.done .uc-badge { background: #3fb950; color: #fff; }
  .uc-step .uc-body { flex: 1; min-width: 0; overflow: hidden; }
  .uc-step .uc-title { font-weight: 600; color: #c9d1d9; font-size: 14px; }
  .uc-step .uc-component { font-size: 11px; color: #8b949e; margin-top: 2px; }
  .uc-step .uc-detail { display: none; margin-top: 10px; font-size: 12px; color: #c9d1d9; line-height: 1.6; }
  .uc-step.active .uc-detail { display: block; }
  .uc-step .uc-proto { display: inline-block; background: #0d1117; border: 1px solid #30363d; border-radius: 4px; padding: 2px 8px; font-size: 10px; color: #79c0ff; margin-top: 8px; }
  .uc-connector { width: 2px; height: 24px; background: #30363d; margin-left: 31px; transition: background .3s; }
  .uc-connector.done { background: #3fb950; }
  .uc-flow-controls {
    display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
  }
  .uc-flow-controls button {
    padding: 8px 18px; border-radius: 8px; border: 1px solid #30363d; background: #161b22;
    color: #c9d1d9; cursor: pointer; font-size: 13px; transition: all .2s;
  }
  .uc-flow-controls button:hover { border-color: #58a6ff; color: #58a6ff; }
  .uc-flow-controls button.primary { background: #1f6feb; border-color: #58a6ff; color: #fff; }
  .uc-legend {
    display: flex; gap: 16px; flex-wrap: wrap; margin-top: 16px; padding: 12px 16px;
    background: #0d1117; border: 1px solid #30363d; border-radius: 8px; font-size: 11px;
  }
  .uc-legend span { display: flex; align-items: center; gap: 6px; color: #8b949e; }
  .uc-legend .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .uc-back-btn {
    background: none; border: 1px solid #30363d; color: #58a6ff; padding: 8px 16px;
    border-radius: 8px; cursor: pointer; font-size: 13px; margin-bottom: 16px; transition: all 0.2s;
  }
  .uc-back-btn:hover { background: #161b22; border-color: #58a6ff; }
  .uc-code {
    margin-top: 10px; padding: 10px 14px; background: #0d1117; border: 1px solid #30363d;
    border-radius: 6px; font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    font-size: 11px; color: #7ee787; line-height: 1.5; overflow-x: auto; white-space: pre;
    max-width: 100%; box-sizing: border-box;
  }
  .uc-refs { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .uc-refs a {
    display: inline-block; padding: 3px 10px; background: #161b22; border: 1px solid #30363d;
    border-radius: 4px; font-size: 10px; color: #79c0ff; text-decoration: none; transition: all .2s;
  }
  .uc-refs a:hover { border-color: #58a6ff; color: #58a6ff; background: #0d1117; }
  .legend-close {
    position: absolute; top: 8px; right: 8px; background: none; border: none;
    color: #8b949e; font-size: 16px; cursor: pointer; line-height: 1; padding: 2px 6px;
  }
  .legend-close:hover { color: #c9d1d9; }

  /* ── Tracker Panel ── */
  #tracker-panel {
    position: fixed; top: 56px; left: 0; bottom: 0; width: 320px; z-index: 12;
    background: rgba(13,17,23,0.97); border-right: 1px solid #30363d;
    display: none; flex-direction: column; backdrop-filter: blur(10px); overflow: hidden;
  }
  #tracker-panel.open { display: flex; }
  #tracker-header { padding: 16px 18px 10px; border-bottom: 1px solid #30363d; display: flex; align-items: center; justify-content: space-between; }
  #tracker-header h3 { font-size: 14px; color: #58a6ff; font-weight: 600; }
  #tracker-header button { background: none; border: none; color: #8b949e; font-size: 18px; cursor: pointer; }
  #tracker-stats { padding: 10px 18px; display: flex; gap: 10px; border-bottom: 1px solid #21262d; }
  .tracker-stat { flex: 1; background: #0d1117; border-radius: 8px; padding: 8px 10px; text-align: center; }
  .tracker-stat .ts-num { font-size: 20px; font-weight: 700; }
  .tracker-stat .ts-label { font-size: 10px; color: #8b949e; }
  #tracker-list { flex: 1; overflow-y: auto; padding: 8px 12px; }
  .tracker-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 2px; }
  .tracker-item:hover { background: rgba(88,166,255,0.08); }
  .tracker-filter { padding: 8px 18px; border-bottom: 1px solid #21262d; display: flex; gap: 6px; flex-wrap: wrap; }
  .tf-chip { padding: 3px 10px; border-radius: 12px; font-size: 11px; cursor: pointer; border: 1px solid #30363d; background: #21262d; color: #8b949e; }
  .tf-chip:hover, .tf-chip.active { border-color: #58a6ff; color: #58a6ff; background: rgba(88,166,255,0.1); }

  /* ── PDF Viewer ── */
  #pdf-viewer {
    display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    z-index: 50; background: #0d1117; flex-direction: column;
  }
  #pdf-viewer.open { display: flex; }
  #pdf-toolbar { display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: #161b22; border-bottom: 1px solid #30363d; flex-shrink: 0; }
  #pdf-toolbar .pdf-title { flex: 1; color: #c9d1d9; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #pdf-iframe { width: 100%; height: 100%; border: none; background: #1e1e1e; }
  #scribble-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: crosshair; z-index: 2; display: none; }
  #scribble-canvas.active { display: block; }
  #pdf-body { position: relative; flex: 1; overflow: hidden; }
  .scribble-tools { display: flex; align-items: center; gap: 6px; margin-left: 8px; border-left: 1px solid #30363d; padding-left: 10px; }
  .scribble-tools .btn { font-size: 11px; padding: 3px 8px; }
  .scribble-tools .btn.active-tool { background: #58a6ff; color: #0d1117; }
  .scribble-color { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #30363d; cursor: pointer; display: inline-block; }
  .scribble-color.sel { border-color: #c9d1d9; }
  .scribble-size { width: 50px; accent-color: #58a6ff; }

  /* ── Appendix ── */
  #appendix-container { position: relative; top: 0; width: 100%; max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
  #view-appendix { overflow-y: auto; height: calc(100vh - 50px); margin-top: 50px; }
  .appendix-stats { color: #8b949e; font-size: 13px; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  .appendix-stats .stat-pill { background: #21262d; border: 1px solid #30363d; border-radius: 12px; padding: 2px 10px; font-size: 12px; }

  deepDives: [
    {
      id: "active-recall",
      num: "Technique 1 of 16",
      title: "Active Recall (Retrieval Practice)",
      desc: "The single highest-leverage study habit. Replace re-reading with retrieval.",
      color: "#58a6ff",
      icon: "🧠",
      svg: function(w, h) {
        var cx = w/2, midY = h/2;
        return '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg" style="background:#0d1117">'
          + '<defs><marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker></defs>'
          + '<text x="' + cx + '" y="30" fill="#c9d1d9" font-size="16" font-weight="700" text-anchor="middle">Re-reading vs. Active Recall — Forgetting Curves</text>'
          + '<line x1="60" y1="' + (h-50) + '" x2="' + (w-30) + '" y2="' + (h-50) + '" stroke="#30363d" stroke-width="2"/>'
          + '<line x1="60" y1="60" x2="60" y2="' + (h-50) + '" stroke="#30363d" stroke-width="2"/>'
          + '<text x="' + (w/2) + '" y="' + (h-15) + '" fill="#8b949e" font-size="12" text-anchor="middle">Time after study →</text>'
          + '<text x="20" y="' + (h/2) + '" fill="#8b949e" font-size="12" transform="rotate(-90 20 ' + (h/2) + ')" text-anchor="middle">Retention %</text>'
          // Re-reading curve (steep drop)
          + '<path d="M60,80 Q150,180 ' + (w-30) + ',' + (h-70) + '" stroke="#f85149" stroke-width="3" fill="none"/>'
          + '<text x="' + (w-180) + '" y="' + (h-90) + '" fill="#f85149" font-size="13" font-weight="600">Re-reading (Ebbinghaus)</text>'
          // Active recall curve (shallow)
          + '<path d="M60,80 Q200,110 ' + (w-30) + ',150" stroke="#7ee787" stroke-width="3" fill="none"/>'
          + '<text x="' + (w-180) + '" y="140" fill="#7ee787" font-size="13" font-weight="600">Active Recall + Spacing</text>'
          // Recall test markers
          + '<circle cx="180" cy="115" r="6" fill="#7ee787"/><text x="180" y="105" fill="#7ee787" font-size="10" text-anchor="middle">test</text>'
          + '<circle cx="320" cy="125" r="6" fill="#7ee787"/><text x="320" y="115" fill="#7ee787" font-size="10" text-anchor="middle">test</text>'
          + '<circle cx="480" cy="140" r="6" fill="#7ee787"/><text x="480" y="130" fill="#7ee787" font-size="10" text-anchor="middle">test</text>'
          + '<text x="' + cx + '" y="' + (h-110) + '" fill="#c9d1d9" font-size="11" text-anchor="middle" font-style="italic">Each retrieval flattens the curve — the testing IS the learning event.</text>'
          + '</svg>';
      },
      sections: [
        { title: "Intuition", text: "Memory is strengthened by the act of *pulling* information out, not pushing it back in. Every time you successfully recall something, you make the next recall easier and longer-lasting. Re-reading creates a comforting illusion of fluency — you recognise the words on the page and your brain confuses recognition with knowing." },
        { title: "Mechanism", text: "Closing the book and trying to reconstruct what you learned forces your brain to traverse the retrieval pathway. Each traversal strengthens the synaptic route (Bjork's 'desirable difficulty'). Failed attempts that are then corrected produce stronger learning than effortless re-exposure." },
        { title: "Worked Example", text: "Read a 10-page chapter once. Close the book. On a blank page, write everything you remember in 5 minutes (a 'brain dump'). Re-open the book and mark what you missed in red. Repeat 24 hours later, then 3 days, then 1 week. Expect 80%+ retention at 30 days vs. ~20% from pure re-reading." },
        { title: "Pitfall & Tie-In", text: "Pitfall: confusing recognition (multiple choice with hints) with recall (blank page, no cues). Always start cueless. Tie-in: Roediger & Karpicke (2006) showed students who tested once retained more at one week than students who re-studied four times — and the retrieval group felt *less* confident, an early lesson in metacognition." }
      ],
      keypoints: [
        { title: "Effect size", text: "Testing effect d ≈ 0.5–0.8 across 100+ studies (Roediger & Karpicke 2006)." },
        { title: "Frequency rule", text: "1 retrieval > 4 re-readings for 1-week+ retention." },
        { title: "Format", text: "Free recall (blank page) > short answer > multiple choice. Harder retrieval = stronger trace." },
        { title: "Pair with", text: "Spaced repetition. Anki / RemNote / handwritten flashcards all work — the algorithm matters less than doing it." }
      ]
    },
    {
      id: "spaced-rep",
      num: "Technique 2 of 16",
      title: "Spaced Repetition",
      desc: "Re-test just before you would forget. The schedule does the heavy lifting.",
      color: "#f778ba",
      icon: "📅",
      svg: function(w, h) {
        return '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg" style="background:#0d1117">'
          + '<text x="' + (w/2) + '" y="30" fill="#c9d1d9" font-size="16" font-weight="700" text-anchor="middle">Expanding Intervals (SM-2 / Leitner)</text>'
          + '<line x1="50" y1="' + (h-60) + '" x2="' + (w-30) + '" y2="' + (h-60) + '" stroke="#30363d" stroke-width="2"/>'
          + '<text x="' + (w/2) + '" y="' + (h-20) + '" fill="#8b949e" font-size="12" text-anchor="middle">Days →</text>'
          // Tick marks for review days: 0, 1, 3, 7, 16, 35
          + (function(){
              var days=[0,1,3,7,16,35]; var labels=['Day 0\nLearn','Day 1','Day 3','Day 7','Day 16','Day 35'];
              var maxD=35; var x0=70, xMax=w-50; var s='';
              for(var i=0;i<days.length;i++){
                var x = x0 + (days[i]/maxD)*(xMax-x0);
                var y = h-60;
                var color = i===0 ? '#58a6ff' : '#f778ba';
                s += '<line x1="'+x+'" y1="'+y+'" x2="'+x+'" y2="'+(y-15)+'" stroke="'+color+'" stroke-width="2"/>';
                s += '<circle cx="'+x+'" cy="'+(y-25)+'" r="14" fill="'+color+'" opacity="0.85"/>';
                s += '<text x="'+x+'" y="'+(y-21)+'" fill="#0d1117" font-size="11" font-weight="700" text-anchor="middle">'+days[i]+'d</text>';
                s += '<text x="'+x+'" y="'+(y+20)+'" fill="#8b949e" font-size="10" text-anchor="middle">'+(i===0?'learn':'review')+'</text>';
              }
              return s;
            })()
          // Decay curves between reviews
          + '<path d="M70,'+(h-110)+' Q90,'+(h-95)+' 110,'+(h-100)+'" stroke="#7ee787" stroke-width="2" fill="none" opacity="0.6"/>'
          + '<path d="M110,'+(h-115)+' Q150,'+(h-100)+' 180,'+(h-110)+'" stroke="#7ee787" stroke-width="2" fill="none" opacity="0.6"/>'
          + '<path d="M180,'+(h-125)+' Q230,'+(h-110)+' 280,'+(h-120)+'" stroke="#7ee787" stroke-width="2" fill="none" opacity="0.6"/>'
          + '<text x="'+(w/2)+'" y="'+(h-150)+'" fill="#c9d1d9" font-size="12" text-anchor="middle" font-style="italic">Each review re-flattens the curve; intervals double each time.</text>'
          + '<text x="'+(w/2)+'" y="80" fill="#7ee787" font-size="13" text-anchor="middle">10 min/day &gt; 70 min/week (massed)</text>'
          + '</svg>';
      },
      sections: [
        { title: "Intuition", text: "Forgetting is not a bug — it's the signal that tells you when to review. The optimal moment to re-study is just before you would forget. Hit that window and the next interval can be 2-3x longer, with the same effort." },
        { title: "Mechanism", text: "Ebbinghaus showed exponential forgetting; each successful retrieval *resets and flattens* the decay curve. Modern algorithms (SM-2 in Anki, FSRS) predict the forgetting moment per-card based on your past performance — so easy cards stretch to 6 months while hard ones stay daily." },
        { title: "Worked Example", text: "Learn 30 vocab words. Review at day 1, 3, 7, 16, 35, 90. Total time: ~35 min. Vs. cramming 30 min the night before, then forgetting 80% by next month. Same effort, ~5x retention." },
        { title: "Pitfall & Tie-In", text: "Pitfall: adding 200 new cards/day. Steady-state load = (new × interval) — get greedy and you'll bury yourself in reviews. Cap at 10-20 new/day. Tie-in: every major language-learning app (Duolingo, Memrise, Anki) is essentially SRS + active recall." }
      ],
      keypoints: [
        { title: "Interval rule of thumb", text: "1d · 3d · 7d · 16d · 35d · 90d (each ≈ 2.2× the prior)." },
        { title: "Tool", text: "Anki (free, FSRS algorithm), Quizlet, RemNote, or paper Leitner box (5 slots)." },
        { title: "Throughput limit", text: "10–20 new cards/day sustainable; 50+ collapses within a month." },
        { title: "Reference", text: "Cepeda et al. (2008) — optimal gap ≈ 10–20% of retention interval." }
      ]
    },
    {
      id: "feynman",
      num: "Technique 3 of 16",
      title: "Feynman Technique",
      desc: "Explain it simply on a blank page. The fastest gap-finder ever invented.",
      color: "#7ee787",
      icon: "💡",
      svg: function(w, h) {
        var step=(w-80)/4;
        var labels=['1. Pick a\nconcept','2. Explain\nto a 12-yr-old','3. Mark every\nspot you\'re stuck','4. Re-study\ngaps & repeat'];
        var icons=['🎯','🧒','🚩','🔁'];
        var s='<svg viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg" style="background:#0d1117">';
        s+='<defs><marker id="arF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7ee787"/></marker></defs>';
        s+='<text x="'+(w/2)+'" y="30" fill="#c9d1d9" font-size="16" font-weight="700" text-anchor="middle">The Feynman Loop — Explain → Find Gap → Restudy → Repeat</text>';
        for(var i=0;i<4;i++){
          var x=40+i*step+step/2; var y=h/2;
          s+='<circle cx="'+x+'" cy="'+y+'" r="46" fill="#161b22" stroke="#7ee787" stroke-width="2"/>';
          s+='<text x="'+x+'" y="'+(y-8)+'" fill="#7ee787" font-size="26" text-anchor="middle">'+icons[i]+'</text>';
          var lines=labels[i].split('\n');
          for(var j=0;j<lines.length;j++){
            s+='<text x="'+x+'" y="'+(y+18+j*14)+'" fill="#c9d1d9" font-size="11" text-anchor="middle" font-weight="600">'+lines[j]+'</text>';
          }
          if(i<3){
            s+='<line x1="'+(x+48)+'" y1="'+y+'" x2="'+(x+step-48)+'" y2="'+y+'" stroke="#7ee787" stroke-width="2" marker-end="url(#arF)"/>';
          }
        }
        // Loop-back arrow
        s+='<path d="M '+(w-40)+' '+(h/2+50)+' Q '+(w/2)+' '+(h-30)+' 80 '+(h/2+50)+'" stroke="#ffa657" stroke-width="2" fill="none" marker-end="url(#arF)" stroke-dasharray="6,4"/>';
        s+='<text x="'+(w/2)+'" y="'+(h-20)+'" fill="#ffa657" font-size="12" text-anchor="middle">loop until you can explain end-to-end without notes</text>';
        s+='</svg>';
        return s;
      },
      sections: [
        { title: "Intuition", text: "Jargon and dense textbook prose let you *hide* gaps from yourself. The moment you try to explain a concept to a smart 12-year-old, every fuzzy joint in your mental model snaps into focus. You can't fake simplicity." },
        { title: "Mechanism", text: "Pick a topic. Write its name at the top of a blank page. Explain it in plain language with concrete examples and analogies — no notes, no jargon. Wherever you stall, hand-wave, or revert to textbook phrasing — circle it. That circle is a real gap. Go back to the source, learn just that piece, and re-explain." },
        { title: "Worked Example", text: "Topic: 'Why does TCP need a 3-way handshake?'. Attempt 1: 'It sets up the connection.' (Vague — circled.) Re-study: SYN, SYN-ACK, ACK; both sides must confirm the other's initial sequence number, otherwise replays / half-open connections. Attempt 2: now you can draw the diagram and explain *why* 2 messages aren't enough." },
        { title: "Pitfall & Tie-In", text: "Pitfall: stopping at attempt 1 because it 'sounded ok'. The whole point is the second pass. Tie-in: this is the public-speaking version of unit testing — your explanation is the test, gaps are the failures, study is the fix." }
      ],
      keypoints: [
        { title: "Audience target", text: "Explain to a smart 12-year-old. No undefined jargon allowed." },
        { title: "Stuck-point rule", text: "Every hand-wave or 'um, basically…' = circled gap = next study target." },
        { title: "Loop count", text: "Most topics need 2-3 passes before the explanation flows end-to-end." },
        { title: "Reference", text: "Originated with Richard Feynman's teaching style; popularised by James Gleick, *Genius* (1992)." }
      ]
    },
    {
      id: "interleaving",
      num: "Technique 4 of 16",
      title: "Interleaving",
      desc: "Mix problem types in one session. Feels worse, works better.",
      color: "#ffa657",
      icon: "🔀",
      svg: function(w, h) {
        var s='<svg viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg" style="background:#0d1117">';
        s+='<text x="'+(w/2)+'" y="30" fill="#c9d1d9" font-size="16" font-weight="700" text-anchor="middle">Blocked vs. Interleaved Practice</text>';
        var boxW=36, boxH=36, gap=6;
        var blocked=['A','A','A','A','B','B','B','B','C','C','C','C'];
        var interleaved=['A','B','C','A','C','B','B','A','C','C','A','B'];
        var colors={A:'#58a6ff',B:'#f778ba',C:'#7ee787'};
        var startX=(w-(boxW+gap)*12)/2;
        s+='<text x="'+(w/2)+'" y="75" fill="#f85149" font-size="14" text-anchor="middle" font-weight="600">❌ Blocked: AAAA BBBB CCCC  →  feels easy, poor transfer</text>';
        for(var i=0;i<12;i++){
          var x=startX+i*(boxW+gap);
          s+='<rect x="'+x+'" y="90" width="'+boxW+'" height="'+boxH+'" fill="'+colors[blocked[i]]+'" rx="4"/>';
          s+='<text x="'+(x+boxW/2)+'" y="'+(90+boxH/2+5)+'" fill="#0d1117" font-size="14" font-weight="700" text-anchor="middle">'+blocked[i]+'</text>';
        }
        s+='<text x="'+(w/2)+'" y="180" fill="#7ee787" font-size="14" text-anchor="middle" font-weight="600">✅ Interleaved: A B C A C B B A C C A B  →  harder in session, stronger on test</text>';
        for(var i=0;i<12;i++){
          var x=startX+i*(boxW+gap);
          s+='<rect x="'+x+'" y="195" width="'+boxW+'" height="'+boxH+'" fill="'+colors[interleaved[i]]+'" rx="4"/>';
          s+='<text x="'+(x+boxW/2)+'" y="'+(195+boxH/2+5)+'" fill="#0d1117" font-size="14" font-weight="700" text-anchor="middle">'+interleaved[i]+'</text>';
        }
        s+='<text x="'+(w/2)+'" y="'+(h-40)+'" fill="#c9d1d9" font-size="12" text-anchor="middle">Test scores 1 week later: Blocked ≈ 20% · Interleaved ≈ 63% (Rohrer & Taylor 2007)</text>';
        s+='</svg>';
        return s;
      },
      sections: [
        { title: "Intuition", text: "Blocked practice (AAAA BBBB) feels productive because each problem looks easy — you already know it's a 'type A'. The hard part of real exams and real life is *deciding which technique to use*. Interleaving forces that decision into every practice rep." },
        { title: "Mechanism", text: "Mixing types invokes a 'discriminative contrast' — your brain must reactivate the cues that distinguish A from B from C. This builds the *retrieval cues*, not just the solutions. Performance during practice drops; performance on novel test items rises sharply." },
        { title: "Worked Example", text: "Studying calculus integration. Blocked: 20 substitution problems, then 20 by-parts, then 20 partial-fractions. Interleaved: shuffle all 60. In-session accuracy will drop ~25%. One-week-later test: interleaved group outperforms by ~40%+ (Rohrer & Taylor 2007 on math; Kornell & Bjork 2008 on art-style attribution)." },
        { title: "Pitfall & Tie-In", text: "Pitfall: confusing interleaving with *random* practice. The set should be related types from the same domain — interleaving French verbs with Python syntax just dilutes both. Tie-in: a chess coach mixing openings, middlegames, and endgames in one session is doing exactly this." }
      ],
      keypoints: [
        { title: "Discrimination, not just storage", text: "Builds the cue that selects the technique, not just the technique itself." },
        { title: "Same-domain rule", text: "Interleave related skills (integration methods, ML algorithms), not unrelated subjects." },
        { title: "Confidence inversion", text: "If practice feels easier, you're probably blocking. Discomfort = signal you're doing it right." },
        { title: "Reference", text: "Rohrer & Taylor (2007), Kornell & Bjork (2008)." }
      ]
    },
    {

        s+='<text x="'+(w/2)+'" y="30" fill="#c9d1d9" font-size="16" font-weight="700" text-anchor="middle">From Isolated Fact → Dense Retrievable Network</text>';

        for(var k=0;k<sat.length;k++){

        s+='<text x="'+(w/2)+'" y="'+(h-20)+'" fill="#c9d1d9" font-size="12" text-anchor="middle" font-style="italic">More retrieval cues → more routes back to the fact when you need it.</text>';

      sections: [
        { title: "Intuition", text: "Memories you can only reach by one mental path get lost when that path is blocked (you forget the keyword, the chapter, the mnemonic). Elaboration builds 5-10 paths to the same fact by asking *why*, *how*, *when*, *where else*." },
        { title: "Mechanism", text: "After reading a claim, pause and answer (in writing): 'Why would this be true?' and 'How does this fit with what I already know?'. Each answer ties the new fact to existing knowledge — giving the new memory multiple retrieval cues." },
        { title: "Worked Example", text: "Fact: 'Insertion sort runs in O(n²).' Elaboration: WHY? — each of n inserts may shift up to n elements. WHEN faster? — nearly-sorted arrays, where shifts are tiny → O(n) best case. WHERE used? — Timsort uses insertion sort for runs of ≤ 32 elements because constant factors beat merge sort there." },
        { title: "Pitfall & Tie-In", text: "Pitfall: vague elaborations ('it's important because it's fundamental'). Be specific — name a cause, a mechanism, a comparison. Tie-in: this is what good teachers do unprompted when they say 'and the reason this matters is…'." }

        { title: "Pairs with", text: "Self-explanation (for procedures) and analogical reasoning (for transfer)." },
        { title: "Output", text: "Write the elaboration down. The act of writing forces specificity." }

    },
    {

      sections: [
        { title: "Intuition", text: "Paivio's dual-coding theory: the brain stores verbal and visual information in separate but linked systems. Encode a concept in both, and you double the chance of retrieval — either route can recover the memory." },
        { title: "Mechanism", text: "When you read a definition AND draw or study a diagram representing it, you lay down two complementary memory traces. Later, even partial recall of the visual (a shape, a position, a colour) can trigger the verbal content and vice versa." },

    },
    {
      id: "concept-map",
      num: "Technique 7 of 16",
      title: "Concept Mapping",
      desc: "Externalise the relationships in a domain. Your map is your understanding.",
      color: "#ffa657",
      icon: "🕸️",
      svg: function(w, h) {
        var s='<svg viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg" style="background:#0d1117">';
        s+='<text x="'+(w/2)+'" y="30" fill="#c9d1d9" font-size="16" font-weight="700" text-anchor="middle">A Concept Map = Nodes (concepts) + Labelled Edges (relationships)</text>';
        // Sample mini concept map about Memory
        var n=[
          {x:w/2, y:80, t:'Memory', big:true},
          {x:w/2-180, y:170, t:'Encoding'},
          {x:w/2, y:170, t:'Storage'},

        var e=[
          {a:0,b:1,l:'phase 1'},{a:0,b:2,l:'phase 2'},{a:0,b:3,l:'phase 3'},

        ];

          var a=n[e[i].a], b=n[e[i].b];
          s+='<line x1="'+a.x+'" y1="'+(a.y+18)+'" x2="'+b.x+'" y2="'+(b.y-18)+'" stroke="#ffa657" stroke-width="1.8" opacity="0.8"/>';
          var mx=(a.x+b.x)/2, my=(a.y+b.y)/2;

          s+='<text x="'+mx+'" y="'+(my+3)+'" fill="#ffa657" font-size="10" text-anchor="middle" font-style="italic">'+e[i].l+'</text>';
        }
        for(var i=0;i<n.length;i++){
          var r=n[i].big?36:30;
          s+='<circle cx="'+n[i].x+'" cy="'+n[i].y+'" r="'+r+'" fill="#161b22" stroke="'+(n[i].big?'#ffa657':'#58a6ff')+'" stroke-width="2"/>';
          var lines=n[i].t.split('\n');
          for(var j=0;j<lines.length;j++){
            s+='<text x="'+n[i].x+'" y="'+(n[i].y+(j-lines.length/2+0.7)*13)+'" fill="#c9d1d9" font-size="11" text-anchor="middle" font-weight="600">'+lines[j]+'</text>';
          }
        }
        s+='<text x="'+(w/2)+'" y="'+(h-20)+'" fill="#c9d1d9" font-size="11" text-anchor="middle" font-style="italic">The *labels on the edges* are what distinguishes a concept map from a mind map.</text>';
        return s+'</svg>';
      },
      sections: [
        { title: "Intuition", text: "Knowing facts is not the same as understanding their relationships. A concept map forces you to name *how* concepts connect — 'causes', 'enables', 'is a kind of', 'contrasts with'. The labels are where the understanding lives." },
        { title: "Mechanism", text: "Pick a domain. Brainstorm 15-25 key concepts on sticky notes. Place the most general at the top, more specific below. Draw arrows between related concepts and *label every arrow* with a verb or short phrase. Re-arrange until the layout reflects the structure you actually believe." },
        { title: "Worked Example", text: "Mapping 'Photosynthesis': Sun —(provides energy to)→ Chlorophyll —(in)→ Chloroplast —(converts)→ CO₂+H₂O —(into)→ Glucose+O₂. The verbs on the edges are the test — if you can't label one, that's a gap." },
        { title: "Pitfall & Tie-In", text: "Pitfall: producing a *tree* (mind map) instead of a *network*. Real understanding has cross-links — if your map is purely hierarchical, force at least 3 cross-connections. Tie-in: Novak & Cañas (Cmap Tools) built decades of evidence; modern equivalents include Obsidian Canvas, Excalidraw, Heptabase." }

        { title: "Reference", text: "Novak & Gowin (1984); Nesbit & Adesope (2006) meta-analysis: d ≈ 0.7 on retention." }
      ]
    },

        s+='<circle cx="'+cx+'" cy="'+cy+'" r="160" fill="#0d1117" stroke="#7ee787" stroke-width="2"/>';

        s+='<circle cx="'+cx+'" cy="'+cy+'" r="60" fill="#0d1117" stroke="#f85149" stroke-width="2"/>';

        // Side annotations - feedback loop
        s+='<rect x="20" y="'+(cy-30)+'" width="140" height="60" fill="#161b22" stroke="#58a6ff" rx="6"/>';
        s+='<text x="90" y="'+(cy-10)+'" fill="#58a6ff" font-size="12" text-anchor="middle" font-weight="700">⏱ Immediate</text>';
        s+='<text x="90" y="'+(cy+8)+'" fill="#58a6ff" font-size="12" text-anchor="middle" font-weight="700">Feedback</text>';
        s+='<text x="90" y="'+(cy+24)+'" fill="#8b949e" font-size="10" text-anchor="middle">coach · solution · test</text>';
        s+='<rect x="'+(w-160)+'" y="'+(cy-30)+'" width="140" height="60" fill="#161b22" stroke="#d2a8ff" rx="6"/>';
        s+='<text x="'+(w-90)+'" y="'+(cy-10)+'" fill="#d2a8ff" font-size="12" text-anchor="middle" font-weight="700">🎯 Specific</text>';
        s+='<text x="'+(w-90)+'" y="'+(cy+8)+'" fill="#d2a8ff" font-size="12" text-anchor="middle" font-weight="700">Sub-skill</text>';
        s+='<text x="'+(w-90)+'" y="'+(cy+24)+'" fill="#8b949e" font-size="10" text-anchor="middle">one weakness at a time</text>';
        s+='<text x="'+(w/2)+'" y="'+(h-20)+'" fill="#c9d1d9" font-size="11" text-anchor="middle" font-style="italic">Ericsson: ~10,000 hrs of *deliberate* practice → expertise. Mere experience plateaus much earlier.</text>';
        return s+'</svg>';
      },
      sections: [
        { title: "Intuition", text: "Most practice is just *repetition* — and repetition past the comfort threshold produces no further growth. Deliberate practice is the deliberate selection of tasks just past your current ability, with immediate corrective feedback. It's how musicians, chess players, and surgeons get better, long after experience alone has plateaued." },
        { title: "Mechanism", text: "(1) Identify a specific sub-skill you can't yet do reliably. (2) Design a task that targets *only* that sub-skill. (3) Attempt it. (4) Get immediate feedback (a coach, a test, the solution). (5) Adjust on the next rep. The loop is tight — minutes, not weeks." },
        { title: "Worked Example", text: "Learning chess endgames. Casual: play full games online. Deliberate: spend an hour drilling K+R vs K positions only, against an engine that shows the optimal move after each of yours. Track which positions you missed; redo those next session. After 20 hrs you'll beat someone with 200 hrs of casual play." },
        { title: "Pitfall & Tie-In", text: "Pitfall: confusing 'lots of hours' with deliberate practice. A senior developer who has written CRUD for 10 years isn't a 10-year expert at distributed systems. Tie-in: Ericsson & Pool's *Peak* (2016) is the canonical reference; Cal Newport's *Deep Work* applies it to knowledge work." }
      ],
      keypoints: [
        { title: "Sweet spot", text: "70-85% success rate per rep — challenging but achievable." },
        { title: "Feedback latency", text: "Same-session feedback is mandatory; week-later feedback breaks the loop." },
        { title: "Sub-skill isolation", text: "Practise one weakness at a time, not the whole skill." },
        { title: "Reference", text: "Ericsson, Krampe & Tesch-Römer (1993); Ericsson & Pool, *Peak* (2016)." }
      ]
    },
    {
      id: "time-depth-ladder",
      num: "Meta-Technique 9 of 16",
      title: "The Time/Depth Ladder",
      desc: "Why 'I watched the video' is not learning. The 1× / 3× / 12× / 50× multiplier rule for any technical content.",
      color: "#79c0ff",
      icon: "⏱️",
      svg: function(w, h) {
        var s='<svg viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg" style="background:#0d1117">';
        s+='<text x="'+(w/2)+'" y="30" fill="#c9d1d9" font-size="16" font-weight="700" text-anchor="middle">Time to Learn = Content Duration × Depth Multiplier</text>';
        // Staircase of bars showing the levels
        var levels=[
          {label:'Passive Watch',  desc:'follow along, fades in days', mult:1,  color:'#6e7681', y:0},
          {label:'First Understanding', desc:'pause, look up unknowns', mult:3, color:'#58a6ff', y:1},
          {label:'Solid Grasp', desc:'explain each idea in own words', mult:12, color:'#7ee787', y:2},
          {label:'Working Competence', desc:'use it daily without lookup', mult:25, color:'#ffa657', y:3},
          {label:'Thorough Mastery', desc:'explain backwards & teach others', mult:50, color:'#f778ba', y:4}
        ];
        var rowH=46, top=70;
        var maxMult=50;
        var barX=200, barMax=w-80;
        for(var i=0;i<levels.length;i++){
          var L=levels[i];
          var y=top+i*rowH;
          var barW=(L.mult/maxMult)*(barMax-barX);
          // label
          s+='<text x="190" y="'+(y+18)+'" fill="'+L.color+'" font-size="13" font-weight="700" text-anchor="end">'+L.label+'</text>';
          s+='<text x="190" y="'+(y+32)+'" fill="#8b949e" font-size="10" text-anchor="end">'+L.desc+'</text>';
          // bar
          s+='<rect x="'+barX+'" y="'+(y+6)+'" width="'+barW+'" height="28" fill="'+L.color+'" opacity="0.85" rx="4"/>';
          // multiplier on bar
          s+='<text x="'+(barX+barW-8)+'" y="'+(y+25)+'" fill="#0d1117" font-size="13" font-weight="700" text-anchor="end">× '+L.mult+'</text>';
        }
        // Right-side worked example for 16-min video
        var ex=w-30;
        s+='<text x="'+ex+'" y="'+(top-10)+'" fill="#d2a8ff" font-size="11" text-anchor="end" font-style="italic">e.g., 16-min video:</text>';
        var examples=['16 min','48 min','3.2 hr','6.7 hr','13.3 hr'];
        for(var i=0;i<5;i++){
          var y=top+i*rowH+22;
          s+='<text x="'+ex+'" y="'+y+'" fill="#c9d1d9" font-size="11" text-anchor="end" font-weight="600">'+examples[i]+'</text>';
        }
        // Bottom warning
        s+='<text x="'+(w/2)+'" y="'+(h-30)+'" fill="#ffa657" font-size="12" text-anchor="middle" font-weight="600">⚠ 1-hr lecture × 50 = 50 hours for mastery. Plan accordingly.</text>';
        return s+'</svg>';
      },
      sections: [
        { title: "Intuition", text: "A 16-minute video is not a 16-minute learning task — it's a 16-minute *exposure*. Real learning requires processing time that scales with the depth you want. Most learners pick a video length, mistake it for the learning budget, and then feel inadequate when nothing sticks. The math was never on their side." },
        { title: "Mechanism", text: "Each depth level requires roughly 3-4× the time of the previous one. Passive consumption (1×) just builds familiarity. Active processing with retrieval, code, and Feynman (12×) is what produces understanding. Mastery — being able to teach the topic backwards — requires deliberate practice and spaced re-encounter (50×+). The multiplier is empirical, derived from cognitive-load and forgetting-curve research." },
        { title: "Worked Example", text: "Goal: master TPU architecture from a 16-min explainer. Passive watch = 16 min, gone in 3 days. Solid grasp (×12 = 3.2 hr) = chunk + WPEQ + concept map + 10 Anki cards. Mastery (×50 = 13 hr) = also implement a 4×4 systolic array in NumPy, read the original v1 paper, write a Feynman explainer post. Most people stop at level 2 and call it learning." },
        { title: "Pitfall & Tie-In", text: "Pitfall: 'watching playlists at 2×'. Mathematically equivalent to skipping every other minute — same retention. Tie-in: this is why bootcamps that compress 6 months of material into 6 weeks produce graduates who can't debug — the content delivery is fine, but the processing time was structurally impossible." }
      ],
      keypoints: [
        { title: "Multiplier rule", text: "Time ≈ duration × {1, 3, 12, 25, 50} for the 5 depth levels." },
        { title: "Calibration", text: "If you're spending less than 12× duration, you're at 'solid grasp' or below. Plan accordingly." },
        { title: "Speed-up tax", text: "Watching at 2× without active processing halves retention without halving time." },
        { title: "Reference", text: "Sweller (1988) cognitive load · Ebbinghaus forgetting curve · Roediger & Karpicke testing effect." }
      ]

        s+='<circle cx="380" cy="'+(h-30)+'" r="7" fill="#d2a8ff"/><text x="392" y="'+(h-26)+'" fill="#c9d1d9" font-size="11">2 of 3 → likely 20% (next batch)</text>';
        s+='<circle cx="640" cy="'+(h-30)+'" r="7" fill="#6e7681"/><text x="652" y="'+(h-26)+'" fill="#c9d1d9" font-size="11">0–1 of 3 → long-tail, defer</text>';

      },
      sections: [
        { title: "Intuition", text: "Every '80/20 the topic' heuristic alone is noisy — index-frequency surfaces over-cited fluff, practitioner-sampling surfaces fads, expert opinions surface taste. Run three heuristics independently and TRUST THE INTERSECTION. Topics flagged by all three are the genuine load-bearing concepts. Topics flagged by zero are encyclopedic detail you can outsource to docs or LLMs." },
        { title: "Mechanism", text: "(1) Independent measurement — each heuristic must use a different source to avoid correlated noise. (2) Set inclusion — list candidate topics from each. (3) Compute the intersection — high-confidence 20%. (4) Compute the union with majority vote (≥2 of 3) — full 20%. (5) Re-run quarterly as you learn more; the convergent set tightens." },
        { title: "Worked Example", text: "Apply to TPU domain. Frequency heuristic (study/tpu.html mindmap): systolic, MXU, HBM, ICI, BF16, sharding, generations, OCS, XLA, VPU. Practitioner heuristic (5 ML-systems blogs): systolic, BF16, sharding, XLA, ICI. Expert heuristic (Google TPU intro talk): systolic, MXU, HBM, ICI, BF16, XLA, sharding. Intersection: systolic, BF16, ICI, XLA, sharding (×5 of 5). Add MXU + HBM (×4 of 5). That's your 7-topic core." },
        { title: "Pitfall & Tie-In", text: "Pitfall: running only one heuristic and trusting it. Index-count alone over-weights long chapters; expert opinion alone over-weights one person's taste. Tie-in: this is the same logic as ensemble methods in ML (bagging) — independent noisy estimators average out, the consensus signal stays. Or in software: three reviewers from different teams catch what one expert misses." }

        s+='<text x="'+(w/2)+'" y="'+(h-15)+'" fill="#c9d1d9" font-size="11" text-anchor="middle" font-style="italic">Most content (~60%) belongs in the bottom-right — that\'s why pure Anki maximalism fails.</text>';

      sections: [
        { title: "Intuition", text: "The most common learning failure isn't laziness — it's mis-routing. Cramming conceptual material into Anki feels productive but builds the wrong mental representation. Storing facts you'll never recall as Zettelkasten notes is just hoarding. Every piece of information has ONE optimal technique; the triage matrix tells you which." },
        { title: "Mechanism", text: "Score each new info-atom on two axes: (1) Need to RECALL on demand (high = test, daily-use, time-pressure context). (2) Need to UNDERSTAND deeply (high = conceptual core, used in arguments, requires intuition). The quadrant determines the technique. Run this BEFORE writing any card or note." },
        { title: "Worked Example", text: "Reading the TPU v4 paper. 'MXU is 128×128' → high recall, low understanding → Anki card. 'Why systolic arrays minimize HBM traffic' → low recall (you'll derive it), high understanding → Feynman + sketch. 'Exact v3 peak TOPS = 420' → low recall (you'll look up), low understanding → searchable note. 'How XLA fuses ops across an HLO graph' → high recall AND high understanding → Anki card + concept map link." },
        { title: "Pitfall & Tie-In", text: "Pitfall: defaulting everything to Anki because it 'feels productive'. You'll build a 500-card deck where 60% of cards encode procedural insights badly. Tie-in: this is the learning equivalent of the right-tool-for-the-job principle in engineering — using a hammer for screws still drives them in, but the joint fails under load." }

      },
      sections: [
        { title: "Intuition", text: "Your brain has (at least) two thinking modes. <b>Focused mode</b> is the narrow beam — prefrontal attention, effortful, follows the rails of what you already know. <b>Diffused mode</b> is the wide net — the Default Mode Network (DMN), active when you're walking, showering, daydreaming, or falling asleep. It makes long-range, low-probability connections that focused mode literally cannot. Most students grind exclusively in focused mode and wonder why insights don't come. The insights need the OTHER mode." },
        { title: "Mechanism", text: "Focused mode tightens attention through dorsolateral PFC and inhibits the DMN — great for solving inside a known frame, terrible at re-framing. The DMN does the opposite: it relaxes inhibition, lets distant brain regions cross-talk, and replays/recombines recent encoding. This is when 'the answer pops into your head in the shower' — your DMN was working on it. Critically, diffused mode requires that you FIRST loaded the problem in focused mode. Empty diffused time is just zoning out; loaded diffused time is where insight comes from." },
        { title: "Worked Example", text: "You're stuck on a proof for 40 minutes. Focused mode is grinding and failing. Action: stand up, walk for 15 min outside (no podcast — that's just more focused mode). Don't try to solve it — let the problem float. ~70% of the time you'll get a partial insight before you sit back down. The other 30%: take a 90-min nap or sleep on it; literature on sleep-dependent problem solving (Wagner et al. 2004) shows ~2× insight rate vs no-sleep. Edison kept ball bearings in his hand during catnaps for exactly this reason." },
        { title: "Pitfall & Tie-In", text: "Pitfall 1: confusing diffused mode with phone-scrolling. Social media RECRUITS focused attention (small, frequent rewards) and SUPPRESSES the DMN. You'll feel rested but get no creative benefit. Pitfall 2: trying to force diffused-mode insights on demand — the harder you try the more focused you become. The technique IS to release. Tie-in: this is the neuroscience underneath the 'sleep on it' folk wisdom, Poincaré's omnibus-step insight, and Kekulé's benzene-ring dream. It's also why the best programmers say 'go for a walk' is the #1 debugging tool." }

        { title: "Best diffused activities", text: "Walking outdoors > shower > washing dishes > 20-min nap > NSDR audio. Phone scrolling is anti-diffused mode." },
        { title: "Sleep as DMN amplifier", text: "REM sleep is diffused mode at maximum strength. A problem held in mind at sleep onset is ~2× more likely to be solved overnight (Wagner 2004, Stickgold 2013)." },
        { title: "Daily schedule", text: "Every 90 min, alternate. 2 hr focused without release ≠ 2 hr productive — you stop making non-obvious connections after ~45 min in one mode." }

        { title: "Intuition", text: "Casual reading earns its compounding return through quantity over years, not intensity per book. The single best predictor of lifelong reading is not feeling guilty about how you read. Treat the book as a conversation partner you can ignore mid-sentence; pick it up tonight or in 3 weeks, doesn't matter. The ~15% that sticks IS the gift." },
        { title: "Mechanism", text: "Pleasure reading activates the default-mode network and integrates the material into your autobiographical memory — which is much stickier than explicit semantic memory. A novel you loved at 22 colors how you think at 42 even if you can't recall the plot. So the encoding goal isn't facts; it's affect + a handful of vivid scenes." },
        { title: "Worked Example", text: "Reading <i>The Goldfinch</i>. Don't take notes during. After each session put the bookmark in and ask yourself: <b>'What's the one image I want to remember from tonight?'</b> Maybe a sentence, maybe a feeling — write it as 1 line in a 'books I've read' note. After finishing: write 3-5 lines (premise + 1 character you loved + 1 idea that surprised you + would you re-read?). That's it. 5 years later those notes are gold." },
        { title: "Pitfall & Tie-In", text: "Pitfall 1: trying to read casual books like technical ones — highlighting, taking notes, Anki cards. You'll kill the joy and finish 1/3 as many books. Pitfall 2: finishing books out of obligation. Sunk-cost fallacy applied to your evenings. Pitfall 3: keeping every book in your head as a 'to-summarize' task. Tie-in: the people with the most enduring depth of reading have the LEAST elaborate reading systems — they just read a lot and chat about it." }

        { title: "Talk about it", text: "Tell one friend the one idea per book that struck you. Articulation = consolidation." },

    {
      id: "book-technical",
      num: "Technique 14 of 16",
      title: "How to Read a Book — Technical",
      desc: "Algorithms, ML, systems, math, software. Goal = working competence + a permanent reference + Anki residue you'll still recall in 2 years.",
      color: "#58a6ff",
      icon: "🔧",
      svg: function(w, h) {
        var cx = w/2;
        return '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg" style="background:#0d1117">'
          + '<text x="' + cx + '" y="28" fill="#c9d1d9" font-size="16" font-weight="700" text-anchor="middle">Technical Read — 4 Passes, Active Throughout</text>'
          // 4 layered passes
          + (function(){
              var passes = [
                { y:65,  c:'#7ee787', n:'Pass 1', t:'SURVEY (15 min)',     d:'TOC · preface · index · skim · decide depth' },
                { y:115, c:'#58a6ff', n:'Pass 2', t:'STRUCTURAL (1-2 hr)', d:'Read every chapter intro & summary · build mental TOC' },
                { y:165, c:'#f0883e', n:'Pass 3', t:'DEEP (per-chapter)',  d:'Read · derive examples · do exercises · write summary' },
                { y:215, c:'#a371f7', n:'Pass 4', t:'CODE / APPLY',        d:'Re-implement key algorithm · use it on real problem · Anki' }

                var p = passes[i];

                s += '<text x="80" y="'+(p.y+18)+'" fill="'+p.c+'" font-size="11" font-weight="700">'+p.n+'</text>';
                s += '<text x="80" y="'+(p.y+33)+'" fill="#c9d1d9" font-size="11" font-weight="600">'+p.t+'</text>';
                s += '<text x="240" y="'+(p.y+25)+'" fill="#8b949e" font-size="11">'+p.d+'</text>';
              }
              return s; })()
          // Time/depth note
          + '<text x="' + cx + '" y="' + (h-50) + '" fill="#c9d1d9" font-size="11" text-anchor="middle">A 400-page textbook ≈ 30-50 hrs to working competence — split across 6-10 weeks</text>'
          + '<text x="' + cx + '" y="' + (h-30) + '" fill="#8b949e" font-size="10" text-anchor="middle" font-style="italic">Skip passes 3-4 for ~70% of chapters. Depth is targeted, not uniform.</text>'
          + '<text x="' + cx + '" y="' + (h-13) + '" fill="#7ee787" font-size="10" text-anchor="middle">Rule: never finish a chapter you can\'t teach in 5 minutes.</text>'
          + '</svg>';
      },
      sections: [
        { title: "Intuition", text: "A technical book is a knowledge graph compressed into linear pages — you have to UN-compress it to use it. Reading linearly start-to-finish is the worst way to do that. Adler & Van Doren's 'How to Read a Book' formalized the idea: 4 passes at increasing depth, each pass earning the next. ~70% of chapters in any textbook stop at pass 2 (you now know what's there); maybe 20% go to pass 3; only ~10% deserve pass 4 (implement + Anki). Treat ALL chapters equally and you'll quit on chapter 4." },
        { title: "Mechanism", text: "Pass 1 (Survey) builds a hierarchical skeleton — gives your brain the slots that pass 2 will fill. Pass 2 (Structural) fills slots without depth — you can navigate the book like a map. Pass 3 (Deep) is the actual encoding: work the examples, derive the formulas yourself, write a chapter summary from memory before checking. Pass 4 (Apply) cements via use — re-implement an algorithm in 50 lines, apply the technique to a real problem in your work, add 3-8 Anki cards. Each pass is cheaper because the previous passes built the scaffolding." },
        { title: "Worked Example", text: "Reading CLRS (Cormen et al.) for algorithms. Pass 1 (1 hr): TOC + 5-min skim per chapter → decide you'll go deep on graphs, dynamic programming, hashing; skim the rest. Pass 2 (8 hrs over 2 wks): read intro+summary of every chapter, do nothing else. Pass 3 (15 hrs on the 3 chosen chapters): work every exercise, write summaries from memory. Pass 4 (10 hrs): code Dijkstra + Kruskal from scratch, use them on a real graph, add 6 Anki cards per chapter. Result: working competence in graphs+DP+hashing, working familiarity with the rest, in 35 hr over 8 weeks. Beats 200 hrs of linear reading." },
        { title: "Pitfall & Tie-In", text: "Pitfall 1: starting with pass 3 — most students open chapter 1 and try to deeply understand every sentence. They quit by chapter 4. Pitfall 2: treating exercises as optional. The exercises are the book — the prose is just background. Pitfall 3: highlighting without re-implementing — highlighting feels productive but doesn't move you toward working competence. Pitfall 4: hoarding Anki cards (50+ per chapter). 3-8 per chapter or the queue dies. Tie-in: this is the same Keshav 3-pass method from research papers, scaled up for book-length material with an explicit Apply pass on top." }
      ],
      keypoints: [
        { title: "Time budget", text: "Pass 1: 15-60 min total. Pass 2: ~5 min/chapter. Pass 3: 2-5 hrs/chapter. Pass 4: 5-10 hrs/chapter. Choose passes per chapter." },
        { title: "Exercise discipline", text: "Do at least 1 exercise per chapter you pass 3. The exercise is where understanding actually forms." },
        { title: "Anki ratio", text: "3-8 cards per chapter, max. Card-worthy = the named theorem/algorithm/formula + 1-2 killer numerics. Not the proof details." },
        { title: "Reference forever", text: "Keep your one-page chapter summaries in a folder. In 2 years, those summaries are how you'll re-enter the book in 5 min instead of 5 hrs." }
      ]
    },
    {
      id: "book-exam",
      num: "Technique 15 of 16",
      title: "How to Read a Book — For an Exam",
      desc: "Hard deadline, defined scope, pass/fail or graded. Goal = maximum coverage at testable accuracy in the time you actually have.",
      color: "#f85149",
      icon: "📝",
      svg: function(w, h) {
        var cx = w/2;
        return '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg" style="background:#0d1117">'
          + '<text x="' + cx + '" y="28" fill="#c9d1d9" font-size="16" font-weight="700" text-anchor="middle">Exam Read — Backward from the Exam, Not Forward from Page 1</text>'
          // Backward timeline: Exam Day at right → working backwards
          + '<line x1="60" y1="' + (h/2) + '" x2="' + (w-60) + '" y2="' + (h/2) + '" stroke="#30363d" stroke-width="2"/>'
          + (function(){
              var marks = [
                { x: w-90, label: 'EXAM',       sub: 'Day 0',  c: '#f85149', big: true },
                { x: w-220, label: 'Mock #2',    sub: '-3 days', c: '#f0883e' },
                { x: w-350, label: 'Mock #1',    sub: '-7 days', c: '#f0883e' },

                s += '<text x="'+m.x+'" y="'+(by+24)+'" fill="#8b949e" font-size="10" text-anchor="middle">'+m.sub+'</text>';

              return s; })()
          // Arrow showing backward planning
          + '<path d="M' + (w-110) + ' ' + (h-60) + ' L100 ' + (h-60) + '" stroke="#a371f7" stroke-width="2" marker-end="url(#ar3)" fill="none"/>'
          + '<defs><marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a371f7"/></marker></defs>'
          + '<text x="' + cx + '" y="' + (h-75) + '" fill="#a371f7" font-size="11" font-weight="700" text-anchor="middle">Plan backward from exam day</text>'
          + '<text x="' + cx + '" y="' + (h-35) + '" fill="#c9d1d9" font-size="11" text-anchor="middle">First action: find 3 past exams. THAT defines what to read, not the book\'s TOC.</text>'
          + '<text x="' + cx + '" y="' + (h-15) + '" fill="#8b949e" font-size="10" text-anchor="middle" font-style="italic">If a topic isn\'t on any past exam, you probably don\'t need to read it.</text>'
          + '</svg>';
      },
      sections: [
        { title: "Intuition", text: "Exam reading is a constraint-satisfaction problem, not a learning problem. You have a finite time budget, a finite scope, and a measurable outcome (the exam itself). The single biggest mistake students make is starting from page 1 of the textbook and 'getting through' as much as they can. The correct first move is to find past exams and let THEM tell you what to read. The exam, not the syllabus, defines the target distribution." },
        { title: "Mechanism", text: "Why backward planning beats forward reading: (1) past exams reveal the question patterns and topic weights — usually 30% of the syllabus carries 70% of the marks; (2) attempting a past paper FIRST (cold, before studying) tells you what you already know and where the real gaps are — far cheaper than reading to find out; (3) every subsequent study hour is gap-targeted, not breadth-spread; (4) repeated mock exams under timed conditions trigger transfer-appropriate processing — your retrieval cues at study-time match the cues at test-time." },
        { title: "Worked Example", text: "3-week exam prep for a 12-chapter textbook. Day 1: find 3 past papers. Attempt paper #1 cold (open-book is OK first time) — score yourself. Tag every question by chapter. Result: chapters 3, 5, 8, 11 carry 65% of marks; chapters 1, 7, 12 are negligible. Week 1: pass 2-style read of all 12 chapters (~10 hrs); pass 3 only on the heavy-weight ones (~15 hrs). Week 2: spaced review via Anki + redo paper #1 closed-book + analyze gaps. Week 3: mock #2 + mock #3, each closed-book + timed, with 2 days between for gap-targeted re-study. Final 24 hrs: NO new material — only Anki + one-page chapter summaries + sleep." },
        { title: "Pitfall & Tie-In", text: "Pitfall 1: 'I'll do past papers AFTER I read everything' — you never finish the reading, so you never do the papers. Reverse this. Pitfall 2: cramming new material in the final 24 hrs — sleep deprivation costs you more marks than the cramming gains. Pitfall 3: skipping mock exams under timed conditions — exam stress is itself a skill; practice it. Pitfall 4: re-reading instead of self-testing — recognition ≠ recall, and the exam tests recall. Tie-in: this is application of the testing effect, spaced repetition, and Pareto distribution — three independently-strong techniques stacked. The students who use all three together routinely outperform peers who studied 3× as many hours." }
      ],
      keypoints: [
        { title: "Past papers FIRST", text: "Find 3 past papers in week 1, attempt one immediately. The exam — not the syllabus — defines the target." },
        { title: "Pareto the syllabus", text: "~30% of topics typically carry ~70% of marks. Tag past-paper questions by topic to see the weighting." },
        { title: "Mocks beat reading", text: "Every closed-book timed mock is worth ~3 hrs of re-reading for exam performance. Schedule 2-3 mocks." },
        { title: "Final 24 hrs rule", text: "No new material. Only retrieval (Anki, summaries) + sleep. Sleep deprivation costs more marks than late cramming gains." }
      ]
    },
    {
      id: "food-for-learning",
      num: "Technique 16 of 16",
      title: "Food & Fuel for Learning",
      desc: "Cognition runs on glucose, omega-3s, water and stable insulin. The food choices that power 8-hour study days vs the ones that quietly tank you after lunch.",
      color: "#7ee787",
      icon: "🥗",
      svg: function(w, h) {
        var cx = w/2;
        var leftPad = 60, rightPad = 30;
        var plotW = w - leftPad - rightPad;
        var topY = 70, baseY = h - 75;
        return '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg" style="background:#0d1117">'
          + '<text x="' + cx + '" y="28" fill="#c9d1d9" font-size="16" font-weight="700" text-anchor="middle">Cognition vs Time — Two Meals, Two Curves</text>'
          // Axes
          + '<line x1="' + leftPad + '" y1="' + baseY + '" x2="' + (w-rightPad) + '" y2="' + baseY + '" stroke="#30363d" stroke-width="2"/>'
          + '<line x1="' + leftPad + '" y1="' + topY + '" x2="' + leftPad + '" y2="' + baseY + '" stroke="#30363d" stroke-width="2"/>'
          + '<text x="' + (leftPad-8) + '" y="' + (topY+4) + '" fill="#8b949e" font-size="10" text-anchor="end">peak</text>'
          + '<text x="' + (leftPad-8) + '" y="' + (baseY+4) + '" fill="#8b949e" font-size="10" text-anchor="end">crash</text>'
          + '<text x="' + cx + '" y="' + (h-15) + '" fill="#8b949e" font-size="11" text-anchor="middle">Hours after meal →</text>'
          // Hour ticks
          + (function(){ var s=''; for(var i=0;i<=5;i++){ var x = leftPad + (i/5)*plotW;
              s += '<line x1="'+x+'" y1="'+baseY+'" x2="'+x+'" y2="'+(baseY+4)+'" stroke="#30363d"/>';
              s += '<text x="'+x+'" y="'+(baseY+18)+'" fill="#8b949e" font-size="10" text-anchor="middle">'+i+'h</text>'; } return s; })()
          // Sugar/carb curve (red) — sharp spike then crash below baseline
          + (function(){
              var pts=[]; var samples=40;
              for(var i=0;i<=samples;i++){
                var t=i/samples; var x = leftPad + t*plotW;
                // spike at ~0.5h, crash by ~2h, recover by ~4h
                var y;
                if(t<0.1){ y = baseY - 30 - (t/0.1)*60; }              // rise
                else if(t<0.25){ y = baseY - 90 - ((t-0.1)/0.15)*30; } // peak
                else if(t<0.5){ y = baseY - 120 + ((t-0.25)/0.25)*140; } // crash
                else if(t<0.75){ y = baseY + 15 - ((t-0.5)/0.25)*5;  } // trough
                else { y = baseY - 20 - ((t-0.75)/0.25)*30; }          // partial recovery
                pts.push(x.toFixed(1)+','+y.toFixed(1));
              }
              return '<polyline points="'+pts.join(' ')+'" stroke="#f85149" stroke-width="2.5" fill="none"/>';
            })()
          // Protein+fat+complex carb curve (green) — gentle rise, long plateau
          + (function(){
              var pts=[]; var samples=40;
              for(var i=0;i<=samples;i++){
                var t=i/samples; var x = leftPad + t*plotW;
                var y;
