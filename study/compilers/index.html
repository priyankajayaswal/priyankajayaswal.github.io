<script id="quiz-data" type="application/json">
[
  {"topic":"Lexical Analysis","q":"Which formalism is most appropriate to specify the tokens of a programming language?","options":["Regular expressions","Context-free grammars","Attribute grammars","Turing machines"],"answer":0,"explain":"Tokens (identifiers, numbers, keywords, punctuation) are recognized by regular languages, so regular expressions are the standard specification and lex/flex generators compile them directly to a DFA. CFGs are needed only at the parser level for nested structure like balanced parens, which regexes cannot match because they cannot count unboundedly. Attribute grammars layer semantic computations onto a CFG and are overkill for token shape, while Turing machines describe arbitrary computation, far beyond what a scanner needs. A handy rule: if the language can be checked left-to-right with finite state, an RE/DFA suffices."},
  {"topic":"Lexical Analysis","q":"Converting an NFA produced from a regex to a DFA may cause which problem?","options":["Loss of language equivalence","Exponential blow-up in state count","Inability to handle epsilon transitions","Loss of determinism"],"answer":1,"explain":"The subset construction can produce up to 2^n DFA states from an n-state NFA, since each DFA state corresponds to a subset of NFA states reachable via the same input. Language equivalence is preserved by construction, so option A is wrong; epsilons are eliminated by epsilon-closure during the conversion, ruling out C; and the result is a DFA so determinism is gained, not lost. In practice, lexer generators tame the blow-up via DFA minimization (Hopcroft's algorithm) and by using lazy/on-the-fly subset construction."},
  {"topic":"Lexical Analysis","q":"What is the purpose of the 'maximal munch' rule in a lexer?","options":["Pick the rule with highest priority","Always take the longest matching token","Skip whitespace eagerly","Reject ambiguous input"],"answer":1,"explain":"Maximal munch (also called longest match) means that when several token rules can match at the current position, the lexer commits to the one that consumes the most characters, e.g. recognizing '==' as one EQ token instead of two '=' tokens. Priority/order is a tie-breaker only when two rules match the same length, which is why keywords like 'if' must be listed before the generic identifier rule. The rule is what makes constructs like '>>' in C++ templates historically tricky and motivates contextual lexing in modern compilers."},
  {"topic":"Parsing","q":"Which grammar class can a top-down predictive (LL(1)) parser handle without backtracking?","options":["Any context-free grammar","Grammars with no left recursion and where FIRST/FOLLOW sets disambiguate each production","All ambiguous grammars","Only regular grammars"],"answer":1,"explain":"LL(1) requires that for every nonterminal A with productions A → α | β, the FIRST sets of α and β are disjoint and, when ε is involved, FIRST(α) is disjoint from FOLLOW(A); otherwise the single-token lookahead cannot pick a production deterministically. Left recursion makes top-down parsing loop forever, so it must be eliminated (e.g., via the standard A → βA' transformation). Ambiguous grammars are excluded outright, and regular grammars are a strict subset of what LL(1) handles. LR(1) parsers accept a strictly larger class because they decide on shifts/reduces with the entire viable prefix, not just the next token."},
  {"topic":"Parsing","q":"What does a shift-reduce conflict in an LR parser indicate?","options":["The grammar is left-recursive","For some state the parser cannot decide between shifting the next token and reducing by a completed production","The lexer produced an invalid token","The parse table is too small"],"answer":1,"explain":"A shift-reduce conflict arises when the LR automaton reaches a state where one item says 'reduce by A → α •' while another says 'shift on terminal t', and t ∈ FOLLOW(A) (or LALR/LR(1) lookahead) so both actions are legal. The classic example is the dangling-else problem: 'if E then if E then S else S' — does 'else' bind to the inner or outer 'if'? Yacc/Bison resolve such conflicts by preferring shift, which conveniently matches the desired innermost-binding semantics; left-recursion alone causes no conflict and is in fact natural for LR. Cleaner fixes are to rewrite the grammar (matched/unmatched if) or to declare operator precedence and associativity."},
  {"topic":"Parsing","q":"Which parser generator strategy underlies tools like Bison and yacc?","options":["Recursive-descent LL(1)","LALR(1)","GLR by default","Earley parsing"],"answer":1,"explain":"Bison/yacc generate LALR(1) tables, which merge LR(1) states with identical LR(0) cores to keep the table size linear in the grammar instead of exponential, while still handling almost all real-world programming-language grammars. Recursive descent is hand-written and limited to LL(k); GLR is supported by Bison as an option (--language=glr) for ambiguous grammars but is not the default; Earley is used in tools like Marpa for arbitrary CFGs at higher cost. The trade-off LALR makes — occasional spurious conflicts on certain LR(1) grammars — is why programmers occasionally see 'reduce/reduce conflict' messages and must massage the grammar."},
  {"topic":"AST & Semantics","q":"Why do compilers convert the parse tree (concrete syntax tree) into an abstract syntax tree (AST)?","options":["The AST is faster to print","The AST drops syntactic noise (parentheses, single-child chains) and exposes the operator/operand structure that later phases need","ASTs are required by the parser generator","ASTs are smaller in bytes only"],"answer":1,"explain":"A concrete parse tree mirrors every grammar production, including helper nonterminals introduced for precedence (Expr → Term → Factor → ...) and tokens like parentheses, which contribute no semantic meaning once associativity is captured by tree shape. The AST keeps just the essential structure — a binary node with operator and two operand subtrees, an If node with cond/then/else, etc. — so type checkers, optimizers, and code generators can pattern-match without wading through grammar artifacts. Tools like Clang's libASTMatchers and rustc's HIR explicitly distinguish CST and AST for exactly this reason."},
  {"topic":"AST & Semantics","q":"In a statically typed language, what does the type-checker primarily verify on the AST?","options":["That every variable is initialized","That operators are applied to operands of compatible types and expressions have well-defined types","That the program halts","That syntax is correct"],"answer":1,"explain":"Type checking walks the AST bottom-up, assigning a type to each expression and rejecting programs that, for example, add an int to a string or call a non-function. It uses the symbol table to resolve identifiers and applies typing rules (e.g., the Hindley-Milner algorithm W in ML, or bidirectional checking in TypeScript/Swift) to infer or verify types. Initialization analysis is a separate dataflow pass, halting is undecidable (Rice's theorem), and syntax was already settled in parsing — so each of the other options is the job of a different phase."},
  {"topic":"AST & Semantics","q":"What is a symbol table chiefly used for during semantic analysis?","options":["Storing optimization hints","Mapping identifiers in scope to their declarations (type, kind, location)","Holding tokens between lexer and parser","Recording machine instructions"],"answer":1,"explain":"The symbol table answers 'what does this name mean here?' — for each identifier it records type, kind (var/func/type), storage class, and source location, organized so that nested scopes can be entered and exited as the analyzer walks the AST. This is what enables shadowing, name-resolution errors ('undeclared identifier'), and later code generation to know addresses or vtable slots. Optimization hints live on IR nodes, the lexer-parser channel is a token stream, and machine instructions live in the back-end's MachineFunction or assembler output."},
  {"topic":"IR & SSA","q":"What is Static Single Assignment (SSA) form?","options":["Each variable is assigned at most once syntactically, with phi-functions merging values at control-flow join points","All variables are global","Each function has a single return statement","Loops are unrolled fully"],"answer":0,"explain":"In SSA every definition introduces a fresh version (x1, x2, ...) and at any block where control flow merges, a φ-function picks the version corresponding to the predecessor that was just executed. This dramatically simplifies dataflow analyses: use-def chains become trivial because each use has exactly one definition, enabling fast constant propagation, global value numbering, and dead-code elimination. LLVM and modern GCC, V8, and HotSpot all use SSA-based IRs (with refinements like pruned SSA or sea-of-nodes); single-return is an unrelated stylistic choice and full unrolling is an optimization, not a form."},
  {"topic":"IR & SSA","q":"When is a phi-function placed at the entry of basic block B for variable x in minimal SSA?","options":["At every block","Only at loop headers","At blocks in the iterated dominance frontier of any block that defines x","Whenever x is used"],"answer":2,"explain":"Cytron et al.'s classical algorithm shows the minimal placement of φ-nodes is exactly the iterated dominance frontier of the set of definition blocks: DF(D) tells you the first blocks where multiple definitions can reach simultaneously, so a φ is needed there to choose. Loop headers are a common case but not the only one (consider an if/else with assignments in both branches feeding a join). Placing φ at every block or every use is correct but wasteful; modern compilers compute dominance via Lengauer-Tarjan and DF in near-linear time."},
  {"topic":"IR & SSA","q":"Which is a typical advantage of a three-address code (TAC) IR like LLVM IR over a stack-based IR?","options":["More compact textual form","Explicit operands enable straightforward dataflow analyses and register allocation","Easier to interpret on a stack VM","Avoids the need for type information"],"answer":1,"explain":"Three-address instructions (x = y op z) name every operand explicitly, so analyses like liveness, reaching definitions, and register allocation can read the operand lists directly without simulating an operand stack. Stack IRs (JVM bytecode, WebAssembly) are more compact and convenient for verification and interpretation, but compilers usually first convert them back to a TAC/SSA IR before optimizing. Type information is still needed in either form (LLVM IR is strongly typed), and compactness was actually a strength of stack IRs, not TAC."},
  {"topic":"Dataflow Analysis","q":"In a forward 'reaching definitions' dataflow analysis, what is the meet (confluence) operator at a join point?","options":["Set intersection","Set union","Set difference","Symmetric difference"],"answer":1,"explain":"Reaching definitions is a may-analysis: a definition reaches a program point if it can do so along some path, so at a merge we union the contributions of all predecessors. The transfer function for a block is OUT = (IN − KILL) ∪ GEN, and iteration to a fixpoint over a monotone framework converges because the lattice (powerset of definitions) has finite height. Available expressions, by contrast, is a must-analysis and uses intersection; mixing them up is one of the most common student errors in compilers exams."},
  {"topic":"Dataflow Analysis","q":"Live variable analysis is best characterized as which kind of dataflow analysis?","options":["Forward, may","Forward, must","Backward, may","Backward, must"],"answer":2,"explain":"A variable is live at a point if there exists a path from that point to a use before any redefinition, so information flows backward from uses, and we union over successors — making it a backward, may-analysis. The transfer function is IN[B] = USE[B] ∪ (OUT[B] − DEF[B]), and the result drives register allocation (live ranges) and dead-store elimination. Available expressions is forward/must; very-busy expressions is backward/must — together these four examples form the standard 2×2 taxonomy taught in every compilers course."},
  {"topic":"Dataflow Analysis","q":"Why must dataflow transfer functions be monotone over a lattice of finite height?","options":["So the IR fits in memory","To guarantee the iterative worklist algorithm terminates at a unique fixpoint","To make analyses parallelizable","To avoid SSA"],"answer":1,"explain":"Monotonicity ensures that each iteration of the worklist algorithm can only move values up (or down) the lattice and never undo prior progress, while finite height bounds the number of times any given fact can change — together they guarantee termination at the least fixpoint (Tarski/Kleene). If the framework is also distributive, the meet-over-all-paths solution coincides with the iterative MFP solution; otherwise MFP is a safe approximation. Memory fit, parallelism, and SSA are unrelated correctness conditions."},
  {"topic":"Optimizations","q":"What does constant folding do?","options":["Replaces constants with variables","Evaluates constant expressions at compile time and substitutes the result","Removes all loops","Inlines all functions"],"answer":1,"explain":"Constant folding rewrites pure operations whose operands are compile-time constants — e.g., '3 * 4 + 5' becomes '17', or 'strlen(\"hi\")' becomes 2 for languages where the call is pure — saving runtime work and exposing further optimization opportunities. It is usually paired with constant propagation, which pushes the new constant forward to its uses, enabling cascades like dead-branch elimination. Care is required for IEEE-754 floating point and integer overflow semantics, which is why some compilers gate folding on flags like '-ffast-math'."},
  {"topic":"Optimizations","q":"Common subexpression elimination (CSE) is safe only when ...","options":["The shared subexpression has no side effects and its operands are not redefined between the two occurrences","The subexpression is in a loop","The compiler is at -O3","The function is pure as a whole"],"answer":0,"explain":"To replace the second occurrence with the first computed value, the expression must be deterministic (no I/O, no volatile reads) and its inputs must reach the second use unchanged — formally, the expression must be 'available' at the second point. Loop-only and -O3-only are not requirements; CSE applies anywhere the conditions hold. Whole-function purity is too strong: CSE can fire on a small region even within an otherwise-impure function, which is why GVN (global value numbering) in LLVM is one of the most impactful mid-end passes."},
  {"topic":"Optimizations","q":"Loop-invariant code motion (LICM) hoists computations out of a loop only when ...","options":["The computation is performed at least once and yields the same value on every iteration","The loop is unrolled","The body is a single basic block","The trip count is known"],"answer":0,"explain":"Hoisting must preserve semantics, so the moved instruction must be loop-invariant (its operands are not redefined inside the loop) and either provably executed (e.g., the loop runs at least once or the op has no side effects) so that 'speculating' it before the loop entry does not introduce new traps. LLVM's LICM also requires the instruction to be safe to speculate (no division by zero, no faulting loads) unless it can prove the original would have executed. Unrolling, single-block bodies, and known trip counts can help but are not preconditions."},
  {"topic":"Optimizations","q":"Function inlining trades off ...","options":["Speed for memory only","Code size and i-cache pressure for reduced call overhead and better cross-procedure optimization","Compilation time for runtime","Correctness for performance"],"answer":1,"explain":"Inlining eliminates the call/return, register save/restore, and parameter marshalling, and — crucially — exposes the callee's code to the caller's context so passes like CSE, constant propagation, and dead-code elimination can fire across the boundary. The cost is binary bloat and worse instruction-cache locality, plus longer compile times; this is why heuristics in GCC/Clang use cost models based on call-site hotness, callee size, and 'always_inline' hints. Correctness is non-negotiable; the optimizer never trades it for speed."},
  {"topic":"Optimizations","q":"Tail-call optimization (TCO) converts a tail call into ...","options":["A loop with reused stack frame","An interrupt","A coroutine","A goto across functions, leaking the frame"],"answer":0,"explain":"In a tail call the caller has nothing to do after the callee returns, so the callee can reuse the caller's stack frame: arguments are placed where the callee expects, then a jump replaces the call/return pair, turning recursion into iteration with O(1) stack. Scheme mandates TCO, and functional code in Haskell/OCaml relies on it heavily; C compilers do it opportunistically when ABI allows. It is not an interrupt, coroutine, or unsafe cross-function jump — frames are properly reused, not leaked."},
  {"topic":"Register Allocation","q":"Chaitin-style graph-coloring register allocation models the problem as ...","options":["Coloring an interference graph with K colors, where K is the number of available registers","Bin-packing variables by size","Topologically sorting basic blocks","Solving a linear program"],"answer":0,"explain":"Each variable becomes a node, edges connect variables whose live ranges overlap (so they cannot share a register), and a K-coloring assigns each node one of K registers. K-coloring is NP-hard in general, so Chaitin's heuristic iteratively removes nodes of degree < K (they are guaranteed colorable later) and, when stuck, picks a node to spill to memory and rebuilds the graph. Linear-scan (used in JIT compilers like HotSpot's C1 and early V8) trades some quality for compile speed; ILP-based allocators exist but are reserved for small functions or research compilers."},
  {"topic":"Register Allocation","q":"What is 'spilling' in register allocation?","options":["Discarding a variable","Storing a value to memory and reloading it because no register is available across its live range","Renaming registers","Saving callee-saved registers at function entry"],"answer":1,"explain":"When the interference graph cannot be K-colored, the allocator picks a variable, inserts a store after each definition and a load before each use, and shortens its live range to tiny segments that are easy to color. Spill choice is driven by cost heuristics (uses × loop nesting depth ÷ degree in Chaitin-Briggs); poor choices cause severe slowdowns, especially in hot loops. Renaming is α-conversion or SSA; callee-saved prologue is part of the calling convention, not spilling."},
  {"topic":"Register Allocation","q":"Why does SSA-based register allocation often produce simpler interference graphs?","options":["SSA values have shorter, more disciplined live ranges (one definition each), and the interference graph on SSA is chordal","SSA uses fewer variables","SSA eliminates the need for spilling","SSA guarantees K-colorability for any K"],"answer":0,"explain":"Because each SSA name has a unique definition, its live range is a connected segment from the def to its last use, and the resulting interference graph is provably chordal — meaning optimal coloring is polynomial via a perfect elimination ordering (Hack & Goos, Brisk et al.). LLVM's greedy and PBQP allocators exploit this. SSA does not reduce variable count (it usually increases it), and spilling is still required when the chromatic number exceeds K."},
  {"topic":"Code Generation","q":"Instruction selection maps IR operations to target machine instructions; a popular technique is ...","options":["Tree pattern matching with dynamic programming (e.g., BURS/iburg)","Random selection","Linear scan","Graph coloring"],"answer":0,"explain":"Tools like iburg and LLVM's older SelectionDAG match patterns of IR DAG against templates of machine instructions, using dynamic programming to choose the lowest-cost cover (Aho-Johnson, Fraser-Hanson-Proebsting). LLVM's newer GlobalISel uses a similar tablegen-driven matcher. Random selection would be incorrect; linear-scan is for register allocation, and graph coloring is also a register-allocation technique — both are downstream of selection."},
  {"topic":"Code Generation","q":"Instruction scheduling primarily aims to ...","options":["Reduce binary size","Minimize execution time by hiding pipeline latencies and exploiting instruction-level parallelism","Eliminate dead code","Allocate registers"],"answer":1,"explain":"By reordering independent instructions within data-dependence constraints, the scheduler fills delay/load slots and feeds multiple issue ports on superscalar/out-of-order CPUs, reducing stalls. List scheduling with a critical-path heuristic is the classic algorithm; software pipelining (modulo scheduling) goes further for inner loops on VLIW/EPIC machines like Itanium. Code size, dead-code elimination, and register allocation are handled by separate passes — though scheduling and allocation interact heavily ('phase ordering problem')."},
  {"topic":"LLVM","q":"In LLVM, which pass manager does Clang use by default for optimization?","options":["The legacy pass manager","The new pass manager (PM)","No pass manager — passes are ad hoc","Only target-specific passes"],"answer":1,"explain":"Since LLVM ~13 the New Pass Manager is the default; it is faster (better pass-instance reuse, no global registry overhead), supports nested adaptors (Module → CGSCC → Function → Loop), and integrates cleanly with -fexperimental-new-pass-manager flags. The legacy PM is still available for plugins that haven't migrated. There is always a pass manager — running passes by hand is only done in tests/tools like 'opt -passes=...'."},
  {"topic":"LLVM","q":"What is the role of LLVM IR's 'datalayout' string?","options":["Specifies pointer/int sizes, alignments, and endianness so target-independent passes can compute layouts","Names the source file","Records compile-time options","Lists optimization passes"],"answer":0,"explain":"The datalayout string (e.g., 'e-m:e-p270:32:32-...-S128') tells passes that need to compute struct offsets, alloca sizes, or alignment about the target's ABI without each pass having to query the backend. It encodes endianness, pointer size in each address space, alignment of integer/float types, and stack natural alignment. Mismatching the datalayout between IR and target leads to subtly wrong layouts, especially for vector types and bit-fields."},
  {"topic":"LLVM","q":"Which LLVM IR concept makes optimizations across function boundaries possible during link-time optimization (LTO)?","options":["Serializing IR (bitcode) into object files so the linker can re-invoke the optimizer over the merged module","Storing source code in the binary","Using JIT only","Recompiling with -O0"],"answer":0,"explain":"With -flto, Clang emits LLVM bitcode instead of native code into .o files; at link time, the gold/lld plugin reads all bitcode, merges it into one Module, and runs IPO passes (inlining, dead-global elimination, devirtualization) before code generation. ThinLTO refines this with a summary-based approach for parallelism. Embedding source, JIT, or rebuilding at -O0 do not provide cross-module optimization."},
  {"topic":"Type Systems","q":"Hindley-Milner type inference (Algorithm W) gives ML/Haskell which property?","options":["Decidable, principal-type inference for the let-polymorphic lambda calculus without type annotations","Dependent types","Subtyping","Dynamic typing"],"answer":0,"explain":"HM infers the most general (principal) type for each expression in the let-polymorphic fragment by generating equality constraints and solving them with unification (Robinson's algorithm), all in nearly linear time in practice. Generalization happens at let-bindings, which is why 'let id = λx.x in ...' gets the polytype ∀α.α→α. HM does not natively support subtyping, dependent types, or general type-class–style dispatch — those require extensions (System F, F<:, dependent types, qualified types like Haskell's)."},
  {"topic":"Type Systems","q":"What is type erasure?","options":["Removing type information at runtime so generic code shares one implementation","Forgetting type errors","Refusing to type-check","Converting types to integers"],"answer":0,"explain":"Java generics and ML/Haskell polymorphism use type erasure: the compiler verifies types statically and then compiles a single, polymorphic code path that does not branch on type — saving code size and avoiding template bloat. The trade-off is that you cannot dispatch on a generic type parameter at runtime (no 'new T()' in Java without a Class<T> token). C++ templates and Rust monomorphization take the opposite tack, generating per-type specializations for speed at the cost of binary size."},
  {"topic":"Garbage Collection","q":"A 'generational' garbage collector is motivated by which empirical observation?","options":["Most objects die young (the weak generational hypothesis)","All objects live forever","GC is undecidable","Pointer arithmetic is common"],"answer":0,"explain":"Decades of measurements (Ungar, Lieberman & Hewitt) show that the vast majority of allocations become unreachable quickly, so collecting a small 'young generation' frequently and an 'old generation' rarely yields high throughput with low pause times. JVM's G1, .NET's GC, and V8's Orinoco/Scavenger all exploit this. To track old-to-young pointers efficiently, generational GCs use write barriers and remembered sets / card tables — a small runtime cost in exchange for a big collection-time win."},
  {"topic":"Memory Safety","q":"What is the purpose of an 'escape analysis' in a compiler?","options":["Detect when a heap-allocated object's lifetime is bounded by its allocating function so it can be stack-allocated or scalar-replaced","Detect compiler crashes","Find escape characters in strings","Identify uncaught exceptions"],"answer":0,"explain":"If a freshly allocated object never 'escapes' the current method (no reference is stored in a longer-lived object, returned, or passed to an opaque callee), the compiler can promote it to the stack or even split its fields into individual scalars (scalar replacement of aggregates), eliminating GC pressure and indirection. HotSpot, Graal, and Go's compiler do this aggressively. The other options are about runtime errors or strings, unrelated to lifetime analysis."},
  {"topic":"Concurrency","q":"Why is the C/C++ memory model relevant to compiler writers?","options":["It tells the compiler which reorderings of memory operations are legal in the presence of concurrent threads, especially around atomics","It defines syntax for threads","It mandates a particular scheduler","It forbids all reorderings"],"answer":0,"explain":"Optimizers love to hoist, sink, and combine loads/stores, but in the presence of other threads such reorderings can break invariants — so the C++11 memory model (and C11) precisely defines, via memory_order tags on atomics, which reorderings are observable. The compiler must respect 'happens-before' edges established by acquire/release pairs and must not invent racy reads. Without this contract, lock-free data structures would be impossible to write portably."},
  {"topic":"Error Recovery","q":"Panic-mode error recovery in a parser typically ...","options":["Halts compilation immediately on the first error","Skips input tokens until a designated synchronization token (e.g., ';' or '}') is seen, then resumes","Tries every possible correction exhaustively","Silently ignores all errors"],"answer":1,"explain":"Panic-mode is the simplest practical strategy: when a syntax error occurs the parser discards tokens until it reaches a synchronization symbol drawn from the FOLLOW set of an enclosing nonterminal (statement terminators, block delimiters), then continues parsing. This avoids cascades of misleading errors at the cost of skipping potentially correct code. Phrase-level recovery (single-token insertion/deletion) and error productions are more sophisticated alternatives used in production compilers like Clang."},
  {"topic":"Just-In-Time","q":"Tiered compilation in modern JIT VMs (HotSpot, V8, .NET) refers to ...","options":["Running unoptimized code first, profiling it, then recompiling hot methods at higher optimization levels","Compiling once at maximum optimization","Interpreting forever","Using only AOT"],"answer":0,"explain":"Tiered execution starts with an interpreter or a fast baseline JIT (HotSpot C1, V8 Sparkplug, RyuJIT Tier 0) to minimize startup latency, collects profile data (branch frequencies, type feedback, hot loops), and then promotes hot methods to an optimizing JIT (HotSpot C2/Graal, V8 TurboFan) that can speculate on the profile. If a speculation fails — say a monomorphic call site sees a new type — the runtime deoptimizes back to the baseline. AOT and 'always max-opt' are different strategies with different start-up/peak trade-offs."},
  {"topic":"Linking & Loading","q":"What does a relocation entry in an object file describe?","options":["A symbol's debug location","A patch the linker must apply once final addresses are known (e.g., the address to fill in for an extern call site)","An optimization to perform","A source-line mapping"],"answer":1,"explain":"Each relocation says 'at offset X in section S, when you know the final address of symbol Y, write its value (perhaps PC-relative, perhaps with an addend) here'. This is what makes separate compilation possible: the assembler emits placeholder bytes plus relocation records, and the linker resolves them when laying out the executable. Debug info lives in DWARF/.pdb sections; line mappings are also DWARF; optimization metadata lives in IR or specialized sections."},
  {"topic":"Misc","q":"A peephole optimizer operates on ...","options":["The whole program","Small windows of consecutive instructions, replacing inefficient sequences with shorter equivalents","The AST only","Only loops"],"answer":1,"explain":"Peephole optimizations look at 2–4 instruction windows (e.g., 'mov eax, 0' → 'xor eax, eax', or eliminating redundant load/store pairs around register spills) and apply local pattern-rewrite rules. They are cheap, late-stage cleanup — typically run after instruction selection and register allocation — and complement, rather than replace, the heavy mid-end optimizers. They cannot do whole-program transforms (that's IPO/LTO), do not act on the AST, and apply everywhere, not only in loops."}
]
</script>
<script>
(function() {
  const dataEl = document.getElementById('quiz-data');
  if (!dataEl) return;
  let questions;
  try { questions = JSON.parse(dataEl.textContent); } catch(e) { console.error('Quiz JSON parse error', e); return; }
  if (!Array.isArray(questions) || !questions.length) return;

  // ── Inject CSS ──
  const css = `
  #view-quiz { overflow-y: auto; padding-top: 60px; height: 100vh; }
  .quiz-wrap { max-width: 880px; margin: 0 auto; padding: 24px 24px 80px; }
  .quiz-header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom: 12px; }
  .quiz-header h2 { font-size: 22px; color: #58a6ff; }
  .quiz-header .quiz-sub { font-size: 12px; color: #8b949e; margin-top: 2px; }
  .quiz-stats { display:flex; gap:10px; flex-wrap:wrap; }
  .quiz-stat { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:8px 14px; font-size:12px; color:#8b949e; }
  .quiz-stat b { color:#c9d1d9; font-size:15px; display:block; }
  .quiz-stat.ok b { color:#7ee787; }
  .quiz-stat.bad b { color:#ff7b72; }
  .quiz-filters { display:flex; flex-wrap:wrap; gap:6px; margin: 12px 0 16px; }
  .quiz-chip { background:#0d1117; border:1px solid #30363d; color:#8b949e; padding:5px 12px; border-radius:16px; cursor:pointer; font-size:12px; transition:all .15s; }
  .quiz-chip:hover { color:#c9d1d9; border-color:#58a6ff; }
  .quiz-chip.active { background:#1f6feb; color:#fff; border-color:#58a6ff; }
  .quiz-actions { display:flex; gap:8px; flex-wrap:wrap; margin-bottom: 14px; }
  .quiz-actions .qbtn { background:#21262d; border:1px solid #30363d; color:#c9d1d9; padding:6px 14px; border-radius:6px; cursor:pointer; font-size:12px; }
  .quiz-actions .qbtn:hover { background:#30363d; border-color:#58a6ff; }
  .quiz-progress { height:6px; background:#161b22; border-radius:4px; overflow:hidden; margin-bottom:16px; border:1px solid #30363d; }
  .quiz-progress > div { height:100%; background:linear-gradient(90deg,#1f6feb,#58a6ff); transition:width .3s; }
  .quiz-card { background:#161b22; border:1px solid #30363d; border-radius:12px; padding:22px 26px; box-shadow:0 4px 18px rgba(0,0,0,.3); }
  .quiz-card .qc-meta { font-size:11px; color:#58a6ff; font-weight:600; text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; display:flex; justify-content:space-between; }
  .quiz-card .qc-meta .qc-num { color:#8b949e; }
  .quiz-card .qc-q { font-size:16px; color:#c9d1d9; line-height:1.55; font-weight:600; margin-bottom:16px; }
  .quiz-options { display:flex; flex-direction:column; gap:8px; }
  .quiz-opt { background:#0d1117; border:1px solid #30363d; color:#c9d1d9; padding:11px 16px; border-radius:8px; cursor:pointer; text-align:left; font-size:14px; transition:all .15s; line-height:1.4; display:flex; align-items:flex-start; gap:10px; }
  .quiz-opt:hover:not(.disabled) { border-color:#58a6ff; background:#161b22; }
  .quiz-opt .opt-letter { flex-shrink:0; width:22px; height:22px; border-radius:50%; background:#21262d; color:#8b949e; font-size:11px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; }
  .quiz-opt.correct { border-color:#3fb950; background:rgba(63,185,80,.08); }
  .quiz-opt.correct .opt-letter { background:#3fb950; color:#fff; }
  .quiz-opt.wrong { border-color:#f85149; background:rgba(248,81,73,.08); }
  .quiz-opt.wrong .opt-letter { background:#f85149; color:#fff; }
  .quiz-opt.disabled { cursor:default; }
  .quiz-explain { margin-top:14px; padding:12px 16px; background:#0d1117; border-left:3px solid #58a6ff; border-radius:6px; font-size:13px; color:#8b949e; line-height:1.6; }
  .quiz-explain b { color:#58a6ff; }
  .quiz-nav { display:flex; justify-content:space-between; gap:10px; margin-top:18px; }
  .quiz-nav .qbtn { padding:8px 18px; font-size:13px; background:#21262d; border:1px solid #30363d; color:#c9d1d9; border-radius:6px; cursor:pointer; }
  .quiz-nav .qbtn:hover { background:#30363d; border-color:#58a6ff; }
  .quiz-nav .qbtn.primary { background:#1f6feb; border-color:#58a6ff; color:#fff; }
  .quiz-nav .qbtn.primary:hover { background:#388bfd; }
  .quiz-nav .qbtn:disabled { opacity:.4; cursor:not-allowed; }
  .quiz-empty { text-align:center; color:#484f58; padding:60px 20px; font-style:italic; }
  .quiz-summary { background:#161b22; border:1px solid #30363d; border-radius:12px; padding:32px; text-align:center; }
  .quiz-summary h3 { color:#58a6ff; font-size:22px; margin-bottom:6px; }
  .quiz-summary .qs-score { font-size:56px; font-weight:700; color:#7ee787; margin:12px 0; }
  .quiz-summary .qs-pct { color:#8b949e; font-size:14px; margin-bottom:16px; }
  .quiz-summary .qs-breakdown { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:8px; margin:20px 0; text-align:left; }
  .quiz-summary .qs-row { background:#0d1117; border:1px solid #30363d; border-radius:8px; padding:8px 12px; font-size:12px; color:#8b949e; }
  .quiz-summary .qs-row b { display:block; color:#c9d1d9; font-size:14px; margin-bottom:2px; }
  @media (max-width: 600px) {
    .quiz-wrap { padding:14px 12px 80px; }
    .quiz-card { padding:16px; }
    .quiz-card .qc-q { font-size:15px; }
    .quiz-opt { font-size:13px; padding:10px 12px; }
  }`;
  const styleEl = document.createElement('style');
  styleEl.textContent = css;
  document.head.appendChild(styleEl);

  // ── Inject view container ──
  function ensureView() {
    let view = document.getElementById('view-quiz');
    if (!view) {
      view = document.createElement('div');
      view.id = 'view-quiz';
      view.className = 'view';
      view.innerHTML = '<div id="quiz-container"></div>';
      document.body.appendChild(view);
    }
    return view;
  }
  const viewEl = ensureView();

  // ── State ──
  const state = { filter: 'ALL', order: [], cursor: 0, answers: {}, built: false };

  function shuffleArr(a) { for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function topics() { return ['ALL', ...Array.from(new Set(questions.map(q => q.topic || 'General')))]; }
  function pool() { return state.order.map(i => ({i, q: questions[i]})).filter(x => state.filter === 'ALL' || (x.q.topic||'General') === state.filter); }

  function build() {
    state.order = questions.map((_, i) => i);
    shuffleArr(state.order);
    const root = document.getElementById('quiz-container');
    root.innerHTML = `
      <div class="quiz-wrap">
        <div class="quiz-header">
          <div>
            <h2>🎯 Knowledge Quiz</h2>
            <div class="quiz-sub">${questions.length} questions across ${topics().length - 1} topics — pick a topic or take it all.</div>
          </div>
          <div class="quiz-stats" id="quiz-stats"></div>
        </div>
        <div class="quiz-filters" id="quiz-filters"></div>
        <div class="quiz-actions">
          <button class="qbtn" data-act="shuffle">🔀 Shuffle</button>
          <button class="qbtn" data-act="reset">↺ Reset Answers</button>
          <button class="qbtn" data-act="next-unans">⏭ Next Unanswered</button>
          <button class="qbtn" data-act="summary">📊 Summary</button>
        </div>
        <div class="quiz-progress"><div id="quiz-progress-bar" style="width:0%"></div></div>
        <div id="quiz-body"></div>
      </div>`;
    root.querySelectorAll('.qbtn[data-act]').forEach(b => b.addEventListener('click', () => {
      const a = b.getAttribute('data-act');
      if (a === 'shuffle') { shuffleArr(state.order); state.cursor = 0; renderQ(); }
      else if (a === 'reset') { if (confirm('Reset all answers?')) { state.answers = {}; renderQ(); } }
      else if (a === 'next-unans') { const p = pool(); const n = p.findIndex(x => state.answers[x.i] === undefined); if (n >= 0) { state.cursor = n; renderQ(); } }
      else if (a === 'summary') { showSummary(); }
    }));
    renderFilters();
    renderQ();
    state.built = true;
  }

  function renderFilters() {
    const el = document.getElementById('quiz-filters');
    el.innerHTML = '';
    topics().forEach(t => {
      const count = t === 'ALL' ? questions.length : questions.filter(q => (q.topic || 'General') === t).length;
      const chip = document.createElement('button');
      chip.className = 'quiz-chip' + (t === state.filter ? ' active' : '');
      chip.textContent = t === 'ALL' ? `All (${count})` : `${t} (${count})`;
      chip.addEventListener('click', () => { state.filter = t; state.cursor = 0; renderFilters(); renderQ(); });
      el.appendChild(chip);
    });
  }

  function renderStats() {
    const p = pool();
    const answered = p.filter(x => state.answers[x.i] !== undefined);
    const correct = answered.filter(x => state.answers[x.i] === x.q.answer).length;
    const wrong = answered.length - correct;
    const el = document.getElementById('quiz-stats');
    if (el) el.innerHTML = `
      <div class="quiz-stat"><b>${p.length}</b>Questions</div>
      <div class="quiz-stat ok"><b>${correct}</b>Correct</div>
      <div class="quiz-stat bad"><b>${wrong}</b>Wrong</div>
      <div class="quiz-stat"><b>${answered.length}/${p.length}</b>Done</div>`;
    const pct = p.length ? Math.round(100 * answered.length / p.length) : 0;
    const bar = document.getElementById('quiz-progress-bar');
    if (bar) bar.style.width = pct + '%';
  }

  function renderQ() {
    const p = pool();
    const body = document.getElementById('quiz-body');
    if (!p.length) { body.innerHTML = '<div class="quiz-empty">No questions for this filter.</div>'; renderStats(); return; }
    if (state.cursor >= p.length) state.cursor = p.length - 1;
    if (state.cursor < 0) state.cursor = 0;
    const cur = p[state.cursor];
    const q = cur.q;
    const selected = state.answers[cur.i];
    const answered = selected !== undefined;
    const optsHtml = q.options.map((opt, i) => {
      let cls = '';
      if (answered) { if (i === q.answer) cls = 'correct'; else if (i === selected) cls = 'wrong'; cls += ' disabled'; }
      const letter = String.fromCharCode(65 + i);
      return `<button class="quiz-opt ${cls}" data-opt="${i}" ${answered ? 'disabled' : ''}>
        <span class="opt-letter">${letter}</span><span>${escapeHtml(opt)}</span>
      </button>`;
    }).join('');
    body.innerHTML = `
      <div class="quiz-card">
        <div class="qc-meta"><span>${escapeHtml(q.topic || 'General')}</span><span class="qc-num">${state.cursor + 1} / ${p.length}</span></div>
        <div class="qc-q">${escapeHtml(q.q)}</div>
        <div class="quiz-options">${optsHtml}</div>
        ${answered ? `<div class="quiz-explain"><b>${selected === q.answer ? '✓ Correct.' : '✗ Not quite.'}</b> ${escapeHtml(q.explain || '')}</div>` : ''}
        <div class="quiz-nav">
          <button class="qbtn" data-nav="prev" ${state.cursor === 0 ? 'disabled' : ''}>← Previous</button>
          <button class="qbtn primary" data-nav="next" ${state.cursor === p.length - 1 ? 'disabled' : ''}>Next →</button>
        </div>
      </div>`;
    body.querySelectorAll('.quiz-opt[data-opt]').forEach(b => b.addEventListener('click', () => {
      const idx = cur.i;
      if (state.answers[idx] !== undefined) return;
      state.answers[idx] = +b.getAttribute('data-opt');
      renderQ();
    }));
    body.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => {
      const dir = b.getAttribute('data-nav');
      const pp = pool();
      if (dir === 'next' && state.cursor < pp.length - 1) { state.cursor++; renderQ(); }
      else if (dir === 'prev' && state.cursor > 0) { state.cursor--; renderQ(); }
    }));
    renderStats();
  }

  function showSummary() {
    const p = pool();
    const answered = p.filter(x => state.answers[x.i] !== undefined);
    const correct = answered.filter(x => state.answers[x.i] === x.q.answer).length;
    const pct = answered.length ? Math.round(100 * correct / answered.length) : 0;
    const topicStats = {};
    p.forEach(x => {
      const t = x.q.topic || 'General';
      if (!topicStats[t]) topicStats[t] = { total: 0, answered: 0, correct: 0 };
      topicStats[t].total++;
      if (state.answers[x.i] !== undefined) {
        topicStats[t].answered++;
        if (state.answers[x.i] === x.q.answer) topicStats[t].correct++;
      }
    });
    const rows = Object.entries(topicStats).map(([t,s]) =>
      `<div class="qs-row"><b>${escapeHtml(t)}</b>${s.correct}/${s.answered} correct · ${s.total} total</div>`).join('');
    document.getElementById('quiz-body').innerHTML = `
      <div class="quiz-summary">
        <h3>Summary</h3>
        <div class="qs-score">${correct} / ${answered.length || p.length}</div>
        <div class="qs-pct">${pct}% correct · ${answered.length} of ${p.length} answered</div>
        <div class="qs-breakdown">${rows}</div>
        <div class="quiz-nav" style="justify-content:center">
          <button class="qbtn primary" id="qs-back">Back to Questions</button>
          <button class="qbtn" id="qs-reset">Reset Answers</button>
        </div>
      </div>`;
    document.getElementById('qs-back').addEventListener('click', renderQ);
    document.getElementById('qs-reset').addEventListener('click', () => { if (confirm('Reset all answers?')) { state.answers = {}; renderQ(); } });
  }

  // ── Activate when the quiz tab is shown ──
  function activate() {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    viewEl.classList.add('active');
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === 'quiz'));
    // hide any floating canvas-controls from other tabs
    document.querySelectorAll('.canvas-controls').forEach(c => { if (c.id !== 'quiz-controls') c.style.display = 'none'; });
    if (!state.built) build();
  }

  // ── Bootstrap on DOM ready: add tab button, hook switchTab ──
  function boot() {
    // Find the tab-group container (handles both class and id variants)
    const tg = document.querySelector('#tab-group') || document.querySelector('.tab-group');
    if (tg) {
      // Avoid duplicate
      if (!tg.querySelector('[data-view="quiz"]')) {
        const btn = document.createElement('button');
        btn.className = 'tab';
        btn.dataset.view = 'quiz';
        btn.textContent = '🎯 Quiz';
        btn.addEventListener('click', () => {
          if (typeof window.switchTab === 'function') {
            try { window.switchTab('quiz'); } catch(e) { activate(); }
            // even if host switchTab handles 'quiz', ensure quiz is built & active
            activate();
          } else {
            activate();
          }
        });
        tg.appendChild(btn);
      }
    }
    // Wrap host switchTab so that programmatic switches also work
    if (typeof window.switchTab === 'function') {
      const orig = window.switchTab;
      window.switchTab = function(tab) {
        if (tab === 'quiz') { activate(); return; }
        try { orig(tab); } catch(e) {}
      };
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
