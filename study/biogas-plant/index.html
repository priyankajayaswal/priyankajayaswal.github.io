<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d1117">

<title>Study Tool Template</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #0d1117; color: #c9d1d9; overflow: hidden; }

  /* ── Toolbar ── */
  #toolbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    background: rgba(13,17,23,0.92); backdrop-filter: blur(8px);
    padding: 0 24px; display: flex; align-items: stretch; gap: 0;
    border-bottom: 1px solid #30363d; height: 50px;
  }
  #toolbar h1 { font-size: 18px; font-weight: 600; color: #58a6ff; white-space: nowrap; display: flex; align-items: center; margin-right: 24px; }
  .tab-group { display: flex; gap: 0; align-items: stretch; margin-right: 20px; }
  .tab {
    background: none; border: none; border-bottom: 2px solid transparent;
    color: #8b949e; padding: 0 16px; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all .2s; display: flex; align-items: center;
  }
  .tab:hover { color: #c9d1d9; }
  .tab.active { color: #58a6ff; border-bottom-color: #58a6ff; }
  .actions { display: flex; align-items: center; gap: 8px; }
  .btn { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .btn:hover { background: #30363d; border-color: #58a6ff; }
  .toolbar-sep { width: 1px; height: 24px; background: #30363d; align-self: center; margin: 0 6px; flex-shrink: 0; }
  .hint { font-size: 12px; color: #8b949e; margin-left: auto; display: flex; align-items: center; }
  #toolbar-menu { display: contents; }
  #hamburger {
    display: none; background: none; border: 1px solid #30363d; color: #c9d1d9;
    font-size: 20px; padding: 4px 10px; border-radius: 6px; cursor: pointer; line-height: 1;
  }
  #hamburger:hover { border-color: #58a6ff; color: #58a6ff; }

  /* ── Floating Controls ── */
  .canvas-controls {
    position: fixed; top: 62px; right: 16px; z-index: 8;
    display: flex; flex-direction: column; gap: 4px;
  }
  .canvas-controls .cbtn {
    background: rgba(22,27,34,0.85); backdrop-filter: blur(8px);
    border: 1px solid #30363d; color: #8b949e; padding: 6px 12px;
    border-radius: 8px; cursor: pointer; font-size: 11px; text-align: left;
    transition: all 0.2s; white-space: nowrap;
  }
  .canvas-controls .cbtn:hover { background: rgba(33,38,45,0.95); color: #c9d1d9; border-color: #58a6ff; }
  .mobile-only { display: none !important; }
  #legend, #legend-graph { position: relative; }

  /* ── Views ── */
  #canvas, #canvas-graph { width: 100vw; height: 100vh; }
  .view { display: none; }
  .view.active { display: block; }

  /* Mindmap */
  path.link { pointer-events: stroke; cursor: pointer; }
  path.link:hover { stroke-opacity: 0.7 !important; stroke-width: 3 !important; }

  /* ── Tooltip ── */
  #tooltip {
    position: fixed; pointer-events: none; opacity: 0;
    background: #161b22; border: 1px solid #30363d; border-radius: 8px;
    padding: 10px 14px; max-width: 380px; font-size: 13px; line-height: 1.5;
    box-shadow: 0 8px 24px rgba(0,0,0,.4); transition: opacity .15s; z-index: 20;
  }
  #tooltip.has-slides { pointer-events: auto; }
  #tooltip .tt-title { color: #58a6ff; font-weight: 600; margin-bottom: 4px; }
  #tooltip .tt-body  { color: #8b949e; }
  #tooltip .tt-slides { margin-top: 6px; padding-top: 5px; border-top: 1px solid #30363d; }
  #tooltip .tt-slides:empty { display: none; }
  #tooltip .tt-slides a {
    display: inline-block; margin: 2px 4px 2px 0; padding: 2px 8px; border-radius: 4px;
    background: rgba(88,166,255,0.1); color: #58a6ff; text-decoration: none;
    font-size: 11px; font-weight: 500; cursor: pointer; border: 1px solid rgba(88,166,255,0.2);
  }
  #tooltip .tt-slides a:hover { background: rgba(88,166,255,0.2); border-color: #58a6ff; }

  #source-link {
    position: fixed; bottom: 16px; right: 16px; z-index: 10;
    background: rgba(22,27,34,0.92); border: 1px solid #30363d; border-radius: 8px;
    padding: 8px 14px; font-size: 12px; font-weight: 600;
    color: #ff0000; text-decoration: none;
  }
  #source-link:hover { background: rgba(255,0,0,0.1); border-color: #ff0000; }

  /* ── Legend ── */
  #legend {
    position: fixed; bottom: 16px; left: 16px; z-index: 10;
    background: rgba(22,27,34,0.92); border: 1px solid #30363d; border-radius: 8px;
    padding: 12px 16px; font-size: 12px;
  }
  #legend div { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  #legend span.swatch { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  #legend .swatch-line { width: 20px; height: 3px; border-radius: 2px; display: inline-block; }
  .legend-item:hover { background: rgba(88,166,255,0.1); }
  .legend-item.active-filter { background: rgba(88,166,255,0.18); outline: 1px solid #58a6ff; }

  /* ── Graph ── */
  .graph-link { fill: none; stroke-opacity: 0.45; }
  .graph-link:hover { stroke-opacity: 0.9; }
  .graph-node-label { font-size: 11px; fill: #c9d1d9; pointer-events: none; paint-order: stroke; stroke: #0d1117; stroke-width: 3.5px; }
  .graph-link-label { font-size: 9.5px; fill: #8b949e; pointer-events: auto; cursor: pointer; paint-order: stroke; stroke: #0d1117; stroke-width: 3px; }
  .graph-link-label:hover { fill: #58a6ff; }
  .graph-link-hit { fill: none; stroke: transparent; stroke-width: 16; pointer-events: stroke; cursor: pointer; }

  /* ── Learning Path Panel ── */
  #path-panel {
    position: fixed; top: 56px; right: 0; bottom: 0; width: 340px; z-index: 10;
    background: rgba(13,17,23,0.95); border-left: 1px solid #30363d;
    overflow-y: auto; padding: 20px; display: none; backdrop-filter: blur(8px);
  }
  #path-panel.open { display: block; }
  #path-panel h2 { font-size: 15px; color: #58a6ff; margin-bottom: 4px; }
  #path-panel .subtitle { font-size: 12px; color: #8b949e; margin-bottom: 16px; }
  .path-step { display: flex; gap: 12px; padding: 10px; border-radius: 8px; cursor: pointer; transition: background .2s; margin-bottom: 2px; position: relative; }
  .path-step:hover { background: rgba(88,166,255,0.08); }
  .path-step.active { background: rgba(88,166,255,0.14); }
  .step-badge { flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%; border: 2px solid #30363d; background: #161b22; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #c9d1d9; }
  .path-step.active .step-badge { border-color: #58a6ff; background: #58a6ff; color: #0d1117; }
  .path-step.completed .step-badge { background: #238636; border-color: #238636; color: #fff; }
  .path-step.completed .step-connector { background: #238636; }
  .path-step.active .step-connector { background: #58a6ff; }
  .step-content { flex: 1; min-width: 0; }
  .step-title { font-size: 13px; font-weight: 600; color: #c9d1d9; }
  .step-desc  { font-size: 11px; color: #8b949e; margin-top: 2px; line-height: 1.4; }
  .step-connector { position: absolute; left: 33px; top: 38px; bottom: -4px; width: 2px; background: #30363d; }
  .path-step:last-child .step-connector { display: none; }
  .path-controls { display: flex; gap: 8px; margin-bottom: 14px; }
  .path-btn { flex: 1; padding: 7px 10px; border-radius: 6px; border: 1px solid #30363d; background: #21262d; color: #c9d1d9; font-size: 12px; cursor: pointer; text-align: center; }
  .path-btn:hover { background: #30363d; border-color: #58a6ff; }

  /* ── Command Panel (Comments/Tags) ── */
  #cmd-panel {
    position: fixed; top: 56px; right: 0; bottom: 0; width: 380px; z-index: 15;
    background: rgba(13,17,23,0.97); border-left: 1px solid #30363d;
    display: none; flex-direction: column; backdrop-filter: blur(10px);
  }
  #cmd-panel.open { display: flex; }
  #cmd-panel-header { padding: 16px 18px 12px; border-bottom: 1px solid #30363d; display: flex; align-items: flex-start; gap: 12px; }
  #cmd-panel-header .cp-title { flex: 1; }
  #cmd-panel-header .cp-name { font-size: 15px; font-weight: 600; color: #c9d1d9; }
  #cmd-panel-header .cp-tip  { font-size: 11px; color: #8b949e; margin-top: 3px; line-height: 1.4; }
  #cmd-panel-close { background: none; border: none; color: #8b949e; font-size: 20px; cursor: pointer; padding: 0 4px; line-height: 1; }
  #cmd-panel-close:hover { color: #c9d1d9; }
  #cmd-tags { padding: 8px 18px; display: flex; flex-wrap: wrap; gap: 6px; min-height: 20px; }
  .cmd-tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 500; }
  .cmd-tag.tag-done     { background: #23863633; color: #7ee787; border: 1px solid #23863666; }
  .cmd-tag.tag-todo     { background: #1f6feb33; color: #79c0ff; border: 1px solid #1f6feb66; }
  .cmd-tag.tag-confused  { background: #da363333; color: #ff7b72; border: 1px solid #da363366; }
  .cmd-tag.tag-important { background: #9e6a0333; color: #ffa657; border: 1px solid #9e6a0366; }
  .cmd-tag.tag-custom    { background: #30363d; color: #c9d1d9; border: 1px solid #484f58; }
  #cmd-comments { flex: 1; overflow-y: auto; padding: 10px 18px; }
  .cmd-comment { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; position: relative; }
  .cmd-comment .cc-text { font-size: 13px; color: #c9d1d9; line-height: 1.5; white-space: pre-wrap; }
  .cmd-comment .cc-time { font-size: 10px; color: #484f58; margin-top: 4px; }
  .cmd-comment .cc-del { position: absolute; top: 6px; right: 8px; background: none; border: none; color: #484f58; cursor: pointer; font-size: 14px; }
  .cmd-comment .cc-del:hover { color: #ff7b72; }
  .cmd-empty { color: #484f58; font-size: 12px; font-style: italic; text-align: center; padding: 20px; }
  #cmd-input-area { padding: 12px 18px; border-top: 1px solid #30363d; }
  #cmd-input { width: 100%; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #c9d1d9; padding: 10px 12px; font-size: 13px; font-family: inherit; resize: none; outline: none; min-height: 60px; }
  #cmd-input:focus { border-color: #58a6ff; }
  #cmd-input-hint { font-size: 10px; color: #484f58; margin-top: 6px; line-height: 1.5; }
  #cmd-input-hint code { background: #161b22; padding: 1px 4px; border-radius: 3px; color: #8b949e; }
  .comment-badge { font-size: 9px; fill: #0d1117; pointer-events: none; }
  .has-comment-ring { fill: none; stroke: #ffa657; stroke-width: 2; stroke-dasharray: 3 2; }

  /* ── Deep Dives ── */
  #view-deepdive { overflow-y: auto; margin-top: 50px; height: calc(100vh - 50px); }
  #view-usecase { overflow-y: auto; margin-top: 50px; height: calc(100vh - 50px); }
  .dd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; padding: 24px 32px; max-width: 1400px; margin: 0 auto; }
  .dd-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; cursor: pointer; overflow: hidden; transition: all .25s; }
  .dd-card:hover { border-color: #58a6ff; transform: translateY(-3px); box-shadow: 0 8px 30px rgba(0,0,0,.4); }
  .dd-card-img { width: 100%; height: 200px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .dd-card-img svg { width: 100%; height: 100%; display: block; }
  .dd-card-body { padding: 16px; }
  .dd-card-num { font-size: 11px; color: #58a6ff; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
  .dd-card-title { font-size: 17px; font-weight: 700; color: #c9d1d9; margin: 4px 0 6px; }
  .dd-card-desc { font-size: 12px; color: #8b949e; line-height: 1.5; }
  .dd-full { display: none; padding: 20px 0 40px; overflow-y: auto; }
  .dd-full.active { display: block; }
  .dd-infographic { max-width: 900px; margin: 0 auto; padding: 32px; background: #161b22; border: 1px solid #30363d; border-radius: 16px; }
  .dd-infographic h2 { font-size: 24px; color: #58a6ff; margin-bottom: 4px; }
  .dd-infographic .dd-subtitle { font-size: 13px; color: #8b949e; margin-bottom: 24px; }
  .dd-section { margin-top: 24px; }
  .dd-section h3 { font-size: 15px; color: #ffa657; margin-bottom: 8px; }
  .dd-section p { font-size: 13px; color: #c9d1d9; line-height: 1.7; }
  .dd-section .dd-formula { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 12px 16px; font-family: 'Courier New', monospace; font-size: 14px; color: #7ee787; margin: 10px 0; text-align: center; }
  .dd-keypoints { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .dd-kp { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 12px; font-size: 12px; }
  .dd-kp strong { color: #58a6ff; display: block; margin-bottom: 4px; }
  .dd-kp span { color: #8b949e; }
  .dd-nav { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
  .dd-nav button { padding: 8px 20px; }

  /* ── Use Cases ── */
  .uc-flow { max-width: 960px; margin: 0 auto; padding: 32px; }
  .uc-flow h2 { font-size: 22px; color: #58a6ff; margin-bottom: 4px; }
  .uc-flow .uc-subtitle { font-size: 13px; color: #8b949e; margin-bottom: 20px; }
  .uc-step {
    display: flex; gap: 14px; padding: 16px; border-radius: 10px; border: 1px solid #30363d;
    background: #161b22; cursor: pointer; transition: all .3s; opacity: 0.3;
  }
  .uc-step.active { opacity: 1; border-color: #58a6ff; box-shadow: 0 0 20px rgba(88,166,255,0.15); }
  .uc-step.done { opacity: 0.8; border-color: #3fb950; }
  .uc-step .uc-badge {
    width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; background: #30363d; color: #8b949e; flex-shrink: 0;
  }
  .uc-step.active .uc-badge { background: #58a6ff; color: #fff; }
  .uc-step.done .uc-badge { background: #3fb950; color: #fff; }
  .uc-step .uc-body { flex: 1; min-width: 0; overflow: hidden; }
  .uc-step .uc-title { font-weight: 600; color: #c9d1d9; font-size: 14px; }
  .uc-step .uc-component { font-size: 11px; color: #8b949e; margin-top: 2px; }
  .uc-step .uc-detail { display: none; margin-top: 10px; font-size: 12px; color: #c9d1d9; line-height: 1.6; }
  .uc-step.active .uc-detail { display: block; }
  .uc-step .uc-proto { display: inline-block; background: #0d1117; border: 1px solid #30363d; border-radius: 4px; padding: 2px 8px; font-size: 10px; color: #79c0ff; margin-top: 8px; }
  .uc-connector { width: 2px; height: 24px; background: #30363d; margin-left: 31px; transition: background .3s; }
  .uc-connector.done { background: #3fb950; }
  .uc-flow-controls {
    display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
  }
  .uc-flow-controls button {
    padding: 8px 18px; border-radius: 8px; border: 1px solid #30363d; background: #161b22;
    color: #c9d1d9; cursor: pointer; font-size: 13px; transition: all .2s;
  }
  .uc-flow-controls button:hover { border-color: #58a6ff; color: #58a6ff; }
  .uc-flow-controls button.primary { background: #1f6feb; border-color: #58a6ff; color: #fff; }
  .uc-legend {
    display: flex; gap: 16px; flex-wrap: wrap; margin-top: 16px; padding: 12px 16px;
    background: #0d1117; border: 1px solid #30363d; border-radius: 8px; font-size: 11px;
  }
  .uc-legend span { display: flex; align-items: center; gap: 6px; color: #8b949e; }
  .uc-legend .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .uc-back-btn {
    background: none; border: 1px solid #30363d; color: #58a6ff; padding: 8px 16px;
    border-radius: 8px; cursor: pointer; font-size: 13px; margin-bottom: 16px; transition: all 0.2s;
  }
  .uc-back-btn:hover { background: #161b22; border-color: #58a6ff; }
  .uc-code {
    margin-top: 10px; padding: 10px 14px; background: #0d1117; border: 1px solid #30363d;
    border-radius: 6px; font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    font-size: 11px; color: #7ee787; line-height: 1.5; overflow-x: auto; white-space: pre;
    max-width: 100%; box-sizing: border-box;
  }
  .uc-refs { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .uc-refs a {
    display: inline-block; padding: 3px 10px; background: #161b22; border: 1px solid #30363d;
    border-radius: 4px; font-size: 10px; color: #79c0ff; text-decoration: none; transition: all .2s;
  }
  .uc-refs a:hover { border-color: #58a6ff; color: #58a6ff; background: #0d1117; }
  .legend-close {
    position: absolute; top: 8px; right: 8px; background: none; border: none;
    color: #8b949e; font-size: 16px; cursor: pointer; line-height: 1; padding: 2px 6px;
  }
  .legend-close:hover { color: #c9d1d9; }

  /* ── Tracker Panel ── */
  #tracker-panel {
    position: fixed; top: 56px; left: 0; bottom: 0; width: 320px; z-index: 12;
    background: rgba(13,17,23,0.97); border-right: 1px solid #30363d;
    display: none; flex-direction: column; backdrop-filter: blur(10px); overflow: hidden;
  }
  #tracker-panel.open { display: flex; }
  #tracker-header { padding: 16px 18px 10px; border-bottom: 1px solid #30363d; display: flex; align-items: center; justify-content: space-between; }
  #tracker-header h3 { font-size: 14px; color: #58a6ff; font-weight: 600; }
  #tracker-header button { background: none; border: none; color: #8b949e; font-size: 18px; cursor: pointer; }
  #tracker-stats { padding: 10px 18px; display: flex; gap: 10px; border-bottom: 1px solid #21262d; }
  .tracker-stat { flex: 1; background: #0d1117; border-radius: 8px; padding: 8px 10px; text-align: center; }
  .tracker-stat .ts-num { font-size: 20px; font-weight: 700; }
  .tracker-stat .ts-label { font-size: 10px; color: #8b949e; }
  #tracker-list { flex: 1; overflow-y: auto; padding: 8px 12px; }
  .tracker-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 2px; }
  .tracker-item:hover { background: rgba(88,166,255,0.08); }
  .tracker-filter { padding: 8px 18px; border-bottom: 1px solid #21262d; display: flex; gap: 6px; flex-wrap: wrap; }
  .tf-chip { padding: 3px 10px; border-radius: 12px; font-size: 11px; cursor: pointer; border: 1px solid #30363d; background: #21262d; color: #8b949e; }
  .tf-chip:hover, .tf-chip.active { border-color: #58a6ff; color: #58a6ff; background: rgba(88,166,255,0.1); }

  /* ── PDF Viewer ── */
  #pdf-viewer {
    display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    z-index: 50; background: #0d1117; flex-direction: column;
  }
  #pdf-viewer.open { display: flex; }
  #pdf-toolbar { display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: #161b22; border-bottom: 1px solid #30363d; flex-shrink: 0; }
  #pdf-toolbar .pdf-title { flex: 1; color: #c9d1d9; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #pdf-iframe { width: 100%; height: 100%; border: none; background: #1e1e1e; }
  #scribble-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: crosshair; z-index: 2; display: none; }
  #scribble-canvas.active { display: block; }
  #pdf-body { position: relative; flex: 1; overflow: hidden; }
  .scribble-tools { display: flex; align-items: center; gap: 6px; margin-left: 8px; border-left: 1px solid #30363d; padding-left: 10px; }
  .scribble-tools .btn { font-size: 11px; padding: 3px 8px; }
  .scribble-tools .btn.active-tool { background: #58a6ff; color: #0d1117; }
  .scribble-color { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #30363d; cursor: pointer; display: inline-block; }
  .scribble-color.sel { border-color: #c9d1d9; }
  .scribble-size { width: 50px; accent-color: #58a6ff; }

  /* ── Appendix ── */
  #appendix-container { position: relative; top: 0; width: 100%; max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
  #view-appendix { overflow-y: auto; height: calc(100vh - 50px); margin-top: 50px; }
  .appendix-stats { color: #8b949e; font-size: 13px; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  .appendix-stats .stat-pill { background: #21262d; border: 1px solid #30363d; border-radius: 12px; padding: 2px 10px; font-size: 12px; }
  .appendix-filter { width: 100%; max-width: 400px; padding: 8px 12px; margin-bottom: 16px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; font-size: 14px; outline: none; }
  .appendix-filter:focus { border-color: #58a6ff; }

let graphInitialized = false;

function toggleMobileLegend(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('mobile-open');
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === tab));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + tab).classList.add('active');

  document.getElementById('mindmap-controls').style.display  = tab === 'mindmap'  ? 'flex' : 'none';
  document.getElementById('graph-controls').style.display    = tab === 'graph'    ? 'flex' : 'none';
  document.getElementById('deepdive-controls').style.display = 'none';
  document.getElementById('usecase-controls').style.display  = 'none';
  document.getElementById('btn-path').style.display = (tab === 'graph' && C.learningPath && C.learningPath.length) ? '' : 'none';
  document.querySelector('.legend-mindmap').style.display = tab === 'mindmap' ? '' : 'none';
  document.getElementById('legend-graph').style.display   = tab === 'graph'   ? '' : 'none';

  if (tab === 'graph' && !graphInitialized) { initGraph(); graphInitialized = true; }
  // Close mobile menu
  document.querySelector('.tab-group').classList.remove('open');
}

function toggleMobileMenu() {
  document.querySelector('.tab-group').classList.toggle('open');

const tooltip = document.getElementById('tooltip');

function showTooltip(evt, name, tip, slides) {
  tooltip.querySelector('.tt-title').textContent = name.replace(/\n/g, ' ');
  tooltip.querySelector('.tt-body').textContent = tip || '';
  const sc = tooltip.querySelector('.tt-slides');
  sc.innerHTML = '';
  if (slides && slides.length) {
    sc.innerHTML = '<span class="slides-label">📎 Linked Materials</span>';
    slides.forEach(s => {
      const a = document.createElement('a');
      a.textContent = s.label;
      a.onclick = (e) => { e.stopPropagation(); openPdfViewer(s.path, s.label); };
      sc.appendChild(a);
    });
    tooltip.classList.add('has-slides');
  } else {
    tooltip.classList.remove('has-slides');
  }
  tooltip.style.opacity = 1;
  positionTooltip(evt);
}

function positionTooltip(evt) {
  const pad = 8;
  const tt = tooltip;
  const vw = window.innerWidth, vh = window.innerHeight;
  const tw = tt.offsetWidth || 300, th = tt.offsetHeight || 150;
  let x = evt.pageX + 16, y = evt.pageY - 10;
  if (x + tw + pad > vw) x = Math.max(pad, vw - tw - pad);
  if (y + th + pad > vh) y = Math.max(pad, vh - th - pad);
  if (x < pad) x = pad;
  if (y < pad) y = pad;
  tt.style.left = x + 'px';
  tt.style.top = y + 'px';
}

// Global listeners to keep tooltip within viewport on move/touch
document.addEventListener('mousemove', function(e) {
  if (tooltip.style.opacity === '1') positionTooltip(e);
});
document.addEventListener('touchstart', function(e) {
  if (tooltip.style.opacity === '1') {
    const t = e.touches[0];
    setTimeout(() => positionTooltip({ pageX: t.pageX, pageY: t.pageY }), 50);
  }
}, { passive: true });

function hideTooltip() {
  setTimeout(() => { if (!tooltip.matches(':hover')) tooltip.style.opacity = 0; }, 200);
}
tooltip.addEventListener('mouseleave', () => { tooltip.style.opacity = 0; });

// ═══════════════════════════════════════════════════════════════════════
// MIND MAP (D3 collapsible tree)
// ═══════════════════════════════════════════════════════════════════════
let g, root, treeLayout, mmZoom;

if (C.mindmap) {
  const W = window.innerWidth, H = window.innerHeight;
  const svg = d3.select("#canvas");
  g = svg.append("g");
  mmZoom = d3.zoom().scaleExtent([0.1, 4]).on("zoom", e => g.attr("transform", e.transform));
  svg.call(mmZoom);
  // Sync zoom internal state with initial position so resetView works correctly
  const mmInitialTransform = d3.zoomIdentity.translate(W/3, H/2);
  svg.call(mmZoom.transform, mmInitialTransform);

  root = d3.hierarchy(C.mindmap);
  root.x0 = 0; root.y0 = 0;

  // Collapse children beyond depth 1
  root.descendants().forEach(d => { if (d.depth > 1 && d.children) { d._children = d.children; d.children = null; } });

  treeLayout = d3.tree().nodeSize([28, 220]);
  updateMindmap(root);

  // Build legend
  buildMindmapLegend();
}

function updateMindmap(source) {
  const duration = 400;
  treeLayout(root);
  const nodes = root.descendants();
  const links = root.links();

  // Links
  const link = g.selectAll("path.link").data(links, d => d.target.data.name);
  link.enter().insert("path", "g")
    .attr("class", "link")
    .attr("fill", "none")
    .attr("stroke", d => depthColors[Math.min(d.target.depth, depthColors.length-1)])
    .attr("stroke-opacity", 0.25)
    .attr("stroke-width", 2)
    .attr("d", () => {
      const o = { x: source.x0, y: source.y0 };
      return diagonal({ source: o, target: o });
    })
    .on("mouseover", function(evt, d) { showTooltip(evt, d.target.data.name, d.target.data.tooltip, d.target.data.slides); })
    .on("mousemove", positionTooltip)
    .on("mouseout", hideTooltip)
    .transition().duration(duration)
    .attr("d", diagonal);

  link.transition().duration(duration).attr("d", diagonal);
  link.exit().transition().duration(duration)
    .attr("d", () => { const o = { x: source.x, y: source.y }; return diagonal({ source: o, target: o }); })
    .remove();

  // Nodes
  const node = g.selectAll("g.node").data(nodes, d => d.data.name);
  const nodeEnter = node.enter().append("g")
    .attr("class", "node")
    .attr("transform", `translate(${source.y0},${source.x0})`)
    .on("click", (evt, d) => { if (d.children) { d._children = d.children; d.children = null; } else if (d._children) { d.children = d._children; d._children = null; } updateMindmap(d); })
    .on("dblclick", (evt, d) => openCmdPanel(d.data.name, d.data.tooltip))
    .on("mouseover", (evt, d) => showTooltip(evt, d.data.name, d.data.tooltip, d.data.slides))
    .on("mousemove", positionTooltip)
    .on("mouseout", hideTooltip);

  nodeEnter.append("circle")
    .attr("r", d => d.depth === 0 ? 14 : d.data._lab ? 9 : 10)
    .attr("fill", d => depthColors[Math.min(d.depth, depthColors.length-1)])
    .attr("fill-opacity", d => d.data._lab ? 0.5 : 0.85)
    .attr("stroke", d => depthColors[Math.min(d.depth, depthColors.length-1)])
    .attr("stroke-width", d => d.depth === 0 ? 3 : 2)
    .attr("stroke-opacity", 0.4);

  nodeEnter.each(function(d) {
    const lines = d.data.name.split("\n");
    const t = d3.select(this).append("text")
      .attr("fill", "#c9d1d9").attr("font-size", d.depth === 0 ? "13px" : "11px")
      .attr("font-weight", d.depth <= 1 ? "600" : "400")
      .attr("dy", lines.length > 1 ? `${-(lines.length-1)*0.3}em` : ".35em")
      .attr("x", d.children || d._children ? -16 : 16)
      .attr("text-anchor", d.children || d._children ? "end" : "start")
      .style("paint-order", "stroke").style("stroke", "#0d1117").style("stroke-width", "3px");
    lines.forEach((line, i) => {
      t.append("tspan")
        .attr("x", d.children || d._children ? -16 : 16)
        .attr("dy", i === 0 ? 0 : "1.2em")
        .text(line);
    });
  });

  // Update positions
  const nodeUpdate = nodeEnter.merge(node);
  nodeUpdate.transition().duration(duration).attr("transform", d => `translate(${d.y},${d.x})`);
  node.exit().transition().duration(duration).attr("transform", `translate(${source.y},${source.x})`).remove();

  nodes.forEach(d => { d.x0 = d.x; d.y0 = d.y; });
}

function diagonal(d) {
  return `M${d.source.y},${d.source.x}C${(d.source.y+d.target.y)/2},${d.source.x} ${(d.source.y+d.target.y)/2},${d.target.x} ${d.target.y},${d.target.x}`;
}

function expandAll()   { root.descendants().forEach(d => { if (d._children) { d.children = d._children; d._children = null; } }); updateMindmap(root); }
function collapseAll() { root.descendants().forEach(d => { if (d.depth > 1 && d.children) { d._children = d.children; d.children = null; } }); updateMindmap(root); }
function resetView()   { collapseAll(); const W = window.innerWidth, H = window.innerHeight; d3.select("#canvas").transition().duration(600).call(mmZoom.transform, d3.zoomIdentity.translate(W/3, H/2)); }

function buildMindmapLegend() {
  const legend = document.getElementById('legend');
  legend.style.display = '';
  const labels = ['Course Root', 'Weekly Topics', 'Sub-Topics', 'Key Concepts', 'Labs'];
  let html = '<button class="legend-close" onclick="this.parentElement.classList.remove(\'mobile-open\')" title="Close">✕</button><div style="font-weight:600;color:#58a6ff;margin-bottom:6px;font-size:12px">Node Depth <span style="font-weight:400;color:#8b949e;font-size:10px">— click to filter</span></div>';
  labels.forEach((l, i) => {
    html += `<div class="legend-item" data-mm="depth-${i}" style="display:flex;align-items:center;gap:8px;margin:4px 0;cursor:pointer;padding:2px 4px;border-radius:4px"><span class="swatch" style="background:${depthColors[i]}"></span> ${l}</div>`;
  });
  html += '<div style="margin-top:6px;border-top:1px solid #30363d;padding-top:6px"><div class="legend-item" data-mm="reset" style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:2px 4px;border-radius:4px;color:#8b949e"><span style="font-size:14px">✕</span> Clear filter</div></div>';
  legend.innerHTML = html;

  // Legend click filtering
  legend.querySelectorAll('.legend-item').forEach(item => {
    item.addEventListener('click', () => {
      const mmKey = item.dataset.mm;
      legend.querySelectorAll('.legend-item').forEach(i => i.classList.remove('active-filter'));
      if (mmKey === 'reset') {
        g.selectAll("g.node").style("opacity", 1);
        g.selectAll("path.link").style("opacity", 1);
        return;
      }
      item.classList.add('active-filter');
      const depth = mmKey === 'depth-4' ? -1 : parseInt(mmKey.split('-')[1]);
      g.selectAll("g.node").style("opacity", d => {
        if (depth === -1) return d.data._lab ? 1 : 0.15;
        return d.depth === depth ? 1 : 0.15;
      });
      g.selectAll("path.link").style("opacity", 0.1);
    });
  });
}

// ═══════════════════════════════════════════════════════════════════════
// TOPIC GRAPH (D3 force-directed)
// ═══════════════════════════════════════════════════════════════════════
let graphZoom, showEdgeLabels = true;

function initGraph() {
  if (!C.graph) return;
  const W = window.innerWidth, H = window.innerHeight;
  const svg = d3.select("#canvas-graph");
  const graphCategories = C.graph.categories;
  const edgeColors = C.graph.edgeColors;
  const nodes = C.graph.nodes.map(d => ({...d}));
  const edges = C.graph.edges.map(d => ({...d}));

  graphZoom = d3.zoom().scaleExtent([0.2, 5]).on("zoom", e => gGraph.attr("transform", e.transform));
  svg.call(graphZoom);
  const gGraph = svg.append("g").attr("transform", `translate(${W/2},${H/2})`);

  const simul = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(edges).id(d => d.id).distance(120))
    .force("charge", d3.forceManyBody().strength(-300))
    .force("center", d3.forceCenter(0, 0))
    .force("collision", d3.forceCollide().radius(30));

  // Edges
  const link = gGraph.selectAll("line.graph-link").data(edges).enter().append("line")
    .attr("class", "graph-link")
    .attr("stroke", d => edgeColors[d.type] || "#8b949e")
    .attr("stroke-width", 2)
    .attr("marker-end", "url(#arrow)");

  // Arrow marker
  svg.append("defs").append("marker").attr("id", "arrow").attr("viewBox", "0 -4 8 8").attr("refX", 20)
    .attr("markerWidth", 6).attr("markerHeight", 6).attr("orient", "auto")
    .append("path").attr("d", "M0,-4L8,0L0,4").attr("fill", "#484f58");

  // Edge labels
  const edgeLabel = gGraph.selectAll("text.graph-link-label").data(edges).enter().append("text")
    .attr("class", "graph-link-label")
    .text(d => d.label || d.type)
    .on("mouseover", function(evt, d) { showTooltip(evt, d.label || d.type, `${d.source.label || d.source} → ${d.target.label || d.target}`); })
    .on("mouseout", hideTooltip);

  // Nodes
  const node = gGraph.selectAll("g.graph-node").data(nodes).enter().append("g")
    .attr("class", "graph-node")
    .call(d3.drag().on("start", (evt, d) => { if (!evt.active) simul.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on("drag", (evt, d) => { d.fx = evt.x; d.fy = evt.y; })
      .on("end", (evt, d) => { if (!evt.active) simul.alphaTarget(0); d.fx = null; d.fy = null; }))
    .on("click", (evt, d) => highlightNode(d, nodes, edges, link, node, edgeLabel))
    .on("dblclick", (evt, d) => openCmdPanel(d.label, d.tip))
    .on("mouseover", (evt, d) => showTooltip(evt, d.label, d.tip, d.slides))
    .on("mousemove", positionTooltip)
    .on("mouseout", hideTooltip);

  node.append("circle")
    .attr("r", d => { const c = edges.filter(e => (e.source.id||e.source)===d.id||(e.target.id||e.target)===d.id).length; return Math.max(10, 6+c*1.5); })
    .attr("fill", d => graphCategories[d.cat])
    .attr("fill-opacity", 0.85).attr("stroke", d => graphCategories[d.cat]).attr("stroke-width", 2).attr("stroke-opacity", 0.4);

  node.each(function(d) {
    const lines = d.label.split("\n");
    const t = d3.select(this).append("text").attr("class", "graph-node-label").attr("text-anchor", "middle")
      .attr("dy", lines.length > 1 ? `-${(lines.length-1)*0.3}em` : ".35em")
      .attr("y", () => { const c = edges.filter(e => (e.source.id||e.source)===d.id||(e.target.id||e.target)===d.id).length; return Math.max(10, 6+c*1.5)+14; });
    lines.forEach((line, i) => { t.append("tspan").attr("x", 0).attr("dy", i===0?0:"1.15em").text(line); });
  });

  window._graphRefs = { link, node, edgeLabel, nodes, edges };

  simul.on("tick", () => {
    link.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
    edgeLabel.attr("x",d=>(d.source.x+d.target.x)/2).attr("y",d=>(d.source.y+d.target.y)/2-6).style("display", showEdgeLabels ? "" : "none");
    node.attr("transform", d => `translate(${d.x},${d.y})`);
  });

  // Build graph legend
  buildGraphLegend();
  setTimeout(() => refreshGraphBadges(loadStore()), 300);
}

function highlightNode(d, nodes, edges, link, node, edgeLabel) {
  const connected = new Set([d.id]);
  edges.forEach(e => { const s=e.source.id||e.source, t=e.target.id||e.target; if(s===d.id) connected.add(t); if(t===d.id) connected.add(s); });
  node.select("circle").transition().duration(300).attr("fill-opacity", n => connected.has(n.id)?1:0.12);
  node.selectAll("text").transition().duration(300).style("opacity", n => connected.has(n.id)?1:0.15);
  link.transition().duration(300).attr("stroke-opacity", e => { const s=e.source.id||e.source, t=e.target.id||e.target; return (s===d.id||t===d.id)?0.85:0.04; });
  edgeLabel.transition().duration(300).style("opacity", e => { const s=e.source.id||e.source, t=e.target.id||e.target; return (s===d.id||t===d.id)?1:0.05; });
}

function highlightReset() {
  if (!window._graphRefs) return;
  const { link, node, edgeLabel } = window._graphRefs;
  node.select("circle").transition().duration(300).attr("fill-opacity",0.85).attr("stroke-opacity",0.4);
  node.selectAll("text").transition().duration(300).style("opacity",1);
  link.transition().duration(300).attr("stroke-opacity",0.45).attr("stroke-width",2);
  edgeLabel.transition().duration(300).style("opacity",1);
}
function toggleLabels() { showEdgeLabels=!showEdgeLabels; if(window._graphRefs) window._graphRefs.edgeLabel.style("display", showEdgeLabels?"":"none"); }
function resetGraphView() { highlightReset(); d3.select("#canvas-graph").transition().duration(600).call(graphZoom.transform, d3.zoomIdentity); }

function buildGraphLegend() {
  const lg = document.getElementById('legend-graph');
  let html = '<button class="legend-close" onclick="this.parentElement.classList.remove(\'mobile-open\')" title="Close">✕</button><div style="font-weight:600;color:#58a6ff;margin-bottom:6px">Node Categories <span style="font-weight:400;color:#8b949e;font-size:10px">— click to filter</span></div>';
  Object.entries(C.graph.categories).forEach(([cat, color]) => {
    html += `<div class="legend-item" data-cat="${cat}" style="display:flex;align-items:center;gap:8px;margin:4px 0;cursor:pointer;padding:2px 4px;border-radius:4px"><span class="swatch" style="background:${color}"></span> ${cat}</div>`;
  });
  html += '<div style="margin-top:8px;font-weight:600;color:#58a6ff;margin-bottom:4px">Edge Types</div>';
  Object.entries(C.graph.edgeColors).forEach(([type, color]) => {
    html += `<div class="legend-item" data-edge="${type}" style="display:flex;align-items:center;gap:8px;margin:4px 0;cursor:pointer;padding:2px 4px;border-radius:4px"><span class="swatch-line" style="background:${color}"></span> ${type}</div>`;
  });
  html += '<div style="margin-top:6px;border-top:1px solid #30363d;padding-top:6px"><div class="legend-item" data-action="reset" style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:2px 4px;border-radius:4px;color:#8b949e"><span style="font-size:14px">✕</span> Clear filter</div></div>';
  lg.innerHTML = html;

  // Attach click handlers for graph legend filtering
  const { link, node, edgeLabel, nodes, edges } = window._graphRefs;
  lg.querySelectorAll('.legend-item').forEach(item => {
    item.addEventListener('click', () => {
      lg.querySelectorAll('.legend-item').forEach(i => i.classList.remove('active-filter'));

      // Reset filter
      if (item.dataset.action === 'reset') {
        node.select("circle").transition().duration(300).attr("fill-opacity", 0.85).attr("stroke-opacity", 0.4);
        node.selectAll("text").transition().duration(300).style("opacity", 1);
        link.transition().duration(300).attr("stroke-opacity", 0.45).attr("stroke-width", 2);
        edgeLabel.transition().duration(300).style("opacity", 1);
        return;
      }

      item.classList.add('active-filter');

      // Filter by node category
      if (item.dataset.cat) {
        const cat = item.dataset.cat;
        node.select("circle").transition().duration(300)
          .attr("fill-opacity", d => d.cat === cat ? 1 : 0.08)
          .attr("stroke-opacity", d => d.cat === cat ? 0.8 : 0.05);
        node.selectAll("text").transition().duration(300)
          .style("opacity", d => d.cat === cat ? 1 : 0.1);
        link.transition().duration(300)
          .attr("stroke-opacity", e => {
            const scat = nodes.find(n => n.id === (e.source.id||e.source));
            const tcat = nodes.find(n => n.id === (e.target.id||e.target));
            return (scat && scat.cat === cat) || (tcat && tcat.cat === cat) ? 0.7 : 0.03;
          });
        edgeLabel.transition().duration(300)
          .style("opacity", e => {
            const scat = nodes.find(n => n.id === (e.source.id||e.source));
            const tcat = nodes.find(n => n.id === (e.target.id||e.target));
            return (scat && scat.cat === cat) || (tcat && tcat.cat === cat) ? 1 : 0.05;
          });
      }

      // Filter by edge type
      if (item.dataset.edge) {
        const etype = item.dataset.edge;
        link.transition().duration(300)
          .attr("stroke-opacity", e => e.type === etype ? 0.85 : 0.03)
          .attr("stroke-width", e => e.type === etype ? 3.5 : 1.5);
        edgeLabel.transition().duration(300)
          .style("opacity", e => e.type === etype ? 1 : 0.05);
        // Dim nodes not connected by this edge type
        const connected = new Set();
        edges.forEach(e => { if (e.type === etype) { connected.add(e.source.id||e.source); connected.add(e.target.id||e.target); } });
        node.select("circle").transition().duration(300)
          .attr("fill-opacity", d => connected.has(d.id) ? 1 : 0.08);
        node.selectAll("text").transition().duration(300)
          .style("opacity", d => connected.has(d.id) ? 1 : 0.1);
      }
    });
  });
}

// ═══════════════════════════════════════════════════════════════════════
// LEARNING PATH
// ═══════════════════════════════════════════════════════════════════════
let pathPanelOpen = false, currentStep = -1, autoPlayTimer = null;

function togglePathPanel() {
  pathPanelOpen = !pathPanelOpen;
  document.getElementById('path-panel').classList.toggle('open', pathPanelOpen);
  if (pathPanelOpen && !document.getElementById('path-steps').children.length) buildPathUI();
}

function buildPathUI() {
  if (!C.learningPath) return;
  const container = document.getElementById('path-steps');
  C.learningPath.forEach((step, idx) => {
    const el = document.createElement('div');
    el.className = 'path-step';
    el.innerHTML = `<div class="step-connector"></div><div class="step-badge">${idx+1}</div><div class="step-content"><div class="step-title">${step.title}</div><div class="step-desc">${step.desc}</div><div class="step-nodes" style="font-size:10px;color:#58a6ff;margin-top:3px">${step.week || ''}</div></div>`;
    el.onclick = () => activateStep(idx);
    container.appendChild(el);
  });
}

function activateStep(idx) {
  currentStep = idx;
  document.querySelectorAll('.path-step').forEach((el, i) => {
    el.classList.remove('active', 'completed');
    if (i < idx) el.classList.add('completed');
    else if (i === idx) el.classList.add('active');
  });
  // Highlight corresponding graph nodes
  if (window._graphRefs && C.learningPath[idx]) {
    highlightReset();
    const stepNodes = new Set(C.learningPath[idx].nodes);
    const { node, link, edgeLabel } = window._graphRefs;
    node.select("circle").transition().duration(300).attr("fill-opacity", n => stepNodes.has(n.id) ? 1 : 0.12);
    node.selectAll("text").transition().duration(300).style("opacity", n => stepNodes.has(n.id) ? 1 : 0.15);
    link.transition().duration(300).attr("stroke-opacity", 0.05);
    edgeLabel.transition().duration(300).style("opacity", 0.05);
  }
}

function resetPath() { currentStep = -1; document.querySelectorAll('.path-step').forEach(el => el.classList.remove('active', 'completed')); highlightReset(); }
function autoPlay() {
  if (autoPlayTimer) { clearInterval(autoPlayTimer); autoPlayTimer = null; document.getElementById('btn-autoplay').textContent = '▶ Auto-Play'; return; }
  document.getElementById('btn-autoplay').textContent = '⏸ Pause';
  let idx = currentStep < 0 ? 0 : currentStep;
  activateStep(idx);
  autoPlayTimer = setInterval(() => {
    idx++;
    if (idx >= (C.learningPath||[]).length) { clearInterval(autoPlayTimer); autoPlayTimer = null; document.getElementById('btn-autoplay').textContent = '▶ Auto-Play'; return; }
    activateStep(idx);
  }, 3000);
}

// ═══════════════════════════════════════════════════════════════════════
// COMMAND PANEL (Comments / Tags)
// ═══════════════════════════════════════════════════════════════════════
let cmdPanelNodeKey = null;

function openCmdPanel(name, tip) {
  cmdPanelNodeKey = nodeKey(name);
  document.getElementById('cp-name').textContent = name.replace(/\n/g, ' ');
  document.getElementById('cp-tip').textContent = tip || '';
  document.getElementById('cmd-panel').classList.add('open');
  renderTags(); renderComments();
}

function closeCmdPanel() { document.getElementById('cmd-panel').classList.remove('open'); cmdPanelNodeKey = null; }

function renderTags() {
  const store = loadStore(); const nd = store[cmdPanelNodeKey] || {}; const tags = nd.tags || [];
  const container = document.getElementById('cmd-tags'); container.innerHTML = '';
  const builtinTags = ['done','todo','confused','important'];
  tags.forEach(tag => {
    const cls = builtinTags.includes(tag) ? 'tag-'+tag : 'tag-custom';
    const el = document.createElement('span'); el.className = 'cmd-tag ' + cls;
    el.innerHTML = `${tagIcon(tag)} ${tag} <span style="cursor:pointer;margin-left:2px" onclick="removeTag('${tag}')">&times;</span>`;
    container.appendChild(el);
  });
}

function renderComments() {
  const store = loadStore(); const nd = store[cmdPanelNodeKey] || {}; const comments = nd.comments || [];
  const container = document.getElementById('cmd-comments');
  if (!comments.length) { container.innerHTML = '<div class="cmd-empty">No comments yet. Type below to add one.</div>'; return; }
  container.innerHTML = '';
  comments.forEach((c, idx) => {
    const el = document.createElement('div'); el.className = 'cmd-comment';
    el.innerHTML = `<div class="cc-text">${escHtml(c.text)}</div><div class="cc-time">${new Date(c.time).toLocaleString()}</div><button class="cc-del" onclick="deleteComment(${idx})">✕</button>`;
    container.appendChild(el);
  });
  container.scrollTop = container.scrollHeight;
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function tagIcon(tag) { return {done:'✅',todo:'📋',confused:'❓',important:'⭐'}[tag] || '🏷️'; }

function deleteComment(idx) {
  const store = loadStore(); const nd = store[cmdPanelNodeKey] || {};
  if (nd.comments) { nd.comments.splice(idx, 1); store[cmdPanelNodeKey] = nd; saveStore(store); }
  renderComments(); refreshAllBadges();
}

function removeTag(tag) {
  const store = loadStore(); const nd = store[cmdPanelNodeKey] || {};
  nd.tags = (nd.tags || []).filter(t => t !== tag); store[cmdPanelNodeKey] = nd; saveStore(store);
  renderTags(); refreshAllBadges();
}

document.getElementById('cmd-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); const val = e.target.value.trim(); if (!val) return; processInput(val); e.target.value = ''; }
});

function processInput(input) {
  if (!cmdPanelNodeKey) return;
  const store = loadStore();
  if (!store[cmdPanelNodeKey]) store[cmdPanelNodeKey] = { comments: [], tags: [] };
  const nd = store[cmdPanelNodeKey]; if (!nd.comments) nd.comments = []; if (!nd.tags) nd.tags = [];
  if (input.startsWith('/')) {
    const parts = input.slice(1).split(/\s+/); const cmd = parts[0].toLowerCase(); const arg = parts.slice(1).join(' ').trim();
    switch(cmd) {
      case 'done': case 'todo': case 'confused': case 'important': toggleTag(nd, cmd); break;
      case 'tag': if (arg) toggleTag(nd, arg); break;
      case 'color': if (arg) nd.color = arg; else delete nd.color; break;
      case 'clear': nd.comments = []; break;
      case 'reset': delete store[cmdPanelNodeKey]; saveStore(store); renderTags(); renderComments(); refreshAllBadges(); return;
      default: nd.comments.push({ text: input, time: Date.now() });
    }
    store[cmdPanelNodeKey] = nd; saveStore(store); renderTags(); renderComments(); refreshAllBadges(); return;
  }
  nd.comments.push({ text: input, time: Date.now() }); store[cmdPanelNodeKey] = nd; saveStore(store); renderComments(); refreshAllBadges();
}

function toggleTag(nd, tag) { const idx = nd.tags.indexOf(tag); if (idx >= 0) nd.tags.splice(idx, 1); else nd.tags.push(tag); }

document.addEventListener('keydown', e => { if (e.key === 'Escape' && cmdPanelNodeKey) closeCmdPanel(); });

function refreshAllBadges() { const store = loadStore(); refreshMindmapBadges(store); refreshGraphBadges(store); }

function refreshMindmapBadges(store) {
  if (!g) return;
  g.selectAll("g.node").each(function(d) {
    const key = nodeKey(d.data.name); const nd = store[key]; const el = d3.select(this);
    el.selectAll(".comment-badge,.comment-badge-bg,.has-comment-ring,.tag-icon-badge").remove();
    if (!nd) return;
    if (nd.color) el.select("circle").style("stroke", nd.color); else el.select("circle").style("stroke", null);
    if (nd.comments && nd.comments.length) {
      const r = d.depth===0?16:d.data._lab?11:12;
      el.insert("circle","circle").attr("class","has-comment-ring").attr("r",r);
      el.append("circle").attr("class","comment-badge-bg").attr("cx",-10).attr("cy",10).attr("r",7).attr("fill","#ffa657");
      el.append("text").attr("class","comment-badge").attr("x",-10).attr("y",10).attr("text-anchor","middle").attr("dominant-baseline","central").style("font-size","8px").style("font-weight","700").text(nd.comments.length);
    }
    if (nd.tags && nd.tags.length) {
      el.append("text").attr("class","tag-icon-badge").attr("x",10).attr("y",-12).style("font-size","10px").style("pointer-events","none").text(nd.tags.slice(0,3).map(t=>tagIcon(t)).join(''));
    }
  });
}

function refreshGraphBadges(store) {
  if (!window._graphRefs) return;
  window._graphRefs.node.each(function(d) {
    const key = nodeKey(d.label); const nd = store[key]; const el = d3.select(this);
    el.selectAll(".comment-badge,.comment-badge-bg,.has-comment-ring,.tag-icon-badge").remove();
    if (!nd) return;
    if (nd.color) el.select("circle").attr("fill",nd.color).attr("stroke",nd.color);
    if (nd.comments && nd.comments.length) {
      el.insert("circle",":first-child").attr("class","has-comment-ring").attr("r",18);
      el.append("circle").attr("class","comment-badge-bg").attr("cx",-14).attr("cy",14).attr("r",7).attr("fill","#ffa657");
      el.append("text").attr("class","comment-badge").attr("x",-14).attr("y",14).attr("text-anchor","middle").attr("dominant-baseline","central").style("font-size","8px").style("font-weight","700").text(nd.comments.length);
    }
    if (nd.tags && nd.tags.length) {
      el.append("text").attr("class","tag-icon-badge").attr("x",14).attr("y",-14).style("font-size","10px").style("pointer-events","none").text(nd.tags.slice(0,3).map(t=>tagIcon(t)).join(''));
    }
  });
}

let ucAutoPlayTimer = null;

if (C.useCases && C.useCases.length) {

function showUseCase(idx) {
  ucCurrentIndex = idx;
  ucCurrentStep = 0;
  if (ucAutoPlayTimer) { clearInterval(ucAutoPlayTimer); ucAutoPlayTimer = null; }
  const uc = C.useCases[idx];
  document.getElementById('uc-card-grid').style.display = 'none';
  document.getElementById('usecase-controls').style.display = 'flex';
  const container = document.getElementById('uc-detail-container');

  let html = '<div class="uc-flow">';
  html += '<button class="uc-back-btn" onclick="showUseCaseGrid()">← Back to All Use Cases</button>';
  html += `<h2>${uc.icon} ${uc.title}</h2>`;
  html += `<div class="uc-subtitle">${uc.desc}</div>`;
  html += '<div class="uc-flow-controls">';
  html += '<button onclick="ucPrev()">← Previous</button>';
  html += '<button class="primary" onclick="ucNext()">Next Step →</button>';
  html += '<button onclick="ucAutoPlay()" id="uc-autoplay-btn">▶ Auto-Play</button>';
  html += '<button onclick="ucReset()">↺ Reset</button>';
  html += '</div>';
  html += '<div class="uc-legend">';
  html += '<span><span class="dot" style="background:#58a6ff"></span> Current step</span>';
  html += '<span><span class="dot" style="background:#3fb950"></span> Completed</span>';
  html += '<span><span class="dot" style="background:#30363d"></span> Upcoming</span>';
  html += '</div>';
  html += '<div class="uc-step-container" id="uc-steps">';

  uc.steps.forEach((step, i) => {
    if (i > 0) html += `<div class="uc-connector" id="uc-conn-${i}"></div>`;
    html += `<div class="uc-step${i === 0 ? ' active' : ''}" id="uc-step-${i}" onclick="ucGoTo(${i})">`;
    html += `<div class="uc-badge">${i + 1}</div>`;
    html += '<div class="uc-body">';
    html += `<div class="uc-title">${step.title}</div>`;
    html += `<div class="uc-component">📍 ${step.component}</div>`;
    let detailHtml = `<p>${step.detail}</p><span class="uc-proto">${step.proto}</span>`;
    if (step.code) detailHtml += `<pre class="uc-code">${step.code}</pre>`;
    if (step.refs && step.refs.length) {
      detailHtml += '<div class="uc-refs">' + step.refs.map(r => `<a href="${r.url}" target="_blank" rel="noopener">${r.label}</a>`).join('') + '</div>';
    }
    html += `<div class="uc-detail">${detailHtml}</div>`;
    html += '</div></div>';
  });

  html += '</div></div>';
  container.innerHTML = html;
  container.style.display = '';
  document.getElementById('view-usecase').scrollTop = 0;
}

function ucGoTo(step) {
  const uc = C.useCases[ucCurrentIndex];
  if (step < 0 || step >= uc.steps.length) return;
  ucCurrentStep = step;
  uc.steps.forEach((_, i) => {
    const el = document.getElementById('uc-step-' + i);
    el.classList.remove('active', 'done');
    if (i < step) el.classList.add('done');
    else if (i === step) el.classList.add('active');
    if (i > 0) {
      const conn = document.getElementById('uc-conn-' + i);
      conn.classList.toggle('done', i <= step);
    }
  });
  const activeEl = document.getElementById('uc-step-' + step);
  if (activeEl) activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function ucNext() {
  const uc = C.useCases[ucCurrentIndex];
  if (ucCurrentStep < uc.steps.length - 1) ucGoTo(ucCurrentStep + 1);
}

function ucPrev() {
  if (ucCurrentStep > 0) ucGoTo(ucCurrentStep - 1);
}

function ucAutoPlay() {
  const btn = document.getElementById('uc-autoplay-btn');
  if (ucAutoPlayTimer) {
    clearInterval(ucAutoPlayTimer);
    ucAutoPlayTimer = null;
    btn.textContent = '▶ Auto-Play';
    return;
  }
  btn.textContent = '⏸ Pause';
  ucAutoPlayTimer = setInterval(() => {
    const uc = C.useCases[ucCurrentIndex];
    if (ucCurrentStep < uc.steps.length - 1) ucNext();
    else { clearInterval(ucAutoPlayTimer); ucAutoPlayTimer = null; btn.textContent = '▶ Auto-Play'; }
  }, 2500);
}

function ucReset() {
  if (ucAutoPlayTimer) { clearInterval(ucAutoPlayTimer); ucAutoPlayTimer = null; }
  const btn = document.getElementById('uc-autoplay-btn');
  if (btn) btn.textContent = '▶ Auto-Play';
  ucGoTo(0);
}

function showUseCaseGrid() {
  ucCurrentIndex = -1;
  if (ucAutoPlayTimer) { clearInterval(ucAutoPlayTimer); ucAutoPlayTimer = null; }
  document.getElementById('uc-detail-container').style.display = 'none';
  document.getElementById('uc-card-grid').style.display = '';
  document.getElementById('usecase-controls').style.display = 'none';
}

let trackerOpen = false;

function toggleTracker() {
  trackerOpen = !trackerOpen;
  document.getElementById('tracker-panel').classList.toggle('open', trackerOpen);
  if (trackerOpen) buildTracker();
}

function buildTracker() {
  const store = loadStore();
  const entries = Object.entries(store).filter(([k,v]) => (v.comments && v.comments.length) || (v.tags && v.tags.length));

  const totalNodes = entries.length;
  const totalComments = entries.reduce((a,[k,v]) => a + (v.comments||[]).length, 0);
  const totalTags = entries.reduce((a,[k,v]) => a + (v.tags||[]).length, 0);

  document.getElementById('tracker-stats').innerHTML =
    `<div class="tracker-stat"><div class="ts-num" style="color:#58a6ff">${totalNodes}</div><div class="ts-label">Nodes</div></div>`
    + `<div class="tracker-stat"><div class="ts-num" style="color:#ffa657">${totalComments}</div><div class="ts-label">Comments</div></div>`
    + `<div class="tracker-stat"><div class="ts-num" style="color:#7ee787">${totalTags}</div><div class="ts-label">Tags</div></div>`;

  const list = document.getElementById('tracker-list');
  if (!entries.length) { list.innerHTML = '<div id="tracker-empty">No comments or tags yet. Double-click any node to add some!</div>'; return; }
  list.innerHTML = '';
  entries.forEach(([key, val]) => {
    const el = document.createElement('div'); el.className = 'tracker-item';
    const icons = (val.tags || []).slice(0,3).map(t => tagIcon(t)).join('');
    el.innerHTML = `<div class="ti-icon">${icons || '💬'}</div><div><div class="ti-name">${key}</div><div class="ti-tags">${(val.tags||[]).join(', ')}</div><div class="ti-count">${(val.comments||[]).length} comment(s)</div></div>`;
    el.onclick = () => openCmdPanel(key, '');
    list.appendChild(el);
  });
}

// PDF VIEWER + SCRIBBLE
// ═══════════════════════════════════════════════════════════════════════
let _pdfCurrentPath = null;
let scribbleCanvas, scribbleCtx, scribbleActive = false, scribbleStrokes = [], currentStroke = null;

function openPdfViewer(path, label) {
  _pdfCurrentPath = path;
  document.getElementById('pdf-title').textContent = label || path;
  document.getElementById('pdf-iframe').src = path;
  document.getElementById('pdf-viewer').classList.add('open');
  tooltip.style.opacity = 0;
  initScribbleCanvas();
  loadScribble(path);
}

function closePdfViewer() {
  document.getElementById('pdf-viewer').classList.remove('open');
  document.getElementById('pdf-iframe').src = '';
  scribbleActive = false;
  const c = document.getElementById('scribble-canvas'); if (c) c.classList.remove('active');
}

function openPdfExternal() { if (_pdfCurrentPath) window.open(_pdfCurrentPath, '_blank'); }

function initScribbleCanvas() {
  scribbleCanvas = document.getElementById('scribble-canvas');
  const body = document.getElementById('pdf-body');
  scribbleCanvas.width = body.offsetWidth; scribbleCanvas.height = body.offsetHeight;
  scribbleCtx = scribbleCanvas.getContext('2d');
  scribbleCtx.lineCap = 'round'; scribbleCtx.lineJoin = 'round'; scribbleCtx.lineWidth = 3; scribbleCtx.strokeStyle = '#ff6b6b';
}

function toggleScribble() {
  scribbleActive = !scribbleActive;
  document.getElementById('scribble-canvas').classList.toggle('active', scribbleActive);
  document.getElementById('scribble-toggle').classList.toggle('active-tool', scribbleActive);
}

function setScribbleColor(el, color) {
  scribbleCtx.strokeStyle = color;
  document.querySelectorAll('.scribble-color').forEach(c => c.classList.remove('sel'));
  el.classList.add('sel');
}

// Scribble drawing
document.getElementById('scribble-canvas').addEventListener('pointerdown', e => {
  if (!scribbleActive) return;
  currentStroke = { color: scribbleCtx.strokeStyle, width: scribbleCtx.lineWidth, points: [{ x: e.offsetX, y: e.offsetY }] };
  scribbleCtx.beginPath(); scribbleCtx.moveTo(e.offsetX, e.offsetY);
});

document.getElementById('scribble-canvas').addEventListener('pointermove', e => {
  if (!currentStroke) return;
  currentStroke.points.push({ x: e.offsetX, y: e.offsetY });
  scribbleCtx.lineTo(e.offsetX, e.offsetY); scribbleCtx.stroke(); scribbleCtx.beginPath(); scribbleCtx.moveTo(e.offsetX, e.offsetY);
});

window.addEventListener('pointerup', () => {
  if (currentStroke) { scribbleStrokes.push(currentStroke); currentStroke = null; saveScribble(); }
});

function redrawScribble() {
  scribbleCtx.clearRect(0, 0, scribbleCanvas.width, scribbleCanvas.height);
  scribbleStrokes.forEach(stroke => {
    scribbleCtx.strokeStyle = stroke.color; scribbleCtx.lineWidth = stroke.width;
    scribbleCtx.beginPath(); scribbleCtx.moveTo(stroke.points[0].x, stroke.points[0].y);
    for (let i = 1; i < stroke.points.length; i++) scribbleCtx.lineTo(stroke.points[i].x, stroke.points[i].y);
    scribbleCtx.stroke();
  });
}

function undoScribble() { if (scribbleStrokes.length) { scribbleStrokes.pop(); redrawScribble(); saveScribble(); } }
function clearScribble() { scribbleStrokes = []; scribbleCtx.clearRect(0,0,scribbleCanvas.width,scribbleCanvas.height); saveScribble(); }

function saveScribble() {
  if (!_pdfCurrentPath) return;
  try { const all = JSON.parse(localStorage.getItem(STORAGE_KEY+'-scribbles')||'{}'); all[_pdfCurrentPath] = scribbleStrokes; localStorage.setItem(STORAGE_KEY+'-scribbles', JSON.stringify(all)); } catch(e) {}
}

function loadScribble(path) {
  scribbleStrokes = [];
  try { const all = JSON.parse(localStorage.getItem(STORAGE_KEY+'-scribbles')||'{}'); if (all[path]) scribbleStrokes = all[path]; } catch(e) {}
  if (scribbleCtx) redrawScribble();
}

window.addEventListener('resize', () => {
  if (!scribbleCanvas) return;
  const body = document.getElementById('pdf-body');
  scribbleCanvas.width = body.offsetWidth; scribbleCanvas.height = body.offsetHeight;
  redrawScribble();
});

function buildAppendix() {
  const container = document.getElementById('appendix-container');
  const videos = C.youtube.videos;
  const unitNames = C.youtube.unitNames || {};
  const unitColors = ["","#58a6ff","#f778ba","#7ee787","#ffa657","#d2a8ff","#7ee787","#ffa657","#ff7b72","#c9d1d9"];

  const progKey = 'progress_' + (C.storageKey || (C.course && C.course.code) || 'default');
  let watched = {};
  try { watched = JSON.parse(localStorage.getItem(progKey) || '{}'); } catch(e) {}

  const unitCounts = {};
  videos.forEach(v => { unitCounts[v.unit] = (unitCounts[v.unit]||0) + 1; });

  const total = videos.length;
  const done = videos.filter(v => watched[v.id]).length;
  const pct = total ? Math.round(done/total*100) : 0;

  let html = `<div class="appendix-stats">
    <strong style="color:#c9d1d9">${total} videos</strong>
    <span class="stat-pill" id="progress-stat" style="border-color:#7ee78740"><span style="color:#7ee787">✓ Watched</span>: <span id="progress-count">${done}</span>/${total} (<span id="progress-pct">${pct}</span>%)</span>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:${pct}%"></div></div>`;
  Object.keys(unitCounts).forEach(u => {
    const color = unitColors[u] || '#8b949e';
    html += `<span class="stat-pill" style="border-color:${color}40"><span style="color:${color}">${unitNames[u] || 'Unit '+u}</span>: ${unitCounts[u]}</span>`;
  });
  html += `<div class="progress-actions">
    <button onclick="markAllWatched(true)">✓ Mark all</button>
    <button onclick="markAllWatched(false)">↺ Reset</button>
  </div>`;
  html += '</div>';
  html += '<input type="text" class="appendix-filter" id="appendix-filter-input" placeholder="🔍 Filter videos by title..." oninput="filterAppendix()">';
  html += '<table class="appendix-table"><thead><tr><th style="width:36px">✓</th><th style="width:40px">#</th><th>Video Title</th><th style="width:160px">Unit</th><th style="width:80px">Watch</th></tr></thead><tbody id="appendix-tbody">';

  let num = 0, curUnit = 0;
  videos.forEach(v => {
    if (v.unit !== curUnit) {
      curUnit = v.unit;
      const color = unitColors[v.unit] || '#8b949e';
      html += `<tr class="unit-group" data-unit="${v.unit}" onclick="toggleUnit(this)"><td colspan="5" style="color:${color};border-bottom-color:${color}40"><span class="unit-toggle">▾</span> ${unitNames[v.unit]||'Unit '+v.unit} <span style="color:#8b949e;font-weight:400;font-size:12px">(${unitCounts[v.unit]} videos)</span></td></tr>`;
    }
    num++;
    const url = `https://www.youtube.com/watch?v=${v.id}`;
    const checked = watched[v.id] ? 'checked' : '';
    const rowClass = watched[v.id] ? 'vid-row watched' : 'vid-row';
    const safeTopic = (v.topic||'').replace(/"/g, '&quot;').toLowerCase();
    html += `<tr class="${rowClass}" data-unit="${v.unit}" data-vid="${v.id}" data-topic="${safeTopic}"><td><input type="checkbox" class="vid-check" ${checked} onchange="toggleWatched('${v.id}', this)"></td><td class="vid-num">${num}</td><td>${v.topic}</td><td style="color:${unitColors[v.unit]||'#8b949e'};font-size:12px">${unitNames[v.unit]||'Unit '+v.unit}</td><td><a class="watch-link" href="${url}" target="_blank">▶ Watch</a></td></tr>`;
  });

  html += '</tbody></table>';
  container.innerHTML = html;
}

function _getProgKey() {
  return 'progress_' + (C.storageKey || (C.course && C.course.code) || 'default');
}

function toggleWatched(vid, el) {
  const key = _getProgKey();
  let w = {};
  try { w = JSON.parse(localStorage.getItem(key) || '{}'); } catch(e) {}
  if (el.checked) w[vid] = 1; else delete w[vid];
  localStorage.setItem(key, JSON.stringify(w));
  const row = el.closest('tr');
  if (row) row.classList.toggle('watched', el.checked);
  _updateProgressStat();
}

function markAllWatched(mark) {
  const key = _getProgKey();
  const w = {};
  if (mark) C.youtube.videos.forEach(v => { w[v.id] = 1; });
  localStorage.setItem(key, JSON.stringify(w));
  document.querySelectorAll('#appendix-tbody tr.vid-row').forEach(row => {
    const cb = row.querySelector('.vid-check');
    if (cb) cb.checked = mark;
    row.classList.toggle('watched', mark);
  });
  _updateProgressStat();
}

function _updateProgressStat() {
  const key = _getProgKey();
  let w = {};
  try { w = JSON.parse(localStorage.getItem(key) || '{}'); } catch(e) {}
  const total = C.youtube.videos.length;
  const done = Object.keys(w).length;
  const pct = total ? Math.round(done/total*100) : 0;
  const dc = document.getElementById('progress-count');
  const pc = document.getElementById('progress-pct');
  const pf = document.getElementById('progress-fill');
  if (dc) dc.textContent = done;
  if (pc) pc.textContent = pct;
  if (pf) pf.style.width = pct + '%';
}

function filterAppendix() {
  const q = document.getElementById('appendix-filter-input').value.toLowerCase();
  const rows = document.querySelectorAll('#appendix-tbody tr');
  const visibleUnits = {};
  rows.forEach(row => {
    if (row.classList.contains('unit-group')) return;
    if (!q) { row.style.display = ''; visibleUnits[row.dataset.unit] = true; return; }
    const match = row.dataset.topic.indexOf(q) !== -1;
    row.style.display = match ? '' : 'none';
    if (match) visibleUnits[row.dataset.unit] = true;
  });
  rows.forEach(row => {
    if (!row.classList.contains('unit-group')) return;
    row.style.display = (!q || visibleUnits[row.dataset.unit]) ? '' : 'none';
  });
}

function toggleUnit(headerRow) {
  const unit = headerRow.dataset.unit;
  const collapsed = headerRow.classList.toggle('collapsed');
  document.querySelectorAll(`#appendix-tbody tr.vid-row[data-unit="${unit}"]`).forEach(r => { r.style.display = collapsed ? 'none' : ''; });
}

function renderProblems() {

             : (C.problems && C.problems.length) ? C.problems : null;
  if (!data) { container.innerHTML = '<div class="prob-intro">No practice problems defined yet for this course.</div>'; container.dataset.rendered = '1'; return; }
  container.dataset.rendered = '1';
  let html = `<div class="prob-intro">

    <br><br>

    <span class="prob-tag derive">derive</span> math / proof &nbsp;
    <span class="prob-tag debug">debug</span> find the failure mode &nbsp;
    <span class="prob-tag code">code</span> hands-on &nbsp;
    <span class="prob-tag paper">paper</span> predict before reading
  </div>`;
  data.forEach((sec, i) => {
    html += `<details class="prob-section"${i < 2 ? ' open' : ''}>
      <summary><span class="wk">${sec.week||''}</span> ${sec.title||''}</summary>

    (sec.items||[]).forEach(p => {
      html += `<li><span class="prob-tag ${p.tag||'design'}">${p.tag||'design'}</span>${p.text||''}`;
      if (p.hint) html += `<span class="prob-hint">${p.hint}</span>`;

<!-- BEGIN tooltip-pin (click pins, click outside closes) -->
<style>
  #tooltip.pinned {
    pointer-events: auto !important;
    box-shadow: 0 0 0 2px #58a6ff, 0 10px 28px rgba(0,0,0,0.55) !important;
    cursor: default;
  }
  #tooltip.pinned::after {
    content: "📌 pinned · click outside to close";
    display: block;
    margin-top: 8px;
    padding-top: 6px;
    border-top: 1px dashed #30363d;
    font-size: 10px;
    color: #58a6ff;
    opacity: 0.85;
  }
  #tooltip .tt-close {
    position: absolute; top: 4px; right: 6px;
    background: transparent; border: 0;
    color: #8b949e; cursor: pointer;
    font-size: 14px; line-height: 1;
    padding: 2px 6px; border-radius: 4px;
    display: none;
  }
  #tooltip.pinned .tt-close { display: block; }
  #tooltip .tt-close:hover { color: #f85149; background: rgba(248,81,73,0.1); }
</style>
<script>
(function(){
  const tt = document.getElementById('tooltip');
  if (!tt) return;
  let pinned = false;
  let lastTarget = null;

  // Inject close button
  if (!tt.querySelector('.tt-close')) {
    const btn = document.createElement('button');
    btn.className = 'tt-close';
    btn.type = 'button';
    btn.textContent = '✕';
    btn.title = 'Close';
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      unpin();
    });
    tt.appendChild(btn);
  }

  function pin() {
    pinned = true;
    tt.classList.add('pinned');
    tt.style.setProperty('opacity', '1', 'important');
  }
  function unpin() {
    pinned = false;
    tt.classList.remove('pinned');
    tt.style.removeProperty('opacity');
    tt.style.opacity = 0;
  }

  // Keep opacity at 1 while pinned (defends against any code that sets opacity:0)
  const obs = new MutationObserver(function() {
    if (pinned && tt.style.opacity !== '1') {
      tt.style.setProperty('opacity', '1', 'important');
    }
  });
  obs.observe(tt, { attributes: true, attributeFilter: ['style'] });

  // While pinned, freeze position: block mousemove repositioning at capture phase
  document.addEventListener('mousemove', function(e) {
    if (pinned) e.stopImmediatePropagation();
  }, true);

  // Selectors that identify clickable graph/mindmap elements with tooltip data
  const SEL = [
    'g.node', 'g.node *',
    'line.graph-link', 'line.graph-link-hit', 'path.graph-link',
    'text.graph-link-label',
    'path.link', 'path.link-hit',
    'circle.node', 'circle'
  ].join(', ');

  function getDatum(el) {
    if (!el || typeof d3 === 'undefined') return null;
    let cur = el;
    while (cur && cur !== document) {
      try {
        const d = d3.select(cur).datum();
        if (d) return { d: d, node: cur };
      } catch(_) {}
      cur = cur.parentNode;
    }
    return null;
  }

  function extract(d) {
    let name, tip, slides;
    if (d.data && (d.data.name || d.data.tooltip)) {
      name = d.data.name; tip = d.data.tooltip; slides = d.data.slides;
    } else if (d.source && d.target) {
      name = d.label || d.type || 'connection';
      const s = d.source, t = d.target;
      const sn = (s.data && s.data.name) || s.label || (typeof s === 'string' ? s : '');
      const tn = (t.data && t.data.name) || t.label || (typeof t === 'string' ? t : '');
      tip = String(sn).replace(/\n/g, ' ') + ' → ' + String(tn).replace(/\n/g, ' ');
    } else if (d.label !== undefined || d.tip !== undefined || d.name !== undefined) {
      name = d.label || d.name; tip = d.tip || d.tooltip; slides = d.slides;
    }
    return name ? { name: name, tip: tip, slides: slides } : null;
  }

  document.addEventListener('click', function(e) {
    // Click inside tooltip → ignore (preserve link clicks etc.)
    if (tt.contains(e.target)) return;

    const hit = getDatum(e.target.closest && e.target.closest(SEL));
    if (!hit) {
      if (pinned) unpin();
      return;
    }
    const info = extract(hit.d);
    if (!info) {
      if (pinned) unpin();
      return;
    }

    // Try the file's own renderer first so slides/icons/etc. render correctly
    let rendered = false;
    if (typeof window.showTooltip === 'function') {
      try { window.showTooltip(e, info.name, info.tip, info.slides); rendered = true; } catch(_) {}
    }
    if (!rendered && typeof window.showTip === 'function') {
      try { window.showTip(e, hit.d); rendered = true; } catch(_) {}
    }
    if (!rendered) {
      const ttl = tt.querySelector('.tt-title');
      const tbd = tt.querySelector('.tt-body');
      if (ttl) ttl.textContent = String(info.name).replace(/\n/g, ' ');
      if (tbd) tbd.textContent = info.tip || '';
    }

    lastTarget = hit.node;
    pin();
  });

  // Esc key unpins
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && pinned) unpin();
  });
})();
</script>
