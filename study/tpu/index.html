      sections: [
        { title: "The 30-second mental model", text: "TPU inference is one idea repeated at every layer: a <b>compiled graph</b> running on a <b>sharded mesh</b> behind a <b>continuous-batching server</b>. Python doesn't drive kernels at runtime — XLA produced a binary ahead of time, GSPMD baked the sharding into it, and the serving engine just feeds it batches of tokens.<div class=\"dd-flow\"><div class=\"dd-flow-step\">Model Code<br/><span style=\"color:#8b949e;font-size:10px\">JAX / Flax</span></div><div class=\"dd-flow-arrow\">→</div><div class=\"dd-flow-step\">XLA Compile<br/><span style=\"color:#8b949e;font-size:10px\">HLO → LLO</span></div><div class=\"dd-flow-arrow\">→</div><div class=\"dd-flow-step\">Sharded Plan<br/><span style=\"color:#8b949e;font-size:10px\">GSPMD</span></div><div class=\"dd-flow-arrow\">→</div><div class=\"dd-flow-step\">Serving Engine<br/><span style=\"color:#8b949e;font-size:10px\">JetStream / vLLM</span></div><div class=\"dd-flow-arrow\">→</div><div class=\"dd-flow-step\">TPU Mesh<br/><span style=\"color:#8b949e;font-size:10px\">ICI all-reduce</span></div></div><div class=\"dd-callout\"><span class=\"dd-callout-icon\">🧠</span><span>Mental rule of thumb: if you need to ask <i>“what kernel ran?”</i>, you're thinking about it like a GPU stack. On TPU there is no kernel — there is one big XLA program per shape.</span></div>" },
        { title: "Layer-by-layer responsibilities", text: "Each layer of the stack owns a narrow contract; failures usually map cleanly to one row of this table.<table class=\"dd-table\"><thead><tr><th>Layer</th><th>Examples</th><th>Owns</th><th>Failure mode</th></tr></thead><tbody><tr><td><b style=\"color:#ffa657\">Model &amp; framework</b></td><td>JAX/Flax, PyTorch-XLA, Keras 3</td><td>Math, weights, sharding annotations</td><td>Wrong dtype / shape</td></tr><tr><td><b style=\"color:#ffa657\">Compiler</b></td><td>XLA, StableHLO, MLIR</td><td>Op fusion, layout, collectives</td><td>Recompile thrash</td></tr><tr><td><b style=\"color:#ffa657\">Runtime</b></td><td>libtpu, Pathways, megacore</td><td>Multi-host orchestration, memory</td><td>OOM, ICI stalls</td></tr><tr><td><b style=\"color:#ffa657\">Serving engine</b></td><td>JetStream, vLLM-TPU, Saxml</td><td>Batching, KV cache, scheduler</td><td>Tail latency</td></tr><tr><td><b style=\"color:#ffa657\">Reference impls</b></td><td>MaxText, MaxDiffusion</td><td>Optimized model code</td><td>Stale model shapes</td></tr><tr><td><b style=\"color:#ffa657\">Deployment</b></td><td>GKE, TPU VMs, GCS</td><td>Autoscale, weight loading</td><td>Cold start</td></tr></tbody></table>" },
        { title: "Frameworks → Compiler: writing a sharded model", text: "In JAX you describe <i>where</i> tensors live with <code>Mesh</code>, <code>NamedSharding</code>, and <code>PartitionSpec</code>; the body of <code>@jax.jit</code> (or an explicit <code>shard_map</code>) is then traced into a single XLA HLO graph. GSPMD propagates the sharding through every op and inserts the required ICI collectives.<pre class=\"dd-code\"><span class=\"k\">import</span> jax, jax.numpy <span class=\"k\">as</span> jnp\n<span class=\"k\">from</span> jax.sharding <span class=\"k\">import</span> Mesh, NamedSharding, PartitionSpec <span class=\"k\">as</span> P\n\n<span class=\"c\"># 8 chips arranged as data=2, model=4</span>\ndevices = jax.devices()\nmesh    = Mesh(devices.reshape(2,4), axis_names=(<span class=\"s\">'data'</span>,<span class=\"s\">'model'</span>))\n\n<span class=\"n\">@jax.jit</span>\n<span class=\"k\">def</span> decode_step(params, kv_cache, token):\n    logits, kv_cache = model.apply(params, kv_cache, token)\n    <span class=\"k\">return</span> logits.argmax(-1), kv_cache\n\nparams   = jax.device_put(params,   NamedSharding(mesh, P(<span class=\"s\">None</span>, <span class=\"s\">'model'</span>)))\nkv_cache = jax.device_put(kv_cache, NamedSharding(mesh, P(<span class=\"s\">'data'</span>, <span class=\"s\">'model'</span>, <span class=\"s\">None</span>)))\n\n<span class=\"c\"># first call compiles HLO → StableHLO → LLO → TPU binary; later calls just dispatch</span>\nnext_tok, kv_cache = decode_step(params, kv_cache, token)</pre><svg class=\"dd-mini\" viewBox=\"0 0 420 170\" xmlns=\"http://www.w3.org/2000/svg\" style=\"background:#0d1117;border:1px solid #30363d;border-radius:6px\"><text x=\"210\" y=\"16\" text-anchor=\"middle\" fill=\"#c9d1d9\" font-size=\"11\" font-weight=\"700\">Mesh(axes=('data','model')) on 2×4 TPU</text><text x=\"40\" y=\"36\" fill=\"#58a6ff\" font-size=\"10\" font-weight=\"700\">data →</text><text x=\"4\" y=\"100\" fill=\"#ff7b72\" font-size=\"10\" font-weight=\"700\" transform=\"rotate(-90 14 100)\">model →</text><rect x=\"60\" y=\"50\" width=\"50\" height=\"34\" rx=\"4\" fill=\"#161b22\" stroke=\"#30363d\"/><text x=\"85\" y=\"70\" text-anchor=\"middle\" fill=\"#c9d1d9\" font-size=\"10\">d0,m0</text><rect x=\"120\" y=\"50\" width=\"50\" height=\"34\" rx=\"4\" fill=\"#161b22\" stroke=\"#30363d\"/><text x=\"145\" y=\"70\" text-anchor=\"middle\" fill=\"#c9d1d9\" font-size=\"10\">d1,m0</text><rect x=\"180\" y=\"50\" width=\"50\" height=\"34\" rx=\"4\" fill=\"#161b22\" stroke=\"#30363d\"/><text x=\"205\" y=\"70\" text-anchor=\"middle\" fill=\"#c9d1d9\" font-size=\"10\">d2,m0</text><rect x=\"240\" y=\"50\" width=\"50\" height=\"34\" rx=\"4\" fill=\"#161b22\" stroke=\"#30363d\"/><text x=\"265\" y=\"70\" text-anchor=\"middle\" fill=\"#c9d1d9\" font-size=\"10\">d3,m0</text><rect x=\"60\" y=\"92\" width=\"50\" height=\"34\" rx=\"4\" fill=\"#161b22\" stroke=\"#30363d\"/><text x=\"85\" y=\"112\" text-anchor=\"middle\" fill=\"#c9d1d9\" font-size=\"10\">d0,m1</text><rect x=\"120\" y=\"92\" width=\"50\" height=\"34\" rx=\"4\" fill=\"#161b22\" stroke=\"#30363d\"/><text x=\"145\" y=\"112\" text-anchor=\"middle\" fill=\"#c9d1d9\" font-size=\"10\">d1,m1</text><rect x=\"180\" y=\"92\" width=\"50\" height=\"34\" rx=\"4\" fill=\"#161b22\" stroke=\"#30363d\"/><text x=\"205\" y=\"112\" text-anchor=\"middle\" fill=\"#c9d1d9\" font-size=\"10\">d2,m1</text><rect x=\"240\" y=\"92\" width=\"50\" height=\"34\" rx=\"4\" fill=\"#161b22\" stroke=\"#30363d\"/><text x=\"265\" y=\"112\" text-anchor=\"middle\" fill=\"#c9d1d9\" font-size=\"10\">d3,m1</text><text x=\"330\" y=\"40\" fill=\"#ff7b72\" font-size=\"10\" font-weight=\"700\">params P(_, model)</text><rect x=\"320\" y=\"50\" width=\"80\" height=\"34\" rx=\"3\" fill=\"#0d1117\" stroke=\"#ff7b72\"/><rect x=\"320\" y=\"50\" width=\"80\" height=\"17\" fill=\"#ff7b7222\"/><text x=\"360\" y=\"63\" text-anchor=\"middle\" fill=\"#ff7b72\" font-size=\"9\">shard 0</text><text x=\"360\" y=\"80\" text-anchor=\"middle\" fill=\"#ff7b72\" font-size=\"9\">shard 1</text><text x=\"330\" y=\"112\" fill=\"#58a6ff\" font-size=\"10\" font-weight=\"700\">batch P(data, _)</text><rect x=\"320\" y=\"122\" width=\"80\" height=\"34\" rx=\"3\" fill=\"#0d1117\" stroke=\"#58a6ff\"/><rect x=\"320\" y=\"122\" width=\"20\" height=\"34\" fill=\"transparent\" stroke=\"#58a6ff\" stroke-width=\"0.5\"/><rect x=\"340\" y=\"122\" width=\"20\" height=\"34\" fill=\"#58a6ff22\" stroke=\"#58a6ff\" stroke-width=\"0.5\"/><rect x=\"360\" y=\"122\" width=\"20\" height=\"34\" fill=\"transparent\" stroke=\"#58a6ff\" stroke-width=\"0.5\"/><rect x=\"380\" y=\"122\" width=\"20\" height=\"34\" fill=\"#58a6ff22\" stroke=\"#58a6ff\" stroke-width=\"0.5\"/><text x=\"360\" y=\"144\" text-anchor=\"middle\" fill=\"#58a6ff\" font-size=\"9\">4 data shards</text></svg><div class=\"dd-links\"><a href=\"https://jax.readthedocs.io/en/latest/notebooks/Distributed_arrays_and_automatic_parallelization.html\" target=\"_blank\">JAX distributed arrays</a><a href=\"https://jax.readthedocs.io/en/latest/notebooks/shard_map.html\" target=\"_blank\">JAX shard_map tutorial</a></div>" },
        { title: "Compiler → Runtime: what XLA actually does", text: "XLA takes the traced graph and runs ~6 stages of lowering. Sharding annotations become explicit collectives; the scheduler interleaves compute and ICI traffic so the chip never stalls.<svg class=\"dd-mini\" viewBox=\"0 0 820 80\" xmlns=\"http://www.w3.org/2000/svg\" style=\"background:#0d1117;border:1px solid #30363d;border-radius:6px\"><rect x=\"10\" y=\"20\" width=\"115\" height=\"42\" rx=\"6\" fill=\"#161b22\" stroke=\"#58a6ff\" stroke-width=\"1.4\"/><text x=\"67\" y=\"37\" text-anchor=\"middle\" fill=\"#58a6ff\" font-size=\"11\" font-weight=\"700\">Python</text><text x=\"67\" y=\"50\" text-anchor=\"middle\" fill=\"#58a6ff\" font-size=\"11\" font-weight=\"700\">Trace</text><line x1=\"125\" y1=\"41\" x2=\"143\" y2=\"41\" stroke=\"#6e7681\" stroke-width=\"1.4\"/><polygon points=\"138,38 138,44 144,41\" fill=\"#6e7681\"/><rect x=\"145\" y=\"20\" width=\"115\" height=\"42\" rx=\"6\" fill=\"#161b22\" stroke=\"#ffa657\" stroke-width=\"1.4\"/><text x=\"202\" y=\"37\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"11\" font-weight=\"700\">HLO</text><line x1=\"260\" y1=\"41\" x2=\"278\" y2=\"41\" stroke=\"#6e7681\" stroke-width=\"1.4\"/><polygon points=\"273,38 273,44 279,41\" fill=\"#6e7681\"/><rect x=\"280\" y=\"20\" width=\"115\" height=\"42\" rx=\"6\" fill=\"#161b22\" stroke=\"#ffa657\" stroke-width=\"1.4\"/><text x=\"337\" y=\"37\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"11\" font-weight=\"700\">SPMD</text><text x=\"337\" y=\"50\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"11\" font-weight=\"700\">Partitioner</text><line x1=\"395\" y1=\"41\" x2=\"413\" y2=\"41\" stroke=\"#6e7681\" stroke-width=\"1.4\"/><polygon points=\"408,38 408,44 414,41\" fill=\"#6e7681\"/><rect x=\"415\" y=\"20\" width=\"115\" height=\"42\" rx=\"6\" fill=\"#161b22\" stroke=\"#ffa657\" stroke-width=\"1.4\"/><text x=\"472\" y=\"37\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"11\" font-weight=\"700\">Optimized</text><text x=\"472\" y=\"50\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"11\" font-weight=\"700\">HLO</text><line x1=\"530\" y1=\"41\" x2=\"548\" y2=\"41\" stroke=\"#6e7681\" stroke-width=\"1.4\"/><polygon points=\"543,38 543,44 549,41\" fill=\"#6e7681\"/><rect x=\"550\" y=\"20\" width=\"115\" height=\"42\" rx=\"6\" fill=\"#161b22\" stroke=\"#7ee787\" stroke-width=\"1.4\"/><text x=\"607\" y=\"37\" text-anchor=\"middle\" fill=\"#7ee787\" font-size=\"11\" font-weight=\"700\">LLO</text><line x1=\"665\" y1=\"41\" x2=\"683\" y2=\"41\" stroke=\"#6e7681\" stroke-width=\"1.4\"/><polygon points=\"678,38 678,44 684,41\" fill=\"#6e7681\"/><rect x=\"685\" y=\"20\" width=\"115\" height=\"42\" rx=\"6\" fill=\"#161b22\" stroke=\"#d2a8ff\" stroke-width=\"1.4\"/><text x=\"742\" y=\"37\" text-anchor=\"middle\" fill=\"#d2a8ff\" font-size=\"11\" font-weight=\"700\">TPU Binary</text></svg><ul style=\"margin:10px 0 10px 20px;font-size:12px;color:#c9d1d9;line-height:1.7\"><li><b style=\"color:#ffa657\">Op fusion</b> — collapse many small ops into one MXU-friendly kernel</li><li><b style=\"color:#ffa657\">Layout assignment</b> — pick tiling that matches the 128×128 systolic array</li><li><b style=\"color:#ffa657\">SPMD partitioning</b> — insert all-gather / reduce-scatter / all-reduce over ICI</li><li><b style=\"color:#ffa657\">Latency-hiding scheduler</b> — overlap collectives with matmuls</li><li><b style=\"color:#ffa657\">Memory space assignment</b> — place tensors in HBM, VMEM, or SMEM (rematerialize when needed)</li></ul><pre class=\"dd-code\"><span class=\"k\">from</span> jax.experimental.shard_map <span class=\"k\">import</span> shard_map\n<span class=\"k\">from</span> jax.sharding <span class=\"k\">import</span> PartitionSpec <span class=\"k\">as</span> P\n\n<span class=\"n\">@jax.jit</span>\n<span class=\"k\">def</span> all_reduce_mean(x):\n    <span class=\"k\">def</span> per_shard(x):\n        s = jax.lax.psum(x, axis_name=<span class=\"s\">'model'</span>)   <span class=\"c\"># manual ICI all-reduce</span>\n        <span class=\"k\">return</span> s / jax.lax.axis_size(<span class=\"s\">'model'</span>)\n    <span class=\"k\">return</span> shard_map(per_shard, mesh=mesh,\n                     in_specs=P(<span class=\"s\">'model'</span>,), out_specs=P(<span class=\"s\">'model'</span>,))(x)</pre><div class=\"dd-links\"><a href=\"https://openxla.org/xla\" target=\"_blank\">OpenXLA</a><a href=\"https://arxiv.org/abs/2203.12533\" target=\"_blank\">Pathways paper</a></div>" },
        { title: "Serving engine internals", text: "Two reference engines dominate TPU LLM serving today. Both use <b>continuous batching</b> (slot new prefills into the running decode batch instead of waiting), <b>paged attention</b> (KV stored as fixed-size blocks), and separate <b>prefill</b> (compute-bound, one big call) from <b>decode</b> (memory-bound, many tiny steps).<div class=\"dd-twocol\"><div><h4>JetStream</h4><ul style=\"margin:6px 0 0 18px;font-size:11.5px;color:#c9d1d9;line-height:1.65\"><li>gRPC <code>engine_api</code> — swap in MaxText, Pax, custom JAX</li><li>Prefill thread + decode thread, joined via a token queue</li><li>Paged KV cache, AOT-compiled by default</li><li>Tuned for TPU v5e / v5p / Trillium</li></ul><pre class=\"dd-code\"><span class=\"c\"># Launch JetStream + MaxText on a TPU v5e-8 VM</span>\npython -m MaxText.maxengine_server \\\n  MaxText/configs/base.yml \\\n  tokenizer_path=assets/tokenizer.llama2 \\\n  load_parameters_path=gs://my-bucket/llama2-7b/ckpt \\\n  max_prefill_predict_length=1024 \\\n  max_target_length=2048 \\\n  per_device_batch_size=4 \\\n  ici_tensor_parallelism=8</pre></div><div><h4>vLLM-TPU</h4><ul style=\"margin:6px 0 0 18px;font-size:11.5px;color:#c9d1d9;line-height:1.65\"><li>HuggingFace-compatible model loading</li><li>Automatic paged attention (same as GPU vLLM)</li><li>OpenAI-compatible HTTP server out of the box</li><li>JAX/XLA backend (also a PyTorch-XLA backend)</li></ul><pre class=\"dd-code\"><span class=\"c\"># vLLM-TPU: same API as GPU vLLM</span>\nvllm serve meta-llama/Llama-3.1-8B-Instruct \\\n  --tensor-parallel-size 8 --max-model-len 8192\n\n<span class=\"k\">from</span> vllm <span class=\"k\">import</span> LLM, SamplingParams\nllm = LLM(model=<span class=\"s\">'meta-llama/Llama-3.1-8B-Instruct'</span>,\n          tensor_parallel_size=8)\nout = llm.generate([<span class=\"s\">'Hello TPU'</span>], SamplingParams(max_tokens=64))</pre></div></div><svg class=\"dd-mini\" viewBox=\"0 0 720 180\" xmlns=\"http://www.w3.org/2000/svg\" style=\"background:#0d1117;border:1px solid #30363d;border-radius:6px\"><text x=\"360\" y=\"16\" text-anchor=\"middle\" fill=\"#c9d1d9\" font-size=\"11\" font-weight=\"700\">Continuous batching: 4 requests share decode steps</text><text x=\"70\" y=\"36\" text-anchor=\"middle\" fill=\"#6e7681\" font-size=\"9\">t0</text><text x=\"125\" y=\"36\" text-anchor=\"middle\" fill=\"#6e7681\" font-size=\"9\">t1</text><text x=\"180\" y=\"36\" text-anchor=\"middle\" fill=\"#6e7681\" font-size=\"9\">t2</text><text x=\"235\" y=\"36\" text-anchor=\"middle\" fill=\"#6e7681\" font-size=\"9\">t3</text><text x=\"290\" y=\"36\" text-anchor=\"middle\" fill=\"#6e7681\" font-size=\"9\">t4</text><text x=\"345\" y=\"36\" text-anchor=\"middle\" fill=\"#6e7681\" font-size=\"9\">t5</text><text x=\"400\" y=\"36\" text-anchor=\"middle\" fill=\"#6e7681\" font-size=\"9\">t6</text><text x=\"455\" y=\"36\" text-anchor=\"middle\" fill=\"#6e7681\" font-size=\"9\">t7</text><text x=\"510\" y=\"36\" text-anchor=\"middle\" fill=\"#6e7681\" font-size=\"9\">t8</text><text x=\"565\" y=\"36\" text-anchor=\"middle\" fill=\"#6e7681\" font-size=\"9\">t9</text><text x=\"620\" y=\"36\" text-anchor=\"middle\" fill=\"#6e7681\" font-size=\"9\">t10</text><text x=\"40\" y=\"65\" text-anchor=\"middle\" fill=\"#58a6ff\" font-size=\"11\" font-weight=\"700\">R1</text><rect x=\"60\" y=\"50\" width=\"108\" height=\"22\" rx=\"3\" fill=\"#58a6ff55\" stroke=\"#58a6ff\"/><text x=\"114\" y=\"65\" text-anchor=\"middle\" fill=\"#c9d1d9\" font-size=\"9\" font-weight=\"700\">prefill</text><rect x=\"170\" y=\"50\" width=\"493\" height=\"22\" rx=\"3\" fill=\"#58a6ff22\" stroke=\"#58a6ff\" stroke-dasharray=\"2,2\"/><text x=\"416.5\" y=\"65\" text-anchor=\"middle\" fill=\"#58a6ff\" font-size=\"9\">decode steps (shared batch)</text><text x=\"40\" y=\"95\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"11\" font-weight=\"700\">R2</text><rect x=\"115\" y=\"80\" width=\"108\" height=\"22\" rx=\"3\" fill=\"#ffa65755\" stroke=\"#ffa657\"/><text x=\"169\" y=\"95\" text-anchor=\"middle\" fill=\"#c9d1d9\" font-size=\"9\" font-weight=\"700\">prefill</text><rect x=\"225\" y=\"80\" width=\"328\" height=\"22\" rx=\"3\" fill=\"#ffa65722\" stroke=\"#ffa657\" stroke-dasharray=\"2,2\"/><text x=\"389\" y=\"95\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"9\">decode steps (shared batch)</text><text x=\"40\" y=\"125\" text-anchor=\"middle\" fill=\"#7ee787\" font-size=\"11\" font-weight=\"700\">R3</text><rect x=\"225\" y=\"110\" width=\"108\" height=\"22\" rx=\"3\" fill=\"#7ee78755\" stroke=\"#7ee787\"/><text x=\"279\" y=\"125\" text-anchor=\"middle\" fill=\"#c9d1d9\" font-size=\"9\" font-weight=\"700\">prefill</text><rect x=\"335\" y=\"110\" width=\"328\" height=\"22\" rx=\"3\" fill=\"#7ee78722\" stroke=\"#7ee787\" stroke-dasharray=\"2,2\"/><text x=\"499\" y=\"125\" text-anchor=\"middle\" fill=\"#7ee787\" font-size=\"9\">decode steps (shared batch)</text><text x=\"40\" y=\"155\" text-anchor=\"middle\" fill=\"#d2a8ff\" font-size=\"11\" font-weight=\"700\">R4</text><rect x=\"390\" y=\"140\" width=\"108\" height=\"22\" rx=\"3\" fill=\"#d2a8ff55\" stroke=\"#d2a8ff\"/><text x=\"444\" y=\"155\" text-anchor=\"middle\" fill=\"#c9d1d9\" font-size=\"9\" font-weight=\"700\">prefill</text><rect x=\"500\" y=\"140\" width=\"163\" height=\"22\" rx=\"3\" fill=\"#d2a8ff22\" stroke=\"#d2a8ff\" stroke-dasharray=\"2,2\"/><text x=\"581.5\" y=\"155\" text-anchor=\"middle\" fill=\"#d2a8ff\" font-size=\"9\">decode steps (shared batch)</text><text x=\"360\" y=\"172\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"10\">Solid = prefill (compute-bound) · dashed = decode (memory-bound, batched per step)</text></svg><div class=\"dd-links\"><a href=\"https://github.com/AI-Hypercomputer/JetStream\" target=\"_blank\">JetStream</a><a href=\"https://github.com/AI-Hypercomputer/maxtext\" target=\"_blank\">MaxText</a><a href=\"https://docs.vllm.ai/en/latest/getting_started/installation/google_tpu.html\" target=\"_blank\">vLLM TPU</a><a href=\"https://github.com/google/saxml\" target=\"_blank\">Saxml</a></div>" },
        { title: "Optimization toolbox", text: "Production TPU serving is a small, well-known cookbook. Pick from these six — most stacks combine 3–4.<div class=\"dd-grid\"><div class=\"dd-tile\"><h4>Paged attention</h4><div style=\"color:#8b949e;font-size:11px;margin:4px 0\">KV stored as fixed blocks; no per-request reallocation.</div><div class=\"dd-spec\"><span>Wins</span><b>~2-4× throughput</b></div></div><div class=\"dd-tile\"><h4>Continuous batching</h4><div style=\"color:#8b949e;font-size:11px;margin:4px 0\">Retire finished seqs every step, slot in new prefills.</div><div class=\"dd-spec\"><span>Wins</span><b>5-23× vs static</b></div></div><div class=\"dd-tile\"><h4>Prefill / decode split</h4><div style=\"color:#8b949e;font-size:11px;margin:4px 0\">Two pools: long compute-bound prefills vs short memory-bound decodes.</div><div class=\"dd-spec\"><span>Wins</span><b>lower TTFT + ↑ TPS</b></div></div><div class=\"dd-tile\"><h4>FP8 / INT8 quant</h4><div style=\"color:#8b949e;font-size:11px;margin:4px 0\">Native on Trillium / Ironwood; per-channel scales.</div><div class=\"dd-spec\"><span>Wins</span><b>1.5-2×, ½ HBM</b></div></div><div class=\"dd-tile\"><h4>Speculative decoding</h4><div style=\"color:#8b949e;font-size:11px;margin:4px 0\">Small draft proposes k tokens; big model verifies in 1 pass.</div><div class=\"dd-spec\"><span>Wins</span><b>2-3× tok/s</b></div></div><div class=\"dd-tile\"><h4>KV cache compression</h4><div style=\"color:#8b949e;font-size:11px;margin:4px 0\">INT8 / grouping / sliding-window for KV bytes.</div><div class=\"dd-spec\"><span>Wins</span><b>longer ctx, less HBM</b></div></div></div><div class=\"dd-callout\"><span class=\"dd-callout-icon\">💡</span><span><b>How to combine:</b> always-on → paged attention + continuous batching + INT8 weights. Add <b>prefill/decode split</b> when TTFT matters and you can afford two pools. Add <b>spec decoding</b> when decode dominates and you have a fast draft. <b>FP8</b> only on Trillium/Ironwood; on v5e stick to INT8.</span></div>" },
        { title: "A request's life: prefill → decode → stream", text: "One generation walks across three lanes: the client opens an HTTP/gRPC stream, the server tokenizes and runs <b>one big prefill</b> on the TPU (initializing the KV cache), then enters a tight loop of small <b>decode</b> calls. Each decode appends to the KV cache and streams a token back; an ICI all-reduce happens inside every decode step.<svg class=\"dd-mini\" viewBox=\"0 0 820 240\" xmlns=\"http://www.w3.org/2000/svg\" style=\"background:#0d1117;border:1px solid #30363d;border-radius:6px\"><text x=\"410\" y=\"16\" text-anchor=\"middle\" fill=\"#c9d1d9\" font-size=\"11\" font-weight=\"700\">Swimlane: one request, prefill → decode loop → stream</text><line x1=\"80\" y1=\"40\" x2=\"800\" y2=\"40\" stroke=\"#30363d\" stroke-dasharray=\"2,3\"/><text x=\"74\" y=\"44\" text-anchor=\"end\" fill=\"#58a6ff\" font-size=\"11\" font-weight=\"700\">Client</text><line x1=\"80\" y1=\"100\" x2=\"800\" y2=\"100\" stroke=\"#30363d\" stroke-dasharray=\"2,3\"/><text x=\"74\" y=\"104\" text-anchor=\"end\" fill=\"#ff7b72\" font-size=\"11\" font-weight=\"700\">Server</text><line x1=\"80\" y1=\"170\" x2=\"800\" y2=\"170\" stroke=\"#30363d\" stroke-dasharray=\"2,3\"/><text x=\"74\" y=\"174\" text-anchor=\"end\" fill=\"#d2a8ff\" font-size=\"11\" font-weight=\"700\">TPU</text><rect x=\"90\" y=\"30\" width=\"70\" height=\"20\" rx=\"3\" fill=\"#58a6ff22\" stroke=\"#58a6ff\"/><text x=\"125\" y=\"44\" text-anchor=\"middle\" fill=\"#58a6ff\" font-size=\"10\">HTTP POST</text><line x1=\"125\" y1=\"50\" x2=\"180\" y2=\"90\" stroke=\"#58a6ff\" stroke-width=\"1.2\"/><polygon points=\"177,84 184,89 178,93\" fill=\"#58a6ff\"/><rect x=\"180\" y=\"90\" width=\"70\" height=\"20\" rx=\"3\" fill=\"#ff7b7222\" stroke=\"#ff7b72\"/><text x=\"215\" y=\"104\" text-anchor=\"middle\" fill=\"#ff7b72\" font-size=\"10\">tokenize</text><line x1=\"215\" y1=\"110\" x2=\"275\" y2=\"160\" stroke=\"#ff7b72\" stroke-width=\"1.2\"/><polygon points=\"271,154 278,159 273,163\" fill=\"#ff7b72\"/><rect x=\"275\" y=\"160\" width=\"110\" height=\"20\" rx=\"3\" fill=\"#ffa65722\" stroke=\"#ffa657\"/><text x=\"330\" y=\"174\" text-anchor=\"middle\" fill=\"#ffa657\" font-size=\"10\">PREFILL (1 call)</text><line x1=\"380\" y1=\"170\" x2=\"380\" y2=\"195\" stroke=\"#d2a8ff\" stroke-dasharray=\"2,2\"/><text x=\"385\" y=\"194\" fill=\"#d2a8ff\" font-size=\"9\">KV cache initialized</text><rect x=\"410\" y=\"160\" width=\"50\" height=\"20\" rx=\"3\" fill=\"#ff7b7222\" stroke=\"#ff7b72\"/><text x=\"435\" y=\"174\" text-anchor=\"middle\" fill=\"#ff7b72\" font-size=\"9\">decode</text><rect x=\"470\" y=\"160\" width=\"50\" height=\"20\" rx=\"3\" fill=\"#ff7b7222\" stroke=\"#ff7b72\"/><text x=\"495\" y=\"174\" text-anchor=\"middle\" fill=\"#ff7b72\" font-size=\"9\">decode</text><rect x=\"530\" y=\"160\" width=\"50\" height=\"20\" rx=\"3\" fill=\"#ff7b7222\" stroke=\"#ff7b72\"/><text x=\"555\" y=\"174\" text-anchor=\"middle\" fill=\"#ff7b72\" font-size=\"9\">decode</text><rect x=\"590\" y=\"160\" width=\"50\" height=\"20\" rx=\"3\" fill=\"#ff7b7222\" stroke=\"#ff7b72\"/><text x=\"615\" y=\"174\" text-anchor=\"middle\" fill=\"#ff7b72\" font-size=\"9\">decode</text><line x1=\"435\" y1=\"180\" x2=\"435\" y2=\"205\" stroke=\"#d2a8ff\" stroke-dasharray=\"2,2\"/><line x1=\"495\" y1=\"180\" x2=\"495\" y2=\"205\" stroke=\"#d2a8ff\" stroke-dasharray=\"2,2\"/><line x1=\"555\" y1=\"180\" x2=\"555\" y2=\"205\" stroke=\"#d2a8ff\" stroke-dasharray=\"2,2\"/><line x1=\"615\" y1=\"180\" x2=\"615\" y2=\"205\" stroke=\"#d2a8ff\" stroke-dasharray=\"2,2\"/><text x=\"525\" y=\"218\" text-anchor=\"middle\" fill=\"#d2a8ff\" font-size=\"9\">KV append + ICI all-reduce per step</text><line x1=\"435\" y1=\"160\" x2=\"435\" y2=\"50\" stroke=\"#7ee787\" stroke-width=\"0.7\" stroke-dasharray=\"1,2\"/><line x1=\"495\" y1=\"160\" x2=\"495\" y2=\"50\" stroke=\"#7ee787\" stroke-width=\"0.7\" stroke-dasharray=\"1,2\"/><line x1=\"555\" y1=\"160\" x2=\"555\" y2=\"50\" stroke=\"#7ee787\" stroke-width=\"0.7\" stroke-dasharray=\"1,2\"/><line x1=\"615\" y1=\"160\" x2=\"615\" y2=\"50\" stroke=\"#7ee787\" stroke-width=\"0.7\" stroke-dasharray=\"1,2\"/><rect x=\"660\" y=\"30\" width=\"110\" height=\"20\" rx=\"3\" fill=\"#7ee78722\" stroke=\"#7ee787\"/><text x=\"715\" y=\"44\" text-anchor=\"middle\" fill=\"#7ee787\" font-size=\"10\">streamed tokens</text><rect x=\"690\" y=\"160\" width=\"60\" height=\"20\" rx=\"3\" fill=\"#21262d\" stroke=\"#8b949e\"/><text x=\"720\" y=\"174\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"10\">close</text></svg><table class=\"dd-table\"><thead><tr><th>Latency component</th><th>Typical (Llama-8B, v5e-8)</th><th>Notes</th></tr></thead><tbody><tr><td>Time to first token (TTFT)</td><td class=\"num\">200-800 ms</td><td>Tokenize + 1 prefill call (1-2k tokens)</td></tr><tr><td>Per-token decode</td><td class=\"num\">10-40 ms</td><td>One XLA dispatch + ICI all-reduce</td></tr><tr><td>Throughput @ batch 64</td><td class=\"num\">~2000 tok/s</td><td>Aggregate across the continuous batch</td></tr><tr><td>HBM read per decode</td><td class=\"num\">~weights + KV</td><td>Decode is HBM-bandwidth bound</td></tr></tbody></table>" },
        { title: "Deployment: VMs vs GKE", text: "Two real shapes. Pick TPU VMs for a single replica you SSH into; pick GKE for autoscaled fleets and multislice training/serving.<div class=\"dd-twocol\"><div><h4>Cloud TPU VMs</h4><ul style=\"margin:6px 0 0 18px;font-size:11.5px;color:#c9d1d9;line-height:1.65\"><li>Direct SSH; install JAX + JetStream/vLLM</li><li>Simplest path — zero k8s overhead</li><li>Manual scaling, no auto-recovery</li></ul><pre class=\"dd-code\">gcloud compute tpus tpu-vm create infer-1 \\\n  --zone=us-central2-b --accelerator-type=v5p-8 \\\n  --version=tpu-ubuntu2204-base</pre></div><div><h4>GKE TPU node pools</h4><ul style=\"margin:6px 0 0 18px;font-size:11.5px;color:#c9d1d9;line-height:1.65\"><li>Cluster autoscaler + HPA per replica</li><li>JobSets / LeaderWorkerSet for multi-host slices</li><li><code>google.com/tpu</code> resource scheduling</li></ul><pre class=\"dd-code\">apiVersion: v1\nkind: Pod\nmetadata: { name: jetstream }\nspec:\n  nodeSelector:\n    cloud.google.com/gke-tpu-accelerator: tpu-v5-lite-podslice\n    cloud.google.com/gke-tpu-topology: 2x4\n  containers:\n  - name: server\n    image: us-docker.pkg.dev/.../jetstream:latest\n    resources:\n      limits: { google.com/tpu: 8 }</pre></div></div><div class=\"dd-flow\"><div class=\"dd-flow-step\">GCS bucket<br/><span style=\"color:#8b949e;font-size:10px\">.safetensors / orbax</span></div><div class=\"dd-flow-arrow\">→</div><div class=\"dd-flow-step\">Orbax<br/>checkpoint</div><div class=\"dd-flow-arrow\">→</div><div class=\"dd-flow-step\">Host CPU<br/>pinned mem</div><div class=\"dd-flow-arrow\">→</div><div class=\"dd-flow-step\">HBM (sharded)<br/><span style=\"color:#8b949e;font-size:10px\">per-chip slice</span></div></div><div class=\"dd-links\"><a href=\"https://cloud.google.com/tpu/docs/jax-quickstart-tpu-vm\" target=\"_blank\">Cloud TPU JAX quickstart</a><a href=\"https://cloud.google.com/kubernetes-engine/docs/concepts/tpus\" target=\"_blank\">GKE TPUs</a><a href=\"https://cloud.google.com/tpu/docs/tutorials/LLM/jetstream-maxtext\" target=\"_blank\">JetStream/MaxText tutorial</a></div>" },
        { title: "Common pitfalls", text: "Six gotchas that bite every team eventually:<ul style=\"margin:10px 0 0 20px;font-size:12px;color:#c9d1d9;line-height:1.75\"><li><b style=\"color:#ff7b72\">Recompilation thrash</b> — every new input shape triggers a full XLA compile. Bucket prompt lengths, pad batches, use <code>padded_shapes</code>.</li><li><b style=\"color:#ff7b72\">Host↔device transfer bottleneck</b> — a slow Python tokenizer can cap throughput at 100 tok/s. Pre-warm the tokenizer, use a Rust BPE, keep token IDs on host.</li><li><b style=\"color:#ff7b72\">Wrong sharding axis</b> — setting <code>--tensor-parallel-size 8</code> when the model dim isn't divisible by 8 silently degrades to 1. Always check <code>jax.debug.visualize_array_sharding</code>.</li><li><b style=\"color:#ff7b72\">KV cache blow-up at long context</b> — KV grows linearly with seq len; at 32k tokens it dwarfs the weights. Quantize KV (INT8), tune page size, or shard the head axis.</li><li><b style=\"color:#ff7b72\">Cold-start weight load</b> — streaming a 70B checkpoint from GCS can take minutes. Keep a warm replica pool, use Orbax async restore.</li><li><b style=\"color:#ff7b72\">XLA OOM from un-rematerialized activations</b> — long prefills exceed HBM. Enable rematerialization (<code>jax.checkpoint</code>) on attention blocks.</li></ul>" }
      ],
      keypoints: [
        { title: "The stack is compiler-first", text: "Unlike GPU kernel-launch loops, the entire model is lowered to one XLA program (HLO → StableHLO → LLO) and dispatched as a single binary per shape." },
        { title: "Sharding is explicit, not implicit", text: "You declare a Mesh + PartitionSpec (or shard_map) in JAX and GSPMD inserts the ICI collectives — there is no autopartitioner guessing for you in production." },
        { title: "JetStream + MaxText is the reference path", text: "Google’s open-source JetStream engine plus MaxText models gives a turnkey, AOT-compiled, continuous-batching LLM server tuned for TPU v5e/v5p/Trillium/Ironwood." },
        { title: "vLLM-TPU brings the GPU API", text: "Same vllm serve / LLM(...) interface, JAX/XLA backend underneath — the easiest migration path for teams already on vLLM." },
        { title: "Paged attention + continuous batching", text: "Block-structured KV cache plus per-step batch reshuffling is what closes the gap to peak HBM bandwidth on long, variable-length workloads." },
        { title: "FP8 / INT8 quantization is the default", text: "Trillium and Ironwood are FP8-native; INT8 weight-only quant is table-stakes for cost-efficient serving on v5e." },
        { title: "Deploy on TPU VMs or GKE + GCS", text: "VMs for single-replica, GKE TPU node pools for autoscaled multi-replica fleets; weights live in GCS and stream in at startup." }
      ]
    },
    {
      id: "dd-ecosystem", num: "Concept 6 of 6", title: "TPU vs the Inference Ecosystem",
      desc: "How TPU stacks up against NVIDIA, AMD, AWS, and Intel for LLM inference.", color: "#79c0ff", icon: "\u2696\ufe0f",
      svg: function(w, h) {
        var vbW = 880, vbH = 320;
        var out = '<svg viewBox="0 0 ' + vbW + ' ' + vbH + '" xmlns="http://www.w3.org/2000/svg" style="background:#0d1117;width:100%;height:auto">';
        out += '<text x="' + vbW/2 + '" y="20" text-anchor="middle" fill="#c9d1d9" font-size="14" font-weight="700">Flagship inference chips \u2014 peak FP8/INT8 \u00b7 HBM capacity \u00b7 HBM bandwidth</text>';
        var plats = [
          { n:'TPU v5p',       c:'#79c0ff', tflops:918,  hbm:95,  bw:2.76 },
          { n:'Ironwood (v7)', c:'#58a6ff', tflops:4614, hbm:192, bw:7.4  },
          { n:'NVIDIA H100',   c:'#7ee787', tflops:1979, hbm:80,  bw:3.35 },
          { n:'NVIDIA B200',   c:'#3fb950', tflops:4500, hbm:192, bw:8.0  },
          { n:'AMD MI300X',    c:'#ff7b72', tflops:2614, hbm:192, bw:5.3  },
          { n:'AWS Trainium2', c:'#ffa657', tflops:1300, hbm:96,  bw:2.9  }
        ];
        var legendY = 36, lx = 30;
        for (var i = 0; i < plats.length; i++) {
          out += '<rect x="' + lx + '" y="' + (legendY-9) + '" width="11" height="11" rx="2" fill="' + plats[i].c + '"/>';
          out += '<text x="' + (lx+16) + '" y="' + legendY + '" fill="#c9d1d9" font-size="11">' + plats[i].n + '</text>';
          lx += 145;
        }
        var groups = [
          { label:'Peak FP8/INT8 (TFLOPS)', key:'tflops', max:5000, unit:'' },
          { label:'HBM capacity (GiB)',     key:'hbm',    max:300,  unit:'' },
          { label:'HBM bandwidth (TB/s)',   key:'bw',     max:10,   unit:'' }
        ];
        var gx = 230, gy = 70, gw = 600, gh = 70, gap = 10;
        for (var g = 0; g < groups.length; g++) {
          var grp = groups[g];
          var by = gy + g * (gh + gap);
          out += '<text x="220" y="' + (by-4) + '" text-anchor="end" fill="#c9d1d9" font-size="11" font-weight="700">' + grp.label + '</text>';
          out += '<line x1="' + gx + '" y1="' + (by+gh) + '" x2="' + (gx+gw) + '" y2="' + (by+gh) + '" stroke="#30363d" stroke-width="1"/>';
          for (var t = 1; t <= 4; t++) {
            var tx = gx + (gw * t/4);
            out += '<line x1="' + tx + '" y1="' + by + '" x2="' + tx + '" y2="' + (by+gh) + '" stroke="#21262d" stroke-width="0.6" stroke-dasharray="2,2"/>';
            out += '<text x="' + tx + '" y="' + (by+gh+11) + '" text-anchor="middle" fill="#6e7681" font-size="9">' + (grp.max*t/4) + '</text>';
          }
          var bh = (gh-8) / plats.length;
          for (var p = 0; p < plats.length; p++) {
            var v = plats[p][grp.key];
            var bw = (v / grp.max) * gw;
            var byy = by + 4 + p * bh;
            out += '<rect x="' + gx + '" y="' + byy + '" width="' + bw + '" height="' + (bh-1) + '" rx="2" fill="' + plats[p].c + '" opacity="0.85"/>';
            out += '<text x="' + (gx+bw+5) + '" y="' + (byy+bh-2) + '" fill="#c9d1d9" font-size="9">' + v + '</text>';
          }
        }
        out += '<text x="' + vbW/2 + '" y="' + (vbH-8) + '" text-anchor="middle" fill="#6e7681" font-size="10">Sources: vendor datasheets (2023-2025). Peak numbers are dense FP8/INT8 per chip; software-realized perf differs.</text>';
        out += '</svg>';
        return out;
      },
      sections: [
        { title: "The competitive landscape", text: "Google\u2019s TPU stack is unusual because Google designs the <b>chip</b>, the <b>optical interconnect (ICI)</b>, the <b>compiler (XLA)</b>, the <b>serving engine (JetStream/Saxml)</b>, and the <b>cloud (GCP)</b>. Every other major inference platform splits those layers across vendors \u2014 NVIDIA owns chip+CUDA but rents capacity through clouds; AMD owns chip+ROCm but relies on OEMs; AWS owns chip+Neuron but uses third-party serving; Intel\u2019s Gaudi sits inside cloud and on-prem servers built by partners.<div class=\"dd-flow\" style=\"flex-wrap:wrap;gap:8px\"><div class=\"dd-flow-step\" style=\"border-color:#79c0ff\"><b style=\"color:#79c0ff\">Google</b><br/><span style=\"color:#8b949e;font-size:10px\">TPU v5p / Ironwood</span></div><div class=\"dd-flow-step\" style=\"border-color:#7ee787\"><b style=\"color:#7ee787\">NVIDIA</b><br/><span style=\"color:#8b949e;font-size:10px\">H100 / H200 / B200 / GB200</span></div><div class=\"dd-flow-step\" style=\"border-color:#ff7b72\"><b style=\"color:#ff7b72\">AMD</b><br/><span style=\"color:#8b949e;font-size:10px\">MI300X / MI325X</span></div><div class=\"dd-flow-step\" style=\"border-color:#ffa657\"><b style=\"color:#ffa657\">AWS</b><br/><span style=\"color:#8b949e;font-size:10px\">Inferentia2 / Trainium2</span></div><div class=\"dd-flow-step\" style=\"border-color:#d2a8ff\"><b style=\"color:#d2a8ff\">Intel</b><br/><span style=\"color:#8b949e;font-size:10px\">Gaudi 3</span></div></div><div class=\"dd-callout\"><span class=\"dd-callout-icon\">\u2696\ufe0f</span><span><b>Vertical integration</b> lets Google co-design the compiler with the silicon (XLA knows MXU tile sizes, ICI topology, and HBM pages). The trade-off: <b>TPUs are GCP-only</b>; you can\u2019t buy a single chip or run on-prem.</span></div>" },
        { title: "Spec-sheet showdown", text: "Realistic per-chip specs from vendor datasheets. \u201CPod / scale-up\u201D is the largest coherent NVLink/ICI/Infinity-Fabric domain \u2014 not multi-rack scale-out.<table class=\"dd-table\"><thead><tr><th>Chip</th><th>Vendor</th><th>Process</th><th>Peak (FP8/INT8)</th><th>HBM</th><th>HBM BW</th><th>Interconnect</th><th>Pod / scale-up</th><th>Year</th></tr></thead><tbody><tr><td><b style=\"color:#79c0ff\">TPU v5p</b></td><td>Google</td><td>5 nm</td><td class=\"num\">918 TOPS INT8</td><td class=\"num\">95 GiB HBM3</td><td class=\"num\">2.76 TB/s</td><td>ICI 3D torus</td><td class=\"num\">8960 chips</td><td class=\"num\">2023</td></tr><tr><td><b style=\"color:#58a6ff\">Ironwood (TPU v7)</b></td><td>Google</td><td>~3 nm</td><td class=\"num\">4614 TF FP8</td><td class=\"num\">192 GiB HBM3e</td><td class=\"num\">7.4 TB/s</td><td>ICI 3D torus</td><td class=\"num\">9216 chips</td><td class=\"num\">2025</td></tr><tr><td><b style=\"color:#7ee787\">H100 SXM</b></td><td>NVIDIA</td><td>4 nm</td><td class=\"num\">1979 TF FP8</td><td class=\"num\">80 GiB HBM3</td><td class=\"num\">3.35 TB/s</td><td>NVLink 4 (900 GB/s)</td><td class=\"num\">256 (NVL)</td><td class=\"num\">2022</td></tr><tr><td><b style=\"color:#7ee787\">H200</b></td><td>NVIDIA</td><td>4 nm</td><td class=\"num\">1979 TF FP8</td><td class=\"num\">141 GiB HBM3e</td><td class=\"num\">4.8 TB/s</td><td>NVLink 4</td><td class=\"num\">256</td><td class=\"num\">2024</td></tr><tr><td><b style=\"color:#3fb950\">B200</b></td><td>NVIDIA</td><td>4NP</td><td class=\"num\">4500 TF FP8</td><td class=\"num\">192 GiB HBM3e</td><td class=\"num\">8 TB/s</td><td>NVLink 5 (1.8 TB/s)</td><td class=\"num\">576 (NVL72)</td><td class=\"num\">2024</td></tr><tr><td><b style=\"color:#3fb950\">GB200 NVL72</b></td><td>NVIDIA</td><td>4NP</td><td class=\"num\">5\u00d7 B200</td><td class=\"num\">13.5 TB pod</td><td class=\"num\">\u2014</td><td>NVLink 5 + IB</td><td class=\"num\">72 GPUs / rack</td><td class=\"num\">2024</td></tr><tr><td><b style=\"color:#ff7b72\">MI300X</b></td><td>AMD</td><td>5 nm</td><td class=\"num\">2614 TF FP8</td><td class=\"num\">192 GiB HBM3</td><td class=\"num\">5.3 TB/s</td><td>Infinity Fabric (896 GB/s)</td><td class=\"num\">8 GPU node</td><td class=\"num\">2023</td></tr><tr><td><b style=\"color:#ff7b72\">MI325X</b></td><td>AMD</td><td>5 nm</td><td class=\"num\">2614 TF FP8</td><td class=\"num\">256 GiB HBM3e</td><td class=\"num\">6 TB/s</td><td>Infinity Fabric</td><td class=\"num\">8 GPU</td><td class=\"num\">2024</td></tr><tr><td><b style=\"color:#ffa657\">Trainium2</b></td><td>AWS</td><td>\u2014</td><td class=\"num\">1300 TF FP8</td><td class=\"num\">96 GiB HBM</td><td class=\"num\">2.9 TB/s</td><td>NeuronLink</td><td class=\"num\">16 (Trn2 UltraServer 64)</td><td class=\"num\">2024</td></tr><tr><td><b style=\"color:#ffa657\">Inferentia2</b></td><td>AWS</td><td>\u2014</td><td class=\"num\">190 TF BF16</td><td class=\"num\">32 GiB HBM</td><td class=\"num\">\u2014</td><td>NeuronLink</td><td class=\"num\">12-chip server</td><td class=\"num\">2023</td></tr><tr><td><b style=\"color:#d2a8ff\">Gaudi 3</b></td><td>Intel</td><td>5 nm</td><td class=\"num\">1835 TF FP8</td><td class=\"num\">128 GiB HBM2e</td><td class=\"num\">3.7 TB/s</td><td>24\u00d7 200GbE RDMA</td><td class=\"num\">8 chip</td><td class=\"num\">2024</td></tr></tbody></table>" },
        { title: "Stack-by-stack mapping", text: "Each layer of TPU\u2019s stack has equivalents elsewhere \u2014 but the <b>ownership boundaries differ</b>. NVIDIA owns the compiler+kernels but not the cloud; AWS owns the cloud+chip but defers to OSS for serving; Google owns everything top to bottom.<table class=\"dd-table\"><thead><tr><th>Layer</th><th>Google TPU</th><th>NVIDIA</th><th>AMD</th><th>AWS</th><th>Intel</th></tr></thead><tbody><tr><td><b>Chip</b></td><td>TPU v5p / Ironwood</td><td>H100 / B200</td><td>MI300X</td><td>Trainium2 / Inferentia2</td><td>Gaudi 3</td></tr><tr><td><b>Scale-up fabric</b></td><td>ICI (optical)</td><td>NVLink + NVSwitch</td><td>Infinity Fabric</td><td>NeuronLink</td><td>RoCE (Ethernet)</td></tr><tr><td><b>Compiler</b></td><td>XLA</td><td>CUDA + cuDNN + TensorRT-LLM</td><td>ROCm + MIGraphX</td><td>Neuron SDK</td><td>SynapseAI / OneAPI</td></tr><tr><td><b>Kernel lib</b></td><td>Pallas, MaxText kernels</td><td>CUTLASS, FA3, TRT-LLM</td><td>hipBLASLt, FA-ROCm</td><td>Neuron Kernel Interface</td><td>hpu-graph</td></tr><tr><td><b>Serving engine</b></td><td>JetStream, Saxml</td><td>Triton + TRT-LLM, vLLM</td><td>vLLM (ROCm), SGLang</td><td>vLLM-Neuron</td><td>TGI, vLLM-HPU</td></tr><tr><td><b>Reference impl</b></td><td>MaxText, MaxDiffusion</td><td>NeMo, Megatron-LM</td><td>Composer, Llama-stack</td><td>NxD, neuronx-distributed</td><td>Optimum-Habana</td></tr><tr><td><b>Cloud-only?</b></td><td><b style=\"color:#ff7b72\">Yes (GCP)</b></td><td>No (any cloud + on-prem)</td><td>No</td><td><b style=\"color:#ff7b72\">Yes (AWS)</b></td><td>No</td></tr></tbody></table>" },
        { title: "Software ecosystem reality check", text: "NVIDIA wins on framework breadth and OSS community gravity; TPU wins on JAX integration and compiler maturity; AMD\u2019s ROCm has closed most of the gap on PyTorch but kernel coverage is still uneven; AWS Neuron is narrow but solid for supported models; Intel\u2019s Gaudi has decent PyTorch via Optimum-Habana.<div class=\"dd-grid\"><div class=\"dd-tile\"><h4>Google TPU</h4><div class=\"dd-spec\"><span>PyTorch</span><b>\u26a0\ufe0f via XLA</b></div><div class=\"dd-spec\"><span>JAX</span><b>\u2705 native</b></div><div class=\"dd-spec\"><span>Custom kernels</span><b>\u26a0\ufe0f Pallas only</b></div><div class=\"dd-spec\"><span>OSS vibrancy</span><b>\u26a0\ufe0f narrow</b></div></div><div class=\"dd-tile\"><h4>NVIDIA</h4><div class=\"dd-spec\"><span>PyTorch</span><b>\u2705 first-class</b></div><div class=\"dd-spec\"><span>JAX</span><b>\u2705 supported</b></div><div class=\"dd-spec\"><span>Custom kernels</span><b>\u2705 CUDA + Triton</b></div><div class=\"dd-spec\"><span>OSS vibrancy</span><b>\u2705 dominant</b></div></div><div class=\"dd-tile\"><h4>AMD</h4><div class=\"dd-spec\"><span>PyTorch</span><b>\u2705 ROCm</b></div><div class=\"dd-spec\"><span>JAX</span><b>\u26a0\ufe0f experimental</b></div><div class=\"dd-spec\"><span>Custom kernels</span><b>\u26a0\ufe0f HIP</b></div><div class=\"dd-spec\"><span>OSS vibrancy</span><b>\u26a0\ufe0f growing</b></div></div><div class=\"dd-tile\"><h4>AWS Neuron</h4><div class=\"dd-spec\"><span>PyTorch</span><b>\u2705 torch-neuronx</b></div><div class=\"dd-spec\"><span>JAX</span><b>\u26a0\ufe0f limited</b></div><div class=\"dd-spec\"><span>Custom kernels</span><b>\u274c NKI early</b></div><div class=\"dd-spec\"><span>OSS vibrancy</span><b>\u26a0\ufe0f AWS-only</b></div></div><div class=\"dd-tile\"><h4>Intel Gaudi</h4><div class=\"dd-spec\"><span>PyTorch</span><b>\u2705 Optimum-Habana</b></div><div class=\"dd-spec\"><span>JAX</span><b>\u274c no</b></div><div class=\"dd-spec\"><span>Custom kernels</span><b>\u26a0\ufe0f TPC-C</b></div><div class=\"dd-spec\"><span>OSS vibrancy</span><b>\u26a0\ufe0f modest</b></div></div></div><div class=\"dd-links\"><a href=\"https://pytorch.org/xla\" target=\"_blank\">PyTorch/XLA</a><a href=\"https://rocm.docs.amd.com/\" target=\"_blank\">AMD ROCm docs</a><a href=\"https://awsdocs-neuron.readthedocs-hosted.com/\" target=\"_blank\">AWS Neuron SDK</a><a href=\"https://docs.habana.ai/\" target=\"_blank\">Intel Gaudi docs</a></div>" },
        { title: "Performance-per-dollar landscape", text: "List-price perf/$ is murky: hyperscaler chips aren\u2019t sold standalone, so you compare <b>cloud on-demand instances</b> instead. Numbers below are approximate public on-demand pricing (2024) \u2014 reserved/committed contracts can be 30-60% cheaper.<table class=\"dd-table\"><thead><tr><th>Instance</th><th>Chip</th><th>On-demand $/hr</th><th>HBM total</th><th>HBM / $</th><th>Notes</th></tr></thead><tbody><tr><td>GCP <code>ct5lp-hightpu-8t</code></td><td>TPU v5e \u00d7 8</td><td class=\"num\">~$5\u20136</td><td class=\"num\">128 GiB</td><td class=\"num\">~23 GiB/$</td><td>Inference-tuned</td></tr><tr><td>GCP <code>ct5p-hightpu-8t</code></td><td>TPU v5p \u00d7 8</td><td class=\"num\">~$30\u201340</td><td class=\"num\">760 GiB</td><td class=\"num\">~22 GiB/$</td><td>Training-class</td></tr><tr><td>GCP <code>a3-highgpu-8g</code></td><td>H100 \u00d7 8</td><td class=\"num\">~$88</td><td class=\"num\">640 GiB</td><td class=\"num\">~7 GiB/$</td><td>NVLink within node</td></tr><tr><td>AWS <code>p5.48xlarge</code></td><td>H100 \u00d7 8</td><td class=\"num\">~$98</td><td class=\"num\">640 GiB</td><td class=\"num\">~6.5 GiB/$</td><td>EFA scale-out</td></tr><tr><td>AWS <code>trn2.48xlarge</code></td><td>Trainium2 \u00d7 16</td><td class=\"num\">~$30\u201340</td><td class=\"num\">~1.5 TiB</td><td class=\"num\">~40+ GiB/$</td><td>AWS-only stack</td></tr><tr><td>Azure <code>ND-MI300X-v5</code></td><td>MI300X \u00d7 8</td><td class=\"num\">~$48</td><td class=\"num\">1.5 TiB</td><td class=\"num\">~32 GiB/$</td><td>Best HBM/$ on a 192GB chip</td></tr></tbody></table><svg class=\"dd-mini\" viewBox=\"0 0 760 220\" xmlns=\"http://www.w3.org/2000/svg\" style=\"background:#0d1117;border:1px solid #30363d;border-radius:6px;margin-top:10px\"><text x=\"380\" y=\"18\" text-anchor=\"middle\" fill=\"#c9d1d9\" font-size=\"12\" font-weight=\"700\">Illustrative throughput per dollar \u2014 Llama-3-70B inference (representative)</text><text x=\"380\" y=\"33\" text-anchor=\"middle\" fill=\"#6e7681\" font-size=\"9\">Relative tokens/sec/$, normalized to H100 = 1.0. Public benchmarks vary widely; this is a mental model, not a leaderboard.</text>" +
            (function(){
              var bars=[{n:'TPU v5e',v:1.6,c:'#79c0ff'},{n:'TPU v5p',v:1.3,c:'#58a6ff'},{n:'H100 (TRT-LLM)',v:1.0,c:'#7ee787'},{n:'B200 (TRT-LLM)',v:1.7,c:'#3fb950'},{n:'MI300X (vLLM)',v:1.2,c:'#ff7b72'},{n:'Trainium2',v:1.8,c:'#ffa657'}];
              var s='', ox=170, oy=55, bw=410, bh=20, gp=6;
              for (var i=0;i<bars.length;i++){
                var b=bars[i], y=oy+i*(bh+gp), W=(b.v/2.0)*bw;
                s+='<text x="'+(ox-8)+'" y="'+(y+14)+'" text-anchor="end" fill="#c9d1d9" font-size="10">'+b.n+'</text>';
                s+='<rect x="'+ox+'" y="'+y+'" width="'+W+'" height="'+bh+'" rx="3" fill="'+b.c+'" opacity="0.85"/>';
                s+='<text x="'+(ox+W+6)+'" y="'+(y+14)+'" fill="#c9d1d9" font-size="10">'+b.v.toFixed(1)+'\u00d7</text>';
              }
              s+='<line x1="'+(ox+bw/2)+'" y1="'+oy+'" x2="'+(ox+bw/2)+'" y2="'+(oy+bars.length*(bh+gp))+'" stroke="#30363d" stroke-dasharray="2,2"/>';
              s+='<text x="'+(ox+bw/2)+'" y="'+(oy+bars.length*(bh+gp)+12)+'" text-anchor="middle" fill="#6e7681" font-size="9">1.0\u00d7 (H100 baseline)</text>';
              return s;
            })() + "</svg>" },
        { title: "Inference-engine portability matrix", text: "Which serving stacks run where. \u2705 production-ready, \u26a0\ufe0f partial / experimental, \u274c no support.<table class=\"dd-table\"><thead><tr><th>Engine</th><th>TPU</th><th>NVIDIA</th><th>AMD</th><th>AWS Neuron</th><th>Intel Gaudi</th></tr></thead><tbody><tr><td><b>vLLM</b></td><td>\u2705 vllm-tpu</td><td>\u2705 native</td><td>\u2705 ROCm fork</td><td>\u26a0\ufe0f vllm-neuron</td><td>\u26a0\ufe0f vllm-hpu</td></tr><tr><td><b>JetStream</b></td><td>\u2705 native</td><td>\u274c</td><td>\u274c</td><td>\u274c</td><td>\u274c</td></tr><tr><td><b>Triton + TRT-LLM</b></td><td>\u274c</td><td>\u2705 native</td><td>\u274c</td><td>\u274c</td><td>\u274c</td></tr><tr><td><b>SGLang</b></td><td>\u26a0\ufe0f early</td><td>\u2705</td><td>\u2705 ROCm</td><td>\u274c</td><td>\u274c</td></tr><tr><td><b>TGI</b></td><td>\u26a0\ufe0f optimum-tpu</td><td>\u2705</td><td>\u2705</td><td>\u26a0\ufe0f optimum-neuron</td><td>\u2705 optimum-habana</td></tr><tr><td><b>Saxml</b></td><td>\u2705 native</td><td>\u26a0\ufe0f limited</td><td>\u274c</td><td>\u274c</td><td>\u274c</td></tr></tbody></table><div class=\"dd-callout\"><span class=\"dd-callout-icon\">\ud83d\udd0c</span><span><b>vLLM is the cross-platform lingua franca</b> \u2014 it\u2019s the only engine with credible support across all five backends. If portability matters more than peak perf, write to vLLM.</span></div>" },
        { title: "Scale-up topology comparison", text: "<b>Scale-up</b> = chips inside a single coherent fabric (NVLink / ICI / IF) where collectives are cheap. <b>Scale-out</b> = racks connected by InfiniBand / Ethernet, where every all-reduce hurts. For LLMs, the larger the scale-up domain, the bigger the model that fits before you pay scale-out latency on every decode step.<svg class=\"dd-mini\" viewBox=\"0 0 880 200\" xmlns=\"http://www.w3.org/2000/svg\" style=\"background:#0d1117;border:1px solid #30363d;border-radius:6px\"><text x=\"440\" y=\"16\" text-anchor=\"middle\" fill=\"#c9d1d9\" font-size=\"12\" font-weight=\"700\">Largest scale-up (coherent) domains</text>" +
            (function(){
              var panels=[
                {x:20,t:'NVIDIA NVL72',c:'#3fb950',rows:8,cols:9,lbl:'72 GPUs \u00b7 NVLink 5 \u00b7 1.8 TB/s/GPU'},
                {x:230,t:'TPU v5p slice',c:'#79c0ff',rows:8,cols:8,lbl:'4096 chips (16\u00b716\u00b716 torus) \u00b7 ICI 3D'},
                {x:440,t:'AMD MI300X node',c:'#ff7b72',rows:2,cols:4,lbl:'8 GPUs \u00b7 IF 896 GB/s/GPU'},
                {x:650,t:'AWS Trn2 UltraServer',c:'#ffa657',rows:8,cols:8,lbl:'64 chips \u00b7 NeuronLink'}
              ];
              var s='';
              for (var p=0;p<panels.length;p++){
                var P=panels[p], baseX=P.x, baseY=42, sz=14, gp=2;
                s+='<text x="'+(baseX+P.cols*(sz+gp)/2)+'" y="38" text-anchor="middle" fill="'+P.c+'" font-size="11" font-weight="700">'+P.t+'</text>';
                for (var r=0;r<P.rows;r++) for (var c=0;c<P.cols;c++){
                  s+='<rect x="'+(baseX+c*(sz+gp))+'" y="'+(baseY+r*(sz+gp))+'" width="'+sz+'" height="'+sz+'" rx="1.5" fill="'+P.c+'" opacity="0.7"/>';
                }
                s+='<text x="'+(baseX+P.cols*(sz+gp)/2)+'" y="'+(baseY+P.rows*(sz+gp)+14)+'" text-anchor="middle" fill="#8b949e" font-size="9">'+P.lbl+'</text>';
              }
              return s;
            })() + "</svg><div class=\"dd-callout\"><span class=\"dd-callout-icon\">\ud83d\udcd0</span><span><b>Bigger scale-up domain = larger model fits without slow scale-out collectives.</b> A 70B model fits in a single MI300X node (1.5 TiB HBM) or one NVL72 rack; a 1T+ model needs a TPU pod or stitched NVL72 racks via InfiniBand.</span></div>" },
        { title: "When to pick which", text: "<table class=\"dd-table\"><thead><tr><th>Workload</th><th>Best fit</th><th>Why</th></tr></thead><tbody><tr><td>Frontier LLM training (>1T params)</td><td><b style=\"color:#79c0ff\">TPU v5p / Ironwood pod</b> or <b style=\"color:#3fb950\">NVIDIA GB200 NVL72</b></td><td>Massive scale-up + dense fabric for collectives</td></tr><tr><td>Latency-sensitive serving (chat)</td><td><b style=\"color:#7ee787\">NVIDIA H100/B200 + TRT-LLM</b> or <b style=\"color:#79c0ff\">TPU + JetStream</b></td><td>Mature kernels, low TTFT, paged attention</td></tr><tr><td>Cost-efficient batch inference</td><td><b style=\"color:#79c0ff\">TPU v5e</b>, <b style=\"color:#ffa657\">AWS Inferentia2</b>, <b style=\"color:#ff7b72\">AMD MI300X</b></td><td>Lower $/token; HBM-rich chips</td></tr><tr><td>JAX-first research</td><td><b style=\"color:#79c0ff\">TPU (any)</b></td><td>Native XLA stack; GSPMD baked in</td></tr><tr><td>On-prem deployment</td><td><b style=\"color:#7ee787\">NVIDIA</b>, <b style=\"color:#ff7b72\">AMD</b>, <b style=\"color:#d2a8ff\">Intel</b></td><td>TPU is GCP-only; no on-prem option</td></tr><tr><td>AWS-native pipeline</td><td><b style=\"color:#ffa657\">Trainium2 / Inferentia2</b></td><td>Tight S3/EFA/Bedrock integration</td></tr></tbody></table><div class=\"dd-links\"><a href=\"https://www.nvidia.com/en-us/data-center/h100/\" target=\"_blank\">NVIDIA H100 datasheet</a><a href=\"https://www.nvidia.com/en-us/data-center/dgx-b200/\" target=\"_blank\">NVIDIA B200 / DGX</a><a href=\"https://www.amd.com/en/products/accelerators/instinct/mi300/mi300x.html\" target=\"_blank\">AMD MI300X spec</a><a href=\"https://aws.amazon.com/ai/machine-learning/trainium/\" target=\"_blank\">AWS Trainium2</a><a href=\"https://www.intel.com/content/www/us/en/products/details/processors/ai-accelerators/gaudi.html\" target=\"_blank\">Intel Gaudi 3</a><a href=\"https://mlcommons.org/benchmarks/inference-datacenter/\" target=\"_blank\">MLPerf Inference</a><a href=\"https://cloud.google.com/tpu/pricing\" target=\"_blank\">GCP TPU pricing</a></div>" },
        { title: "Open questions / what to watch", text: "<ul style=\"margin:6px 0 0 20px;font-size:12px;color:#c9d1d9;line-height:1.8\"><li><b style=\"color:#79c0ff\">NVLink Fusion / open NVLink</b> \u2014 will third-party accelerators get into the NVLink domain, eroding NVIDIA\u2019s scale-up moat?</li><li><b style=\"color:#ff7b72\">AMD MI355X (CDNA 4)</b> \u2014 HBM3e + FP4 support; the first AMD chip likely to threaten B200 perf/$ at scale.</li><li><b style=\"color:#79c0ff\">TPU availability outside GCP</b> \u2014 rumored deals with third-party clouds; if real, it breaks the GCP-only constraint.</li><li><b style=\"color:#d2a8ff\">Microsoft Maia / Meta MTIA / OpenAI custom silicon</b> \u2014 every hyperscaler is building their own; will any reach external availability?</li><li><b style=\"color:#ffa657\">Trainium3</b> \u2014 AWS\u2019s next-gen, expected to close the FP8 perf gap with B200.</li><li><b style=\"color:#7ee787\">Rubin (NVIDIA next-gen)</b> \u2014 announced for 2026; HBM4 + new NVLink generation.</li></ul>" }
      ],
      keypoints: [
        { title: "TPU is vertically integrated, GCP-only", text: "Google designs chip + ICI + XLA + serving + cloud as one stack \u2014 unbeatable co-design, but you can\u2019t buy a TPU or run it on-prem." },
        { title: "NVIDIA owns ecosystem breadth", text: "CUDA, cuDNN, TensorRT-LLM, Triton, vLLM, NeMo, Megatron \u2014 every framework targets NVIDIA first. Community gravity is the real moat." },
        { title: "AMD MI300X = best HBM-per-chip in 2024", text: "192 GiB HBM3 (256 GiB on MI325X) lets a single 8-GPU node hold a 70B model entirely in coherent memory \u2014 a price/perf sweet spot for cost-sensitive inference." },
        { title: "AWS Trainium2 wins on $/token inside AWS", text: "If your data, pipeline, and Bedrock endpoints are AWS-native, Trainium2 UltraServer offers the best HBM/$ \u2014 but the Neuron stack is narrow." },
        { title: "Scale-up domain matters more than peak TFLOPS", text: "For 100B+ models, the size of the coherent NVLink/ICI/IF domain decides whether collectives stay fast. NVL72 (72 GPUs) and TPU pods (1000s) are the only true \u2018big-LLM\u2019 fabrics." },
        { title: "vLLM is the cross-platform serving lingua franca", text: "Only engine with credible support across TPU, NVIDIA, AMD, AWS Neuron, and Intel Gaudi. Write to vLLM if portability matters more than peak per-platform perf." },
        { title: "Compiler maturity differs sharply", text: "XLA (TPU) and TensorRT-LLM (NVIDIA) are mature; ROCm and Neuron are catching up; SynapseAI is workable but smaller. Compiler quality often beats raw chip specs in real deployments." }
      ]
    }
  ],
