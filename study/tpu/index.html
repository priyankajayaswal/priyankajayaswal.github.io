<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d1117">
<title>TPU — Architecture &amp; Applications</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #0d1117; color: #c9d1d9; overflow: hidden; }

  /* ── Toolbar ── */
  #toolbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    background: rgba(13,17,23,0.92); backdrop-filter: blur(8px);
    padding: 0 24px; display: flex; align-items: stretch; gap: 0;
    border-bottom: 1px solid #30363d; height: 50px;
  }
  #toolbar h1 { font-size: 18px; font-weight: 600; color: #58a6ff; white-space: nowrap; display: flex; align-items: center; margin-right: 24px; }
  .tab-group { display: flex; gap: 0; align-items: stretch; margin-right: 20px; }
  .tab {
    background: none; border: none; border-bottom: 2px solid transparent;
    color: #8b949e; padding: 0 16px; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all .2s; display: flex; align-items: center;
  }
  .tab:hover { color: #c9d1d9; }
  .tab.active { color: #58a6ff; border-bottom-color: #58a6ff; }
  .actions { display: flex; align-items: center; gap: 8px; }
  .btn { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .btn:hover { background: #30363d; border-color: #58a6ff; }
  .toolbar-sep { width: 1px; height: 24px; background: #30363d; align-self: center; margin: 0 6px; flex-shrink: 0; }
  .hint { font-size: 12px; color: #8b949e; margin-left: auto; display: flex; align-items: center; }
  #toolbar-menu { display: contents; }
  #hamburger {
    display: none; background: none; border: 1px solid #30363d; color: #c9d1d9;
    font-size: 20px; padding: 4px 10px; border-radius: 6px; cursor: pointer; line-height: 1;
  }
  #hamburger:hover { border-color: #58a6ff; color: #58a6ff; }

  /* ── Floating Controls ── */
  .canvas-controls {
    position: fixed; top: 62px; right: 16px; z-index: 8;
    display: flex; flex-direction: column; gap: 4px;
  }
  .canvas-controls .cbtn {
    background: rgba(22,27,34,0.85); backdrop-filter: blur(8px);
    border: 1px solid #30363d; color: #8b949e; padding: 6px 12px;
    border-radius: 8px; cursor: pointer; font-size: 11px; text-align: left;
    transition: all 0.2s; white-space: nowrap;
  }
  .canvas-controls .cbtn:hover { background: rgba(33,38,45,0.95); color: #c9d1d9; border-color: #58a6ff; }
  .mobile-only { display: none !important; }
  #legend, #legend-graph { position: relative; }

  /* ── Views ── */
  #canvas, #canvas-graph { width: 100vw; height: 100vh; }
  .view { display: none; }
  .view.active { display: block; }

  /* Mindmap */
  path.link { pointer-events: stroke; cursor: pointer; }
  path.link:hover { stroke-opacity: 0.7 !important; stroke-width: 3 !important; }

  /* ── Tooltip ── */
  #tooltip {
    position: fixed; pointer-events: none; opacity: 0;
    background: #161b22; border: 1px solid #30363d; border-radius: 8px;
    padding: 10px 14px; max-width: 380px; font-size: 13px; line-height: 1.5;
    box-shadow: 0 8px 24px rgba(0,0,0,.4); transition: opacity .15s; z-index: 20;
  }
  #tooltip.has-slides { pointer-events: auto; }
  #tooltip .tt-title { color: #58a6ff; font-weight: 600; margin-bottom: 4px; }
  #tooltip .tt-body  { color: #8b949e; }
  #tooltip .tt-slides { margin-top: 6px; padding-top: 5px; border-top: 1px solid #30363d; }
  #tooltip .tt-slides:empty { display: none; }
  #tooltip .tt-slides a {
    display: inline-block; margin: 2px 4px 2px 0; padding: 2px 8px; border-radius: 4px;
    background: rgba(88,166,255,0.1); color: #58a6ff; text-decoration: none;
    font-size: 11px; font-weight: 500; cursor: pointer; border: 1px solid rgba(88,166,255,0.2);
  }
  #tooltip .tt-slides a:hover { background: rgba(88,166,255,0.2); border-color: #58a6ff; }

  #source-link {
    position: fixed; bottom: 16px; right: 16px; z-index: 10;
    background: rgba(22,27,34,0.92); border: 1px solid #30363d; border-radius: 8px;
    padding: 8px 14px; font-size: 12px; font-weight: 600;
    color: #ff0000; text-decoration: none;
  }
  #source-link:hover { background: rgba(255,0,0,0.1); border-color: #ff0000; }

  /* ── Legend ── */
  #legend {
    position: fixed; bottom: 16px; left: 16px; z-index: 10;
    background: rgba(22,27,34,0.92); border: 1px solid #30363d; border-radius: 8px;
    padding: 12px 16px; font-size: 12px;
  }
  #legend div { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  #legend span.swatch { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  #legend .swatch-line { width: 20px; height: 3px; border-radius: 2px; display: inline-block; }
  .legend-item:hover { background: rgba(88,166,255,0.1); }
  .legend-item.active-filter { background: rgba(88,166,255,0.18); outline: 1px solid #58a6ff; }

  /* ── Graph ── */
  .graph-link { fill: none; stroke-opacity: 0.45; }
  .graph-link:hover { stroke-opacity: 0.9; }
  .graph-node-label { font-size: 11px; fill: #c9d1d9; pointer-events: none; paint-order: stroke; stroke: #0d1117; stroke-width: 3.5px; }
  .graph-link-label { font-size: 9.5px; fill: #8b949e; pointer-events: auto; cursor: pointer; paint-order: stroke; stroke: #0d1117; stroke-width: 3px; }
  .graph-link-label:hover { fill: #58a6ff; }
  .graph-link-hit { fill: none; stroke: transparent; stroke-width: 16; pointer-events: stroke; cursor: pointer; }

  /* ── Learning Path Panel ── */
  #path-panel {
    position: fixed; top: 56px; right: 0; bottom: 0; width: 340px; z-index: 10;
    background: rgba(13,17,23,0.95); border-left: 1px solid #30363d;
    overflow-y: auto; padding: 20px; display: none; backdrop-filter: blur(8px);
  }
  #path-panel.open { display: block; }
  #path-panel h2 { font-size: 15px; color: #58a6ff; margin-bottom: 4px; }
  #path-panel .subtitle { font-size: 12px; color: #8b949e; margin-bottom: 16px; }
  .path-step { display: flex; gap: 12px; padding: 10px; border-radius: 8px; cursor: pointer; transition: background .2s; margin-bottom: 2px; position: relative; }
  .path-step:hover { background: rgba(88,166,255,0.08); }
  .path-step.active { background: rgba(88,166,255,0.14); }
  .step-badge { flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%; border: 2px solid #30363d; background: #161b22; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #c9d1d9; }
  .path-step.active .step-badge { border-color: #58a6ff; background: #58a6ff; color: #0d1117; }
  .path-step.completed .step-badge { background: #238636; border-color: #238636; color: #fff; }
  .path-step.completed .step-connector { background: #238636; }
  .path-step.active .step-connector { background: #58a6ff; }
  .step-content { flex: 1; min-width: 0; }
  .step-title { font-size: 13px; font-weight: 600; color: #c9d1d9; }
  .step-desc  { font-size: 11px; color: #8b949e; margin-top: 2px; line-height: 1.4; }
  .step-connector { position: absolute; left: 33px; top: 38px; bottom: -4px; width: 2px; background: #30363d; }
  .path-step:last-child .step-connector { display: none; }
  .path-controls { display: flex; gap: 8px; margin-bottom: 14px; }
  .path-btn { flex: 1; padding: 7px 10px; border-radius: 6px; border: 1px solid #30363d; background: #21262d; color: #c9d1d9; font-size: 12px; cursor: pointer; text-align: center; }
  .path-btn:hover { background: #30363d; border-color: #58a6ff; }

  /* ── Command Panel (Comments/Tags) ── */
  #cmd-panel {
    position: fixed; top: 56px; right: 0; bottom: 0; width: 380px; z-index: 15;
    background: rgba(13,17,23,0.97); border-left: 1px solid #30363d;
    display: none; flex-direction: column; backdrop-filter: blur(10px);
  }
  #cmd-panel.open { display: flex; }
  #cmd-panel-header { padding: 16px 18px 12px; border-bottom: 1px solid #30363d; display: flex; align-items: flex-start; gap: 12px; }
  #cmd-panel-header .cp-title { flex: 1; }
  #cmd-panel-header .cp-name { font-size: 15px; font-weight: 600; color: #c9d1d9; }
  #cmd-panel-header .cp-tip  { font-size: 11px; color: #8b949e; margin-top: 3px; line-height: 1.4; }
  #cmd-panel-close { background: none; border: none; color: #8b949e; font-size: 20px; cursor: pointer; padding: 0 4px; line-height: 1; }
  #cmd-panel-close:hover { color: #c9d1d9; }
  #cmd-tags { padding: 8px 18px; display: flex; flex-wrap: wrap; gap: 6px; min-height: 20px; }
  .cmd-tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 500; }
  .cmd-tag.tag-done     { background: #23863633; color: #7ee787; border: 1px solid #23863666; }
  .cmd-tag.tag-todo     { background: #1f6feb33; color: #79c0ff; border: 1px solid #1f6feb66; }
  .cmd-tag.tag-confused  { background: #da363333; color: #ff7b72; border: 1px solid #da363366; }
  .cmd-tag.tag-important { background: #9e6a0333; color: #ffa657; border: 1px solid #9e6a0366; }
  .cmd-tag.tag-custom    { background: #30363d; color: #c9d1d9; border: 1px solid #484f58; }
  #cmd-comments { flex: 1; overflow-y: auto; padding: 10px 18px; }
  .cmd-comment { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; position: relative; }
  .cmd-comment .cc-text { font-size: 13px; color: #c9d1d9; line-height: 1.5; white-space: pre-wrap; }
  .cmd-comment .cc-time { font-size: 10px; color: #484f58; margin-top: 4px; }
  .cmd-comment .cc-del { position: absolute; top: 6px; right: 8px; background: none; border: none; color: #484f58; cursor: pointer; font-size: 14px; }
  .cmd-comment .cc-del:hover { color: #ff7b72; }
  .cmd-empty { color: #484f58; font-size: 12px; font-style: italic; text-align: center; padding: 20px; }
  #cmd-input-area { padding: 12px 18px; border-top: 1px solid #30363d; }
  #cmd-input { width: 100%; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #c9d1d9; padding: 10px 12px; font-size: 13px; font-family: inherit; resize: none; outline: none; min-height: 60px; }
  #cmd-input:focus { border-color: #58a6ff; }
  #cmd-input-hint { font-size: 10px; color: #484f58; margin-top: 6px; line-height: 1.5; }
  #cmd-input-hint code { background: #161b22; padding: 1px 4px; border-radius: 3px; color: #8b949e; }
  .comment-badge { font-size: 9px; fill: #0d1117; pointer-events: none; }
  .has-comment-ring { fill: none; stroke: #ffa657; stroke-width: 2; stroke-dasharray: 3 2; }

  /* ── Deep Dives ── */
  #view-deepdive { overflow-y: auto; margin-top: 50px; height: calc(100vh - 50px); }
  #view-usecase { overflow-y: auto; margin-top: 50px; height: calc(100vh - 50px); }
  .dd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; padding: 24px 32px; max-width: 1400px; margin: 0 auto; }
  .dd-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; cursor: pointer; overflow: hidden; transition: all .25s; }
  .dd-card:hover { border-color: #58a6ff; transform: translateY(-3px); box-shadow: 0 8px 30px rgba(0,0,0,.4); }
  .dd-card-img { width: 100%; height: 200px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .dd-card-img svg { width: 100%; height: 100%; display: block; }
  .dd-card-body { padding: 16px; }
  .dd-card-num { font-size: 11px; color: #58a6ff; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
  .dd-card-title { font-size: 17px; font-weight: 700; color: #c9d1d9; margin: 4px 0 6px; }
  .dd-card-desc { font-size: 12px; color: #8b949e; line-height: 1.5; }
  .dd-full { display: none; padding: 20px 0 40px; overflow-y: auto; }
  .dd-full.active { display: block; }
  .dd-infographic { max-width: 900px; margin: 0 auto; padding: 32px; background: #161b22; border: 1px solid #30363d; border-radius: 16px; }
  .dd-infographic h2 { font-size: 24px; color: #58a6ff; margin-bottom: 4px; }
  .dd-infographic .dd-subtitle { font-size: 13px; color: #8b949e; margin-bottom: 24px; }
  .dd-section { margin-top: 24px; }
  .dd-section h3 { font-size: 15px; color: #ffa657; margin-bottom: 8px; }
  .dd-section p { font-size: 13px; color: #c9d1d9; line-height: 1.7; }
  .dd-section .dd-formula { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 12px 16px; font-family: 'Courier New', monospace; font-size: 14px; color: #7ee787; margin: 10px 0; text-align: center; }
  .dd-keypoints { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .dd-kp { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 12px; font-size: 12px; }
  .dd-kp strong { color: #58a6ff; display: block; margin-bottom: 4px; }
  .dd-kp span { color: #8b949e; }
  .dd-nav { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
  .dd-nav button { padding: 8px 20px; }

  .dd-section table.dd-table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; overflow: hidden; }
  .dd-section table.dd-table th, .dd-section table.dd-table td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #21262d; color: #c9d1d9; }
  .dd-section table.dd-table th { background: #161b22; color: #58a6ff; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; position: sticky; top: 0; }
  .dd-section table.dd-table tr:last-child td { border-bottom: none; }
  .dd-section table.dd-table tr:hover td { background: #161b22; }
  .dd-section table.dd-table td.num { font-family: 'Courier New', monospace; color: #7ee787; text-align: right; }
  .dd-section .dd-mini { display: block; margin: 12px auto; max-width: 100%; }
  .dd-section .dd-callout { display: flex; gap: 12px; padding: 12px 14px; margin: 12px 0; background: #0d1117; border-left: 3px solid #d2a8ff; border-radius: 6px; font-size: 12px; color: #c9d1d9; }
  .dd-section .dd-callout .dd-callout-icon { font-size: 20px; flex-shrink: 0; }
  .dd-section .dd-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin: 12px 0; }
  .dd-section .dd-tile { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 12px; font-size: 12px; }
  .dd-section .dd-tile h4 { color: #d2a8ff; font-size: 13px; margin-bottom: 6px; }
  .dd-section .dd-tile .dd-spec { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid #21262d; color: #8b949e; }
  .dd-section .dd-tile .dd-spec:last-child { border-bottom: none; }
  .dd-section .dd-tile .dd-spec b { color: #7ee787; font-family: 'Courier New', monospace; }
  .dd-section .dd-flow { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 12px 0; justify-content: center; }
  .dd-section .dd-flow-step { background: #0d1117; border: 1px solid #d2a8ff; border-radius: 8px; padding: 8px 12px; font-size: 11px; color: #d2a8ff; text-align: center; min-width: 80px; }
  .dd-section .dd-flow-arrow { color: #6e7681; font-size: 18px; }
  .dd-section pre.dd-code { background: #0d1117; border: 1px solid #30363d; border-left: 3px solid #7ee787; border-radius: 6px; padding: 12px 14px; margin: 10px 0; font-family: 'Courier New', monospace; font-size: 12px; color: #c9d1d9; line-height: 1.55; overflow-x: auto; white-space: pre; }
  .dd-section pre.dd-code .c { color: #6e7681; font-style: italic; }
  .dd-section pre.dd-code .k { color: #ff7b72; }
  .dd-section pre.dd-code .s { color: #a5d6ff; }
  .dd-section pre.dd-code .n { color: #d2a8ff; }
  .dd-section .dd-links { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .dd-section .dd-links a { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 6px 10px; font-size: 11px; color: #58a6ff; text-decoration: none; }
  .dd-section .dd-links a:hover { border-color: #58a6ff; background: #161b22; }
  .dd-section .dd-twocol { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 12px 0; }
  .dd-section .dd-twocol > div { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 12px; }
  .dd-section .dd-twocol h4 { color: #ff7b72; font-size: 13px; margin-bottom: 6px; }
  .dd-section .dd-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; background: #ff7b7222; border: 1px solid #ff7b72; color: #ff7b72; font-size: 10px; font-weight: 600; margin: 0 4px 4px 0; }
  @media (max-width: 700px) { .dd-section .dd-twocol { grid-template-columns: 1fr; } }

  /* ── Use Cases ── */
  .uc-flow { max-width: 960px; margin: 0 auto; padding: 32px; }
  .uc-flow h2 { font-size: 22px; color: #58a6ff; margin-bottom: 4px; }
  .uc-flow .uc-subtitle { font-size: 13px; color: #8b949e; margin-bottom: 20px; }
  .uc-step {
    display: flex; gap: 14px; padding: 16px; border-radius: 10px; border: 1px solid #30363d;
    background: #161b22; cursor: pointer; transition: all .3s; opacity: 0.3;
  }
  .uc-step.active { opacity: 1; border-color: #58a6ff; box-shadow: 0 0 20px rgba(88,166,255,0.15); }
  .uc-step.done { opacity: 0.8; border-color: #3fb950; }
  .uc-step .uc-badge {
    width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; background: #30363d; color: #8b949e; flex-shrink: 0;
  }
  .uc-step.active .uc-badge { background: #58a6ff; color: #fff; }
  .uc-step.done .uc-badge { background: #3fb950; color: #fff; }
  .uc-step .uc-body { flex: 1; min-width: 0; overflow: hidden; }
  .uc-step .uc-title { font-weight: 600; color: #c9d1d9; font-size: 14px; }
  .uc-step .uc-component { font-size: 11px; color: #8b949e; margin-top: 2px; }
  .uc-step .uc-detail { display: none; margin-top: 10px; font-size: 12px; color: #c9d1d9; line-height: 1.6; }
  .uc-step.active .uc-detail { display: block; }
  .uc-step .uc-proto { display: inline-block; background: #0d1117; border: 1px solid #30363d; border-radius: 4px; padding: 2px 8px; font-size: 10px; color: #79c0ff; margin-top: 8px; }
  .uc-connector { width: 2px; height: 24px; background: #30363d; margin-left: 31px; transition: background .3s; }
  .uc-connector.done { background: #3fb950; }
  .uc-flow-controls {
    display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
  }
  .uc-flow-controls button {
    padding: 8px 18px; border-radius: 8px; border: 1px solid #30363d; background: #161b22;
    color: #c9d1d9; cursor: pointer; font-size: 13px; transition: all .2s;
  }
  .uc-flow-controls button:hover { border-color: #58a6ff; color: #58a6ff; }
  .uc-flow-controls button.primary { background: #1f6feb; border-color: #58a6ff; color: #fff; }
  .uc-legend {
    display: flex; gap: 16px; flex-wrap: wrap; margin-top: 16px; padding: 12px 16px;
    background: #0d1117; border: 1px solid #30363d; border-radius: 8px; font-size: 11px;
  }
  .uc-legend span { display: flex; align-items: center; gap: 6px; color: #8b949e; }
  .uc-legend .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .uc-back-btn {
    background: none; border: 1px solid #30363d; color: #58a6ff; padding: 8px 16px;
    border-radius: 8px; cursor: pointer; font-size: 13px; margin-bottom: 16px; transition: all 0.2s;
  }
  .uc-back-btn:hover { background: #161b22; border-color: #58a6ff; }
  .uc-code {
    margin-top: 10px; padding: 10px 14px; background: #0d1117; border: 1px solid #30363d;
    border-radius: 6px; font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    font-size: 11px; color: #7ee787; line-height: 1.5; overflow-x: auto; white-space: pre;
    max-width: 100%; box-sizing: border-box;
  }
  .uc-refs { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .uc-refs a {
    display: inline-block; padding: 3px 10px; background: #161b22; border: 1px solid #30363d;
    border-radius: 4px; font-size: 10px; color: #79c0ff; text-decoration: none; transition: all .2s;
  }
  .uc-refs a:hover { border-color: #58a6ff; color: #58a6ff; background: #0d1117; }
  .legend-close {
    position: absolute; top: 8px; right: 8px; background: none; border: none;
    color: #8b949e; font-size: 16px; cursor: pointer; line-height: 1; padding: 2px 6px;
  }
  .legend-close:hover { color: #c9d1d9; }

  /* ── Tracker Panel ── */
  #tracker-panel {

  deepDives: [
    {
      id: "dd-systolic", num: "Concept 1 of 6", title: "Systolic Arrays",
      desc: "2D grid of MACs, weight-stationary dataflow, matrix multiply.", color: "#58a6ff", icon: "\ud83d\udd32",
      svg: function(w, h) {
        var g = 4, s = Math.min((w - 80) / g, (h - 80) / g), ox = (w - g * s) / 2, oy = (h - g * s) / 2;
        var out = '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg" style="background:#0d1117">';
        for (var r = 0; r < g; r++) for (var c = 0; c < g; c++) {
          var x = ox + c * s, y = oy + r * s;
          out += '<rect x="' + (x+2) + '" y="' + (y+2) + '" width="' + (s-4) + '" height="' + (s-4) + '" rx="4" fill="#58a6ff15" stroke="#58a6ff" stroke-width="1"/>';
          out += '<text x="' + (x+s/2) + '" y="' + (y+s/2+4) + '" text-anchor="middle" fill="#58a6ff" font-size="10">MAC</text>';
        }
        out += '<text x="' + w/2 + '" y="' + (oy - 10) + '" text-anchor="middle" fill="#8b949e" font-size="11">Weight-Stationary 4\u00d74 Systolic Array</text>';
        out += '</svg>'; return out;
      },
      sections: [
        { title: "Overview", text: "A systolic array is a 2D grid of multiply-accumulate (MAC) units. Data flows rhythmically through the array in a pipelined fashion, enabling high throughput matrix multiplication with minimal memory access." },
        { title: "Dataflow", text: "In weight-stationary mode, each PE holds a weight value while input activations stream horizontally and partial sums accumulate vertically. This minimizes data movement and maximizes compute utilization." },
        { title: "Key Formula", formula: "C[i][j] = \u03a3_k A[i][k] \u00d7 B[k][j]" }
      ],
      keypoints: [
        { title: "Massive Parallelism", text: "All PEs compute simultaneously, achieving O(N\u00b2) MACs per cycle for an N\u00d7N array." },
        { title: "Energy Efficient", text: "Data reuse within the array drastically reduces memory bandwidth requirements." },
        { title: "Deterministic Latency", text: "Fixed pipeline depth gives predictable execution time for each matrix operation." }
      ]
    },
    {
      id: "dd-bfloat16", num: "Concept 2 of 6", title: "bfloat16",
      desc: "Brain floating point, 8-bit exponent + 7-bit mantissa, vs FP32/FP16.", color: "#7ee787", icon: "\ud83d\udd22",
      svg: function(w, h) {
        var out = '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg" style="background:#0d1117">';
        var bw = w - 80, bh = 32, by = h/2 - 50;
        // bfloat16 layout: 1 sign + 8 exponent + 7 mantissa
        var parts = [{n:"S",w:1,c:"#f778ba"},{n:"Exponent",w:8,c:"#58a6ff"},{n:"Mantissa",w:7,c:"#7ee787"}];
        var total = 16, px = 40;
        parts.forEach(function(p) {
          var pw = (p.w / total) * bw;
          out += '<rect x="'+px+'" y="'+by+'" width="'+pw+'" height="'+bh+'" fill="'+p.c+'22" stroke="'+p.c+'" stroke-width="1" rx="2"/>';
          out += '<text x="'+(px+pw/2)+'" y="'+(by+bh/2+4)+'" text-anchor="middle" fill="'+p.c+'" font-size="10" font-weight="600">'+p.n+' ('+p.w+')</text>';
          px += pw;
        });
        out += '<text x="'+w/2+'" y="'+(by-12)+'" text-anchor="middle" fill="#c9d1d9" font-size="12" font-weight="600">bfloat16 — 16 bits</text>';
        out += '<text x="'+w/2+'" y="'+(by+bh+24)+'" text-anchor="middle" fill="#8b949e" font-size="10">Same exponent range as FP32, truncated mantissa</text>';
        out += '</svg>'; return out;
      },
      sections: [
        { title: "Overview", text: "bfloat16 (Brain Floating Point) is a 16-bit format with 1 sign bit, 8 exponent bits, and 7 mantissa bits. It preserves the dynamic range of FP32 while halving memory and bandwidth." },
        { title: "Why bfloat16?", text: "Deep learning gradients need wide dynamic range more than high precision. bfloat16 matches FP32 exponent range (±3.4\u00d710\u00b3\u2078) while using half the bits, enabling faster training with minimal accuracy loss." },
        { title: "Comparison", text: "FP32: 1+8+23 bits. FP16: 1+5+10 bits. bfloat16: 1+8+7 bits. FP16 has more mantissa precision but much smaller range, causing overflow in training." }
      ],
      keypoints: [
        { title: "FP32 Range", text: "8-bit exponent gives the same \u00b13.4\u00d710\u00b3\u2078 range as 32-bit floats." },
        { title: "2\u00d7 Throughput", text: "16-bit operations double the throughput vs FP32 on the same hardware." },
        { title: "Drop-in Replacement", text: "Simple truncation of FP32 mantissa makes conversion trivial in hardware." }
      ]
    },
    {
      id: "dd-pod", num: "Concept 3 of 6", title: "TPU Pod Architecture",
      desc: "Inter-chip interconnect, ICI mesh, scaling to thousands.", color: "#ffa657", icon: "\ud83c\udfd7\ufe0f",
      svg: function(w, h) {
        var out = '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg" style="background:#0d1117">';
        var cols = 4, rows = 3, s = Math.min((w-100)/cols, (h-80)/rows), ox = (w-cols*s)/2, oy = (h-rows*s)/2;
        for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) {
          var x = ox + c*s + s/2, y = oy + r*s + s/2;
          out += '<rect x="'+(x-16)+'" y="'+(y-16)+'" width="32" height="32" rx="4" fill="#ffa65722" stroke="#ffa657" stroke-width="1"/>';
          out += '<text x="'+x+'" y="'+(y+4)+'" text-anchor="middle" fill="#ffa657" font-size="8">TPU</text>';
          if (c < cols-1) out += '<line x1="'+(x+16)+'" y1="'+y+'" x2="'+(x+s-16)+'" y2="'+y+'" stroke="#ffa65766" stroke-width="1"/>';
          if (r < rows-1) out += '<line x1="'+x+'" y1="'+(y+16)+'" x2="'+x+'" y2="'+(y+s-16)+'" stroke="#ffa65766" stroke-width="1"/>';
        }
        out += '<text x="'+w/2+'" y="'+(oy-14)+'" text-anchor="middle" fill="#8b949e" font-size="11">ICI Mesh — 4\u00d73 Pod Slice</text>';
        out += '</svg>'; return out;
      },
      sections: [
        { title: "Overview", text: "TPU Pods connect hundreds to thousands of TPU chips via a high-bandwidth Inter-Chip Interconnect (ICI). This creates a single logical accelerator for massive distributed training." },
        { title: "ICI Mesh", text: "Chips are arranged in a 2D or 3D torus/mesh topology. Each chip has direct links to its neighbors, enabling all-reduce and all-to-all collective operations with minimal latency." },
        { title: "Scaling", text: "TPU v4 pods scale to 4096 chips (4096 \u00d7 ~275 TFLOPS = ~1.1 EFLOPS). Optical circuit switching allows dynamic reconfiguration of the interconnect topology." }
      ],
      keypoints: [
        { title: "ICI Bandwidth", text: "Each chip-to-chip link provides hundreds of Gbps for fast collective communication." },
        { title: "Optical Switching", text: "TPU v4 uses optical circuit switches to reconfigure topology without rewiring." },
        { title: "Exaflop Scale", text: "A full v4 pod delivers over 1 exaflop of bfloat16 compute." }
      ]
    },
    {
      id: "dd-history", num: "Concept 4 of 6", title: "History of TPU",
      desc: "Generations from v1 (2015) through Ironwood (v7), and what changed in each.", color: "#d2a8ff", icon: "\ud83d\udcdc",
      svg: function(w, h) {
        var gens = [
          { name: "v1",       year: "2015", peak: 92,   color: "#6e7681" },
          { name: "v2",       year: "2017", peak: 46,   color: "#58a6ff" },
          { name: "v3",       year: "2018", peak: 123,  color: "#58a6ff" },
          { name: "v4",       year: "2021", peak: 275,  color: "#3fb950" },
          { name: "v5e",      year: "2023", peak: 197,  color: "#ffa657" },
          { name: "v5p",      year: "2023", peak: 459,  color: "#ffa657" },
          { name: "Trillium", year: "2024", peak: 926,  color: "#d2a8ff" },
          { name: "Ironwood", year: "2025", peak: 4614, color: "#ff7b72" }
        ];
        var n = gens.length, pad = 60;
        var step = (w - pad*2) / (n - 1);
        var maxLog = Math.log10(6000), minLog = Math.log10(35);
        var maxBarH = Math.max(60, h * 0.45);
        var axisY = h - 70;
        var barBase = axisY - 12;
        var s = '<svg viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg" style="background:#0d1117">';
        s += '<text x="'+(w/2)+'" y="22" text-anchor="middle" fill="#c9d1d9" font-size="14" font-weight="700">TPU Generations \u2014 Timeline &amp; Peak Compute (log scale)</text>';
        s += '<line x1="'+pad+'" y1="'+barBase+'" x2="'+(w-pad)+'" y2="'+barBase+'" stroke="#21262d" stroke-width="1"/>';
        s += '<line x1="'+pad+'" y1="'+axisY+'" x2="'+(w-pad)+'" y2="'+axisY+'" stroke="#30363d" stroke-width="2"/>';
        for (var i = 0; i < n; i++) {
          var x = pad + i*step;
          var bh = Math.max(8, ((Math.log10(gens[i].peak) - minLog) / (maxLog - minLog)) * maxBarH);
          var by = barBase - bh;
          s += '<rect x="'+(x-24)+'" y="'+by+'" width="48" height="'+bh+'" rx="3" fill="'+gens[i].color+'33" stroke="'+gens[i].color+'" stroke-width="1.5"/>';
          s += '<text x="'+x+'" y="'+(by-5)+'" text-anchor="middle" fill="'+gens[i].color+'" font-size="11" font-weight="700">'+gens[i].peak+' TF</text>';
          s += '<line x1="'+x+'" y1="'+barBase+'" x2="'+x+'" y2="'+axisY+'" stroke="'+gens[i].color+'66" stroke-width="1" stroke-dasharray="2,2"/>';
          s += '<circle cx="'+x+'" cy="'+axisY+'" r="7" fill="'+gens[i].color+'" stroke="#0d1117" stroke-width="2"/>';
          s += '<text x="'+x+'" y="'+(axisY+22)+'" text-anchor="middle" fill="#c9d1d9" font-size="11" font-weight="700">'+gens[i].name+'</text>';
          s += '<text x="'+x+'" y="'+(axisY+36)+'" text-anchor="middle" fill="#8b949e" font-size="10">'+gens[i].year+'</text>';
        }
        s += '<text x="'+(w/2)+'" y="'+(h-6)+'" text-anchor="middle" fill="#6e7681" font-size="10">Bars: peak per-chip compute (TFLOPS BF16; v1 = TOPS INT8, Ironwood = TFLOPS FP8) on a log scale</text>';
        s += '</svg>';
        return s;
      },
      sections: [
        { title: "Why Google built the TPU", text: "By 2013 Google projected that scaling voice search to all Android users would roughly double its datacenter footprint on CPUs alone. A custom inference ASIC was the answer \u2014 cheaper, denser, and lower-latency than CPUs or GPUs of the time. Two years later, TPU v1 was running in production." +
          '<div class="dd-flow">' +
            '<div class="dd-flow-step">Voice / Search<br/>demand</div>' +
            '<div class="dd-flow-arrow">\u2192</div>' +
            '<div class="dd-flow-step">Projected 2\u00d7<br/>datacenter footprint</div>' +
            '<div class="dd-flow-arrow">\u2192</div>' +
            '<div class="dd-flow-step">Custom ASIC<br/>(INT8 inference)</div>' +
            '<div class="dd-flow-arrow">\u2192</div>' +
            '<div class="dd-flow-step">TPU v1<br/>deployed 2015</div>' +
          '</div>' },
        { title: "Generations at a glance", text: "Eight generations in ten years. Each row shows the headline numbers \u2014 peak compute, HBM capacity, and pod size all march upward, while process node, numerics, and topology each take their own staircase." +
          '<table class="dd-table"><thead><tr><th>Gen</th><th>Year</th><th>Process</th><th>Peak (BF16/FP8)</th><th>HBM</th><th>HBM BW</th><th>ICI Topology</th><th>Pod</th><th>Focus</th></tr></thead><tbody>' +
            '<tr><td>v1</td><td class="num">2015</td><td>28 nm</td><td class="num">92 TOPS INT8</td><td class="num">8 GiB DDR3</td><td class="num">34 GB/s</td><td>PCIe only</td><td class="num">1</td><td>Inference</td></tr>' +
            '<tr><td>v2</td><td class="num">2017</td><td>16 nm</td><td class="num">46 TF BF16</td><td class="num">16 GiB HBM</td><td class="num">600 GB/s</td><td>2D torus 16\u00d716</td><td class="num">256</td><td>Training</td></tr>' +
            '<tr><td>v3</td><td class="num">2018</td><td>16 nm</td><td class="num">123 TF BF16</td><td class="num">32 GiB HBM</td><td class="num">900 GB/s</td><td>2D torus 32\u00d732</td><td class="num">1024</td><td>Training (liquid)</td></tr>' +
            '<tr><td>v4</td><td class="num">2021</td><td>7 nm</td><td class="num">275 TF BF16</td><td class="num">32 GiB HBM2</td><td class="num">1.2 TB/s</td><td>3D torus + OCS</td><td class="num">4096</td><td>Training</td></tr>' +
            '<tr><td>v5e</td><td class="num">2023</td><td>5 nm</td><td class="num">197 TF BF16</td><td class="num">16 GiB HBM2</td><td class="num">819 GB/s</td><td>2D torus</td><td class="num">256</td><td>Cost-efficient</td></tr>' +
            '<tr><td>v5p</td><td class="num">2023</td><td>5 nm</td><td class="num">459 TF BF16</td><td class="num">95 GiB HBM3</td><td class="num">2.76 TB/s</td><td>3D torus</td><td class="num">8960</td><td>Flagship training</td></tr>' +
            '<tr><td>Trillium (v6e)</td><td class="num">2024</td><td>~5 nm</td><td class="num">~926 TF BF16</td><td class="num">32 GiB HBM</td><td class="num">~1.6 TB/s</td><td>2D torus + SC g3</td><td class="num">256</td><td>Mixed</td></tr>' +
            '<tr><td>Ironwood (v7)</td><td class="num">2025</td><td>~3 nm</td><td class="num">~4614 TF FP8</td><td class="num">192 GiB HBM3e</td><td class="num">7.4 TB/s</td><td>3D torus optical</td><td class="num">9216</td><td>Inference at scale</td></tr>' +
          '</tbody></table>' },
        { title: "Numerics evolution",text: "Each generation rebalanced where bits get spent. v1 was pure INT8 inference. v2 introduced bfloat16 multiply with FP32 accumulate so training kept FP32-like dynamic range at half the storage. v5e/v5p kept BF16 and added INT8 paths for serving. Trillium and Ironwood add FP8 for ~2\u00d7 throughput on the same silicon." +
          '<svg class="dd-mini" viewBox="0 0 700 170" xmlns="http://www.w3.org/2000/svg" style="background:#0d1117;border:1px solid #30363d;border-radius:8px"><text x="350" y="22" text-anchor="middle" fill="#c9d1d9" font-size="12" font-weight="700">Dominant numerics per generation</text>' +
            '<g font-size="10" font-family="Courier New,monospace">' +
              '<rect x="40" y="50" width="60" height="22" fill="#ff7b7244" stroke="#ff7b72"/><text x="70" y="65" text-anchor="middle" fill="#ff7b72">INT8</text><text x="70" y="106" text-anchor="middle" fill="#8b949e">v1</text>' +
              '<rect x="120" y="50" width="60" height="22" fill="#58a6ff44" stroke="#58a6ff"/><text x="150" y="65" text-anchor="middle" fill="#58a6ff">BF16</text><rect x="120" y="74" width="60" height="14" fill="#3fb95044" stroke="#3fb950"/><text x="150" y="85" text-anchor="middle" fill="#3fb950" font-size="9">FP32 acc</text><text x="150" y="106" text-anchor="middle" fill="#8b949e">v2</text>' +
              '<rect x="200" y="50" width="60" height="22" fill="#58a6ff44" stroke="#58a6ff"/><text x="230" y="65" text-anchor="middle" fill="#58a6ff">BF16</text><rect x="200" y="74" width="60" height="14" fill="#3fb95044" stroke="#3fb950"/><text x="230" y="85" text-anchor="middle" fill="#3fb950" font-size="9">FP32 acc</text><text x="230" y="106" text-anchor="middle" fill="#8b949e">v3</text>' +
              '<rect x="280" y="50" width="60" height="22" fill="#58a6ff44" stroke="#58a6ff"/><text x="310" y="65" text-anchor="middle" fill="#58a6ff">BF16</text><rect x="280" y="74" width="60" height="14" fill="#3fb95044" stroke="#3fb950"/><text x="310" y="85" text-anchor="middle" fill="#3fb950" font-size="9">FP32 acc</text><text x="310" y="106" text-anchor="middle" fill="#8b949e">v4</text>' +
              '<rect x="360" y="50" width="60" height="22" fill="#58a6ff44" stroke="#58a6ff"/><text x="390" y="65" text-anchor="middle" fill="#58a6ff">BF16</text><rect x="360" y="74" width="60" height="14" fill="#ff7b7244" stroke="#ff7b72"/><text x="390" y="85" text-anchor="middle" fill="#ff7b72" font-size="9">INT8</text><text x="390" y="106" text-anchor="middle" fill="#8b949e">v5e</text>' +
              '<rect x="440" y="50" width="60" height="22" fill="#58a6ff44" stroke="#58a6ff"/><text x="470" y="65" text-anchor="middle" fill="#58a6ff">BF16</text><rect x="440" y="74" width="60" height="14" fill="#ff7b7244" stroke="#ff7b72"/><text x="470" y="85" text-anchor="middle" fill="#ff7b72" font-size="9">INT8</text><text x="470" y="106" text-anchor="middle" fill="#8b949e">v5p</text>' +
              '<rect x="520" y="50" width="60" height="22" fill="#58a6ff44" stroke="#58a6ff"/><text x="550" y="65" text-anchor="middle" fill="#58a6ff">BF16</text><rect x="520" y="74" width="60" height="14" fill="#d2a8ff44" stroke="#d2a8ff"/><text x="550" y="85" text-anchor="middle" fill="#d2a8ff" font-size="9">FP8</text><text x="550" y="106" text-anchor="middle" fill="#8b949e">Trillium</text>' +
              '<rect x="600" y="50" width="60" height="22" fill="#d2a8ff44" stroke="#d2a8ff"/><text x="630" y="65" text-anchor="middle" fill="#d2a8ff">FP8</text><rect x="600" y="74" width="60" height="14" fill="#58a6ff44" stroke="#58a6ff"/><text x="630" y="85" text-anchor="middle" fill="#58a6ff" font-size="9">BF16</text><text x="630" y="106" text-anchor="middle" fill="#8b949e">Ironwood</text>' +
            '</g>' +
            '<g font-size="10"><rect x="60" y="135" width="12" height="12" fill="#ff7b7244" stroke="#ff7b72"/><text x="78" y="145" fill="#c9d1d9">INT8</text>' +
              '<rect x="140" y="135" width="12" height="12" fill="#58a6ff44" stroke="#58a6ff"/><text x="158" y="145" fill="#c9d1d9">BF16</text>' +
              '<rect x="220" y="135" width="12" height="12" fill="#3fb95044" stroke="#3fb950"/><text x="238" y="145" fill="#c9d1d9">FP32 accumulator</text>' +
              '<rect x="370" y="135" width="12" height="12" fill="#d2a8ff44" stroke="#d2a8ff"/><text x="388" y="145" fill="#c9d1d9">FP8</text></g>' +
          '</svg>' },
        { title: "Memory evolution", text: "v1 used commodity DDR3; v2 was the first TPU with HBM. From there it\'s a steady walk: HBM \u2192 HBM2 \u2192 HBM3 \u2192 HBM3e, with capacity per chip growing from 8 GiB to 192 GiB (24\u00d7) over a decade. The dip at v5e is intentional \u2014 it\'s the cheap-and-cheerful SKU." +
          (function(){
            var mem = [
              { n: "v1",       v: 8,   c: "#6e7681" },
              { n: "v2",       v: 16,  c: "#58a6ff" },
              { n: "v3",       v: 32,  c: "#58a6ff" },
              { n: "v4",       v: 32,  c: "#3fb950" },
              { n: "v5e",      v: 16,  c: "#ffa657" },
              { n: "v5p",      v: 95,  c: "#ffa657" },
              { n: "Trillium", v: 32,  c: "#d2a8ff" },
              { n: "Ironwood", v: 192, c: "#ff7b72" }
            ];
            var W = 700, H = 220, pad = 50, baseY = H - 50;
            var stepX = (W - pad*2) / (mem.length - 1);
            var maxV = 200, scale = (baseY - 40) / maxV;
            var s = '<svg class="dd-mini" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" style="background:#0d1117;border:1px solid #30363d;border-radius:8px">';
            s += '<text x="'+(W/2)+'" y="22" text-anchor="middle" fill="#c9d1d9" font-size="12" font-weight="700">HBM (or DDR3) capacity per chip \u2014 GiB</text>';
            s += '<line x1="'+pad+'" y1="'+baseY+'" x2="'+(W-pad)+'" y2="'+baseY+'" stroke="#30363d"/>';
            var ticks = [0, 50, 100, 150, 200];
            for (var t = 0; t < ticks.length; t++) {
              var ty = baseY - ticks[t]*scale;
              s += '<line x1="'+(pad-4)+'" y1="'+ty+'" x2="'+(W-pad)+'" y2="'+ty+'" stroke="#21262d" stroke-dasharray="2,3"/>';
              s += '<text x="'+(pad-8)+'" y="'+(ty+3)+'" text-anchor="end" fill="#6e7681" font-size="9">'+ticks[t]+'</text>';
            }
            for (var i = 0; i < mem.length; i++) {
              var x = pad + i*stepX;

        { title: "Key takeaways", text: "Per-chip peak compute grew ~50\u00d7 from v1 to Ironwood (92 \u2192 4614 TF, mixing INT8/BF16/FP8). Pod size grew from a single card to 9216 chips. The recurring pattern is the same every generation: numerics shrink, memory grows, interconnect widens, and specialization deepens." +
