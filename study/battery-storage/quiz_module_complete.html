<!-- ============================================================
     DROP-IN QUIZ MODULE — self-bootstrapping
     Place this entire block immediately before </body>.
     Customize the JSON inside <script id="quiz-data"> for the domain.
     Each question: { topic, q, options:[...4], answer:0..3, explain }
     ============================================================ -->
<script id="quiz-data" type="application/json">
[
  {"topic":"Electrochemistry Fundamentals","q":"In electrochemistry, what does the Nernst equation describe?","options":["The relationship between voltage and ion concentration","The rate of electron transfer","The heat generated in a cell","The resistance of the electrolyte"],"answer":0,"explain":"The Nernst equation: E = E° − (RT/nF)ln(Q) describes how the cell potential depends on temperature and the concentration of reactants."},
  {"topic":"Electrochemistry Fundamentals","q":"What is the standard electrode potential (E°) for the reduction of Cu²⁺ to Cu?","options":["-0.76 V","+0.34 V","+0.80 V","-0.34 V"],"answer":1,"explain":"The standard reduction potential for Cu²⁺/Cu is +0.34 V vs SHE, one of the key values in electrochemistry."},
  {"topic":"Electrochemistry Fundamentals","q":"Which describes an oxidation reaction?","options":["Loss of electrons","Gain of electrons","Combination with oxygen","Formation of ions"],"answer":0,"explain":"Oxidation is defined as the loss of electrons. The mnemonic is 'LEO' (Loss of Electrons = Oxidation)."},
  {"topic":"Electrochemistry Fundamentals","q":"What does Faraday's Law determine?","options":["The voltage of a cell","The amount of substance produced by electrolysis from the charge passed","The temperature rise in a battery","The color of the electrolyte"],"answer":1,"explain":"Faraday's Law: amount (mol) = Q/(nF), where Q is charge (C), n is electrons, F is Faraday's constant (96,485 C/mol)."},
  {"topic":"Li-Ion: NMC & LFP","q":"What does NMC stand for in battery cathodes?","options":["Nickel Manganese Cobalt oxide","Nickel Metal Carbon","Nickel Magnesium Ceramic","Nitrogen Manganese Cobalt"],"answer":0,"explain":"NMC (LiNi₀.₃Mn₀.₃Co₀.₃O₂) is a layered oxide cathode material offering good energy density, power, and cycle life."},
  {"topic":"Li-Ion: NMC & LFP","q":"Which cathode material is known for superior thermal stability and safety?","options":["LiCoO₂","LiFePO₄ (LFP)","NMC","LiMn₂O₄"],"answer":1,"explain":"LFP (LiFePO₄) has an olivine structure with stronger Fe-O bonds, providing excellent thermal stability and resistance to thermal runaway."},
  {"topic":"Li-Ion: NMC & LFP","q":"What is a key trade-off between NMC and LFP cathodes?","options":["NMC has higher energy density but lower thermal stability","LFP has better cycle life but lower cost","NMC is safer but lower voltage","LFP has higher power density"],"answer":0,"explain":"NMC offers higher energy density (~200 Wh/kg) and operates at higher voltages, but LFP is inherently safer and more thermally stable."},
  {"topic":"Li-Ion: NMC & LFP","q":"What is the typical discharge voltage plateau for LFP cells?","options":["3.2 V","3.6 V","3.8 V","4.2 V"],"answer":0,"explain":"LFP cells have a characteristic flat discharge profile around 3.2 V (nominal 3.3 V), which is lower than NMC but more stable."},
  {"topic":"Li-Ion: Anode & Electrolyte","q":"What is the standard anode material in commercial Li-ion batteries?","options":["Lithium metal foil","Graphite","Silicon carbide","Copper oxide"],"answer":1,"explain":"Graphite is the standard anode in Li-ion cells. It intercalates Li⁺ at ~0.05 V vs Li/Li⁺, providing stable voltage and cycling performance."},
  {"topic":"Li-Ion: Anode & Electrolyte","q":"Why are organic carbonate solvents used in Li-ion electrolyte?","options":["They are cheaper","They provide good ionic conductivity, high electrochemical stability, and allow SEI formation","They reduce weight","They improve safety"],"answer":1,"explain":"Organic carbonates (EC, DEC, DMC) dissolve lithium salts well, offer wide electrochemical windows, and enable protective SEI film on graphite."},
  {"topic":"Li-Ion: Anode & Electrolyte","q":"What is LiPF₆ in battery electrolyte?","options":["A cathode material","The salt dissolved in organic solvents to provide Li⁺ ions and conductivity","A separator material","A thermal additive"],"answer":1,"explain":"LiPF₆ (lithium hexafluorophosphate) is the standard salt in Li-ion electrolytes. It dissociates to provide Li⁺ ions for transport and conducts current."},
  {"topic":"Battery Management Systems (BMS)","q":"What is the primary function of a Battery Management System?","options":["Monitor and protect the battery pack from unsafe conditions","Increase the battery capacity","Reduce the cost of materials","Prevent chemical reactions"],"answer":0,"explain":"BMS monitors voltage, current, and temperature of individual cells, manages cell balancing, and protects against overcharge, overdischarge, and thermal runaway."},
  {"topic":"Battery Management Systems (BMS)","q":"What is cell balancing in a BMS?","options":["Matching cells from the same manufacturer","Equalizing the state of charge across cells in a pack","Rotating cells during operation","Reducing the number of cells"],"answer":1,"explain":"Cell balancing ensures all cells reach similar charge levels, extending pack life and preventing some cells from overcharging or over-discharging."},
  {"topic":"Battery Management Systems (BMS)","q":"What is the difference between passive and active cell balancing?","options":["Passive is manual, active is automatic","Passive dissipates excess energy as heat, active transfers energy between cells","Active is cheaper than passive","Passive requires more power"],"answer":1,"explain":"Passive balancing uses resistors to dissipate energy from high cells. Active balancing uses DC-DC converters to transfer energy from high to low cells, more efficient."},
  {"topic":"Battery Management Systems (BMS)","q":"How is State of Charge (SOC) estimated?","options":["Only by measuring voltage","Using coulomb counting and voltage/temperature models","By physical weight change","From the age of the battery"],"answer":1,"explain":"SOC is estimated by integrating current (coulomb counting), combined with voltage and temperature models to correct for measurement drift."},
  {"topic":"Thermal Management","q":"What causes heat generation in a lithium-ion cell?","options":["Entropy of mixing only","Joule heating (I²R) and entropic losses","Chemical decomposition","Light absorption"],"answer":1,"explain":"Heat is generated from resistive losses (I²R) and entropy changes during lithiation/delithiation. High-rate operation increases Joule heating."},
  {"topic":"Thermal Management","q":"At what temperature does thermal runaway typically begin in Li-ion cells?","options":["Below 50°C","Around 80–150°C depending on chemistry","Above 300°C","Below 0°C"],"answer":1,"explain":"Thermal runaway in Li-ion cells typically initiates around 80–150°C when the solid-electrolyte interphase breaks down, triggering exothermic reactions."},
  {"topic":"Thermal Management","q":"Which cooling method is most effective for high-power battery packs?","options":["Passive air cooling","Liquid cooling","Passive thermal interfaces","Insulation"],"answer":1,"explain":"Liquid cooling provides superior heat transfer (high specific heat and thermal conductivity) for high-power applications like EVs."},
  {"topic":"Thermal Management","q":"What is the optimal operating temperature range for Li-ion batteries?","options":["−40 to +60°C","15°C to 35°C","50°C to 80°C","Below 0°C"],"answer":1,"explain":"Li-ion batteries perform best at 15–35°C. Outside this range, cycle life degrades rapidly: cold reduces power, heat accelerates aging."},
  {"topic":"Grid Storage","q":"What is a key advantage of using Li-ion batteries for grid-scale energy storage?","options":["Infinite cycle life","Fast response time and good round-trip efficiency (90%+)","Zero environmental impact","No maintenance required"],"answer":1,"explain":"Li-ion batteries provide millisecond-scale response to demand changes and 90–95% round-trip efficiency, making them ideal for grid services."},
  {"topic":"Grid Storage","q":"What does BESS stand for?","options":["Battery Energy Storage System","Battery External Storage Site","Business Energy Service System","Bulk Electric Storage Spot"],"answer":0,"explain":"BESS (Battery Energy Storage System) is the standard term for battery-based grid storage systems that provide capacity, energy, and services."},
  {"topic":"Grid Storage","q":"Which battery technology is best for 4+ hour duration grid storage?","options":["Supercapacitors","Flow batteries or long-duration Li-ion with energy arbitrage","Superconductors","Lead-acid"],"answer":1,"explain":"Flow batteries (vanadium, zinc-bromine) and long-duration Li-ion systems are cost-effective for multi-hour grid storage and energy arbitrage."},
  {"topic":"Grid Storage","q":"What service can a battery energy storage system provide to the grid?","options":["Frequency regulation only","Peak shaving, frequency regulation, blackstart capability, energy arbitrage","Voltage support only","No specific services"],"answer":1,"explain":"BESS provides multiple ancillary services: frequency regulation, peak shaving, energy time-shifting, voltage support, and blackstart for grid stability."},
  {"topic":"Safety","q":"What is the most common cause of Li-ion battery fires?","options":["Overcharging leading to internal short circuit or thermal runaway","Low temperature operation","UV exposure","Physical vibration"],"answer":0,"explain":"Overcharging causes separator breakdown, internal short circuits, and thermal runaway. Thermal management and BMS protection are critical."},
  {"topic":"Safety","q":"What does a current interrupt device (CID) in a battery do?","options":["Increases the discharge current","Disconnects the battery circuit if internal pressure exceeds a threshold","Balances the cells","Reduces self-discharge"],"answer":1,"explain":"A CID is a safety mechanism that opens the internal circuit if abnormal pressure builds up, typically due to internal short circuit or venting."},
  {"topic":"Safety","q":"Why is SEI (Solid Electrolyte Interphase) important for battery safety?","options":["It increases conductivity","It insulates the anode and prevents further electrolyte decomposition","It speeds up charging","It has no safety role"],"answer":1,"explain":"The SEI is a protective layer formed on the anode during initial cycling that prevents electrolyte decomposition and improves cycle life and safety."},
  {"topic":"Battery Degradation","q":"What is calendar aging in batteries?","options":["Capacity loss due to cycling","Capacity loss over time even without use","Increase in voltage over time","Physical corrosion of terminals"],"answer":1,"explain":"Calendar aging occurs through parasitic reactions (electrolyte oxidation, SEI growth) even when the battery is idle, accelerated by temperature."},
  {"topic":"Battery Degradation","q":"What is the primary cause of cycle fade in Li-ion batteries?","options":["Loss of lithium ions to side reactions","Increase in cathode structural disorder","All of the above","Electrode material dissolution and electrolyte decomposition"],"answer":2,"explain":"Cycle fade is caused by lithium loss (plating, SEI growth), structural changes in cathode/anode, electrolyte decomposition, and transition metal dissolution."},
  {"topic":"Battery Degradation","q":"How does depth of discharge (DoD) affect cycle life?","options":["DoD has no effect","Shallower DoD extends cycle life; full DoD cycling reduces it","Deeper DoD always improves life","DoD only affects voltage"],"answer":1,"explain":"Operating at shallow depth of discharge (e.g., 20% DoD) can extend cycle life to 10,000+ cycles; 100% DoD reduces life to 1,000–2,000 cycles."},
  {"topic":"Battery Degradation","q":"What is State of Health (SOH)?","options":["Voltage at any instant","The remaining capacity as a percentage of the original rated capacity","The operating temperature","The age in years"],"answer":1,"explain":"SOH quantifies battery degradation: SOH = (current max capacity) / (original max capacity) × 100%. Used to predict end-of-life."},
  {"topic":"Solid-State Batteries","q":"What is the main advantage of solid-state batteries over conventional Li-ion?","options":["Lower cost","Higher energy density and improved safety due to solid electrolyte","Faster charging only","Better thermal management only"],"answer":1,"explain":"Solid electrolytes eliminate flammability, enable higher voltage cathodes, and allow lithium metal anodes, targeting 500+ Wh/kg and improved safety."},
  {"topic":"Solid-State Batteries","q":"What is a key challenge in solid-state battery commercialization?","options":["Electrolyte toxicity","Interfacial resistance and dendrite formation","Lack of raw materials","Patent restrictions"],"answer":1,"explain":"Solid-state batteries face challenges with ionic transport at interfaces, dendrite penetration through solid electrolytes, and manufacturing scalability."},
  {"topic":"Solid-State Batteries","q":"Which electrolyte type is most commonly pursued for solid-state batteries?","options":["Liquid organic","Polymer (PVDF-HFP)","Ceramic oxide or sulfide","Aqueous"],"answer":2,"explain":"Ceramic (e.g., LLZO, Li₃PS₄) and sulfide solid electrolytes are leading candidates due to high ionic conductivity and electrochemical stability."},
  {"topic":"Flow Batteries","q":"What is the key operational principle of flow batteries?","options":["Electrochemical reactions in fixed electrodes like conventional batteries","Active materials dissolved in liquid electrolyte stored in external tanks","Mechanical pumping of solid particles","Magnetic confinement"],"answer":1,"explain":"Flow batteries store energy in liquid electrolytes in external tanks. Energy capacity scales with tank size; power with stack area—independent scaling."},
  {"topic":"Flow Batteries","q":"What is a major advantage of vanadium redox flow batteries (VRFB)?","options":["Lower cost than Li-ion","Single electrolyte with all four redox states in vanadium enables full rebalancing","Faster response than Li-ion","No safety concerns"],"answer":1,"explain":"VRFB uses one element (vanadium) in all four redox states, allowing full rebalancing and recovery from deep discharge or imbalance."},
  {"topic":"Flow Batteries","q":"What is the round-trip efficiency typical for flow batteries?","options":["95%+","50–70%","70–85%","20–40%"],"answer":2,"explain":"Vanadium redox and other flow batteries typically achieve 70–85% round-trip efficiency due to electrode overpotentials and shunt currents."},
  {"topic":"Sodium-Ion Batteries","q":"Why are sodium-ion batteries attractive as an alternative to Li-ion?","options":["Sodium is more abundant and cheaper than lithium","They have higher energy density","They are inherently safer","Both A and C"],"answer":0,"explain":"Sodium is ~1000× more abundant than lithium, significantly cheaper, and geographically distributed. This reduces supply chain risk and cost."},
  {"topic":"Sodium-Ion Batteries","q":"What is a typical energy density of sodium-ion batteries compared to Li-ion?","options":["2× higher","Similar to Li-ion (~200 Wh/kg)","30–50% lower (~150 Wh/kg)","Much lower, <50 Wh/kg"],"answer":2,"explain":"Sodium-ion batteries typically deliver 150–160 Wh/kg, vs 200–250 Wh/kg for Li-ion. Lower density due to heavier Na⁺ ions."},
  {"topic":"Supercapacitors","q":"How does an Electric Double-Layer Capacitor (EDLC) store charge?","options":["Chemical reactions","Electrostatic accumulation at the electrode-electrolyte interface","Magnetic fields","Phase transitions"],"answer":1,"explain":"EDLC stores energy through Helmholtz double-layer capacitance: ions accumulate at the electrode surface without Faradaic reactions, enabling fast charge/discharge."},
  {"topic":"Supercapacitors","q":"What is a key difference between supercapacitors and batteries?","options":["Supercapacitors have higher energy density","Batteries use Faradaic reactions; supercapacitors use electrostatic storage","Supercapacitors last forever","No difference"],"answer":1,"explain":"Batteries store energy chemically (Faradaic); supercapacitors store energy electrostatically. Result: supercaps are fast & long-lived but lower energy density."}
]
</script>
<script>
(function() {
  const dataEl = document.getElementById('quiz-data');
  if (!dataEl) return;
  let questions;
  try { questions = JSON.parse(dataEl.textContent); } catch(e) { console.error('Quiz JSON parse error', e); return; }
  if (!Array.isArray(questions) || !questions.length) return;

  // ── Inject CSS ──
  const css = `
  #view-quiz { overflow-y: auto; padding-top: 60px; height: 100vh; }
  .quiz-wrap { max-width: 880px; margin: 0 auto; padding: 24px 24px 80px; }
  .quiz-header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom: 12px; }
  .quiz-header h2 { font-size: 22px; color: #58a6ff; }
  .quiz-header .quiz-sub { font-size: 12px; color: #8b949e; margin-top: 2px; }
  .quiz-stats { display:flex; gap:10px; flex-wrap:wrap; }
  .quiz-stat { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:8px 14px; font-size:12px; color:#8b949e; }
  .quiz-stat b { color:#c9d1d9; font-size:15px; display:block; }
  .quiz-stat.ok b { color:#7ee787; }
  .quiz-stat.bad b { color:#ff7b72; }
  .quiz-filters { display:flex; flex-wrap:wrap; gap:6px; margin: 12px 0 16px; }
  .quiz-chip { background:#0d1117; border:1px solid #30363d; color:#8b949e; padding:5px 12px; border-radius:16px; cursor:pointer; font-size:12px; transition:all .15s; }
  .quiz-chip:hover { color:#c9d1d9; border-color:#58a6ff; }
  .quiz-chip.active { background:#1f6feb; color:#fff; border-color:#58a6ff; }
  .quiz-actions { display:flex; gap:8px; flex-wrap:wrap; margin-bottom: 14px; }
  .quiz-actions .qbtn { background:#21262d; border:1px solid #30363d; color:#c9d1d9; padding:6px 14px; border-radius:6px; cursor:pointer; font-size:12px; }
  .quiz-actions .qbtn:hover { background:#30363d; border-color:#58a6ff; }
  .quiz-progress { height:6px; background:#161b22; border-radius:4px; overflow:hidden; margin-bottom:16px; border:1px solid #30363d; }
  .quiz-progress > div { height:100%; background:linear-gradient(90deg,#1f6feb,#58a6ff); transition:width .3s; }
  .quiz-card { background:#161b22; border:1px solid #30363d; border-radius:12px; padding:22px 26px; box-shadow:0 4px 18px rgba(0,0,0,.3); }
  .quiz-card .qc-meta { font-size:11px; color:#58a6ff; font-weight:600; text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; display:flex; justify-content:space-between; }
  .quiz-card .qc-meta .qc-num { color:#8b949e; }
  .quiz-card .qc-q { font-size:16px; color:#c9d1d9; line-height:1.55; font-weight:600; margin-bottom:16px; }
  .quiz-options { display:flex; flex-direction:column; gap:8px; }
  .quiz-opt { background:#0d1117; border:1px solid #30363d; color:#c9d1d9; padding:11px 16px; border-radius:8px; cursor:pointer; text-align:left; font-size:14px; transition:all .15s; line-height:1.4; display:flex; align-items:flex-start; gap:10px; }
  .quiz-opt:hover:not(.disabled) { border-color:#58a6ff; background:#161b22; }
  .quiz-opt .opt-letter { flex-shrink:0; width:22px; height:22px; border-radius:50%; background:#21262d; color:#8b949e; font-size:11px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; }
  .quiz-opt.correct { border-color:#3fb950; background:rgba(63,185,80,.08); }
  .quiz-opt.correct .opt-letter { background:#3fb950; color:#fff; }
  .quiz-opt.wrong { border-color:#f85149; background:rgba(248,81,73,.08); }
  .quiz-opt.wrong .opt-letter { background:#f85149; color:#fff; }
  .quiz-opt.disabled { cursor:default; }
  .quiz-explain { margin-top:14px; padding:12px 16px; background:#0d1117; border-left:3px solid #58a6ff; border-radius:6px; font-size:13px; color:#8b949e; line-height:1.6; }
  .quiz-explain b { color:#58a6ff; }
  .quiz-nav { display:flex; justify-content:space-between; gap:10px; margin-top:18px; }
  .quiz-nav .qbtn { padding:8px 18px; font-size:13px; background:#21262d; border:1px solid #30363d; color:#c9d1d9; border-radius:6px; cursor:pointer; }
  .quiz-nav .qbtn:hover { background:#30363d; border-color:#58a6ff; }
  .quiz-nav .qbtn.primary { background:#1f6feb; border-color:#58a6ff; color:#fff; }
  .quiz-nav .qbtn.primary:hover { background:#388bfd; }
  .quiz-nav .qbtn:disabled { opacity:.4; cursor:not-allowed; }
  .quiz-empty { text-align:center; color:#484f58; padding:60px 20px; font-style:italic; }
  .quiz-summary { background:#161b22; border:1px solid #30363d; border-radius:12px; padding:32px; text-align:center; }
  .quiz-summary h3 { color:#58a6ff; font-size:22px; margin-bottom:6px; }
  .quiz-summary .qs-score { font-size:56px; font-weight:700; color:#7ee787; margin:12px 0; }
  .quiz-summary .qs-pct { color:#8b949e; font-size:14px; margin-bottom:16px; }
  .quiz-summary .qs-breakdown { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:8px; margin:20px 0; text-align:left; }
  .quiz-summary .qs-row { background:#0d1117; border:1px solid #30363d; border-radius:8px; padding:8px 12px; font-size:12px; color:#8b949e; }
  .quiz-summary .qs-row b { display:block; color:#c9d1d9; font-size:14px; margin-bottom:2px; }
  @media (max-width: 600px) {
    .quiz-wrap { padding:14px 12px 80px; }
    .quiz-card { padding:16px; }
    .quiz-card .qc-q { font-size:15px; }
    .quiz-opt { font-size:13px; padding:10px 12px; }
  }`;
  const styleEl = document.createElement('style');
  styleEl.textContent = css;
  document.head.appendChild(styleEl);

  // ── Inject view container ──
  function ensureView() {
    let view = document.getElementById('view-quiz');
    if (!view) {
      view = document.createElement('div');
      view.id = 'view-quiz';
      view.className = 'view';
      view.innerHTML = '<div id="quiz-container"></div>';
      document.body.appendChild(view);
    }
    return view;
  }
  const viewEl = ensureView();

  // ── State ──
  const state = { filter: 'ALL', order: [], cursor: 0, answers: {}, built: false };

  function shuffleArr(a) { for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function topics() { return ['ALL', ...Array.from(new Set(questions.map(q => q.topic || 'General')))]; }
  function pool() { return state.order.map(i => ({i, q: questions[i]})).filter(x => state.filter === 'ALL' || (x.q.topic||'General') === state.filter); }

  function build() {
    state.order = questions.map((_, i) => i);
    shuffleArr(state.order);
    const root = document.getElementById('quiz-container');
    root.innerHTML = `
      <div class="quiz-wrap">
        <div class="quiz-header">
          <div>
            <h2>🎯 Knowledge Quiz</h2>
            <div class="quiz-sub">${questions.length} questions across ${topics().length - 1} topics — pick a topic or take it all.</div>
          </div>
          <div class="quiz-stats" id="quiz-stats"></div>
        </div>
        <div class="quiz-filters" id="quiz-filters"></div>
        <div class="quiz-actions">
          <button class="qbtn" data-act="shuffle">🔀 Shuffle</button>
          <button class="qbtn" data-act="reset">↺ Reset Answers</button>
          <button class="qbtn" data-act="next-unans">⏭ Next Unanswered</button>
          <button class="qbtn" data-act="summary">📊 Summary</button>
        </div>
        <div class="quiz-progress"><div id="quiz-progress-bar" style="width:0%"></div></div>
        <div id="quiz-body"></div>
      </div>`;
    root.querySelectorAll('.qbtn[data-act]').forEach(b => b.addEventListener('click', () => {
      const a = b.getAttribute('data-act');
      if (a === 'shuffle') { shuffleArr(state.order); state.cursor = 0; renderQ(); }
      else if (a === 'reset') { if (confirm('Reset all answers?')) { state.answers = {}; renderQ(); } }
      else if (a === 'next-unans') { const p = pool(); const n = p.findIndex(x => state.answers[x.i] === undefined); if (n >= 0) { state.cursor = n; renderQ(); } }
      else if (a === 'summary') { showSummary(); }
    }));
    renderFilters();
    renderQ();
    state.built = true;
  }

  function renderFilters() {
    const el = document.getElementById('quiz-filters');
    el.innerHTML = '';
    topics().forEach(t => {
      const count = t === 'ALL' ? questions.length : questions.filter(q => (q.topic || 'General') === t).length;
      const chip = document.createElement('button');
      chip.className = 'quiz-chip' + (t === state.filter ? ' active' : '');
      chip.textContent = t === 'ALL' ? `All (${count})` : `${t} (${count})`;
      chip.addEventListener('click', () => { state.filter = t; state.cursor = 0; renderFilters(); renderQ(); });
      el.appendChild(chip);
    });
  }

  function renderStats() {
    const p = pool();
    const answered = p.filter(x => state.answers[x.i] !== undefined);
    const correct = answered.filter(x => state.answers[x.i] === x.q.answer).length;
    const wrong = answered.length - correct;
    const el = document.getElementById('quiz-stats');
    if (el) el.innerHTML = `
      <div class="quiz-stat"><b>${p.length}</b>Questions</div>
      <div class="quiz-stat ok"><b>${correct}</b>Correct</div>
      <div class="quiz-stat bad"><b>${wrong}</b>Wrong</div>
      <div class="quiz-stat"><b>${answered.length}/${p.length}</b>Done</div>`;
    const pct = p.length ? Math.round(100 * answered.length / p.length) : 0;
    const bar = document.getElementById('quiz-progress-bar');
    if (bar) bar.style.width = pct + '%';
  }

  function renderQ() {
    const p = pool();
    const body = document.getElementById('quiz-body');
    if (!p.length) { body.innerHTML = '<div class="quiz-empty">No questions for this filter.</div>'; renderStats(); return; }
    if (state.cursor >= p.length) state.cursor = p.length - 1;
    if (state.cursor < 0) state.cursor = 0;
    const cur = p[state.cursor];
    const q = cur.q;
    const selected = state.answers[cur.i];
    const answered = selected !== undefined;
    const optsHtml = q.options.map((opt, i) => {
      let cls = '';
      if (answered) { if (i === q.answer) cls = 'correct'; else if (i === selected) cls = 'wrong'; cls += ' disabled'; }
      const letter = String.fromCharCode(65 + i);
      return `<button class="quiz-opt ${cls}" data-opt="${i}" ${answered ? 'disabled' : ''}>
        <span class="opt-letter">${letter}</span><span>${escapeHtml(opt)}</span>
      </button>`;
    }).join('');
    body.innerHTML = `
      <div class="quiz-card">
        <div class="qc-meta"><span>${escapeHtml(q.topic || 'General')}</span><span class="qc-num">${state.cursor + 1} / ${p.length}</span></div>
        <div class="qc-q">${escapeHtml(q.q)}</div>
        <div class="quiz-options">${optsHtml}</div>
        ${answered ? `<div class="quiz-explain"><b>${selected === q.answer ? '✓ Correct.' : '✗ Not quite.'}</b> ${escapeHtml(q.explain || '')}</div>` : ''}
        <div class="quiz-nav">
          <button class="qbtn" data-nav="prev" ${state.cursor === 0 ? 'disabled' : ''}>← Previous</button>
          <button class="qbtn primary" data-nav="next" ${state.cursor === p.length - 1 ? 'disabled' : ''}>Next →</button>
        </div>
      </div>`;
    body.querySelectorAll('.quiz-opt[data-opt]').forEach(b => b.addEventListener('click', () => {
      const idx = cur.i;
      if (state.answers[idx] !== undefined) return;
      state.answers[idx] = +b.getAttribute('data-opt');
      renderQ();
    }));
    body.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => {
      const dir = b.getAttribute('data-nav');
      const pp = pool();
      if (dir === 'next' && state.cursor < pp.length - 1) { state.cursor++; renderQ(); }
      else if (dir === 'prev' && state.cursor > 0) { state.cursor--; renderQ(); }
    }));
    renderStats();
  }

  function showSummary() {
    const p = pool();
    const answered = p.filter(x => state.answers[x.i] !== undefined);
    const correct = answered.filter(x => state.answers[x.i] === x.q.answer).length;
    const pct = answered.length ? Math.round(100 * correct / answered.length) : 0;
    const topicStats = {};
    p.forEach(x => {
      const t = x.q.topic || 'General';
      if (!topicStats[t]) topicStats[t] = { total: 0, answered: 0, correct: 0 };
      topicStats[t].total++;
      if (state.answers[x.i] !== undefined) {
        topicStats[t].answered++;
        if (state.answers[x.i] === x.q.answer) topicStats[t].correct++;
      }
    });
    const rows = Object.entries(topicStats).map(([t,s]) =>
      `<div class="qs-row"><b>${escapeHtml(t)}</b>${s.correct}/${s.answered} correct · ${s.total} total</div>`).join('');
    document.getElementById('quiz-body').innerHTML = `
      <div class="quiz-summary">
        <h3>Summary</h3>
        <div class="qs-score">${correct} / ${answered.length || p.length}</div>
        <div class="qs-pct">${pct}% correct · ${answered.length} of ${p.length} answered</div>
        <div class="qs-breakdown">${rows}</div>
        <div class="quiz-nav" style="justify-content:center">
          <button class="qbtn primary" id="qs-back">Back to Questions</button>
          <button class="qbtn" id="qs-reset">Reset Answers</button>
        </div>
      </div>`;
    document.getElementById('qs-back').addEventListener('click', renderQ);
    document.getElementById('qs-reset').addEventListener('click', () => { if (confirm('Reset all answers?')) { state.answers = {}; renderQ(); } });
  }

  // ── Activate when the quiz tab is shown ──
  function activate() {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    viewEl.classList.add('active');
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === 'quiz'));
    // hide any floating canvas-controls from other tabs
    document.querySelectorAll('.canvas-controls').forEach(c => { if (c.id !== 'quiz-controls') c.style.display = 'none'; });
    if (!state.built) build();
  }

  // ── Bootstrap on DOM ready: add tab button, hook switchTab ──
  function boot() {
    // Find the tab-group container (handles both class and id variants)
    const tg = document.querySelector('#tab-group') || document.querySelector('.tab-group');
    if (tg) {
      // Avoid duplicate
      if (!tg.querySelector('[data-view="quiz"]')) {
        const btn = document.createElement('button');
        btn.className = 'tab';
        btn.dataset.view = 'quiz';
        btn.textContent = '🎯 Quiz';
        btn.addEventListener('click', () => {
          if (typeof window.switchTab === 'function') {
            try { window.switchTab('quiz'); } catch(e) { activate(); }
            // even if host switchTab handles 'quiz', ensure quiz is built & active
            activate();
          } else {
            activate();
          }
        });
        tg.appendChild(btn);
      }
    }
    // Wrap host switchTab so that programmatic switches also work
    if (typeof window.switchTab === 'function') {
      const orig = window.switchTab;
      window.switchTab = function(tab) {
        if (tab === 'quiz') { activate(); return; }
        try { orig(tab); } catch(e) {}
      };
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
