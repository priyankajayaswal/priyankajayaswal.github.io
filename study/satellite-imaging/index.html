[
  {"topic":"EM Radiation","q":"Which region of the electromagnetic spectrum is most commonly used for optical remote sensing?","options":["X-rays","Visible to Near-Infrared","Microwave","Gamma rays"],"answer":1,"explain":"Visible to Near-Infrared (0.4–3 µm) is optimal for optical remote sensing due to strong atmospheric transmission in the optical window, enabling high spatial resolution (~10–30 m for Landsat, Sentinel-2). X-rays and Gamma rays are blocked by the atmosphere; microwave lacks the spectral diversity needed for detailed land-cover classification."},
  {"topic":"EM Radiation","q":"What is atmospheric scattering by particles smaller than the wavelength of radiation called?","options":["Rayleigh scattering","Mie scattering","Non-selective scattering","Absorption"],"answer":0,"explain":"Rayleigh scattering dominates when particles are much smaller than the radiation wavelength, following a 1/λ⁴ relationship—this is why shorter blue wavelengths scatter dramatically more than longer red wavelengths, creating the blue sky. In remote sensing, Rayleigh scattering causes atmospheric haze and must be corrected via algorithms like DOS or physics-based models to recover true surface reflectance."},
  {"topic":"EM Radiation","q":"Which satellite sensor type can penetrate cloud cover?","options":["Optical multispectral","Hyperspectral","Synthetic Aperture Radar (SAR)","Thermal infrared passive"],"answer":2,"explain":"Synthetic Aperture Radar (SAR) is an active microwave sensor that emits energy and measures backscatter, allowing all-weather imaging through clouds—critical for tropical regions and emergency response. Optical sensors (multispectral, hyperspectral, thermal IR) are passive and blocked by clouds. Missions like Sentinel-1 leverage this all-weather advantage for flood monitoring, change detection, and forest assessment."},
  {"topic":"EM Radiation","q":"Spectral reflectance curves unique to material types are called?","options":["Spectral signature","Spectral diversity","Radiance spectrum","Emissivity"],"answer":0,"explain":"Each material—vegetation, water, soil, concrete, asphalt—exhibits a unique spectral reflectance curve (spectral signature) across wavelengths due to its biochemical composition and surface properties. These signatures enable land-cover classification, mineral mapping, and water quality assessment. Hyperspectral sensors capture 50–1000+ narrow bands to distinguish materials with high precision, whereas multispectral sensors (4–15 bands) identify broad categories like forest vs. urban."},
  {"topic":"EM Radiation","q":"Which atmospheric effect reduces remote sensing image contrast?","options":["Refraction","Haze and atmospheric path radiance","Polarization","Parallax"],"answer":1,"explain":"Haze and atmospheric path radiance (scattered light from aerosols and Rayleigh scattering) reduce image contrast and cause misclassification by adding unwanted brightness to every pixel. Atmospheric correction algorithms (Dark Object Subtraction, FLAASH, 6S) estimate and remove this path radiance to recover surface reflectance, essential for multi-temporal analysis and precise vegetation monitoring via NDVI."},
  {"topic":"Sensor Systems","q":"What is the main difference between passive and active sensors?","options":["Passive has better resolution","Active sensors emit their own radiation","Passive sensors are more expensive","Active sensors work only at night"],"answer":1,"explain":"Active sensors (SAR, LIDAR) emit their own radiation and measure returned backscatter, enabling all-weather imaging and precise 3D elevation mapping; passive sensors (optical cameras, thermal IR) detect naturally reflected solar radiation or emitted thermal radiation. Passive optical sensors (Landsat 8, Sentinel-2) excel at spectral discrimination; active SAR (Sentinel-1) dominates in cloud-covered regions and structural analysis."},
  {"topic":"Sensor Systems","q":"Multispectral sensors typically capture data in how many spectral bands?","options":["1-3 bands","4-15 bands","50-100 bands","1000+ bands"],"answer":1,"explain":"Multispectral sensors capture 4–15 discrete spectral bands spanning visible to thermal infrared (e.g., Landsat 8 has 11 bands including TIRS thermal). Hyperspectral sensors capture 50–1000+ contiguous narrow bands with 10–20 nm spectral resolution, enabling mineral identification and water-constituent mapping. Multispectral trade spatial resolution (~30 m) for broader coverage; hyperspectral sacrifice spatial resolution (~200 m) for spectral precision."},
  {"topic":"Sensor Systems","q":"Hyperspectral advantages over multispectral include?","options":["Lower cost","Higher spatial resolution","Better spectral discrimination for material analysis","Faster processing"],"answer":2,"explain":"Hyperspectral sensors resolve narrow absorption features (~10–20 nm bands) across visible, NIR, SWIR ranges, enabling mineral classification, water stress detection, and contaminant identification. Multispectral broad bands miss these fine spectral details; hyperspectral missions like AVIRIS, EnMAP detect specific minerals, pigments, and gases. Trade-off: hyperspectral typically has coarser spatial resolution (100–200 m) versus multispectral's 10–30 m due to data volume and radiative transfer complexity."},
  {"topic":"Sensor Systems","q":"Thermal infrared sensors detect which radiation type?","options":["Reflected solar radiation","Emitted thermal radiation (8-14 µm)","Microwave backscatter","UV radiation"],"answer":1,"explain":"Thermal infrared (TIR) sensors (8–14 µm band) detect thermal radiance emitted by Earth surfaces—brightness temperature directly relates to surface temperature via Planck's Law. TIR is passive, independent of sunlight, enabling night-time land-surface temperature mapping for urban heat islands, water quality, and geothermal exploration. Landsat 8 TIRS and NOAA satellites leverage TIR; other options (reflected solar, microwave) measure reflectance, not temperature."},
  {"topic":"Sensor Systems","q":"What does SAR measure?","options":["Backscatter of emitted microwaves","Thermal emittance","Spectral reflectance","Atmospheric pressure"],"answer":0,"explain":"SAR instruments emit microwave pulses (typically C-band ~5.6 cm, L-band ~23 cm) and measure backscattered intensity and phase, enabling all-weather observation and interferometry. Backscatter intensity depends on surface roughness and dielectric properties—smooth water scatters little (dark), rough vegetation scatters more (bright). Phase coherence allows InSAR for precise deformation monitoring (subsidence, landslides) and elevation mapping, advantages optical sensors lack."},
  {"topic":"Sensor Systems","q":"Which sensor is best for vegetation health monitoring?","options":["Thermal infrared only","Blue and Red bands","Near-Infrared (NIR) and Red bands","Microwave only"],"answer":2,"explain":"Normalized Difference Vegetation Index (NDVI = (NIR−Red)/(NIR+Red)) exploits chlorophyll's high NIR reflectance and strong red absorption to quantify vegetation vigor: NDVI ≥ +0.6 indicates healthy dense vegetation, 0.3–0.6 is moderate cover, <0 is non-vegetated (water, bare soil). Landsat 8 and Sentinel-2 MSI provide these bands; thermal or microwave-only sensors cannot calculate NDVI and miss vegetation phenology essential for agriculture, drought detection, and carbon estimation."},
  {"topic":"Sensor Systems","q":"More spectral bands provide what benefit?","options":["No relationship to resolution","Narrower spectral resolution","Broader spectral resolution","Lower accuracy"],"answer":1,"explain":"Spectral resolution is the bandwidth of each band. More bands spanning the same wavelength range (e.g., 50 bands over 0.4–2.5 µm vs. 11 bands) yield narrower bandwidth per band, revealing finer spectral features (absorption edges, narrow peaks). This enables material discrimination—hyperspectral identifies specific minerals, water constituents, and pigments. Fewer broad bands (multispectral) blur these features, suitable for general land-cover mapping but inadequate for detailed compositional analysis."},
  {"topic":"Orbits","q":"Which orbit provides highest spatial resolution?","options":["Geostationary (GEO)","Low Earth Orbit (LEO)","Medium Earth Orbit (MEO)","Sun-synchronous"],"answer":1,"explain":"Low Earth Orbit (LEO, 160–2000 km altitude) enables high spatial resolution (0.3–30 m) because satellites are close; Geostationary (GEO, ~36,000 km) sacrifices resolution (~1–4 km) for continuous observation of fixed regions. Landsat (LEO, 30 m) provides detailed mapping but 16-day revisit; GOES (GEO, meteorology) monitors weather continuously over Americas. The altitude-resolution trade-off reflects optical system physics: same aperture size sees finer pixels at closer distances."},
  {"topic":"Orbits","q":"Geostationary satellite orbital altitude?","options":["500 km","5,000 km","36,000 km","400,000 km"],"answer":2,"explain":"Geostationary orbit at approximately 35,786 km altitude has an orbital period matching Earth's 24-hour rotation, keeping the satellite fixed above an equatorial location for continuous coverage of ~30% of Earth's disk. This enables real-time weather monitoring, but the extreme distance results in ~1–4 km spatial resolution. GOES, Himawari, and Meteosat use GEO for meteorology; Landsat's LEO offers higher resolution but lower revisit frequency."},
  {"topic":"Orbits","q":"Sun-synchronous orbits maintain what constant characteristic?","options":["Same altitude","Same orbital speed","Same sun illumination angle","Same ground speed"],"answer":2,"explain":"Sun-synchronous orbits precess the orbital plane ~1° per day to track Earth's ~1°/day solar position shift, maintaining consistent solar illumination geometry (same local solar time, sun angle) for every pass over the same ground location. This ensures comparable imagery across seasons and years, critical for change detection, NDVI consistency, and shadow minimization. Landsat, Sentinel-1, Sentinel-2 all use sun-synchronous orbits for this geometric stability."},
  {"topic":"Orbits","q":"What is 'revisit time' or 'temporal resolution'?","options":["Time for one pass","Frequency satellite revisits same location","Image processing duration","Atmospheric correction time"],"answer":1,"explain":"Revisit time (temporal resolution) is the interval at which a satellite re-observes the same ground location. Depends on orbital period, swath width, and constellation design. A 16-day revisit enables seasonal crop monitoring; 1–5 day revisit supports rapid change detection and disaster response. Revisit frequency is inversely proportional to spatial resolution due to data volume constraints: high-resolution commercial satellites (~1 m) typically have longer revisits than medium-resolution Sentinel-2 (10 m, 5-day revisit)."},
  {"topic":"Orbits","q":"Landsat satellite revisit time approximately?","options":["1 day","5 days","16 days","30 days"],"answer":2,"explain":"Landsat 8 and 9 each have a 16-day revisit cycle with 185 km swath width, providing global coverage with manageable data volume (~1000 scenes/day). Constellation redundancy (Landsat 8 + 9) can reduce revisit to 8 days in selected regions. This temporal frequency supports crop phenology monitoring, urban growth tracking, and change detection across diverse timescales. Finer revisits require larger constellations (Sentinel-2 is 5 days via two satellites) or commercial services."},
  {"topic":"Orbits","q":"Which orbit preferred for weather/meteorology?","options":["LEO","GEO","Polar","Inclined 30°"],"answer":1,"explain":"Geostationary satellites are essential for meteorology because they provide continuous, high-temporal-resolution (~15-min updates) observation of cloud systems, severe weather, and atmospheric dynamics over large regions (Americas for GOES, Asia-Pacific for Himawari). LEO satellites like NOAA AVHRR provide global coverage but only 2–4 passes/day, insufficient for real-time weather forecasting and hurricane tracking. GEO's apparent stationarity enables 24/7 vigilance."},
  {"topic":"Resolution","q":"Spatial resolution refers to?","options":["Number of spectral bands","Ground area represented by each pixel","Time variation ability","Brightness precision"],"answer":1,"explain":"Spatial resolution (also ground sample distance, GSD) is the ground area covered by each pixel—e.g., Landsat 8's 30 m resolution means each pixel represents a 30×30 m area. Finer resolution (1 m, 3 m) reveals individual structures and small features; coarser resolution (1 km) shows regional patterns with less storage and processing cost. Resolution is limited by sensor optics, orbital altitude, and noise; finer sensors often sacrifice temporal or spectral resolution or have longer revisit times due to data volume."},
  {"topic":"Resolution","q":"Spectral resolution measured by?","options":["Ground distance per pixel","Wavelength band width (nanometers)","Revisits per year","Radiometric bit depth"],"answer":1,"explain":"Spectral resolution is the wavelength bandwidth of each spectral channel—narrow bands (10 nm in hyperspectral) reveal fine absorption features; broad bands (100+ nm in multispectral) blur spectral details. Landsat 8's Red band is ~70 nm wide; hyperspectral AVIRIS has ~10 nm bands. Higher spectral resolution enables mineral identification, water-constituent mapping, and vegetation pigment analysis but increases data volume and requires radiometric calibration precision."},
  {"topic":"Resolution","q":"Temporal resolution refers to?","options":["Processing duration","Revisit frequency - how often satellite observes area","Wavelength precision","Geolocation accuracy"],"answer":1,"explain":"Temporal resolution is the frequency at which a satellite observes the same location, measured in days. A 1-day temporal resolution means daily observations; 16-day means observations ~twice monthly. Temporal resolution enables change detection (floods, fire, deforestation), phenology tracking (crop growth, vegetation seasonality), and time-series analysis. Trade-offs: longer revisit (Landsat 16 days) accommodates better spatial/spectral resolution; shorter revisit (Planet's ~daily, Sentinel-2's 5 days) requires constellation or coarser resolution."},
  {"topic":"Resolution","q":"Radiometric resolution determines?","options":["Geographic accuracy","Number of brightness levels/gray levels","Spectral band width","Revisit frequency"],"answer":1,"explain":"Radiometric resolution (bit depth) determines the number of brightness/intensity levels per pixel: 8-bit = 256 levels, 12-bit = 4096, 16-bit = 65,536. Higher radiometric resolution improves sensitivity to subtle reflectance differences (useful for vegetation stress, water quality) and reduces quantization errors. Landsat 8 provides 12-bit data; many commercial providers deliver 11–16-bit. Low radiometric resolution (8-bit) causes banding artifacts and information loss in shadows and bright areas."},
  {"topic":"Resolution","q":"Typical trade-off between spatial and spectral resolution?","options":["No trade-off","Higher spatial = higher spectral","Higher spatial often = lower spectral","Independent"],"answer":2,"explain":"High-spatial-resolution optical sensors (0.3–1 m, commercial satellites) typically have 3–4 multispectral bands because the massive data volume (~terabytes/scene) constrains spectral coverage. High-spectral-resolution sensors (hyperspectral, 50–250 bands) usually have coarser spatial resolution (100–200 m) to remain tractable. Landsat (30 m, 11 bands) and Sentinel-2 (10 m, 13 bands) balance both; Sentinel-1 SAR mitigates this by trading spectral for temporal resolution and all-weather capability."},
  {"topic":"Resolution","q":"Best spatial resolution available?","options":["Landsat (30 m)","Sentinel-2 (10 m)","Commercial satellites (0.3-1 m)","MODIS (250-1000 m)"],"answer":2,"explain":"Commercial high-resolution optical satellites (WorldView-3, Maxar's Tiros/WorldView constellation) achieve 0.3–0.5 m panchromatic spatial resolution, enabling building-scale urban mapping, infrastructure assessment, and precise change detection. Multispectral bands from these sensors are often 1.2–1.8 m due to radiometric constraints. Landsat (30 m), Sentinel-2 (10 m), and MODIS (250–1000 m) sacrifice this precision for global coverage, open data access, and sustained funding—commercial satellites excel for site-specific intelligence."},
  {"topic":"Atmospheric Correction","q":"Why atmospheric correction necessary?","options":["File compression","Remove path radiance/aerosol effects reducing contrast","Increase spatial resolution","Convert to RGB"],"answer":1,"explain":"Atmospheric correction is essential to convert satellite-measured at-sensor radiance into surface reflectance by removing path radiance (scattered light from aerosols, Rayleigh scattering) and atmospheric transmission effects. This enables meaningful multi-temporal and multi-sensor comparison, accurate NDVI calculations, and spectral classification. Without correction, haze and seasonal aerosol changes dominate the signal, making vegetation indices and water quality metrics unreliable. Algorithms include Dark Object Subtraction (DOS), FLAASH, 6S, and physics-based models."},
  {"topic":"Atmospheric Correction","q":"Atmospheric correction converts to?","options":["Latitude/Longitude","Top-of-Atmosphere reflectance","Surface reflectance","Digital Numbers"],"answer":2,"explain":"Atmospheric correction follows a chain: at-sensor radiance (digital numbers) → top-of-atmosphere (TOA) reflectance (accounting for solar irradiance and geometry) → surface reflectance (removing atmospheric effects). Surface reflectance is the true reflectance of ground materials, independent of atmospheric conditions, enabling cross-temporal and cross-sensor analysis. Landsat Collection 2 and Sentinel-2 Level-2A products provide surface reflectance; Level-1 products stop at TOA reflectance and require user-applied corrections."},
  {"topic":"Atmospheric Correction","q":"Key parameter for atmospheric effect modeling?","options":["Solar zenith angle","Aerosol Optical Depth (AOD)","Satellite altitude","Pressure only"],"answer":1,"explain":"Aerosol Optical Depth (AOD) quantifies aerosol concentration in the atmosphere (0.1 = clear, >0.5 = hazy) and is the primary input for physics-based atmospheric correction models (FLAASH, 6S). AOD can be retrieved from satellite imagery (MODIS aerosol product, Sentinel-5P) or fixed climatologically. Other approaches: Dark Object Subtraction (DOS) assumes darkest pixels are water (zero reflectance) to estimate path radiance; empirical line calibration uses ground reflectance targets. Choice depends on availability of validation data and required accuracy."},
  {"topic":"Atmospheric Correction","q":"Simplest atmospheric correction approach?","options":["Physics-based model","Neural networks","Dark Object Subtraction (DOS)","Machine learning"],"answer":2,"explain":"Dark Object Subtraction (DOS) is a simple atmospheric correction assuming the darkest pixels in an image are water or very dark soil with near-zero reflectance at all wavelengths. The minimum observed value minus expected noise is attributed to path radiance, then subtracted from all pixels. DOS is computationally fast, requires no ancillary data, but inaccurate for scenes without water or with complex aerosol profiles. Physics-based methods (FLAASH, 6S) using radiative transfer and AOD are more accurate but computationally expensive and require auxiliary data."},
  {"topic":"Image Analysis","q":"NDVI importance?","options":["Noise detection","Measures vegetation health (NIR-Red)/(NIR+Red)","Near-Infrared variance","Noise determination"],"answer":1,"explain":"Normalized Difference Vegetation Index (NDVI = (NIR−Red)/(NIR+Red)) is the most widely used vegetation metric: NDVI > 0.6 indicates dense, healthy vegetation; 0.3–0.6 is moderate cover; 0–0.3 is sparse vegetation or mixed surfaces; <0 is water or bare soil. NDVI enables crop yield prediction, drought monitoring, deforestation detection, and carbon sequestration assessment. Applications range from precision agriculture to climate monitoring; limitations include saturation in dense forests and sensitivity to atmospheric residuals, mitigated by enhanced indices (EVI, NDVI8) used in MODIS products."},
  {"topic":"Image Analysis","q":"Pansharpening combines?","options":["Multiple passes","Low-res multispectral + high-res panchromatic","Radar + optical","Thermal + visible"],"answer":1,"explain":"Pansharpening fuses high-spatial-resolution panchromatic (single grayscale band, 10–15 m for Landsat) with lower-resolution multispectral bands (30 m) to produce high-resolution multispectral imagery retaining spectral fidelity and spatial sharpness. Techniques include Brovey transform, HPFA (high-pass filter addition), and PCA. Result: 15–10 m multispectral (8 bands) suitable for urban mapping and land-cover classification, whereas raw Landsat multispectral is 30 m (coarser than panchromatic alone)."},
  {"topic":"Image Analysis","q":"PCA in remote sensing?","options":["Removes clouds","Decorrelates/compresses bands, enhances contrast","Improves spatial resolution","Corrects geometric distortion"],"answer":1,"explain":"Principal Component Analysis (PCA) decorrelates multispectral bands via eigenvalue decomposition, producing uncorrelated orthogonal components ranked by variance. First few components capture most information with reduced data volume (compression); transformed data enhances contrast and separates subtle patterns lost in raw correlated bands. Applied for band selection, decorrelation stretching (improving visualization), noise reduction, and change detection. PCA does not improve absolute accuracy but enhances visualization and computational efficiency—complementary to atmospheric correction."},
  {"topic":"Image Analysis","q":"Classification assigns pixels to?","options":["Wavelength bands","Land cover/land use classes (urban, forest, water, agriculture)","Coordinate systems","Orbit types"],"answer":1,"explain":"Classification assigns each pixel to one of predefined land-use/land-cover (LULC) classes—e.g., urban, forest, grassland, water, agriculture—based on spectral reflectance patterns in multispectral bands. Supervised methods (random forest, SVM) require training samples; unsupervised (k-means, ISODATA) cluster pixels without labels. Classification accuracy depends on spatial resolution (30 m Landsat struggles with mixed pixels), spectral information (multispectral adequate for broad classes; hyperspectral needed for detailed mapping), and training data quality. Output: thematic maps for land-cover monitoring, urban expansion, and ecosystem assessment."},
  {"topic":"Applications","q":"Agriculture satellite imaging uses?","options":["Pest identification only","Crop health (NDVI), yield prediction, irrigation, drought detection","Soil pH measurement","Weather forecasting"],"answer":1,"explain":"Satellite remote sensing revolutionizes precision agriculture: NDVI time-series track crop phenology and detect water/nutrient stress weeks before visual symptoms; multispectral reflectance identifies pest outbreaks and disease; high-resolution imagery (1–3 m) enables field-scale yield prediction and irrigation optimization. Sentinel-2 (10 m, 5-day revisit) is ideal for operational monitoring; Landsat provides 16-day historical data. Applications reduce input costs, improve yields, support sustainable intensification, and quantify agricultural productivity for food security and carbon credits."},
  {"topic":"Applications","q":"Climate/environmental monitoring includes?","options":["Local weather only","Sea ice, temperature, snow cover, deforestation, wetlands","Urban planning","Military surveillance"],"answer":1,"explain":"Satellite monitoring tracks critical climate parameters: sea surface temperature (TIR), sea ice extent and thickness (SAR, passive microwave), snow cover and glacier dynamics (multispectral NDSI), vegetation phenology and productivity (NDVI time-series), deforestation and forest degradation (optical + SAR change detection), wetland extent (SAR), and atmospheric CO₂/methane (TROPOMI, GeoCarb). These datasets inform climate models, IPCC assessments, and carbon accounting. Long-term archives (Landsat 50 years, MODIS 25 years) enable trend detection and attribution—foundational to climate science."},
  {"topic":"Applications","q":"Defense/security applications?","options":["Agriculture forecasting","Border surveillance, infrastructure, change detection, disaster response","Yield prediction","Vegetation monitoring"],"answer":1,"explain":"Defense and security leverage satellite imagery for border surveillance (detecting crossing points, smuggling routes), infrastructure assessment (airfield readiness, supply line monitoring), conflict analysis (damage assessment, displacement detection), and disaster response (rapid mapping post-earthquake or flood). High-resolution optical (0.3–1 m) provides precise geolocation and change detection; SAR penetrates clouds and darkness for persistent surveillance. Publicly available Sentinel-1/2 data supports humanitarian applications; classified imagery provides operational advantage. Dual-use concerns drive remote-sensing export controls."},
  {"topic":"Data & Sensors","q":"Landsat 8 typical spatial resolution?","options":["1 meter","10 meters","30 meters","100 meters"],"answer":2,"explain":"Landsat 8 provides 30 m panchromatic and multispectral bands (11 bands total, including thermal), and 15 m panchromatic for pan-sharpening. This balance supports continental-scale mapping with manageable data volume (~1.2 GB/scene) and archived coverage since 1972. Spatial resolution suffices for land-cover classification, vegetation monitoring, water body mapping, and urban growth; insufficient for building-scale detail (use commercial 0.3–1 m satellites). Radiometric 12-bit depth and atmospheric correction to surface reflectance (Collection 2) enable quantitative analysis—foundational for climate, agriculture, and disaster monitoring."},
  {"topic":"Data & Sensors","q":"Sentinel-2A temporal resolution?","options":["1 day","5 days","10 days","20 days"],"answer":1,"explain":"Sentinel-2A and 2B form a constellation with phased orbits providing 5-day global revisit frequency (each satellite 10 days, offset 5 days). Combined with Landsat 8/9 (8-day revisit when both operational), users access 2–3-day revisit in temperate regions, enabling rapid crop damage assessment, flood mapping, and fire monitoring. Sentinel-2's 10–20 m multispectral resolution, 13 bands (including SWIR for water/burn detection), open access policy, and ESA commitment make it the reference for operational land monitoring—critical for agriculture, disaster response, and climate tracking."}
]

</script>
<script>
(function() {
  const dataEl = document.getElementById('quiz-data');
  if (!dataEl) return;
  let questions;
  try { questions = JSON.parse(dataEl.textContent); } catch(e) { console.error('Quiz JSON parse error', e); return; }
  if (!Array.isArray(questions) || !questions.length) return;

  // ── Inject CSS ──
  const css = `
  #view-quiz { overflow-y: auto; padding-top: 60px; height: 100vh; }
  .quiz-wrap { max-width: 880px; margin: 0 auto; padding: 24px 24px 80px; }
  .quiz-header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom: 12px; }
  .quiz-header h2 { font-size: 22px; color: #58a6ff; }
  .quiz-header .quiz-sub { font-size: 12px; color: #8b949e; margin-top: 2px; }
  .quiz-stats { display:flex; gap:10px; flex-wrap:wrap; }
  .quiz-stat { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:8px 14px; font-size:12px; color:#8b949e; }
  .quiz-stat b { color:#c9d1d9; font-size:15px; display:block; }
  .quiz-stat.ok b { color:#7ee787; }
  .quiz-stat.bad b { color:#ff7b72; }
  .quiz-filters { display:flex; flex-wrap:wrap; gap:6px; margin: 12px 0 16px; }
  .quiz-chip { background:#0d1117; border:1px solid #30363d; color:#8b949e; padding:5px 12px; border-radius:16px; cursor:pointer; font-size:12px; transition:all .15s; }
  .quiz-chip:hover { color:#c9d1d9; border-color:#58a6ff; }
  .quiz-chip.active { background:#1f6feb; color:#fff; border-color:#58a6ff; }
  .quiz-actions { display:flex; gap:8px; flex-wrap:wrap; margin-bottom: 14px; }
  .quiz-actions .qbtn { background:#21262d; border:1px solid #30363d; color:#c9d1d9; padding:6px 14px; border-radius:6px; cursor:pointer; font-size:12px; }
  .quiz-actions .qbtn:hover { background:#30363d; border-color:#58a6ff; }
  .quiz-progress { height:6px; background:#161b22; border-radius:4px; overflow:hidden; margin-bottom:16px; border:1px solid #30363d; }
  .quiz-progress > div { height:100%; background:linear-gradient(90deg,#1f6feb,#58a6ff); transition:width .3s; }
  .quiz-card { background:#161b22; border:1px solid #30363d; border-radius:12px; padding:22px 26px; box-shadow:0 4px 18px rgba(0,0,0,.3); }
  .quiz-card .qc-meta { font-size:11px; color:#58a6ff; font-weight:600; text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; display:flex; justify-content:space-between; }
  .quiz-card .qc-meta .qc-num { color:#8b949e; }
  .quiz-card .qc-q { font-size:16px; color:#c9d1d9; line-height:1.55; font-weight:600; margin-bottom:16px; }
  .quiz-options { display:flex; flex-direction:column; gap:8px; }
  .quiz-opt { background:#0d1117; border:1px solid #30363d; color:#c9d1d9; padding:11px 16px; border-radius:8px; cursor:pointer; text-align:left; font-size:14px; transition:all .15s; line-height:1.4; display:flex; align-items:flex-start; gap:10px; }
  .quiz-opt:hover:not(.disabled) { border-color:#58a6ff; background:#161b22; }
  .quiz-opt .opt-letter { flex-shrink:0; width:22px; height:22px; border-radius:50%; background:#21262d; color:#8b949e; font-size:11px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; }
  .quiz-opt.correct { border-color:#3fb950; background:rgba(63,185,80,.08); }
  .quiz-opt.correct .opt-letter { background:#3fb950; color:#fff; }
  .quiz-opt.wrong { border-color:#f85149; background:rgba(248,81,73,.08); }
  .quiz-opt.wrong .opt-letter { background:#f85149; color:#fff; }
  .quiz-opt.disabled { cursor:default; }
  .quiz-explain { margin-top:14px; padding:12px 16px; background:#0d1117; border-left:3px solid #58a6ff; border-radius:6px; font-size:13px; color:#8b949e; line-height:1.6; }
  .quiz-explain b { color:#58a6ff; }
  .quiz-nav { display:flex; justify-content:space-between; gap:10px; margin-top:18px; }
  .quiz-nav .qbtn { padding:8px 18px; font-size:13px; background:#21262d; border:1px solid #30363d; color:#c9d1d9; border-radius:6px; cursor:pointer; }
  .quiz-nav .qbtn:hover { background:#30363d; border-color:#58a6ff; }
  .quiz-nav .qbtn.primary { background:#1f6feb; border-color:#58a6ff; color:#fff; }
  .quiz-nav .qbtn.primary:hover { background:#388bfd; }
  .quiz-nav .qbtn:disabled { opacity:.4; cursor:not-allowed; }
  .quiz-empty { text-align:center; color:#484f58; padding:60px 20px; font-style:italic; }
  .quiz-summary { background:#161b22; border:1px solid #30363d; border-radius:12px; padding:32px; text-align:center; }
  .quiz-summary h3 { color:#58a6ff; font-size:22px; margin-bottom:6px; }
  .quiz-summary .qs-score { font-size:56px; font-weight:700; color:#7ee787; margin:12px 0; }
  .quiz-summary .qs-pct { color:#8b949e; font-size:14px; margin-bottom:16px; }
  .quiz-summary .qs-breakdown { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:8px; margin:20px 0; text-align:left; }
  .quiz-summary .qs-row { background:#0d1117; border:1px solid #30363d; border-radius:8px; padding:8px 12px; font-size:12px; color:#8b949e; }
  .quiz-summary .qs-row b { display:block; color:#c9d1d9; font-size:14px; margin-bottom:2px; }
  @media (max-width: 600px) {
    .quiz-wrap { padding:14px 12px 80px; }
    .quiz-card { padding:16px; }
    .quiz-card .qc-q { font-size:15px; }
    .quiz-opt { font-size:13px; padding:10px 12px; }
  }`;
  const styleEl = document.createElement('style');
  styleEl.textContent = css;
  document.head.appendChild(styleEl);

  // ── Inject view container ──
  function ensureView() {
    let view = document.getElementById('view-quiz');
    if (!view) {
      view = document.createElement('div');
      view.id = 'view-quiz';
      view.className = 'view';
      view.innerHTML = '<div id="quiz-container"></div>';
      document.body.appendChild(view);
    }
    return view;
  }
  const viewEl = ensureView();

  // ── State ──
  const state = { filter: 'ALL', order: [], cursor: 0, answers: {}, built: false };

  function shuffleArr(a) { for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function topics() { return ['ALL', ...Array.from(new Set(questions.map(q => q.topic || 'General')))]; }
  function pool() { return state.order.map(i => ({i, q: questions[i]})).filter(x => state.filter === 'ALL' || (x.q.topic||'General') === state.filter); }

  function build() {
    state.order = questions.map((_, i) => i);
    shuffleArr(state.order);
    const root = document.getElementById('quiz-container');
    root.innerHTML = `
      <div class="quiz-wrap">
        <div class="quiz-header">
          <div>
            <h2>🎯 Knowledge Quiz</h2>
            <div class="quiz-sub">${questions.length} questions across ${topics().length - 1} topics — pick a topic or take it all.</div>
          </div>
          <div class="quiz-stats" id="quiz-stats"></div>
        </div>
        <div class="quiz-filters" id="quiz-filters"></div>
        <div class="quiz-actions">
          <button class="qbtn" data-act="shuffle">🔀 Shuffle</button>
          <button class="qbtn" data-act="reset">↺ Reset Answers</button>
          <button class="qbtn" data-act="next-unans">⏭ Next Unanswered</button>
          <button class="qbtn" data-act="summary">📊 Summary</button>
        </div>
        <div class="quiz-progress"><div id="quiz-progress-bar" style="width:0%"></div></div>
        <div id="quiz-body"></div>
      </div>`;
    root.querySelectorAll('.qbtn[data-act]').forEach(b => b.addEventListener('click', () => {
      const a = b.getAttribute('data-act');
      if (a === 'shuffle') { shuffleArr(state.order); state.cursor = 0; renderQ(); }
      else if (a === 'reset') { if (confirm('Reset all answers?')) { state.answers = {}; renderQ(); } }
      else if (a === 'next-unans') { const p = pool(); const n = p.findIndex(x => state.answers[x.i] === undefined); if (n >= 0) { state.cursor = n; renderQ(); } }
      else if (a === 'summary') { showSummary(); }
    }));
    renderFilters();
    renderQ();
    state.built = true;
  }

  function renderFilters() {
    const el = document.getElementById('quiz-filters');
    el.innerHTML = '';
    topics().forEach(t => {
      const count = t === 'ALL' ? questions.length : questions.filter(q => (q.topic || 'General') === t).length;
      const chip = document.createElement('button');
      chip.className = 'quiz-chip' + (t === state.filter ? ' active' : '');
      chip.textContent = t === 'ALL' ? `All (${count})` : `${t} (${count})`;
      chip.addEventListener('click', () => { state.filter = t; state.cursor = 0; renderFilters(); renderQ(); });
      el.appendChild(chip);
    });
  }

  function renderStats() {
    const p = pool();
    const answered = p.filter(x => state.answers[x.i] !== undefined);
    const correct = answered.filter(x => state.answers[x.i] === x.q.answer).length;
    const wrong = answered.length - correct;
    const el = document.getElementById('quiz-stats');
    if (el) el.innerHTML = `
      <div class="quiz-stat"><b>${p.length}</b>Questions</div>
      <div class="quiz-stat ok"><b>${correct}</b>Correct</div>
      <div class="quiz-stat bad"><b>${wrong}</b>Wrong</div>
      <div class="quiz-stat"><b>${answered.length}/${p.length}</b>Done</div>`;
    const pct = p.length ? Math.round(100 * answered.length / p.length) : 0;
    const bar = document.getElementById('quiz-progress-bar');
    if (bar) bar.style.width = pct + '%';
  }

  function renderQ() {
    const p = pool();
    const body = document.getElementById('quiz-body');
    if (!p.length) { body.innerHTML = '<div class="quiz-empty">No questions for this filter.</div>'; renderStats(); return; }
    if (state.cursor >= p.length) state.cursor = p.length - 1;
    if (state.cursor < 0) state.cursor = 0;
    const cur = p[state.cursor];
    const q = cur.q;
    const selected = state.answers[cur.i];
    const answered = selected !== undefined;
    const optsHtml = q.options.map((opt, i) => {
      let cls = '';
      if (answered) { if (i === q.answer) cls = 'correct'; else if (i === selected) cls = 'wrong'; cls += ' disabled'; }
      const letter = String.fromCharCode(65 + i);
      return `<button class="quiz-opt ${cls}" data-opt="${i}" ${answered ? 'disabled' : ''}>
        <span class="opt-letter">${letter}</span><span>${escapeHtml(opt)}</span>
      </button>`;
    }).join('');
    body.innerHTML = `
      <div class="quiz-card">
        <div class="qc-meta"><span>${escapeHtml(q.topic || 'General')}</span><span class="qc-num">${state.cursor + 1} / ${p.length}</span></div>
        <div class="qc-q">${escapeHtml(q.q)}</div>
        <div class="quiz-options">${optsHtml}</div>
        ${answered ? `<div class="quiz-explain"><b>${selected === q.answer ? '✓ Correct.' : '✗ Not quite.'}</b> ${escapeHtml(q.explain || '')}</div>` : ''}
        <div class="quiz-nav">
          <button class="qbtn" data-nav="prev" ${state.cursor === 0 ? 'disabled' : ''}>← Previous</button>
          <button class="qbtn primary" data-nav="next" ${state.cursor === p.length - 1 ? 'disabled' : ''}>Next →</button>
        </div>
      </div>`;
    body.querySelectorAll('.quiz-opt[data-opt]').forEach(b => b.addEventListener('click', () => {
      const idx = cur.i;
      if (state.answers[idx] !== undefined) return;
      state.answers[idx] = +b.getAttribute('data-opt');
      renderQ();
    }));
    body.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => {
      const dir = b.getAttribute('data-nav');
      const pp = pool();
      if (dir === 'next' && state.cursor < pp.length - 1) { state.cursor++; renderQ(); }
      else if (dir === 'prev' && state.cursor > 0) { state.cursor--; renderQ(); }
    }));
    renderStats();
  }

  function showSummary() {
    const p = pool();
    const answered = p.filter(x => state.answers[x.i] !== undefined);
    const correct = answered.filter(x => state.answers[x.i] === x.q.answer).length;
    const pct = answered.length ? Math.round(100 * correct / answered.length) : 0;
    const topicStats = {};
    p.forEach(x => {
      const t = x.q.topic || 'General';
      if (!topicStats[t]) topicStats[t] = { total: 0, answered: 0, correct: 0 };
      topicStats[t].total++;
      if (state.answers[x.i] !== undefined) {
        topicStats[t].answered++;
        if (state.answers[x.i] === x.q.answer) topicStats[t].correct++;
      }
    });
    const rows = Object.entries(topicStats).map(([t,s]) =>
      `<div class="qs-row"><b>${escapeHtml(t)}</b>${s.correct}/${s.answered} correct · ${s.total} total</div>`).join('');
    document.getElementById('quiz-body').innerHTML = `
      <div class="quiz-summary">
        <h3>Summary</h3>
        <div class="qs-score">${correct} / ${answered.length || p.length}</div>
        <div class="qs-pct">${pct}% correct · ${answered.length} of ${p.length} answered</div>
        <div class="qs-breakdown">${rows}</div>
        <div class="quiz-nav" style="justify-content:center">
          <button class="qbtn primary" id="qs-back">Back to Questions</button>
          <button class="qbtn" id="qs-reset">Reset Answers</button>
        </div>
      </div>`;
    document.getElementById('qs-back').addEventListener('click', renderQ);
    document.getElementById('qs-reset').addEventListener('click', () => { if (confirm('Reset all answers?')) { state.answers = {}; renderQ(); } });
  }

  // ── Activate when the quiz tab is shown ──
  function activate() {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    viewEl.classList.add('active');
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === 'quiz'));
    // hide any floating canvas-controls from other tabs
    document.querySelectorAll('.canvas-controls').forEach(c => { if (c.id !== 'quiz-controls') c.style.display = 'none'; });
    if (!state.built) build();
  }

  // ── Bootstrap on DOM ready: add tab button, hook switchTab ──
  function boot() {
    // Find the tab-group container (handles both class and id variants)
    const tg = document.querySelector('#tab-group') || document.querySelector('.tab-group');
    if (tg) {
      // Avoid duplicate
      if (!tg.querySelector('[data-view="quiz"]')) {
        const btn = document.createElement('button');
        btn.className = 'tab';
        btn.dataset.view = 'quiz';
        btn.textContent = '🎯 Quiz';
        btn.addEventListener('click', () => {
          if (typeof window.switchTab === 'function') {
            try { window.switchTab('quiz'); } catch(e) { activate(); }
            // even if host switchTab handles 'quiz', ensure quiz is built & active
            activate();
          } else {
            activate();
          }
        });
        tg.appendChild(btn);
      }
    }
    // Wrap host switchTab so that programmatic switches also work
    if (typeof window.switchTab === 'function') {
      const orig = window.switchTab;
      window.switchTab = function(tab) {
        if (tab === 'quiz') { activate(); return; }
        try { orig(tab); } catch(e) {}
      };
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
