{"topic":"Divide & Conquer","q":"Binary Search on the Answer (BSTA) works when:","options":["The array is sorted","A property is monotonic (all 'no's followed by 'yes's or vice versa)","The target is at index 0","Only for unique elements"],"answer":1,"explain":"BSTA requires a monotonic property: as we increase the answer, the property changes from false to true or vice versa."},
{"topic":"Divide & Conquer","q":"Merge Sort divides the array in half and sorts recursively. Its recurrence is:","options":["T(n) = n^2","T(n) = 2T(n/2) + n","T(n) = T(n-1) + n","T(n) = T(n/2) + 1"],"answer":1,"explain":"Merge Sort: T(n) = 2T(n/2) + O(n) for dividing and merging, solving to O(n log n)."},
{"topic":"Divide & Conquer","q":"Ternary Search finds the max of a unimodal function in:","options":["O(n)","O(log n)","O(log^2 n)","O(n^2)"],"answer":1,"explain":"Ternary search divides into thirds and recurses, achieving O(log n) iterations."},
{"topic":"Greedy","q":"The Greedy algorithm for coin change (using max denominations first) fails when:","options":["Coins are sorted","Denominations don't form a 'canonical' system","Only one coin exists","Coins are worth 1"],"answer":1,"explain":"Greedy coin change fails for non-canonical systems (e.g., coins {1, 3, 4} for total 6: greedy gives 4+1+1, optimal is 3+3)."},
{"topic":"Greedy","q":"Huffman Coding is a greedy algorithm that optimizes:","options":["Sorting speed","Prefix-free code length (minimizing average bits per character)","Memory usage","Parsing time"],"answer":1,"explain":"Huffman builds a tree by repeatedly merging lowest-frequency nodes, minimizing average code length."},
{"topic":"Greedy","q":"Interval Scheduling Maximization: to select the most non-overlapping intervals, greedy sorts by:","options":["Start time ascending","End time ascending","Interval length","Reverse start time"],"answer":1,"explain":"Sorting by end time and greedily selecting intervals with earliest end times maximizes the count."},
{"topic":"Greedy","q":"Dijkstra's algorithm is greedy because it:","options":["Picks arbitrary edges","Always picks the unvisited node with smallest known distance","Sorts all edges first","Uses priority queues only for fun"],"answer":1,"explain":"Dijkstra greedily selects the nearest unvisited node, guaranteed to find shortest paths for non-negative weights."},
{"topic":"DP","q":"Dynamic Programming applies when a problem has:","options":["Only one solution","Overlapping subproblems and optimal substructure","Linear structure","Unique elements"],"answer":1,"explain":"DP requires: (1) overlapping subproblems (reuse solutions) and (2) optimal substructure (optimal solution from optimal subsolutions)."},
{"topic":"DP","q":"The 0-1 Knapsack problem uses DP with state dp[i][w] representing:","options":["The i-th item's weight","Max value using first i items and capacity w","Whether item i fits","The weight of item i"],"answer":1,"explain":"dp[i][w] = max value using items 0..i-1 with weight limit w."},
{"topic":"DP","q":"Longest Increasing Subsequence (LIS) can be solved in O(n log n) using:","options":["Nested loops","Memoization only","Binary search with a DP array","Greedy"],"answer":2,"explain":"DP tracks smallest tail[i] for LIS of length i, using binary search to find the right position for each element."},
{"topic":"DP","q":"Bitmask DP for the Travelling Salesman Problem uses state dp[mask][i]:","options":["Mask = visited cities, i = current city; stores min distance","Mask = city indices, i = iterations","Mask = weights, i = distance","Mask = priorities, i = next city"],"answer":0,"explain":"dp[mask][i] = min distance to visit cities in mask and end at city i. Mask tracks visited cities."},
{"topic":"DP","q":"DP on DAG (Directed Acyclic Graph) computes longest paths by:","options":["BFS from all nodes","Topological sort then DP","Storing all paths","Using Dijkstra"],"answer":1,"explain":"Topological sort ensures each node is processed after all predecessors, enabling DP for longest/shortest paths."},
{"topic":"Graph","q":"DFS is best for finding:","options":["Shortest path in unweighted graphs","Connected components and cycles","MST","Shortest unweighted paths"],"answer":1,"explain":"DFS explores deeply and easily detects cycles, connected components, and topological order."},
{"topic":"Graph","q":"BFS guarantees the shortest path in:","options":["All graphs","Weighted graphs only","Unweighted graphs (all edges weight 1)","DAGs only"],"answer":2,"explain":"BFS explores level-by-level. In unweighted graphs, first arrival at a node is via shortest path. Weighted graphs need Dijkstra."},
{"topic":"Graph","q":"Topological Sort is only valid for:","options":["All graphs","Weighted graphs","Directed Acyclic Graphs (DAGs)","Bipartite graphs"],"answer":2,"explain":"Topological sort requires no cycles. A DAG always has a valid topological order."},
{"topic":"Graph","q":"In topological sort, nodes with no incoming edges are processed:","options":["Last","First (via queue/stack)","Randomly","Not at all"],"answer":1,"explain":"Kahn's algorithm: start with in-degree 0 nodes, process them, update neighbors' in-degrees."},
{"topic":"Shortest Paths","q":"Dijkstra's algorithm fails on graphs with:","options":["Multiple sources","Negative edge weights","Cycles","Many edges"],"answer":1,"explain":"Dijkstra assumes non-negative weights. Negative edges break its greedy property."},
{"topic":"Shortest Paths","q":"Bellman-Ford detects negative cycles by:","options":["Checking heap validity","Running relaxation V times, then checking for further improvements","BFS only","Sorting edges"],"answer":1,"explain":"If a V-th iteration updates any distance, a negative cycle exists."},
{"topic":"Shortest Paths","q":"Floyd-Warshall computes all-pairs shortest paths in:","options":["O(V^2 log V)","O(V^3)","O(V * E)","O(V^2)"],"answer":1,"explain":"Floyd-Warshall: three nested loops over vertices, O(V^3) time and space."},
{"topic":"Shortest Paths","q":"When should you use Dijkstra over Floyd-Warshall for single-source shortest paths?","options":["Never","Always","When edges are non-negative and V is large","When the graph is dense"],"answer":2,"explain":"Dijkstra is O(E log V), better than Floyd's O(V^3) for sparse graphs and large V."},
{"topic":"MST","q":"Kruskal's MST algorithm works by:","options":["Starting from a node and growing a tree","Sorting edges and adding them if they don't create a cycle","Removing the heaviest edge","Using DFS"],"answer":1,"explain":"Kruskal: sort edges by weight, greedily add non-cycle edges using Union-Find."},
{"topic":"MST","q":"Prim's MST algorithm is similar to:","options":["DFS","BFS","Dijkstra","Topological sort"],"answer":2,"explain":"Prim grows a tree from a starting node, always adding the minimum-weight edge to a new node, like Dijkstra."},
{"topic":"MST","q":"For a graph with V vertices, an MST has exactly:","options":["V edges","V - 1 edges","V + 1 edges","V^2 edges"],"answer":1,"explain":"A tree on V nodes has exactly V-1 edges and is acyclic."},
{"topic":"Graph","q":"Strongly Connected Components (SCC) are maximal subgraphs where:","options":["All nodes are connected","Every node reaches every other node","Nodes form a cycle","One path connects all nodes"],"answer":1,"explain":"SCC: every pair of vertices has a path to each other in both directions."},
{"topic":"Graph","q":"A bipartite graph has:","options":["No cycles","Only two nodes","Vertices partitionable into two sets with edges only between sets","All vertices connected"],"answer":2,"explain":"Bipartite: vertices split into two groups; edges only go between groups (no edges within groups)."},
{"topic":"Graph","q":"To check if a graph is bipartite, use:","options":["DFS with 2-coloring","Topological sort","MST algorithm","Dijkstra"],"answer":0,"explain":"2-coloring via BFS/DFS: if you can color all vertices with 2 colors such that adjacent vertices differ, it's bipartite."},
{"topic":"Number Theory","q":"The Sieve of Eratosthenes finds all primes up to n in:","options":["O(n log log n)","O(n log n)","O(n^2)","O(n)"],"answer":0,"explain":"Sieve iterates through multiples of each prime, achieving O(n log log n) time."},
{"topic":"Number Theory","q":"To compute (a^b) mod p efficiently for large b, use:","options":["Repeated multiplication","Binary exponentiation","Fermat's little theorem only","Sequential loop"],"answer":1,"explain":"Binary exponentiation repeatedly squares and multiplies, achieving O(log b) modular exponentiations."},
{"topic":"Number Theory","q":"The Extended Euclidean Algorithm finds integers x, y such that:","options":["x + y = gcd(a, b)","a*x + b*y = gcd(a, b)","x*y = a*b","x = a, y = b"],"answer":1,"explain":"Extended GCD: ax + by = gcd(a, b) for some integers x, y."},
{"topic":"Combinatorics","q":"Catalan numbers count:","options":["Permutations of n elements","Binary strings with n zeros","Balanced parentheses sequences, BST shapes, and non-crossing partitions","Subsets of size k"],"answer":2,"explain":"Catalan(n) = (2n)! / ((n+1)! * n!) counts many structures including balanced parentheses and BSTs."},
{"topic":"Combinatorics","q":"To compute nCk (n choose k) under modulo p, use:","options":["Direct multiplication","Factorial with modular inverse","Pascal's triangle","Stirling's approximation"],"answer":1,"explain":"Compute n! / (k! * (n-k)!) under mod p using modular multiplicative inverse."},
{"topic":"String Matching","q":"The KMP (Knuth-Morris-Pratt) algorithm avoids re-scanning by using:","options":["A hash table","Failure function to skip characters","Sorting","Binary search"],"answer":1,"explain":"KMP's failure function records longest proper prefix that's also a suffix, allowing jumps on mismatch."},
{"topic":"String Matching","q":"Rabin-Karp uses hashing to find patterns in:","options":["O(n * m) always","O(n + m) best case, O((n - m + 1) * m) worst case","O(n) always","O(n^2)"],"answer":1,"explain":"Rabin-Karp hashes substrings; hash matches allow O(1) comparison. Good average case, bad worst case."},
{"topic":"String Matching","q":"A Suffix Array is a sorted array of all:","options":["Prefixes of a string","Suffixes of a string","Substrings","Characters"],"answer":1,"explain":"Suffix Array: indices of all suffixes sorted lexicographically. Combined with LCP array, enables many queries."},
{"topic":"Geometry","q":"Convex Hull (via Andrew's Monotone Chain) sorts points by:","options":["Angle from origin","x-coordinate (then y-coordinate as tiebreak), builds lower then upper hull","Distance from origin","Random order"],"answer":1,"explain":"Andrew's algorithm: sort by x (then y), build lower hull left-to-right, upper hull right-to-left."},
{"topic":"Geometry","q":"The Shoelace Formula computes a polygon's area using:","options":["Sum of side lengths","Sum of coordinate products and differences","Perimeter and apothem","Distance to origin"],"answer":1,"explain":"Shoelace: Area = 0.5 * |sum of (x_i * y_{i+1} - x_{i+1} * y_i)|."},
{"topic":"Advanced","q":"Network Flow's max-flow min-cut theorem states:","options":["Max flow equals bottleneck capacity","Max flow equals min cut capacity","All edges carry max flow","Flow is unique"],"answer":1,"explain":"The maximum value of flow from source to sink equals the minimum capacity of a cut separating them."},
{"topic":"Advanced","q":"Dinic's algorithm for max flow achieves:","options":["O(V^2 * E)","O(V * E^2)","O(V^2 * E) for unit capacities; O(V * E * log(max_cap)) otherwise","O(V^3)"],"answer":2,"explain":"Dinic's builds level graphs and finds blocking flows, achieving O(V^2 * E) or better with unit capacities."},
{"topic":"Advanced","q":"FFT (Fast Fourier Transform) multiplies polynomials of degree n in:","options":["O(n^2)","O(n log n)","O(n^3)","O(n)"],"answer":1,"explain":"FFT converts to frequency domain (O(n log n)), multiplies component-wise (O(n)), and converts back (O(n log n))."}
]

</script>
<script>
(function() {
  const dataEl = document.getElementById('quiz-data');
  if (!dataEl) return;
  let questions;
  try { questions = JSON.parse(dataEl.textContent); } catch(e) { console.error('Quiz JSON parse error', e); return; }
  if (!Array.isArray(questions) || !questions.length) return;

  // ── Inject CSS ──
  const css = `
  #view-quiz { overflow-y: auto; padding-top: 60px; height: 100vh; }
  .quiz-wrap { max-width: 880px; margin: 0 auto; padding: 24px 24px 80px; }
  .quiz-header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom: 12px; }
  .quiz-header h2 { font-size: 22px; color: #58a6ff; }
  .quiz-header .quiz-sub { font-size: 12px; color: #8b949e; margin-top: 2px; }
  .quiz-stats { display:flex; gap:10px; flex-wrap:wrap; }
  .quiz-stat { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:8px 14px; font-size:12px; color:#8b949e; }
  .quiz-stat b { color:#c9d1d9; font-size:15px; display:block; }
  .quiz-stat.ok b { color:#7ee787; }
  .quiz-stat.bad b { color:#ff7b72; }
  .quiz-filters { display:flex; flex-wrap:wrap; gap:6px; margin: 12px 0 16px; }
  .quiz-chip { background:#0d1117; border:1px solid #30363d; color:#8b949e; padding:5px 12px; border-radius:16px; cursor:pointer; font-size:12px; transition:all .15s; }
  .quiz-chip:hover { color:#c9d1d9; border-color:#58a6ff; }
  .quiz-chip.active { background:#1f6feb; color:#fff; border-color:#58a6ff; }
  .quiz-actions { display:flex; gap:8px; flex-wrap:wrap; margin-bottom: 14px; }
  .quiz-actions .qbtn { background:#21262d; border:1px solid #30363d; color:#c9d1d9; padding:6px 14px; border-radius:6px; cursor:pointer; font-size:12px; }
  .quiz-actions .qbtn:hover { background:#30363d; border-color:#58a6ff; }
  .quiz-progress { height:6px; background:#161b22; border-radius:4px; overflow:hidden; margin-bottom:16px; border:1px solid #30363d; }
  .quiz-progress > div { height:100%; background:linear-gradient(90deg,#1f6feb,#58a6ff); transition:width .3s; }
  .quiz-card { background:#161b22; border:1px solid #30363d; border-radius:12px; padding:22px 26px; box-shadow:0 4px 18px rgba(0,0,0,.3); }
  .quiz-card .qc-meta { font-size:11px; color:#58a6ff; font-weight:600; text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; display:flex; justify-content:space-between; }
  .quiz-card .qc-meta .qc-num { color:#8b949e; }
  .quiz-card .qc-q { font-size:16px; color:#c9d1d9; line-height:1.55; font-weight:600; margin-bottom:16px; }
  .quiz-options { display:flex; flex-direction:column; gap:8px; }
  .quiz-opt { background:#0d1117; border:1px solid #30363d; color:#c9d1d9; padding:11px 16px; border-radius:8px; cursor:pointer; text-align:left; font-size:14px; transition:all .15s; line-height:1.4; display:flex; align-items:flex-start; gap:10px; }
  .quiz-opt:hover:not(.disabled) { border-color:#58a6ff; background:#161b22; }
  .quiz-opt .opt-letter { flex-shrink:0; width:22px; height:22px; border-radius:50%; background:#21262d; color:#8b949e; font-size:11px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; }
  .quiz-opt.correct { border-color:#3fb950; background:rgba(63,185,80,.08); }
  .quiz-opt.correct .opt-letter { background:#3fb950; color:#fff; }
  .quiz-opt.wrong { border-color:#f85149; background:rgba(248,81,73,.08); }
  .quiz-opt.wrong .opt-letter { background:#f85149; color:#fff; }
  .quiz-opt.disabled { cursor:default; }
  .quiz-explain { margin-top:14px; padding:12px 16px; background:#0d1117; border-left:3px solid #58a6ff; border-radius:6px; font-size:13px; color:#8b949e; line-height:1.6; }
  .quiz-explain b { color:#58a6ff; }
  .quiz-nav { display:flex; justify-content:space-between; gap:10px; margin-top:18px; }
  .quiz-nav .qbtn { padding:8px 18px; font-size:13px; background:#21262d; border:1px solid #30363d; color:#c9d1d9; border-radius:6px; cursor:pointer; }
  .quiz-nav .qbtn:hover { background:#30363d; border-color:#58a6ff; }
  .quiz-nav .qbtn.primary { background:#1f6feb; border-color:#58a6ff; color:#fff; }
  .quiz-nav .qbtn.primary:hover { background:#388bfd; }
  .quiz-nav .qbtn:disabled { opacity:.4; cursor:not-allowed; }
  .quiz-empty { text-align:center; color:#484f58; padding:60px 20px; font-style:italic; }
  .quiz-summary { background:#161b22; border:1px solid #30363d; border-radius:12px; padding:32px; text-align:center; }
  .quiz-summary h3 { color:#58a6ff; font-size:22px; margin-bottom:6px; }
  .quiz-summary .qs-score { font-size:56px; font-weight:700; color:#7ee787; margin:12px 0; }
  .quiz-summary .qs-pct { color:#8b949e; font-size:14px; margin-bottom:16px; }
  .quiz-summary .qs-breakdown { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:8px; margin:20px 0; text-align:left; }
  .quiz-summary .qs-row { background:#0d1117; border:1px solid #30363d; border-radius:8px; padding:8px 12px; font-size:12px; color:#8b949e; }
  .quiz-summary .qs-row b { display:block; color:#c9d1d9; font-size:14px; margin-bottom:2px; }
  @media (max-width: 600px) {
    .quiz-wrap { padding:14px 12px 80px; }
    .quiz-card { padding:16px; }
    .quiz-card .qc-q { font-size:15px; }
    .quiz-opt { font-size:13px; padding:10px 12px; }
  }`;
  const styleEl = document.createElement('style');
  styleEl.textContent = css;
  document.head.appendChild(styleEl);

  // ── Inject view container ──
  function ensureView() {
    let view = document.getElementById('view-quiz');
    if (!view) {
      view = document.createElement('div');
      view.id = 'view-quiz';
      view.className = 'view';
      view.innerHTML = '<div id="quiz-container"></div>';
      document.body.appendChild(view);
    }
    return view;
  }
  const viewEl = ensureView();

  // ── State ──
  const state = { filter: 'ALL', order: [], cursor: 0, answers: {}, built: false };

  function shuffleArr(a) { for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function topics() { return ['ALL', ...Array.from(new Set(questions.map(q => q.topic || 'General')))]; }
  function pool() { return state.order.map(i => ({i, q: questions[i]})).filter(x => state.filter === 'ALL' || (x.q.topic||'General') === state.filter); }

  function build() {
    state.order = questions.map((_, i) => i);
    shuffleArr(state.order);
    const root = document.getElementById('quiz-container');
    root.innerHTML = `
      <div class="quiz-wrap">
        <div class="quiz-header">
          <div>
            <h2>🎯 Knowledge Quiz</h2>
            <div class="quiz-sub">${questions.length} questions across ${topics().length - 1} topics — pick a topic or take it all.</div>
          </div>
          <div class="quiz-stats" id="quiz-stats"></div>
        </div>
        <div class="quiz-filters" id="quiz-filters"></div>
        <div class="quiz-actions">
          <button class="qbtn" data-act="shuffle">🔀 Shuffle</button>
          <button class="qbtn" data-act="reset">↺ Reset Answers</button>
          <button class="qbtn" data-act="next-unans">⏭ Next Unanswered</button>
          <button class="qbtn" data-act="summary">📊 Summary</button>
        </div>
        <div class="quiz-progress"><div id="quiz-progress-bar" style="width:0%"></div></div>
        <div id="quiz-body"></div>
      </div>`;
    root.querySelectorAll('.qbtn[data-act]').forEach(b => b.addEventListener('click', () => {
      const a = b.getAttribute('data-act');
      if (a === 'shuffle') { shuffleArr(state.order); state.cursor = 0; renderQ(); }
      else if (a === 'reset') { if (confirm('Reset all answers?')) { state.answers = {}; renderQ(); } }
      else if (a === 'next-unans') { const p = pool(); const n = p.findIndex(x => state.answers[x.i] === undefined); if (n >= 0) { state.cursor = n; renderQ(); } }
      else if (a === 'summary') { showSummary(); }
    }));
    renderFilters();
    renderQ();
    state.built = true;
  }

  function renderFilters() {
    const el = document.getElementById('quiz-filters');
    el.innerHTML = '';
    topics().forEach(t => {
      const count = t === 'ALL' ? questions.length : questions.filter(q => (q.topic || 'General') === t).length;
      const chip = document.createElement('button');
      chip.className = 'quiz-chip' + (t === state.filter ? ' active' : '');
      chip.textContent = t === 'ALL' ? `All (${count})` : `${t} (${count})`;
      chip.addEventListener('click', () => { state.filter = t; state.cursor = 0; renderFilters(); renderQ(); });
      el.appendChild(chip);
    });
  }

  function renderStats() {
    const p = pool();
    const answered = p.filter(x => state.answers[x.i] !== undefined);
    const correct = answered.filter(x => state.answers[x.i] === x.q.answer).length;
    const wrong = answered.length - correct;
    const el = document.getElementById('quiz-stats');
    if (el) el.innerHTML = `
      <div class="quiz-stat"><b>${p.length}</b>Questions</div>
      <div class="quiz-stat ok"><b>${correct}</b>Correct</div>
      <div class="quiz-stat bad"><b>${wrong}</b>Wrong</div>
      <div class="quiz-stat"><b>${answered.length}/${p.length}</b>Done</div>`;
    const pct = p.length ? Math.round(100 * answered.length / p.length) : 0;
    const bar = document.getElementById('quiz-progress-bar');
    if (bar) bar.style.width = pct + '%';
  }

  function renderQ() {
    const p = pool();
    const body = document.getElementById('quiz-body');
    if (!p.length) { body.innerHTML = '<div class="quiz-empty">No questions for this filter.</div>'; renderStats(); return; }
    if (state.cursor >= p.length) state.cursor = p.length - 1;
    if (state.cursor < 0) state.cursor = 0;
    const cur = p[state.cursor];
    const q = cur.q;
    const selected = state.answers[cur.i];
    const answered = selected !== undefined;
    const optsHtml = q.options.map((opt, i) => {
      let cls = '';
      if (answered) { if (i === q.answer) cls = 'correct'; else if (i === selected) cls = 'wrong'; cls += ' disabled'; }
      const letter = String.fromCharCode(65 + i);
      return `<button class="quiz-opt ${cls}" data-opt="${i}" ${answered ? 'disabled' : ''}>
        <span class="opt-letter">${letter}</span><span>${escapeHtml(opt)}</span>
      </button>`;
    }).join('');
    body.innerHTML = `
      <div class="quiz-card">
        <div class="qc-meta"><span>${escapeHtml(q.topic || 'General')}</span><span class="qc-num">${state.cursor + 1} / ${p.length}</span></div>
        <div class="qc-q">${escapeHtml(q.q)}</div>
        <div class="quiz-options">${optsHtml}</div>
        ${answered ? `<div class="quiz-explain"><b>${selected === q.answer ? '✓ Correct.' : '✗ Not quite.'}</b> ${escapeHtml(q.explain || '')}</div>` : ''}
        <div class="quiz-nav">
          <button class="qbtn" data-nav="prev" ${state.cursor === 0 ? 'disabled' : ''}>← Previous</button>
          <button class="qbtn primary" data-nav="next" ${state.cursor === p.length - 1 ? 'disabled' : ''}>Next →</button>
        </div>
      </div>`;
    body.querySelectorAll('.quiz-opt[data-opt]').forEach(b => b.addEventListener('click', () => {
      const idx = cur.i;
      if (state.answers[idx] !== undefined) return;
      state.answers[idx] = +b.getAttribute('data-opt');
      renderQ();
    }));
    body.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => {
      const dir = b.getAttribute('data-nav');
      const pp = pool();
      if (dir === 'next' && state.cursor < pp.length - 1) { state.cursor++; renderQ(); }
      else if (dir === 'prev' && state.cursor > 0) { state.cursor--; renderQ(); }
    }));
    renderStats();
  }

  function showSummary() {
    const p = pool();
    const answered = p.filter(x => state.answers[x.i] !== undefined);
    const correct = answered.filter(x => state.answers[x.i] === x.q.answer).length;
    const pct = answered.length ? Math.round(100 * correct / answered.length) : 0;
    const topicStats = {};
    p.forEach(x => {
      const t = x.q.topic || 'General';
      if (!topicStats[t]) topicStats[t] = { total: 0, answered: 0, correct: 0 };
      topicStats[t].total++;
      if (state.answers[x.i] !== undefined) {
        topicStats[t].answered++;
        if (state.answers[x.i] === x.q.answer) topicStats[t].correct++;
      }
    });
    const rows = Object.entries(topicStats).map(([t,s]) =>
      `<div class="qs-row"><b>${escapeHtml(t)}</b>${s.correct}/${s.answered} correct · ${s.total} total</div>`).join('');
    document.getElementById('quiz-body').innerHTML = `
      <div class="quiz-summary">
        <h3>Summary</h3>
        <div class="qs-score">${correct} / ${answered.length || p.length}</div>
        <div class="qs-pct">${pct}% correct · ${answered.length} of ${p.length} answered</div>
        <div class="qs-breakdown">${rows}</div>
        <div class="quiz-nav" style="justify-content:center">
          <button class="qbtn primary" id="qs-back">Back to Questions</button>
          <button class="qbtn" id="qs-reset">Reset Answers</button>
        </div>
      </div>`;
    document.getElementById('qs-back').addEventListener('click', renderQ);
    document.getElementById('qs-reset').addEventListener('click', () => { if (confirm('Reset all answers?')) { state.answers = {}; renderQ(); } });
  }

  // ── Activate when the quiz tab is shown ──
  function activate() {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    viewEl.classList.add('active');
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === 'quiz'));
    document.querySelectorAll('.canvas-controls').forEach(c => { if (c.id !== 'quiz-controls') c.style.display = 'none'; });
    if (!state.built) build();
  }

  // ── Bootstrap on DOM ready: add tab button, hook switchTab ──
  function boot() {
    const tg = document.querySelector('#tab-group') || document.querySelector('.tab-group');
    if (tg) {
      if (!tg.querySelector('[data-view="quiz"]')) {
        const btn = document.createElement('button');
        btn.className = 'tab';
        btn.dataset.view = 'quiz';
        btn.textContent = '🎯 Quiz';
        btn.addEventListener('click', () => {
          if (typeof window.switchTab === 'function') {
            try { window.switchTab('quiz'); } catch(e) { activate(); }
            activate();
          } else {
            activate();
          }
        });
        tg.appendChild(btn);
      }
    }
    if (typeof window.switchTab === 'function') {
      const orig = window.switchTab;
      window.switchTab = function(tab) {
        if (tab === 'quiz') { activate(); return; }
        try { orig(tab); } catch(e) {}
      };
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>

</body>
